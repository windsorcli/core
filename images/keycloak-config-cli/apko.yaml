# keycloak-config-cli for the platform realm Job in kustomize/identity.
# Run task keycloak-config-cli:image after each change to this file. The task writes apko.lock.json and the image reference.

contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - keycloak-config-cli

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

work-dir: /home/nonroot

entrypoint:
  command: /usr/lib/jvm/java-21-openjdk/bin/java -jar /usr/share/java/keycloak-config-cli/keycloak-config-cli.jar

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.source: https://github.com/windsorcli/core
