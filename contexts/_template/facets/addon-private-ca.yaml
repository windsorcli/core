kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: private-ca
  description: Cluster Certificate Authority with trust-manager integration

# Requires
# =============================================================================
requires:
  - when: (pki.ca.key ?? pki.private_ca.key ?? '') != '' && (pki.ca.cert ?? pki.private_ca.cert ?? '') == ''
    paths:
      - pki.ca.cert
    message: A CA private key needs its certificate.

# Flux
# =============================================================================
# trust-manager and the private-issuer/ca ClusterIssuer, which signs workload certificates.
# The CA cert and key come from the pki terraform stack.
flux:

  - name: pki
    # Secrets, since a substituted multi-line PEM loses its line breaks.
    secrets:
      # Cert and key, in system-pki only, for the ClusterIssuer.
      private-ca-keypair:
        namespaces: [system-pki]
        data:
          tls.crt: ${terraform_output('pki', 'cert')}
          tls.key: ${terraform_output('pki', 'key')}
      # Cert only, for the trust-manager Bundle.
      # The private-ca-cert name belongs to a kubernetes.io/tls Secret, and Secret type is immutable.
      private-ca-trust-cert:
        namespaces: [system-pki-trust]
        data:
          tls.crt: ${terraform_output('pki', 'cert')}
    install:
      components:
        - trust-manager
    resources:
      - timeout: 5m
        interval: 5m
        components:
          - private-issuer/ca
          # CA auto-injection, a Kyverno mutation, only with policies enabled.
          - "${(policies.enabled ?? true) == true ? 'private-issuer/ca/kyverno-inject' : ''}"

  # Adds the pki.trusted_cas roots to the trust bundle.
  - name: pki
    when: len(pki.trusted_cas ?? []) > 0
    secrets:
      pki-trusted-cas:
        namespaces: [system-pki-trust]
        data:
          ca.crt: ${join(pki.trusted_cas, '\n')}
    resources:
      - components:
          - private-issuer/ca/trusted-cas
