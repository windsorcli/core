kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: azure
  description: "Azure provider basic infrastructure"

when: platform == 'azure'

# Requires
# =============================================================================
requires:
  - when: >-
      tls_effective.public_acme == true
    paths:
      - email
    message: ACME certificates for dns.public_domain or gateway.<name>.tls.issuer acme need email as the account contact.

# Config
# =============================================================================
config:

  # AKS ships metrics-server as an add-on.
  - name: telemetry
    value:
      metrics_server_enabled: false

  # The public issuer is selfsigned by default.
  - name: pki_effective
    value:
      issuer_component: public-issuer/selfsigned

  # The public issuer is ACME with Azure DNS-01 when a gateway domain uses public-acme
  # and Azure DNS hosts the public zone.
  - name: pki_effective
    when: >-
      tls_effective.public_acme == true && dns_zone_effective.cloud == true
    value:
      issuer_component: public-issuer/acme/azuredns

# Terraform
# =============================================================================
terraform:

  # Core provisions the state storage account unless set by terraform.backend.
  - name: backend
    path: backend/azurerm
    when: backend_effective.managed == true

  - name: network
    path: network/azure-vnet
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
    inputs:
      region: ${azure.region ?? 'eastus'}
      vnet_cidr: ${network.cidr_block}
      # The VNet also provisions a linked private DNS zone for this domain.
      domain_name: ${dns.private_domain ?? ""}

  # Public Azure DNS zone for dns.public_domain, in its own resource group.
  - name: dns-zone
    path: dns/zone/azure-dns
    when: "dns_zone_effective.cloud == true"
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
    inputs:
      domain_name: ${dns.public_domain}

  # AKS, with Cilium and the Workload Identities for cert-manager and external-dns.
  - name: cluster
    path: cluster/azure-aks
    dependsOn:
      - network
    inputs:
      # AKS requires the VNet's region.
      region: ${terraform_output('network', 'region')}
      private_subnet_ids: ${terraform_output('network', 'private_subnet_ids')}
      availability_zones: "${topology == 'ha' ? ['1','2','3'] : null}"
      default_node_pool:
        node_count: "${topology == 'ha' ? 2 : 1}"
      # cert-manager identity, only when Azure DNS hosts the public zone.
      create_cert_manager_identity: "${dns_zone_effective.cloud == true}"
      # The identity's role assignment is limited to the public zone.
      cert_manager_dns_zone_ids: "${dns_zone_effective.cloud == true && (terraform_output('dns-zone', 'zone_id') ?? '') != '' ? [terraform_output('dns-zone', 'zone_id')] : []}"
      # The private zone ID and the public zone ID, whichever exist.
      external_dns_dns_zone_ids: >-
        ${(dns.private_domain ?? '') != '' && (terraform_output('network', 'private_zone_id') ?? '') != '' && dns_zone_effective.cloud == true && gateway_external_effective.domain != '' && (terraform_output('dns-zone', 'zone_id') ?? '') != '' ?
        [terraform_output('network', 'private_zone_id'), terraform_output('dns-zone', 'zone_id')] :
        ((dns.private_domain ?? '') != '' && (terraform_output('network', 'private_zone_id') ?? '') != '' ?
        [terraform_output('network', 'private_zone_id')] :
        (dns_zone_effective.cloud == true && gateway_external_effective.domain != '' && (terraform_output('dns-zone', 'zone_id') ?? '') != '' ?
        [terraform_output('dns-zone', 'zone_id')] : []))}
      # One general pool unless set by cluster.pools.
      pools: >-
        ${cluster.pools ?? {"general": {"class": "general", "count": 1}}}

  # Adds dns-zone to the cluster's dependsOn when Azure DNS hosts the public zone.
  - name: cluster
    when: "dns_zone_effective.cloud == true"
    dependsOn:
      - dns-zone

  - name: gitops
    path: gitops/flux
    # Skipped on destroy, since deleting AKS removes Flux.
    destroy: false
    dependsOn:
      - cluster
    inputs:
      concurrency: 5

# Flux
# =============================================================================
flux:

  # cert-manager Workload Identity, which the azureDNS solver requires for Azure AD tokens.
  - name: pki
    when: "dns_zone_effective.cloud == true"
    install:
      components:
        - cert-manager/azure-workload-identity
      substitutions:
        cert_manager_client_id: "${terraform_output('cluster', 'cert_manager_client_id') ?? ''}"
        cert_manager_tenant_id: "${terraform_output('cluster', 'tenant_id') ?? ''}"

  # Public ClusterIssuer from pki_effective.issuer_component.
  - name: pki
    resources:
      - components:
          - "${pki_effective.issuer_component}"
        timeout: 5m
        interval: 5m
        substitutions:
          acme_server: "${dev == true ? 'https://acme-staging-v02.api.letsencrypt.org/directory' : 'https://acme-v02.api.letsencrypt.org/directory'}"
          acme_email: "${email ?? ''}"
          acme_dns_zone: "${dns.public_domain ?? ''}"
          # The dns-zone resource group, or empty without an Azure DNS public zone.
          acme_dns_zone_resource_group: "${dns_zone_effective.cloud == true ? (terraform_output('dns-zone', 'resource_group_name') ?? '') : ''}"
          acme_dns_zone_subscription_id: "${dns_zone_effective.cloud == true ? (terraform_output('dns-zone', 'subscription_id') ?? '') : ''}"
          cert_manager_client_id: "${terraform_output('cluster', 'cert_manager_client_id') ?? ''}"
          cert_manager_tenant_id: "${terraform_output('cluster', 'tenant_id') ?? ''}"

  # Azure load balancer for the internal Envoy gateway Service.
  - name: gateway
    when: "gateway.enabled == true && gateway.driver == 'envoy' && load_balancer.mode == 'loadbalancer' && (dns.private_domain ?? '') != ''"
    resources:
      - name: internal
        components:
          - envoy/loadbalancer/azure

  # AKS ships the Azure Disk CSI driver. The azure-disk component adds the default StorageClass.
  - name: csi
    install:
      components:
        - azure-disk
      timeout: 5m
      interval: 5m
      substitutions:
        single_storage_type: ${cluster.storage.single_storage_type ?? "StandardSSD_LRS"}

  # external-dns, one instance per Azure DNS zone: public when dns.public_domain is set,
  # private when dns.private.driver is cloud.
  - name: dns
    when: "dns_zone_effective.cloud == true || dns.private.driver == 'cloud'"
    install:
      timeout: 5m
      interval: 5m
    resources:
      - name: account
        components:
          - service-account
          - service-account/providers/azure
        substitutions:
          external_dns_client_id: "${terraform_output('cluster', 'external_dns_client_id') ?? ''}"
          external_dns_tenant_id: "${terraform_output('cluster', 'tenant_id') ?? ''}"
        timeout: 5m
        interval: 5m
      - name: public
        when: dns_zone_effective.cloud == true
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/azure
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-public
          external_dns_domain: "${dns.public_domain ?? ''}"
          external_dns_azure_provider: azure
          external_dns_subscription_id: "${terraform_output('dns-zone', 'subscription_id') ?? ''}"
          external_dns_resource_group: "${terraform_output('dns-zone', 'resource_group_name') ?? ''}"
          external_dns_tenant_id: "${terraform_output('cluster', 'tenant_id') ?? ''}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m
      - name: private
        when: dns.private.driver == 'cloud'
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/azure
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-private
          external_dns_domain: "${dns.private_domain ?? ''}"
          external_dns_azure_provider: azure-private-dns
          external_dns_subscription_id: "${terraform_output('network', 'subscription_id') ?? ''}"
          external_dns_resource_group: "${terraform_output('network', 'resource_group_name') ?? ''}"
          external_dns_tenant_id: "${terraform_output('cluster', 'tenant_id') ?? ''}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m
