kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: storage
  description: Kubernetes storage (CSI) driver configuration

# Storage driver handling is Talos-specific (requires Talos extensions).
# Managed clusters (EKS, AKS) use cloud CSI drivers installed by their
# platform-* facet directly.
when: cluster.driver == 'talos'

# =============================================================================
# Config — Mayastor image tags
# =============================================================================
# Mayastor has no arm64 build on a released tag (openebs/mayastor#1107).
# arm64 workstations override to the develop tag.
config:

  - name: mayastor_images
    value:
      tags:
        # artifact: type=image name=docker.io/openebs/mayastor-agent-core
        agent_core: v2.11.1@sha256:f4f4b85b67b399cfb6452e139680cb35b788574f626ca27094bd7fda7fb8e6f3
        # artifact: type=image name=docker.io/openebs/mayastor-agent-ha-cluster
        agent_ha_cluster: v2.11.1@sha256:5007ae0a38bf52fa51744d845325038327fe03c626c3f95f954c98cd100aed9d
        # artifact: type=image name=docker.io/openebs/mayastor-agent-ha-node
        agent_ha_node: v2.11.1@sha256:27ea3280d3e71213f31e4815b7935f828ecc1cf0e8802e74aa2934b989ee5a43
        # artifact: type=image name=docker.io/openebs/mayastor-api-rest
        api_rest: v2.11.1@sha256:2e60c6fc69970a4dccc2d9b0f0719e6d272858c63c3a1dc24c38abac5853d0ec
        # artifact: type=image name=docker.io/openebs/mayastor-csi-controller
        csi_controller: v2.11.1@sha256:f4f442d8ce7ea8b3e410c4cfe8540b1e8a3250ed91c025d83f1b870f119acb97
        # artifact: type=image name=docker.io/openebs/mayastor-csi-node
        csi_node: v2.11.1@sha256:0946de2b2fd44275ec60bc146cdb7ca917ec5cabfde9b21b64c2bfe532f41dd4
        # artifact: type=image name=docker.io/openebs/mayastor-io-engine
        io_engine: v2.11.1@sha256:b88de71674405f4fa0f755f0eb246e0eafc0d0f1473263852fd039e45e1b3553
        # artifact: type=image name=docker.io/openebs/mayastor-operator-diskpool
        operator_diskpool: v2.11.1@sha256:231020f43edb57a31d3fc9626f67251f8bd7e356d362aeddbcd675eee7adc417

  - name: mayastor_images
    when: talos_common.storage_driver == 'mayastor' && (workstation.arch ?? 'amd64') == 'arm64'
    value:
      tags:
        # artifact: type=image name=docker.io/openebs/mayastor-agent-core
        agent_core: develop@sha256:326c0208ba95c03b1b1f0c570cd0d988624a68861aa73b2435ebbc7eee812c68
        # artifact: type=image name=docker.io/openebs/mayastor-agent-ha-cluster
        agent_ha_cluster: develop@sha256:72d834b68b030a0a0e4c89b33c14f7c79d8239ed8e0489aec80fc6f548148d5f
        # artifact: type=image name=docker.io/openebs/mayastor-agent-ha-node
        agent_ha_node: develop@sha256:db92737946284dffcdf2a0c612368d0a42bde88f7b6cec154df0e85b02efafe1
        # artifact: type=image name=docker.io/openebs/mayastor-api-rest
        api_rest: develop@sha256:e23b11447e1093bff7bbfe866efffcfccd94783c5156d65ce09b2a7998a7cc45
        # artifact: type=image name=docker.io/openebs/mayastor-csi-controller
        csi_controller: develop@sha256:bf5afb9770171a70c317cdd295758d67a0bfe74c343dc1ad0fdfb7f93984ed7a
        # artifact: type=image name=docker.io/openebs/mayastor-csi-node
        csi_node: develop@sha256:f09d6fd0aeb2400d95bd8c5b7d629e8dd3a4c53f8db92a68c7ff4452d30b1dac
        # artifact: type=image name=docker.io/openebs/mayastor-io-engine
        io_engine: develop@sha256:5d137d2245ebb3f8b0758032376d373e42193ad108b41e00cdc71ef284ba6841
        # artifact: type=image name=docker.io/openebs/mayastor-operator-diskpool
        operator_diskpool: develop@sha256:733ef63d35fdc3b6401293325984418b4e49e81b6ce803a2c1fff3fd0138b0fa

  # DiskPool disks need a persistent devlink; Mayastor rejects /dev/sdb.
  # incus derives its QEMU by-id path here. Other platforms set
  # disks[].device to a real by-id path directly.
  - name: mayastor_pool
    when: talos_common.storage_driver == 'mayastor'
    value:
      # name:device pairs, one per configured disk, space-separated for the
      # registrar DaemonSet to loop over. One pool per disk per node.
      devices: >-
        ${join(map(cluster.workers.disks ?? [], #.name + ':' +
          (platform == 'incus'
            ? '/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_incus_' + #.name
            : #.device) + ' '))}

# =============================================================================
# Terraform — Talos extensions for CSI
# =============================================================================
# Some CSI drivers need kernel/system tools missing from the stock Talos image
# (Longhorn needs iscsi-tools + util-linux-tools). Installed via the
# cluster/talos/extensions module, with Flux waiting until they're live.
terraform:

  # cluster-extensions — apply Talos system extensions when the storage driver
  # needs them (longhorn, mayastor). Waits for cni when Cilium is the CNI,
  # since both write Talos machine config and must not run concurrently.
  - name: cluster-extensions
    when: "(cluster.storage.driver ?? 'openebs') in ['longhorn', 'mayastor'] && cluster_provisioned"
    path: cluster/talos/extensions
    dependsOn:
      - cluster
      - "${cluster.cni.driver == 'cilium' ? 'cni' : ''}"
    parallelism: 1
    inputs:
      talos_version: ${talos.talos_version}
      controlplanes: ${talos_node_targets.controlplanes ?? []}
      workers: ${talos_node_targets.workers ?? []}
      extensions: ${talos_common.extensions ?? []}
      powercycle_reboot: ${platform == 'incus'}

  # Dependency merge: Flux waits for extensions so CSI DaemonSets find their kernel modules.
  - name: gitops
    when: "(cluster.storage.driver ?? 'openebs') in ['longhorn', 'mayastor'] && cluster_provisioned"
    path: gitops/flux
    dependsOn:
      - cluster-extensions

# =============================================================================
# Kustomize — CSI driver Helm releases
# =============================================================================
# One kustomization per storage driver; exactly one fires based on
# talos_common.storage_driver (openebs on metal/docker, longhorn on incus).
flux:

  # OpenEBS — hostPath local volumes; the default for platforms without dedicated block devices.
  - name: csi
    when: talos_common.storage_driver == 'openebs'
    install:
      components:
        - openebs
        - openebs/dynamic-localpv
      substitutions:
        local_volume_path: ${talos_common.csi_local_volume_path}
        local_volume_quota: "${string(cluster.storage.quota ?? (platform != 'docker'))}"
      timeout: 20m
      interval: 5m

  # Longhorn — distributed block storage.
  - name: csi
    when: talos_common.storage_driver == 'longhorn'
    install:
      components:
        - longhorn
        - "${((cluster.controlplanes.schedulable ?? false) || topology == 'single-node') ? 'longhorn/single-node' : ''}"
        - "${topology == 'ha' ? 'longhorn/ha' : ''}"
        - "${chart_registry != '' ? 'longhorn/chart-registry' : ''}"
      timeout: 20m
      interval: 5m
    # longhorn/prometheus in resources, not install: avoids a csi-install <->
    # telemetry-install cycle.
    resources:
      - dependsOn:
          - "${telemetry.metrics.enabled || telemetry.logs.enabled ? 'telemetry-install' : ''}"
        components:
          - "${observability.enabled == true ? 'longhorn/prometheus' : ''}"

  # Mayastor — replicated NVMe-oF block storage across the disk each worker carries.
  - name: csi
    when: talos_common.storage_driver == 'mayastor'
    install:
      components:
        - openebs
        - openebs/mayastor
      substitutions:
        # incus runs Talos as a nested guest with no IOMMU passthrough; bare
        # metal keeps SPDK's default (va).
        mayastor_iova_mode: "${platform == 'incus' ? 'pa' : 'va'}"
        # Reactor cores taper with worker_factor: 1 core at or below the
        # worker threshold, 2 cores once workers are double it or more.
        mayastor_io_engine_cpu: "${string(int(2 - talos_common.worker_factor + 0.5))}"
        local_volume_path: ${talos_common.csi_local_volume_path}
        local_volume_quota: "${string(cluster.storage.quota ?? (platform != 'docker'))}"
        mayastor_agent_core_tag: "${get(mayastor_images.tags, 'agent_core') ?? ''}"
        mayastor_agent_ha_cluster_tag: "${get(mayastor_images.tags, 'agent_ha_cluster') ?? ''}"
        mayastor_agent_ha_node_tag: "${get(mayastor_images.tags, 'agent_ha_node') ?? ''}"
        mayastor_api_rest_tag: "${get(mayastor_images.tags, 'api_rest') ?? ''}"
        mayastor_csi_controller_tag: "${get(mayastor_images.tags, 'csi_controller') ?? ''}"
        mayastor_csi_node_tag: "${get(mayastor_images.tags, 'csi_node') ?? ''}"
        mayastor_io_engine_tag: "${get(mayastor_images.tags, 'io_engine') ?? ''}"
        mayastor_operator_diskpool_tag: "${get(mayastor_images.tags, 'operator_diskpool') ?? ''}"
      timeout: 20m
      interval: 5m

  # A DaemonSet registers one DiskPool per node matching the mayastor
  # node label; the operator has no auto-discovery.
  - name: csi
    when: talos_common.storage_driver == 'mayastor'
    resources:
      - dependsOn: [csi-install]
        components:
          - openebs/mayastor/diskpool
        substitutions:
          mayastor_pool_devices: ${mayastor_pool.devices}

  # Grafana dashboard patch: inject the Longhorn dashboard into observability-resources
  # when Longhorn is active and observability is on; the driver gate is required
  # since the dashboard is meaningless without longhorn metrics.
  - name: observability
    when: talos_common.storage_driver == 'longhorn' && (observability.enabled == true || dev == true)
    resources:
      - components:
          - grafana/dashboards/longhorn
