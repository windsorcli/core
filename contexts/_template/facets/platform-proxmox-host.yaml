kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: proxmox-host
  description: Opt-in Proxmox VE image datastore, kept on destroy

when: "platform == 'proxmox' && cluster.driver == 'talos' && (proxmox.manage_image_datastore ?? false) == true"

requires:
  - paths:
      - proxmox.image_datastore
      - proxmox.image_datastore_path
    message: Set proxmox.image_datastore to the storage id and proxmox.image_datastore_path to its directory on the node.

terraform:

  # Image datastore that outlives the context.
  - name: host
    path: host/proxmox
    inputs:
      nodes: ${proxmox_effective.nodes}
      image_datastore_id: "${proxmox_effective.image_datastore}"
      image_datastore_path: "${proxmox.image_datastore_path}"
    destroy: false
