kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: observability
  description: Observability stack with metrics backends, log storage drivers, and dashboarding

when: addons.observability.enabled == true

# =============================================================================
# Config — dashboard backend default
# =============================================================================
# Land `addons.observability.dashboards` so other facets can read it without
# re-applying the fallback. logs_driver has no default — unset means "no external
# log storage, fluentd aggregator only".
config:

  - name: addons
    value:
      observability:
        dashboards: "${addons.observability.dashboards ?? 'grafana'}"

  # Derived external Grafana URL, read by the identity facet to set the client's redirect
  # URI. docker-desktop reaches the gateway on :8443 (its NodePort host-forward); else :443.
  - name: grafana_effective
    value:
      url: >-
        ${'https://grafana.' +
        ((dns.public_domain ?? '') == '' ? (dns.private_domain ?? '') : dns.public_domain) +
        (workstation.runtime == 'docker-desktop' ? ':8443' : '')}

requires:
  # Explicitly enabling Grafana SSO needs a cluster identity provider to authenticate against.
  - when: addons.observability.grafana.sso == true
    paths:
      - identity.enabled
    message: Grafana SSO authenticates against the cluster identity provider — enable identity.
  # The keycloak driver generates the client secret in-cluster and copies it to Grafana; the
  # oidc driver points at an external provider, so its client secret must be supplied.
  - when: identity.enabled == true && addons.observability.grafana.sso != false && (identity.driver ?? 'keycloak') == 'oidc'
    paths:
      - addons.observability.grafana.client_secret
    message: External OIDC needs Grafana's client secret from your provider. Set addons.observability.grafana.client_secret (a ${secret(...)} ref).

# =============================================================================
# Flux systems — observability install entries, telemetry override
# =============================================================================
# Every entry merges into one `observability` system: HelmReleases land in the
# install tier, dashboards/routes/fluentd config in the resources tier. Other
# facets patch in their own dashboards under `- name: observability` entries.
flux:

  # When Elasticsearch is the log store, replace platform-base's telemetry system:
  # swap fluent-bit for filebeat (native ES shipper) and drop the fluentbit stack.
  - name: telemetry
    when: addons.observability.logs_driver == 'elasticsearch' && gateway.enabled == true
    strategy: replace
    install:
      components:
        - prometheus
        - prometheus/flux
        - filebeat
        - metrics-server
      timeout: 30m
      interval: 10m
    resources:
      - components:
          - prometheus
          - prometheus/flux
          - "${telemetry.alert_components ?? []}"
        timeout: 10m
        interval: 5m

  # Base Grafana + standard dashboards. Substitutions propagate timezone/time
  # format to panel defs so timestamps match operator locale.
  - name: observability
    when: addons.observability.dashboards == 'grafana'
    dependsOn:
      - telemetry-install
      - "${dns.enabled ? 'dns-install' : ''}"
    install:
      timeout: 15m
      interval: 10m
      components:
        - grafana
        - grafana/prometheus
        # Single sign-on against the cluster identity provider. Inferred on when identity
        # is enabled (opt out with grafana.sso: false); provider-agnostic — label,
        # issuer, and endpoints come from identity.
        - "${identity.enabled == true && addons.observability.grafana.sso != false ? 'grafana/oidc' : ''}"
      substitutions:
        external_domain: "${(dns.public_domain ?? '') == '' ? (dns.private_domain ?? '') : dns.public_domain}"
        grafana_root_url: "${grafana_effective.url}"
        # generic_oauth inputs — the provider label and endpoints come from identity (one
        # place, both drivers); endpoints default to the issuer's standard OIDC path, with
        # per-provider overrides under identity.oidc. client_id is the app name; role
        # mapping defaults to platform-admins → Grafana Admin. All leaves are null-safe.
        oidc_name: "${identity_effective.display_name ?? 'SSO'}"
        oidc_client_id: grafana
        # Dev: one-click — clicking Grafana goes straight to the SSO login. Off elsewhere
        # so the local admin form stays reachable.
        oidc_auto_login: "${dev == true ? 'true' : 'false'}"
        # auth_url is the browser redirect (external issuer); token/userinfo are Grafana's
        # server-side calls (back-channel issuer — the in-cluster Service for the hosted
        # driver, since the external URL doesn't resolve inside the cluster).
        oidc_auth_url: "${(identity.oidc.auth_url ?? '') != '' ? identity.oidc.auth_url : ((identity_effective.issuer ?? '') + '/protocol/openid-connect/auth')}"
        oidc_token_url: "${(identity.oidc.token_url ?? '') != '' ? identity.oidc.token_url : ((identity_effective.backchannel_issuer ?? '') + '/protocol/openid-connect/token')}"
        oidc_userinfo_url: "${(identity.oidc.userinfo_url ?? '') != '' ? identity.oidc.userinfo_url : ((identity_effective.backchannel_issuer ?? '') + '/protocol/openid-connect/userinfo')}"
        oidc_role_attribute_path: "${addons.observability.grafana.role_attribute_path ?? \"contains(groups[*], '/platform-admins') && 'Admin' || 'Viewer'\"}"
    resources:
      - timeout: 10m
        interval: 5m
        components:
          - grafana/dashboards/node
          - grafana/dashboards/kubernetes
          - grafana/dashboards/flux
          - grafana/dashboards/cert-manager
          - grafana/dashboards/fluent-bit
          - grafana/dashboards/fluentd
        substitutions:
          timezone: ${timezone}
          date_full: "${time_format == '12h' ? 'MMM DD, YYYY @ hh:mm:ss a' : 'YYYY-MM-DD HH:mm:ss'}"
          date_interval_second: "${time_format == '12h' ? 'hh:mm:ss a' : 'HH:mm:ss'}"
          date_interval_minute: "${time_format == '12h' ? 'hh:mm a' : 'HH:mm'}"
          date_interval_hour: "${time_format == '12h' ? 'MMM DD hh:mm a' : 'MM/DD HH:mm'}"
          date_interval_day: "${time_format == '12h' ? 'MMM DD' : 'MM/DD'}"

  # Grafana's copy of the OIDC client secret, read by generic_oauth (grafana/oidc). For the
  # oidc driver this is the supplied external value. The keycloak driver instead generates it
  # in Keycloak and copies it here via identity's clients/grafana Job, so this does not apply.
  - name: observability
    when: identity.enabled == true && addons.observability.grafana.sso != false && (identity.driver ?? 'keycloak') == 'oidc'
    secrets:
      grafana-oidc-client:
        data:
          clientSecret: ${addons.observability.grafana.client_secret}

  # Gateway route + Envoy-specific dashboards when the cluster has a Gateway.
  # Waits for gateway-resources so the Gateway exists before the HTTPRoute applies.
  - name: observability
    when: addons.observability.dashboards == 'grafana' && gateway.enabled == true
    resources:
      - dependsOn:
          - gateway-resources
        components:
          - grafana/gateway
          - "${gateway.driver == 'envoy' ? 'grafana/dashboards/envoy' : ''}"
        substitutions:
          external_domain: "${(dns.public_domain ?? '') == '' ? (dns.private_domain ?? '') : dns.public_domain}"

  # =============================================================================
  # Log storage drivers — one block fires per logs_driver value
  # =============================================================================

  # stdout: write logs to container stdout (no external store). Dev default.
  - name: observability
    when: addons.observability.logs_driver == 'stdout'
    resources:
      - dependsOn:
          - telemetry-resources
        components:
          - fluentd/outputs/stdout

  # Quickwit: search-optimized log store on object storage (PVC for staging).
  # Install waits for csi (staging PVC).
  - name: observability
    when: addons.observability.logs_driver == 'quickwit'
    dependsOn:
      - csi
    install:
      timeout: 20m
      interval: 5m
      components:
        - quickwit
        - quickwit/pvc
        - quickwit/prometheus
        - "${addons.observability.dashboards == 'grafana' ? 'grafana/quickwit' : ''}"
    resources:
      - dependsOn:
          - telemetry-resources
        timeout: 10m
        interval: 5m
        components:
          - fluentd/outputs/quickwit
          - "${addons.observability.dashboards == 'grafana' ? 'grafana/dashboards/logs/quickwit' : ''}"
          - "${addons.observability.dashboards == 'grafana' ? 'grafana/dashboards/quickwit' : ''}"

  # Elasticsearch + Kibana. Gated on gateway.enabled (Kibana needs an HTTPRoute
  # to be reachable). Install waits for csi (ES data PVCs).
  - name: observability
    when: addons.observability.logs_driver == 'elasticsearch' && gateway.enabled == true
    dependsOn:
      - csi
    install:
      timeout: 20m
      interval: 5m
      components:
        - elasticsearch
        - kibana
    resources:
      - dependsOn:
          - gateway-resources
        timeout: 10m
        interval: 5m
        components:
          - kibana/gateway
        substitutions:
          external_domain: "${(dns.public_domain ?? '') == '' ? (dns.private_domain ?? '') : dns.public_domain}"

# =============================================================================
# Messages — post-run notes printed on bootstrap
# =============================================================================
# In dev, tell the operator how to sign in. When SSO is on the platform realm seeds
# 'admin' and 'viewer' users (identity's keycloak/realm/dev-user), so point at single
# sign-on; otherwise fall back to Grafana's local admin form (option-dev installs grafana/dev).
messages:
  # SSO on: the seeded users work for every SSO app.
  - when: dev == true && addons.observability.dashboards == 'grafana' && identity.enabled == true && addons.observability.grafana.sso != false
    text: >-
      Grafana is at ${grafana_effective.url}. Single sign-on is enabled and skips Grafana's
      own login page. Sign in as 'admin' / 'admin-password' (admin) or
      'viewer' / 'viewer-password' (read-only); these users work for every SSO app. The
      gateway cert is self-signed, so trust the local CA or click through the browser warning.
  # SSO off: local Grafana admin form.
  - when: dev == true && addons.observability.dashboards == 'grafana' && (identity.enabled != true || addons.observability.grafana.sso == false)
    text: >-
      Observe your cluster in Grafana at ${grafana_effective.url}. Sign in with
      username 'admin' and password '${addons.observability.admin_password ??
      'grafana'}'. The gateway cert is self-signed, so trust the local CA or
      click through the browser warning on your first visit.
