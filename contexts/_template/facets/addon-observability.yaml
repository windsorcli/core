kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: observability
  description: Observability stack with metrics backends, log storage drivers, and dashboarding

when: observability.enabled == true

# Requires
# =============================================================================
requires:
  - when: (dns.public_domain ?? '') == '' && (dns.private_domain ?? '') == ''
    paths:
      - dns.public_domain
      - dns.private_domain
    message: Observability needs a DNS domain for its Grafana and Kibana hostnames; set dns.public_domain or dns.private_domain.
  - when: observability.grafana.sso == true
    paths:
      - identity.enabled
    message: Grafana SSO authenticates against the cluster identity provider — enable identity.
  # The Keycloak issuer is a gateway URL, which Grafana's login redirect requires.
  - when: identity.enabled == true && observability.grafana.sso != false && (identity.driver ?? 'keycloak') == 'keycloak' && gateway.enabled != true
    message: With identity.driver keycloak, set gateway.enabled to true or set observability.grafana.sso to false.

# Config
# =============================================================================
config:

  # observability.dashboards resolves to grafana by default, for other facets to read.
  - name: observability
    value:
      dashboards: "${observability.dashboards ?? 'grafana'}"

  # Grafana URL on the private route target, with :8443 on docker-desktop.
  - name: grafana_effective
    value:
      url: >-
        ${'https://grafana.' + gateway_effective.private.domain +
        (workstation.runtime == 'docker-desktop' ? ':8443' : '')}

# Flux
# =============================================================================
# Other facets add their dashboards under observability entries.
flux:

  # With elasticsearch logs, replaces the base telemetry system, with filebeat in place of fluent-bit.
  - name: telemetry
    when: observability.logs_driver == 'elasticsearch' && gateway.enabled == true && gateway_effective.private.name != ''
    strategy: replace
    install:
      components:
        - prometheus
        - prometheus/flux
        - filebeat
        - metrics-server
        - "${chart_registry != '' ? 'filebeat/chart-registry' : ''}"
        - "${chart_registry != '' ? 'metrics-server/chart-registry' : ''}"
      timeout: 30m
      interval: 10m
    resources:
      - components:
          - prometheus
          - prometheus/flux
          - "${telemetry.alert_components ?? []}"
        timeout: 10m
        interval: 5m

  # Grafana with the standard dashboards. timezone and time_format set the panel date formats.
  - name: observability
    when: observability.dashboards == 'grafana'
    install:
      timeout: 15m
      interval: 10m
      components:
        - grafana
        - "${telemetry.metrics.enabled ? 'grafana/prometheus' : ''}"
        # Grafana SSO, on with identity unless observability.grafana.sso is false.
        # The label, issuer and endpoints come from identity.
        - "${identity.enabled == true && observability.grafana.sso != false ? 'grafana/oidc' : ''}"
        # External oidc provider that issued a client secret for Grafana.
        - "${identity.enabled == true && observability.grafana.sso != false && (identity.driver ?? 'keycloak') == 'oidc' && (observability.grafana.client_secret ?? '') != '' ? 'grafana/oidc/client-secret' : ''}"
      substitutions:
        private_domain: "${dns.private_domain ?? ''}"
    resources:
      - timeout: 10m
        interval: 5m
        components:
          - grafana/dashboards/node
          - grafana/dashboards/kubernetes
          - grafana/dashboards/flux
          - grafana/dashboards/cert-manager
          - grafana/dashboards/fluent-bit
          - grafana/dashboards/fluentd
        substitutions:
          timezone: ${timezone}
          date_full: "${time_format == '12h' ? 'MMM DD, YYYY @ hh:mm:ss a' : 'YYYY-MM-DD HH:mm:ss'}"
          date_interval_second: "${time_format == '12h' ? 'hh:mm:ss a' : 'HH:mm:ss'}"
          date_interval_minute: "${time_format == '12h' ? 'hh:mm a' : 'HH:mm'}"
          date_interval_hour: "${time_format == '12h' ? 'MMM DD hh:mm a' : 'MM/DD HH:mm'}"
          date_interval_day: "${time_format == '12h' ? 'MMM DD' : 'MM/DD'}"

  # Grafana SSO substitutions, rendered only with the grafana/oidc component.
  - name: observability
    when: observability.dashboards == 'grafana' && identity.enabled == true && observability.grafana.sso != false
    install:
      substitutions:
        grafana_root_url: "${grafana_effective.url}"
        # The provider label and endpoints come from identity_effective, with overrides under identity.oidc.
        oidc_name: "${identity_effective.display_name ?? 'SSO'}"
        oidc_client_id: grafana
        # Dev skips the Grafana login form and goes straight to SSO.
        oidc_auto_login: "${dev == true ? 'true' : 'false'}"
        # The browser redirect uses the external issuer. Token and userinfo use the back-channel issuer.
        oidc_auth_url: "${(identity.oidc.auth_url ?? '') != '' ? identity.oidc.auth_url : ((identity_effective.issuer ?? '') + '/protocol/openid-connect/auth')}"
        oidc_token_url: "${(identity.oidc.token_url ?? '') != '' ? identity.oidc.token_url : ((identity_effective.backchannel_issuer ?? '') + '/protocol/openid-connect/token')}"
        oidc_userinfo_url: "${(identity.oidc.userinfo_url ?? '') != '' ? identity.oidc.userinfo_url : ((identity_effective.backchannel_issuer ?? '') + '/protocol/openid-connect/userinfo')}"
        # Admin for identity_effective.admin_group, else Viewer, unless set by observability.grafana.role_attribute_path.
        oidc_role_attribute_path: "${observability.grafana.role_attribute_path ?? (\"contains(groups[*], '/\" + (identity_effective.admin_group ?? 'platform-admins') + \"') && 'Admin' || 'Viewer'\")}"

  # Grafana's OIDC client secret, external oidc driver with a supplied secret.
  - name: observability
    when: identity.enabled == true && observability.grafana.sso != false && (identity.driver ?? 'keycloak') == 'oidc' && (observability.grafana.client_secret ?? '') != ''
    secrets:
      grafana-oidc-client:
        data:
          clientSecret: ${observability.grafana.client_secret}

  # Grafana route and Envoy dashboards on the private route target.
  - name: observability
    when: observability.dashboards == 'grafana' && gateway.enabled == true && gateway_effective.private.name != ''
    resources:
      - dependsOn:
          - "${'gateway-resources-' + gateway_effective.private.name}"
        components:
          - grafana/gateway
          - "${gateway.driver == 'envoy' ? 'grafana/dashboards/envoy' : ''}"
        substitutions:
          grafana_domain: "${gateway_effective.private.domain}"
          grafana_gateway_name: "${gateway_effective.private.name}"

  # Log storage, one entry per observability.logs_driver. Unset means fluentd with no external store.

  # stdout writes logs to container stdout. The dev default.
  - name: observability
    when: observability.logs_driver == 'stdout'
    resources:
      - dependsOn:
          - telemetry-resources
        components:
          - fluentd/outputs/stdout

  # Quickwit, a search-optimized log store on object storage, with a PVC for staging.
  - name: observability
    when: observability.logs_driver == 'quickwit'
    dependsOn:
      - csi-install
    install:
      timeout: 20m
      interval: 5m
      components:
        - quickwit
        - quickwit/pvc
        - quickwit/prometheus
        - "${observability.dashboards == 'grafana' ? 'grafana/quickwit' : ''}"
        - "${chart_registry != '' ? 'quickwit/chart-registry' : ''}"
    resources:
      - dependsOn:
          - telemetry-resources
        timeout: 10m
        interval: 5m
        components:
          - fluentd/outputs/quickwit
          - "${observability.dashboards == 'grafana' ? 'grafana/dashboards/logs/quickwit' : ''}"
          - "${observability.dashboards == 'grafana' ? 'grafana/dashboards/quickwit' : ''}"

  # Elasticsearch and Kibana, with Kibana on the private route target.
  - name: observability
    when: observability.logs_driver == 'elasticsearch' && gateway.enabled == true && gateway_effective.private.name != ''
    dependsOn:
      - csi-install
    install:
      timeout: 20m
      interval: 5m
      components:
        - elasticsearch
        - kibana
        - "${chart_registry != '' ? 'elasticsearch/chart-registry' : ''}"
        - "${chart_registry != '' ? 'kibana/chart-registry' : ''}"
    resources:
      - dependsOn:
          - "${'gateway-resources-' + gateway_effective.private.name}"
        timeout: 10m
        interval: 5m
        components:
          - kibana/gateway
        substitutions:
          kibana_domain: "${gateway_effective.private.domain}"
          kibana_gateway_name: "${gateway_effective.private.name}"

# Messages
# =============================================================================
# Dev sign-in notes: SSO users with identity, else the local Grafana admin.
messages:
  # SSO on.
  - when: dev == true && observability.dashboards == 'grafana' && identity.enabled == true && observability.grafana.sso != false
    text: |-
      Grafana is ready at ${grafana_effective.url}

      Single sign-on is on: clicking Grafana goes straight to the login.
      Sign in with either seeded user (they work for every SSO app):

        ┌────────────┬─────────────────┬────────────┐
        │ username   │ password        │ role       │
        ├────────────┼─────────────────┼────────────┤
        │ dev-admin  │ admin-password  │ full admin │
        │ dev-viewer │ viewer-password │ read-only  │
        └────────────┴─────────────────┴────────────┘

      The gateway cert is self-signed. Trust the local CA, or click through
      the browser warning on your first visit.
  # SSO off.
  - when: dev == true && observability.dashboards == 'grafana' && (identity.enabled != true || observability.grafana.sso == false)
    text: |-
      Grafana is ready at ${grafana_effective.url}

      Sign in with username 'admin' and password '${observability.admin_password ?? 'grafana'}'.

      The gateway cert is self-signed. Trust the local CA, or click through
      the browser warning on your first visit.
