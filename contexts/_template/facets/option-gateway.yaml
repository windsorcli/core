kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: gateway
  description: Configurable cluster traffic entrypoint

# Each rule names gateway_effective.unsupported, which is never set, so a matching rule fails composition.
requires:
  - when: >-
      ((gateway.external.ip ?? '') != '' && gateway_exposure.external == 'NodePort') ||
      ((gateway.internal.ip ?? '') != '' && gateway_exposure.internal == 'NodePort')
    paths:
      - gateway_effective.unsupported
    message: gateway.<name>.ip applies only to service_type LoadBalancer.
  - when: >-
      ((gateway.external.node_port ?? 0) != 0 && gateway_exposure.external == 'LoadBalancer') ||
      ((gateway.internal.node_port ?? 0) != 0 && gateway_exposure.internal == 'LoadBalancer')
    paths:
      - gateway_effective.unsupported
    message: gateway.<name>.node_port applies only to service_type NodePort.
  - when: >-
      platform in ['aws', 'azure', 'gcp', 'hetzner'] &&
      ((gateway.external.ip ?? '') != '' || (gateway.internal.ip ?? '') != '')
    paths:
      - gateway_effective.unsupported
    message: The cloud load balancer assigns the gateway address; remove gateway.<name>.ip.
  - when: >-
      gateway.enabled == true && platform in ['metal', 'vsphere', 'hyperv', 'incus', 'proxmox'] &&
      ((gateway_effective.external_enabled == true && gateway_exposure.external == 'LoadBalancer' && (gateway.external.ip ?? '') == '') ||
      (gateway_effective.internal_enabled == true && gateway_exposure.internal == 'LoadBalancer' && (gateway.internal.ip ?? '') == ''))
    paths:
      - gateway_effective.unsupported
    message: On metal, vsphere, hyperv, incus, and proxmox, a LoadBalancer gateway needs gateway.<name>.ip.
  - when: >-
      gateway.enabled == true &&
      (network.loadbalancer_ips.start ?? '') != '' && (network.loadbalancer_ips.end ?? '') != '' &&
      ((gateway.internal.ip ?? '') != '' || (gateway.external.ip ?? '') != '') &&
      (let start = reduce(split(network.loadbalancer_ips.start, '.'), #acc * 256 + int(#), 0);
      let end = reduce(split(network.loadbalancer_ips.end, '.'), #acc * 256 + int(#), 0);
      let internal = (gateway.internal.ip ?? '') != '' ? reduce(split(gateway.internal.ip, '.'), #acc * 256 + int(#), 0) : -1;
      let external = (gateway.external.ip ?? '') != '' ? reduce(split(gateway.external.ip, '.'), #acc * 256 + int(#), 0) : -1;
      (internal >= start && internal <= end) || (external >= start && external <= end))
    paths:
      - gateway_effective.unsupported
    message: gateway.<name>.ip MUST sit outside network.loadbalancer_ips.
  - when: (gateway.external.ip ?? '') != '' && gateway.external.ip == (gateway.internal.ip ?? '')
    paths:
      - gateway_effective.unsupported
    message: The two gateways need different addresses in gateway.<name>.ip.
  - when: >-
      gateway_exposure.nodeport == true &&
      gateway_exposure.external_node_port == gateway_exposure.internal_node_port
    paths:
      - gateway_effective.unsupported
    message: The two NodePort gateways need different gateway.<name>.node_port values.
  - when: >-
      ((gateway.external.tls.cert ?? '') == '') != ((gateway.external.tls.key ?? '') == '') ||
      ((gateway.internal.tls.cert ?? '') == '') != ((gateway.internal.tls.key ?? '') == '')
    paths:
      - gateway_effective.unsupported
    message: A supplied gateway certificate needs both gateway.<name>.tls.cert and gateway.<name>.tls.key.
  - when: >-
      gateway.enabled == true && dev != true && (dns.public_domain ?? '') != '' && (gateway.external.https ?? true) == true &&
      (gateway.external.tls.cert ?? '') == '' && tls_effective.external_override == '' &&
      tls_effective.public_zone_writable != true && tls_effective.internal_acme != true
    paths:
      - gateway_effective.unsupported
    message: >-
      The external gateway has no certificate source. Use a dns.public_domain zone the cluster writes
      (aws, azure, gcp, or hetzner), set pki.acme.server or gateway.external.tls.cert, or set gateway.external.tls.issuer.
  - when: >-
      gateway.enabled == true && (dns.public_domain ?? '') != '' && (gateway.external.https ?? true) == true &&
      (gateway.external.tls.cert ?? '') == '' && tls_effective.external_issuer == 'public-acme' && tls_effective.public_zone_writable != true
    paths:
      - gateway_effective.unsupported
    message: gateway.external.tls.issuer acme needs pki.acme.server or a dns.public_domain zone on aws, azure, gcp, or hetzner.
  - when: >-
      gateway.enabled == true && gateway_effective.internal == true && (gateway.internal.https ?? true) == true &&
      (gateway.internal.tls.cert ?? '') == '' && tls_effective.internal_issuer == 'public-acme' &&
      (tls_effective.private_subdomain != true || tls_effective.public_zone_writable != true)
    paths:
      - gateway_effective.unsupported
    message: >-
      gateway.internal.tls.issuer acme needs pki.acme.server, or a dns.private_domain under a
      dns.public_domain zone on aws, azure, gcp, or hetzner.
  - when: >-
      ((gateway.external.allowed_listeners ?? 'None') != 'None' && gateway_exposure.external == 'NodePort') ||
      ((gateway.internal.allowed_listeners ?? 'None') != 'None' && gateway_exposure.internal == 'NodePort')
    paths:
      - gateway_effective.unsupported
    message: gateway.<name>.allowed_listeners applies only to service_type LoadBalancer.
  - when: platform == 'hetzner' && (gateway.internal.allowed_listeners ?? 'None') != 'None'
    paths:
      - gateway_effective.unsupported
    message: Hetzner has no internal gateway; remove gateway.internal.allowed_listeners.
  - when: >-
      ((gateway.external.https ?? true) == false &&
      ((gateway.external.tls.cert ?? '') != '' || (gateway.external.tls.issuer ?? '') != '')) ||
      ((gateway.internal.https ?? true) == false &&
      ((gateway.internal.tls.cert ?? '') != '' || (gateway.internal.tls.issuer ?? '') != ''))
    paths:
      - gateway_effective.unsupported
    message: gateway.<name>.tls applies only to a gateway with https; remove it or set gateway.<name>.https to true.
  - when: >-
      gateway.enabled == true &&
      ((gateway_effective.external_enabled == true && (dns.public_domain ?? '') == '' &&
      (gateway.external.https ?? true) == true && (gateway.external.tls.cert ?? '') == '') ||
      (gateway_effective.internal_enabled == true && (dns.private_domain ?? '') == '' &&
      (gateway.internal.https ?? true) == true && (gateway.internal.tls.cert ?? '') == ''))
    paths:
      - gateway_effective.unsupported
    message: A gateway without a domain needs gateway.<name>.tls.cert, or gateway.<name>.https set to false.

# =============================================================================
# Config — derived values consumed by this facet
# =============================================================================
config:

  - name: gateway_effective
    value:
      # Cilium assigns the pool addresses when it is the LB driver and no cloud LB controller does.
      cilium_lb: "${lb_effective.driver == 'cilium' && lb_effective.controller_required != true}"
      internal_ip: "${gateway.internal.ip ?? ''}"
      external_ip: "${gateway.external.ip ?? ''}"
      internal_mode: "${gateway_exposure.internal == 'NodePort' ? 'nodeport' : 'loadbalancer'}"
      external_mode: "${gateway_exposure.external == 'NodePort' ? 'nodeport' : 'loadbalancer'}"
      # Hetzner is public only and gets no internal gateway.
      internal: "${(dns.private_domain ?? '') != '' && platform != 'hetzner'}"
      # A gateway exists with its domain, or without one when it admits ListenerSets.
      external_enabled: "${(dns.public_domain ?? '') != '' || (gateway.external.allowed_listeners ?? 'None') != 'None'}"
      internal_enabled: >-
        ${platform != 'hetzner' &&
        ((dns.private_domain ?? '') != '' || (gateway.internal.allowed_listeners ?? 'None') != 'None')}
      external_https: ${gateway.external.https ?? true}
      internal_https: ${gateway.internal.https ?? true}

# =============================================================================
# CRDs — vendored, applied ahead of the controller
# =============================================================================
# Gateway API CRDs ship whenever the gateway is enabled (both drivers use them);
# Envoy Gateway's own CRDs ship only on the envoy path.
crds:
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
  - "${gateway.enabled == true ? 'gateway-api-experimental-1.6.2' : ''}"
  # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
  - "${gateway.enabled == true && gateway.driver == 'envoy' ? 'envoy-gateway-1.9.2' : ''}"

# =============================================================================
# Flux systems — Gateway API controller + external/internal Gateway resources
# =============================================================================
# gateway.driver selects 'envoy' or 'cilium'. Downstream facets dependsOn the
# canonical names gateway-install / gateway-resources regardless of driver.
# Two optional gateways: external from dns.public_domain, internal from dns.private_domain.
# Either also exists without its domain when its allowed_listeners admits ListenerSets.
# Resources components take ${gateway_name}, so both gateways share one tree.
flux:

  # Envoy installs Envoy Gateway; Cilium installs only the GatewayClass.
  - name: gateway
    when: gateway.enabled == true
    # dependsOn telemetry-install: keeps destroy order in sync with
    # envoy-gateway's HelmRelease dependsOn on kube-prometheus-stack.
    dependsOn:
      - "${gateway.driver == 'envoy' && telemetry.metrics.enabled ? 'telemetry-install' : ''}"
    install:
      components:
        - "${gateway.driver}"
        - "${gateway.driver == 'envoy' ? 'envoy/prometheus' : ''}"
      timeout: 10m
      interval: 5m
    resources:
      - name: external
        when: gateway_effective.external_enabled == true
        dependsOn:
          - pki-resources
        components:
          # Cilium LBIPAM patch, skipped when a cloud LB controller owns the address.
          - "${gateway.driver == 'cilium' && lb_effective.controller_required != true ? 'cilium' : ''}"
          - >-
            ${gateway.driver == 'cilium' && lb_effective.controller_required != true &&
            (gateway_effective.external_ip ?? '') != '' ? 'cilium/fixed-ip' : ''}
          - "${gateway_effective.external_https == true && (gateway.external.tls.cert ?? '') == '' ? 'certificate' : ''}"
          - "${gateway_effective.external_https != true ? 'no-web-https' : ''}"
          - "${(gateway.external.allowed_listeners ?? 'None') != 'None' ? 'allowed-listeners' : ''}"
          - "${gateway.driver != 'cilium' ? 'envoy/base' : ''}"
          - "${gateway.driver == 'envoy' ? 'envoy/' + gateway_effective.external_mode : ''}"
          - >-
            ${gateway.driver == 'envoy' && gateway_effective.external_mode == 'loadbalancer' &&
            lb_effective.enabled == true && (gateway_effective.external_ip ?? '') != '' ?
            'envoy/loadbalancer/' + lb_effective.driver + '-ip' : ''}
          - >-
            ${gateway.driver == 'envoy' && gateway_effective.external_mode == 'loadbalancer' &&
            gateway_effective.cilium_lb == true && (gateway_effective.external_ip ?? '') != '' ?
            'envoy/loadbalancer/cilium-ip' : ''}
          - >-
            ${gateway_effective.cilium_lb == true && gateway_effective.external_mode == 'loadbalancer' &&
            (gateway_effective.external_ip ?? '') != '' ? 'cilium-pool' : ''}
          - >-
            ${gateway.driver == 'envoy' && gateway_effective.external_mode == 'nodeport' &&
            workstation.runtime == 'docker-desktop' ? 'envoy/nodeport/docker-desktop' : ''}
          # Points the Gateway at its EnvoyProxy (envoy-only data-plane Service config).
          - "${gateway.driver != 'cilium' ? 'envoy/parameters' : ''}"
          # Catch-all 404 (Envoy directResponse) for unmatched HTTPRoutes; envoy-only.
          - "${gateway.driver != 'cilium' && gateway_effective.external_https == true ? 'envoy/default-404' : ''}"
          - >-
            ${gateway.driver != 'cilium' && gateway_effective.external_https == true && (dns.public_domain ?? '') != '' ?
            'envoy/default-404/external-dns' : ''}
          - >-
            ${lb_effective.enabled == true && gateway_effective.external_mode == 'loadbalancer' && (gateway_effective.external_ip ?? '') != '' ?
            'lb-address' : ''}
        substitutions:
          gateway_name: external
          gateway_allowed_listeners: "${gateway.external.allowed_listeners ?? 'None'}"
          gateway_tls_secret: "${(gateway.external.tls.cert ?? '') != '' ? 'external-supplied-tls' : 'external-web-tls'}"
          gateway_class_name: ${gateway.driver}
          gateway_domain: "${dns.public_domain ?? ''}"
          gateway_cert_issuer: "${tls_effective.external_issuer}"
          gateway_lb_scheme: internet-facing
          gateway_loadbalancer_ip: >-
            ${(lb_effective.enabled == true || gateway_effective.cilium_lb == true) && gateway_effective.external_mode == 'loadbalancer' ?
            gateway_effective.external_ip : ''}
          gateway_dns_target: "${lb_effective.enabled == true && gateway_effective.external_mode == 'loadbalancer' ? gateway_effective.external_ip : ''}"
          # docker-desktop forwards to a host port; everywhere else uses :443.
          gateway_redirect_port: "${workstation.runtime == 'docker-desktop' ? '8444' : '443'}"
          gateway_nodeport_http: ${gateway_exposure.external_http_node_port}
          gateway_nodeport_https: ${gateway_exposure.external_node_port}
          gateway_host_http_port: 8081
          gateway_host_https_port: 8444
        timeout: 10m
        interval: 5m

      - name: internal
        when: gateway_effective.internal_enabled == true
        dependsOn:
          - pki-resources
        components:
          - "${gateway.driver == 'cilium' && lb_effective.controller_required != true ? 'cilium' : ''}"
          - >-
            ${gateway.driver == 'cilium' && lb_effective.controller_required != true &&
            (gateway_effective.internal_ip ?? '') != '' ? 'cilium/fixed-ip' : ''}
          - "${gateway_effective.internal_https == true && (gateway.internal.tls.cert ?? '') == '' ? 'certificate' : ''}"
          - "${gateway_effective.internal_https != true ? 'no-web-https' : ''}"
          - "${(gateway.internal.allowed_listeners ?? 'None') != 'None' ? 'allowed-listeners' : ''}"
          - "${gateway.driver != 'cilium' ? 'envoy/base' : ''}"
          - "${gateway.driver == 'envoy' ? 'envoy/' + gateway_effective.internal_mode : ''}"
          - >-
            ${gateway.driver == 'envoy' && gateway_effective.internal_mode == 'loadbalancer' &&
            lb_effective.enabled == true && (gateway_effective.internal_ip ?? '') != '' ?
            'envoy/loadbalancer/' + lb_effective.driver + '-ip' : ''}
          - >-
            ${gateway.driver == 'envoy' && gateway_effective.internal_mode == 'loadbalancer' &&
            gateway_effective.cilium_lb == true && (gateway_effective.internal_ip ?? '') != '' ?
            'envoy/loadbalancer/cilium-ip' : ''}
          - >-
            ${gateway_effective.cilium_lb == true && gateway_effective.internal_mode == 'loadbalancer' &&
            (gateway_effective.internal_ip ?? '') != '' ? 'cilium-pool' : ''}
          - >-
            ${gateway.driver == 'envoy' && gateway_effective.internal_mode == 'nodeport' &&
            dns.private.driver == 'coredns' ? 'envoy/nodeport/dns' : ''}
          - >-
            ${gateway.driver == 'envoy' && gateway_effective.internal_mode == 'nodeport' &&
            (gitops.mode ?? 'push') == 'push' ? 'envoy/nodeport/flux-webhook' : ''}
          - >-
            ${gateway.driver == 'envoy' && gateway_effective.internal_mode == 'nodeport' &&
            workstation.runtime == 'docker-desktop' ? 'envoy/nodeport/docker-desktop' : ''}
          - "${gateway.driver != 'cilium' ? 'envoy/parameters' : ''}"
          - "${gateway.driver != 'cilium' && gateway_effective.internal_https == true ? 'envoy/default-404' : ''}"
          - >-
            ${gateway.driver != 'cilium' && gateway_effective.internal_https == true && (dns.private_domain ?? '') != '' ?
            'envoy/default-404/external-dns' : ''}
          - >-
            ${gateway.driver != 'cilium' && dns.private.driver == 'coredns' && (dns.private_domain ?? '') != '' ?
            'dns' : ''}
          - >-
            ${lb_effective.enabled == true && gateway_effective.internal_mode == 'loadbalancer' && (gateway_effective.internal_ip ?? '') != '' ?
            'lb-address' : ''}
          - "${(gitops.mode ?? 'push') == 'push' ? 'flux-webhook' : ''}"
        substitutions:
          gateway_name: internal
          gateway_allowed_listeners: "${gateway.internal.allowed_listeners ?? 'None'}"
          gateway_tls_secret: "${(gateway.internal.tls.cert ?? '') != '' ? 'internal-supplied-tls' : 'internal-web-tls'}"
          gateway_class_name: ${gateway.driver}
          gateway_domain: "${dns.private_domain ?? ''}"
          gateway_cert_issuer: "${tls_effective.internal_issuer}"
          gateway_lb_scheme: internal
          gateway_loadbalancer_ip: >-
            ${(lb_effective.enabled == true || gateway_effective.cilium_lb == true) && gateway_effective.internal_mode == 'loadbalancer' ?
            gateway_effective.internal_ip : ''}
          gateway_dns_target: "${lb_effective.enabled == true && gateway_effective.internal_mode == 'loadbalancer' ? gateway_effective.internal_ip : ''}"
          gateway_redirect_port: "${workstation.runtime == 'docker-desktop' ? '8443' : '443'}"
          gateway_nodeport_http: ${gateway_exposure.internal_http_node_port}
          gateway_nodeport_https: ${gateway_exposure.internal_node_port}
          gateway_host_http_port: 8080
          gateway_host_https_port: 8443
        timeout: 10m
        interval: 5m

  # Supplied certificate for each gateway, in place of a cert-manager Certificate.
  - name: gateway
    when: gateway.enabled == true && gateway_effective.external_enabled == true && (gateway.external.tls.cert ?? '') != ''
    secrets:
      external-supplied-tls:
        namespaces: [system-gateway]
        type: kubernetes.io/tls
        data:
          tls.crt: ${gateway.external.tls.cert}
          tls.key: ${gateway.external.tls.key}

  - name: gateway
    when: gateway.enabled == true && gateway_effective.internal_enabled == true && (gateway.internal.tls.cert ?? '') != ''
    secrets:
      internal-supplied-tls:
        namespaces: [system-gateway]
        type: kubernetes.io/tls
        data:
          tls.crt: ${gateway.internal.tls.cert}
          tls.key: ${gateway.internal.tls.key}
