kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: gcp
  description: "GCP provider basic infrastructure"

when: platform == 'gcp'

# Requires
# =============================================================================
requires:
  - paths:
      - gcp.project_id
    message: The GCP provider needs a project ID for every API call.
  - when: >-
      tls_effective.public_acme == true
    paths:
      - email
    message: ACME certificates for dns.public_domain or gateway.<name>.tls.issuer acme need email as the account contact.

# Config
# =============================================================================
config:

  # GKE ships metrics-server as an add-on.
  - name: telemetry
    value:
      metrics_server_enabled: false

  # The public issuer is selfsigned by default.
  - name: pki_effective
    value:
      issuer_component: public-issuer/selfsigned

  # The public issuer is ACME with Cloud DNS-01 when a gateway domain uses public-acme
  # and Cloud DNS hosts the public zone.
  - name: pki_effective
    when: >-
      tls_effective.public_acme == true && dns_zone_effective.cloud == true
    value:
      issuer_component: public-issuer/acme/clouddns

# Terraform
# =============================================================================
terraform:

  # Core provisions the state bucket unless set by terraform.backend.
  - name: backend
    path: backend/gcs
    when: backend_effective.managed == true

  - name: network
    path: network/gcp-vpc
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
    inputs:
      region: ${gcp.region ?? 'us-central1'}
      cidr_block: ${network.cidr_block}
      # The VPC also provisions a private Cloud DNS zone for this domain.
      domain_name: ${dns.private_domain ?? ''}

  # Public Cloud DNS zone for dns.public_domain.
  - name: dns-zone
    path: dns/zone/gcp-dns
    when: "dns_zone_effective.cloud == true"
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
    inputs:
      project_id: ${gcp.project_id}
      domain_name: ${dns.public_domain}

  # GKE, whose Dataplane V2 runs Cilium.
  - name: cluster
    path: cluster/gcp-gke
    dependsOn:
      - network
    inputs:
      project_id: ${gcp.project_id}
      # GKE requires the VPC's region.
      region: ${terraform_output('network', 'region')}
      network_id: ${terraform_output('network', 'network_id')}
      subnetwork_id: ${terraform_output('network', 'private_subnet_id')}
      # Nodes in a single zone unless topology is ha.
      node_locations: "${topology == 'ha' ? terraform_output('network', 'available_zones') : [terraform_output('network', 'available_zones')[0]]}"
      system_node_pool:
        node_count: "${topology == 'ha' ? 2 : 1}"
        # Off for ephemeral contexts, so repairs don't race the pool's deletion.
        auto_repair: "${!(ephemeral ?? false)}"
      # cert-manager identity, only when Cloud DNS hosts the public zone.
      create_cert_manager_identity: "${dns_zone_effective.cloud == true}"
      # The identity's Cloud DNS writes are limited to the public zone.
      cert_manager_dns_zone_names: "${dns_zone_effective.cloud == true && (terraform_output('dns-zone', 'zone_name') ?? '') != '' ? [terraform_output('dns-zone', 'zone_name')] : []}"
      # The public zone name and the private zone name, whichever exist.
      external_dns_dns_zone_names: >-
        ${concat(
          dns_zone_effective.cloud == true && gateway_external_effective.domain != '' && (terraform_output('dns-zone', 'zone_name') ?? '') != '' ? [terraform_output('dns-zone', 'zone_name')] : [],
          (dns.private_domain ?? '') != '' && (terraform_output('network', 'private_zone_name') ?? '') != '' ? [terraform_output('network', 'private_zone_name')] : [])}
      # One general pool unless set by cluster.pools. A custom pool sets its own auto_repair.
      pools: >-
        ${cluster.pools ?? {"general": {"class": "general", "count": 1, "auto_repair": !(ephemeral ?? false)}}}

  # Adds dns-zone to the cluster's dependsOn when Cloud DNS hosts the public zone.
  - name: cluster
    when: "dns_zone_effective.cloud == true"
    dependsOn:
      - dns-zone

  - name: gitops
    path: gitops/flux
    # Skipped on destroy, since deleting GKE removes Flux.
    destroy: false
    dependsOn:
      - cluster
    inputs:
      concurrency: 5

# Flux
# =============================================================================
flux:

  # cert-manager Workload Identity, which the cloudDNS solver requires for Google access tokens.
  - name: pki
    when: "dns_zone_effective.cloud == true"
    install:
      components:
        - cert-manager/gcp-workload-identity
      substitutions:
        cert_manager_service_account_email: "${terraform_output('cluster', 'cert_manager_service_account_email') ?? ''}"

  # Public ClusterIssuer from pki_effective.issuer_component.
  - name: pki
    resources:
      - components:
          - "${pki_effective.issuer_component}"
        timeout: 5m
        interval: 5m
        substitutions:
          acme_server: "${dev == true ? 'https://acme-staging-v02.api.letsencrypt.org/directory' : 'https://acme-v02.api.letsencrypt.org/directory'}"
          acme_email: "${email ?? ''}"
          acme_dns_zone: "${dns.public_domain ?? ''}"
          acme_dns_zone_project: "${gcp.project_id}"

  # external-dns, one instance per Cloud DNS zone: public when dns.public_domain is set,
  # private when dns.private.driver is cloud. Neither sets a zone ID filter.
  - name: dns
    when: "dns_zone_effective.cloud == true || dns.private.driver == 'cloud'"
    install:
      timeout: 5m
      interval: 5m
    resources:
      - name: account
        components:
          - service-account
          - service-account/providers/google
        substitutions:
          external_dns_service_account_email: "${terraform_output('cluster', 'external_dns_service_account_email') ?? ''}"
        timeout: 5m
        interval: 5m
      - name: public
        when: dns_zone_effective.cloud == true
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/google
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-public
          external_dns_domain: "${dns.public_domain ?? ''}"
          google_project_id: "${gcp.project_id}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m
      - name: private
        when: dns.private.driver == 'cloud'
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/google
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-private
          external_dns_domain: "${dns.private_domain ?? ''}"
          google_project_id: "${gcp.project_id}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m

  # GCP load balancer for the internal Envoy gateway Service.
  - name: gateway
    when: "gateway.enabled == true && gateway.driver == 'envoy' && load_balancer.mode == 'loadbalancer' && (dns.private_domain ?? '') != ''"
    resources:
      - name: internal
        components:
          - envoy/loadbalancer/gcp
