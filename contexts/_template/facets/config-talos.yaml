kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: talos
  description: Talos common patches (cert rotation, volume mounts, allow scheduling on control planes, API-server OIDC, NTP servers)

# Only relevant when Talos is the cluster driver. Managed clusters (EKS, AKS)
# build their own machine images and don't take Talos patches.
when: cluster.driver == 'talos'

requires:
  # kube-apiserver fetches the issuer's JWKS itself and clients validate the same
  # token `iss` claim, both against the hosted Keycloak's gateway URL — without a
  # gateway neither can reach it.
  - when: >-
      cluster.oidc.enabled == true
      && (cluster.oidc.issuer_url ?? '') == ''
      && identity.enabled == true
      && (identity.driver ?? 'keycloak') == 'keycloak'
      && gateway.enabled != true
    message: >-
      kube-apiserver OIDC against the hosted Keycloak needs it reachable through
      the gateway — enable the gateway, or set cluster.oidc.issuer_url explicitly.
  - when: >-
      any(
        values(docker.registries ?? {}),
        ((get(#, 'username') ?? '') == '') != ((get(#, 'password') ?? '') == '')
      )
    message: The username and password of a docker.registries entry must be set together.
  - when: talos_registries.credentials_conflict == true
    message: docker.registries entries with the same endpoint host need the same username and password.
  # Registry mode copies only the images of the Talos versions in talos_images.
  - when: (charts.registry ?? '') != '' && !(talos.talos_version in talos_images)
    message: Registry mode supports only the Talos versions that this blueprint pins. Use a pinned Talos version, or turn off registry mode.
  - when: >-
      (charts.registry ?? '') != ''
      && !(let versions = keys(talos_images ?? {}); all(filter(concat(
        [cluster.controlplanes.image ?? '', cluster.workers.image ?? ''],
        map(values(cluster.controlplanes.nodes ?? {}), #.image ?? ''),
        map(values(cluster.workers.nodes ?? {}), #.image ?? '')
      ), # != ''), {let image = #; any(versions, image endsWith ('v' + #) || image contains ('v' + # + '/') || image contains ('v' + # + '@'))}))
    message: Registry mode supports only node images of the Talos versions that this blueprint pins. Remove the node image override, or turn off registry mode.

# =============================================================================
# Config — Talos machine patch + extension catalog
# =============================================================================
# Everything funnels into talos_common, the single object the cluster/talos
# terraform module consumes. Platform facets set overrides first; this file
# layers in the common defaults.
config:

  # docker.registries entries with an endpoint, parsed for the Talos registry documents.
  - name: talos_registries
    value:
      endpoints: >-
        ${map(
          sortBy(filter(toPairs(docker.registries ?? {}), (get(get(#, 1), 'endpoint') ?? '') != ''), get(#, 0)),
          let entry = get(#, 1);
          let parts = split(entry.endpoint contains '://' ? entry.endpoint : 'https://' + entry.endpoint, '/');
          ({
            registry: (entry.local ?? '') != '' ? entry.local : get(#, 0),
            host: parts[2],
            https: parts[0] == 'https:',
            url: parts[0] + '//' + parts[2] + (len(parts) > 3 ? '/v2/' + join(parts[3:], '/') : ''),
            username: entry.username ?? '',
            password: entry.password ?? ''
          })
        )}
      auths: "${filter(talos_registries.endpoints, #.username != '')}"
      credentials_conflict: "${len(uniq(map(talos_registries.auths, #.host + ' ' + #.username + ' ' + #.password))) > len(uniq(map(talos_registries.auths, #.host)))}"

  # talos_common defaults: platform facets set platform-specific values first,
  # then this block fills in anything left.
  - name: talos_common
    value:

      # Storage driver; incus overrides to 'longhorn' (dedicated block devices).
      storage_driver: "${cluster.storage.driver ?? 'openebs'}"

      # Default Longhorn data disk; platform facets override size/name.
      longhorn_default_disk:
        - name: longhorn
          size: 30

      # single-node forces the control plane to schedule workloads.
      allowSchedulingOnControlPlanes: "${(cluster.controlplanes.schedulable ?? false) || topology == 'single-node'}"
      controlplane_volumes: "${cluster.controlplanes.volumes ?? []}"
      worker_volumes: "${let vols = cluster.workers.volumes ?? []; talos_common.storage_driver == 'mayastor' ? concat(vols, ['/var/local']) : vols}"
      csi_local_volume_path: "${cluster.storage.local_base_path ?? \"/var/mnt/local\"}"

      # Default to the longhorn disk when longhorn is the driver, else no disks.
      controlplane_disks: "${cluster.controlplanes.disks ?? (talos_common.storage_driver == 'longhorn' ? talos_common.longhorn_default_disk : [])}"
      worker_disks: "${cluster.workers.disks ?? (talos_common.storage_driver == 'longhorn' ? talos_common.longhorn_default_disk : [])}"

      # Reservation tiers keyed on schedulable vs dedicated. Schedulable
      # competes with real Pods so stays light; dedicated only shares with
      # DaemonSets so affords more. max is raw millicores/Mi, scaled below.
      cp_tiers:
        schedulable:
          threshold: { cpu: 4, memory: 12 }
          max: { kubelet_cpu: 100, kubelet_memory: 256, api_cpu: 100, api_memory: 128, cm_cpu: 50, cm_memory: 64, sched_cpu: 50, sched_memory: 64 }
        dedicated:
          threshold: { cpu: 2, memory: 4 }
          max: { kubelet_cpu: 500, kubelet_memory: 512, api_cpu: 250, api_memory: 256, cm_cpu: 100, cm_memory: 128, sched_cpu: 100, sched_memory: 128 }
      cp_tier: "${talos_common.allowSchedulingOnControlPlanes ? talos_common.cp_tiers.schedulable : talos_common.cp_tiers.dedicated}"

      # Worker reservation: single tier (workers always run Pods). Anchored
      # to GKE's kubeReserved formula at a 4 CPU/8GB node (80m, 1843Mi).
      worker_threshold: { cpu: 4, memory: 8 }
      worker_max: { kubelet_cpu: 80, kubelet_memory: 1843 }

      # Kubelet serving-cert rotation.
      cert_rotation:
        kubelet_extra_args:
          rotate-server-certificates: "true"
        # Approves the kubelet serving CSRs that rotation requests.
        approver_manifest:
          name: kubelet-csr-approver
          contents: "${file('../manifests/kubelet-csr-approver.yaml')}"

      # Machine patch stringified into common_config_patches; platform facets
      # can merge additional keys into common_patch.
      common_patch:
        cluster:
          allowSchedulingOnControlPlanes: ${talos_common.allowSchedulingOnControlPlanes}
          inlineManifests: ${[talos_common.cert_rotation.approver_manifest]}
        machine:
          kubelet:
            extraArgs: ${talos_common.cert_rotation.kubelet_extra_args}
      common_config_patches: >-
        ${join(concat([string(talos_common.common_patch)], talos_common.registry_mirror_documents, talos_common.registry_auth_documents, talos_common.registry_tls_documents), "\n---\n")}

      # Extension catalog: driver/feature → required Talos Image Factory
      # extensions. Add a key for a new driver; the aggregated extensions list picks it up.
      csi_extensions:
        longhorn:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
        mayastor:
          - siderolabs/nvme-cli

      extensions: "${get(talos_common.csi_extensions, talos_common.storage_driver) ?? []}"

      # RegistryMirrorConfig documents for the docker.registries endpoints and the resolved workstation caches.
      registry_mirror_documents: >-
        ${let caches = type(talos_registry_mirrors.mirrors) == 'map' ? talos_registry_mirrors.mirrors : {};
        let endpoints = map(talos_registries.endpoints, [#.registry, { endpoints: [#.url], skipFallback: true }]);
        map(sortBy(toPairs(fromPairs(concat(toPairs(caches), endpoints))), get(#, 0)), string(fromPairs(concat([
          ['apiVersion', 'v1alpha1'],
          ['kind', 'RegistryMirrorConfig'],
          ['name', get(#, 0)],
          ['endpoints', map(get(get(#, 1), 'endpoints'), # contains '/v2/' ? fromPairs([['url', #], ['overridePath', true]]) : fromPairs([['url', #]]))]
        ], get(get(#, 1), 'skipFallback') == true ? [['skipFallback', true]] : []))))}

      # RegistryAuthConfig documents, one per endpoint host.
      registry_auth_documents: >-
        ${sort(uniq(map(talos_registries.auths, string(fromPairs([
          ['apiVersion', 'v1alpha1'],
          ['kind', 'RegistryAuthConfig'],
          ['name', #.host],
          ['username', #.username],
          ['password', #.password]
        ])))))}

      # RegistryTLSConfig documents trusting pki.trusted_cas, one per https endpoint host.
      registry_tls_documents: >-
        ${len(pki.trusted_cas ?? []) == 0 ? [] : map(
          sort(uniq(map(filter(talos_registries.endpoints, #.https), #.host))),
          string(fromPairs([
            ['apiVersion', 'v1alpha1'],
            ['kind', 'RegistryTLSConfig'],
            ['name', #],
            ['ca', join(pki.trusted_cas, '\n')]
          ]))
        )}

  # Reservation tapers linearly from full at the threshold to zero at 2x it,
  # driven by whichever axis (cpu/memory) is proportionally smaller.
  - name: talos_common
    value:
      cp_cpu_ratio: "${cluster_resources_effective.controlplanes.cpu / talos_common.cp_tier.threshold.cpu}"
      cp_memory_ratio: "${cluster_resources_effective.controlplanes.memory / talos_common.cp_tier.threshold.memory}"
      cp_ratio: "${talos_common.cp_cpu_ratio < talos_common.cp_memory_ratio ? talos_common.cp_cpu_ratio : talos_common.cp_memory_ratio}"
      cp_factor: "${talos_common.cp_ratio > 2 ? 0 : (talos_common.cp_ratio < 1 ? 1 : (2 - talos_common.cp_ratio))}"
      resource_constrained: "${talos_common.cp_factor > 0}"

      worker_cpu_ratio: "${cluster_resources_effective.workers.cpu / talos_common.worker_threshold.cpu}"
      worker_memory_ratio: "${cluster_resources_effective.workers.memory / talos_common.worker_threshold.memory}"
      worker_ratio: "${talos_common.worker_cpu_ratio < talos_common.worker_memory_ratio ? talos_common.worker_cpu_ratio : talos_common.worker_memory_ratio}"
      worker_factor: "${talos_common.worker_ratio > 2 ? 0 : (talos_common.worker_ratio < 1 ? 1 : (2 - talos_common.worker_ratio))}"
      worker_constrained: "${talos_common.worker_factor > 0}"
      worker_reserve_needed: "${talos_common.resource_constrained || talos_common.worker_constrained}"
      worker_patch_emit: "${talos_common.worker_reserve_needed || platform == 'docker' || talos_common.storage_driver == 'mayastor'}"

      # Base for worker_patch: platform blocks (docker's systemReserved gap)
      # and the kubeReserved block below each merge a sibling key into this.
      worker_patch: {}

  # Cilium machine patch: disable the built-in flannel CNI and kube-proxy.
  - name: talos_common
    when: cluster.cni.driver == 'cilium'
    value:
      common_patch:
        cluster:
          network:
            cni:
              name: none
          proxy:
            disabled: true

  # NTP servers: overrides Talos's built-in default (time.cloudflare.com).
  # Applies to every platform since common_patch flows into every cluster/talos
  # invocation, not just the ones with a per-platform network patch.
  - name: talos_common
    when: len(network.ntp_servers ?? []) > 0
    value:
      common_patch:
        machine:
          time:
            servers: ${network.ntp_servers}

  # Single-node topology: no peers, so disable leader election (avoids a ~2s etcd
  # lease write) and enable etcd auto-compaction (upstream default is off).
  - name: talos_common
    when: topology == 'single-node'
    value:
      common_patch:
        cluster:
          controllerManager:
            extraArgs:
              leader-elect: "false"
          scheduler:
            extraArgs:
              leader-elect: "false"
          etcd:
            extraArgs:
              auto-compaction-mode: "revision"
              auto-compaction-retention: "1000"
              # 3/3 (default 5/5): no peers to catch up, saves ~128 MiB on disk.
              max-snapshots: "3"
              max-wals: "3"

  # Small control plane: reserve kubelet/containerd cgroup headroom (otherwise
  # zero) so bursty pod scheduling during bootstrap doesn't starve them, and
  # give apiServer/controllerManager/scheduler enough CPU shares that the
  # kernel favors them under contention. etcd runs outside kubepods.slice
  # already, so it isn't set here. kubeReserved only, not systemReserved:
  # docker's own host-quota-gap correction (option-workstation.yaml) already
  # sets systemReserved on that platform, and a second value on the same key
  # would just overwrite this one, not add to it.
  - name: talos_common
    when: talos_common.resource_constrained
    value:
      cp_reserve:
        kubelet_cpu: "${string(int(talos_common.cp_tier.max.kubelet_cpu * talos_common.cp_factor + 0.5)) + 'm'}"
        kubelet_memory: "${string(int(talos_common.cp_tier.max.kubelet_memory * talos_common.cp_factor + 0.5)) + 'Mi'}"
        api_cpu: "${string(int(talos_common.cp_tier.max.api_cpu * talos_common.cp_factor + 0.5)) + 'm'}"
        api_memory: "${string(int(talos_common.cp_tier.max.api_memory * talos_common.cp_factor + 0.5)) + 'Mi'}"
        cm_cpu: "${string(int(talos_common.cp_tier.max.cm_cpu * talos_common.cp_factor + 0.5)) + 'm'}"
        cm_memory: "${string(int(talos_common.cp_tier.max.cm_memory * talos_common.cp_factor + 0.5)) + 'Mi'}"
        sched_cpu: "${string(int(talos_common.cp_tier.max.sched_cpu * talos_common.cp_factor + 0.5)) + 'm'}"
        sched_memory: "${string(int(talos_common.cp_tier.max.sched_memory * talos_common.cp_factor + 0.5)) + 'Mi'}"
      common_patch:
        machine:
          kubelet:
            extraConfig:
              kubeReserved:
                cpu: ${talos_common.cp_reserve.kubelet_cpu}
                memory: ${talos_common.cp_reserve.kubelet_memory}
        cluster:
          apiServer:
            resources:
              requests:
                cpu: ${talos_common.cp_reserve.api_cpu}
                memory: ${talos_common.cp_reserve.api_memory}
          controllerManager:
            resources:
              requests:
                cpu: ${talos_common.cp_reserve.cm_cpu}
                memory: ${talos_common.cp_reserve.cm_memory}
          scheduler:
            resources:
              requests:
                cpu: ${talos_common.cp_reserve.sched_cpu}
                memory: ${talos_common.cp_reserve.sched_memory}

  # Merges into worker_patch (base above), not common_patch (shared by every
  # role): a worker's own size decides this. Later patches override earlier
  # ones on the same field, so this also corrects the leak from above.
  - name: talos_common
    when: talos_common.worker_reserve_needed
    value:
      # Recomputes the factor from worker_ratio instead of referencing
      # worker_factor directly: read cross-block, worker_factor evaluates to
      # cp_factor's value instead of its own (composer bug, not ours).
      worker_reserve:
        kubelet_cpu: "${let f = talos_common.worker_ratio > 2 ? 0 : (talos_common.worker_ratio < 1 ? 1 : (2 - talos_common.worker_ratio)); string(int(talos_common.worker_max.kubelet_cpu * f + 0.5)) + 'm'}"
        kubelet_memory: "${let f = talos_common.worker_ratio > 2 ? 0 : (talos_common.worker_ratio < 1 ? 1 : (2 - talos_common.worker_ratio)); string(int(talos_common.worker_max.kubelet_memory * f + 0.5)) + 'Mi'}"
      worker_patch:
        machine:
          kubelet:
            extraConfig:
              kubeReserved:
                cpu: ${talos_common.worker_reserve.kubelet_cpu}
                memory: ${talos_common.worker_reserve.kubelet_memory}

  # Mayastor: hugepages, the nvme_tcp module, a node label for io-engine.
  # Its /var/local mount goes through worker_volumes instead, not here (extraMounts replaces rather than merges).
  - name: talos_common
    when: talos_common.storage_driver == 'mayastor'
    value:
      worker_patch:
        machine:
          sysctls:
            vm.nr_hugepages: "1024"
          nodeLabels:
            openebs.io/engine: mayastor
          kernel:
            modules:
              - name: nvme_tcp

  - name: talos_common
    when: talos_common.worker_patch_emit
    value:
      worker_config_patches: "${string(talos_common.worker_patch)}"

  # API-server OIDC: maps cluster.oidc.* to the kube-apiserver --oidc-* flags.
  # issuer_url/client_id fall back to the hosted Keycloak identity provider when unset.
  - name: talos_common
    when: cluster.oidc.enabled == true
    value:
      oidc_issuer_url: "${cluster.oidc.issuer_url ?? (identity.enabled == true ? identity_effective.issuer : '')}"
      oidc_client_id: "${cluster.oidc.client_id ?? ((identity.enabled == true && (identity.driver ?? 'keycloak') == 'keycloak') ? 'kubernetes' : '')}"
      common_patch:
        cluster:
          apiServer:
            extraArgs:
              oidc-issuer-url: ${talos_common.oidc_issuer_url}
              oidc-client-id: ${talos_common.oidc_client_id}
              oidc-username-claim: "${cluster.oidc.username_claim ?? 'sub'}"
              oidc-groups-claim: "${cluster.oidc.groups_claim ?? 'groups'}"

  # public_ca: the hosted Keycloak's gateway serves a Let's Encrypt certificate, verified against system roots.
  - name: talos_oidc
    value:
      public_ca: >-
        ${(cluster.oidc.issuer_url ?? '') == '' && identity.enabled == true &&
        (identity.driver ?? 'keycloak') == 'keycloak' && (identity.keycloak.hostname ?? '') == '' &&
        ((dns.public_domain ?? '') != '' ?
        (gateway.external.tls.cert ?? '') == '' && tls_effective.external_issuer == 'public-acme' :
        (gateway.internal.tls.cert ?? '') == '' && tls_effective.internal_issuer == 'public-acme')}

  # Trusts the Windsor-managed private CA for OIDC token verification. The
  # cert comes from the pki/ca terraform step, which runs ahead of this
  # machine config so it's available at first bootstrap. Without pki
  # enabled, oidc-ca-file is left unset and the issuer must carry a
  # publicly-trusted certificate instead.
  #
  # oidc_ca_file_patch is a standalone literal-YAML string (cert substituted
  # inline), fed to controlplane_config_patches rather than merged into
  # common_patch: terraform_output()'s cert value is deferred until pki/ca
  # applies, and a deferred plain-string leaf nested inside a map that
  # common_config_patches later stringifies loses its YAML block-scalar
  # formatting on resolution. A deferred value substituted directly into
  # literal text (this pattern, also used by docker's certSANs patch)
  # doesn't hit that path.
  - name: talos_common
    when: cluster.oidc.enabled == true && talos_oidc.public_ca != true
    value:
      common_patch:
        cluster:
          apiServer:
            extraArgs:
              oidc-ca-file: /etc/kubernetes/oidc-ca.crt
            extraVolumes:
              - hostPath: /var/kubernetes/oidc-ca.crt
                mountPath: /etc/kubernetes/oidc-ca.crt
                readonly: true
      oidc_ca_file_patch: |-
        machine:
          files:
          - op: create
            path: /var/kubernetes/oidc-ca.crt
            permissions: 420
            content: |
              ${terraform_output('pki', 'cert')}

  # Appends the pki.trusted_cas roots to the OIDC CA file.
  - name: talos_common
    when: cluster.oidc.enabled == true && talos_oidc.public_ca != true && len(pki.trusted_cas ?? []) > 0
    value:
      oidc_ca_file_patch: |-
        machine:
          files:
          - op: create
            path: /var/kubernetes/oidc-ca.crt
            permissions: 420
            content: |
              ${terraform_output('pki', 'cert')}
              ${join(pki.trusted_cas, '\n')}

  # Pinned Talos version; Renovate watches the string below.
  - name: talos
    value:
      # renovate: datasource=github-releases depName=talos package=siderolabs/talos
      talos_version: "1.14.2"

  - name: talos
    when: platform == 'docker' && workstation.runtime == 'colima'
    value:
      # Remove once Colima's VM image is Ubuntu 26.04 or newer.
      # artifact: type=image name=ghcr.io/siderolabs/talos
      talos_image_tag: "v1.13.11"
      talos_version: "${trimPrefix(talos.talos_image_tag, 'v')}"
      # artifact: type=image name=registry.k8s.io/kube-apiserver
      # artifact: type=image name=registry.k8s.io/kube-controller-manager
      # artifact: type=image name=registry.k8s.io/kube-scheduler
      # artifact: type=image name=ghcr.io/siderolabs/kubelet
      # artifact: type=image name=registry.k8s.io/kube-proxy
      kubernetes_image_tag: "v1.36.5"
      kubernetes_version: "${trimPrefix(talos.kubernetes_image_tag, 'v')}"

  # BEGIN talos_images: generated by task talos:images. Do not edit.
  - name: talos_images
    value:
      "1.13.11":
        # artifact: type=image name=registry.k8s.io/coredns/coredns
        coredns: "registry.k8s.io/coredns/coredns:v1.14.7"
        # artifact: type=image name=registry.k8s.io/etcd
        etcd: "registry.k8s.io/etcd:v3.6.14"
        # artifact: type=image name=ghcr.io/siderolabs/flannel
        flannel: "ghcr.io/siderolabs/flannel:0.28.8"
        # artifact: type=image name=registry.k8s.io/networking/kube-network-policies
        kube-network-policies: "registry.k8s.io/networking/kube-network-policies:v1.1.0"
        # artifact: type=image name=registry.k8s.io/pause
        pause: "registry.k8s.io/pause:3.10.1"
      "1.14.2":
        # artifact: type=image name=registry.k8s.io/coredns/coredns
        coredns: "registry.k8s.io/coredns/coredns:v1.14.7"
        # artifact: type=image name=registry.k8s.io/etcd
        etcd: "registry.k8s.io/etcd:3.7.1"
        # artifact: type=image name=ghcr.io/siderolabs/flannel
        flannel: "ghcr.io/siderolabs/flannel:0.28.9"
        # artifact: type=image name=registry.k8s.io/networking/kube-network-policies
        kube-network-policies: "registry.k8s.io/networking/kube-network-policies:v1.1.1"
        # artifact: type=image name=registry.k8s.io/pause
        pause: "registry.k8s.io/pause:3.10.2"
  # END talos_images
