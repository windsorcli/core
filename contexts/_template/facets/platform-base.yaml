kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: platform-base
  description: "Base infrastructure components for all platforms"

when: (platform ?? 'none') != 'none'

# Requires
# =============================================================================
requires:
  - when: "'*' in keys(registries ?? {}) && (get(registries['*'], 'endpoint') ?? '') == ''"
    message: The * entry in registries needs endpoint.
  - when: >-
      any(values(registries ?? {}), (get(#, 'hostname') ?? '') != '' && (get(#, 'endpoint') ?? '') == '') &&
      !((platform == 'docker' || platform == 'incus') && (workstation.runtime ?? '') != '')
    message: An entry in registries that sets hostname needs endpoint on a context with no workstation.
  - when: (dns.public_domain ?? '') != '' && dns.public_domain == (dns.private_domain ?? '')
    message: dns.public_domain and dns.private_domain must differ; use a subdomain such as internal.<public_domain> for the private zone.
  - when: dns.private.driver == 'cloud' && platform != 'aws' && platform != 'azure' && platform != 'gcp'
    message: dns.private.driver cloud needs a platform with a cloud private zone (aws, azure or gcp); use coredns or none.
  - when: dns.private.driver == 'cloud'
    paths:
      - dns.private_domain
    message: The cloud private zone is created for dns.private_domain.
  - when: (pki.public_issuer ?? '') == 'acme'
    paths:
      - dns.public_domain
    message: pki.public_issuer acme issues certificates for dns.public_domain; set it or use selfsigned.
  - when: ((pki.acme.eab.key_id ?? '') == '') != ((pki.acme.eab.hmac_key ?? '') == '')
    paths:
      - pki.acme.eab.key_id
      - pki.acme.eab.hmac_key
    message: ACME external account binding needs both pki.acme.eab.key_id and pki.acme.eab.hmac_key.
  - when: lb_effective.driver == 'cilium' && cluster.cni.driver != 'cilium'
    message: network.loadbalancer_driver cilium needs cluster.cni.driver cilium.
  - when: cluster.cni.driver == 'cilium' && (lb_effective.driver == 'kube-vip' || lb_effective.driver == 'metallb')
    message: With cluster.cni.driver cilium, set network.loadbalancer_driver to cilium or none.
  - when: cluster.vip == true
    paths:
      - cluster.endpoint
    message: cluster.vip makes the host in cluster.endpoint the Talos VIP; set cluster.endpoint.
  - when: cluster.vip == true && !(platform in ['incus', 'proxmox', 'vsphere', 'hyperv', 'metal'])
    message: cluster.vip is supported on incus, proxmox, vsphere, hyperv, and metal.
  - when: lb_effective.driver == 'metallb'
    paths:
      - network.loadbalancer_ips.start
      - network.loadbalancer_ips.end
    message: network.loadbalancer_driver metallb assigns LoadBalancer addresses only from network.loadbalancer_ips.

# Config
# =============================================================================
# Platform facets and add-ons read the *_effective values defined here.
config:

  - name: platform
    value: "${platform ?? 'none'}"

  - name: backend_effective
    value:
      # Core provisions the state bucket or storage account on aws, azure and gcp unless set by terraform.backend.
      managed: >-
        ${platform == 'aws' ? ((terraform.backend.type ?? 's3') == 's3' && (terraform.backend.s3.bucket ?? '') == '')
        : (platform == 'azure' ? ((terraform.backend.type ?? 'azurerm') == 'azurerm' && (terraform.backend.azurerm.storage_account_name ?? '') == '')
        : (platform == 'gcp' ? ((terraform.backend.type ?? 'gcs') == 'gcs' && (terraform.backend.gcs.bucket ?? '') == '')
        : false))}
      kubernetes: "${(terraform.backend.type ?? '') == 'kubernetes'}"

  - name: workstation
    value:
      runtime: "${workstation.runtime ?? ''}"

  - name: cluster_nodes_effective
    value:
      controlplanes: "${max(1, cluster.controlplanes.count ?? len(cluster.controlplanes.nodes ?? {}))}"
      # cluster.workers.count, else the size of cluster.workers.nodes. Hetzner defaults to 1 worker.
      workers: "${cluster.workers.count ?? (len(cluster.workers.nodes ?? {}) > 0 ? len(cluster.workers.nodes) : (platform == 'hetzner' ? 1 : 0))}"

  # The nodes entry named controlplane-N or worker-N for each position, or null if undeclared.
  - name: cluster_node_entries
    value:
      controlplanes: >-
        ${map(
          1..int(cluster.controlplanes.count ?? 1),
          get(cluster.controlplanes.nodes ?? {}, "controlplane-" + string(#))
        )}
      workers: >-
        ${map(
          1..int(cluster.workers.count ?? 0),
          get(cluster.workers.nodes ?? {}, "worker-" + string(#))
        )}

  # IPv4 and MAC address of each position. The IPv4 is the node, else the endpoint host.
  - name: cluster_node_addresses
    value:
      controlplanes: >-
        ${map(cluster_node_entries.controlplanes, fromPairs([
          ["ipv4", # == null ? null : (#.node ?? split(#.endpoint, ":")[0])],
          ["mac_address", # == null ? null : #.mac_address]
        ]))}
      workers: >-
        ${map(cluster_node_entries.workers, fromPairs([
          ["ipv4", # == null ? null : (#.node ?? split(#.endpoint, ":")[0])],
          ["mac_address", # == null ? null : #.mac_address]
        ]))}
      # True when any position has no nodes entry.
      controlplanes_missing: "${any(cluster_node_entries.controlplanes, # == null)}"
      workers_missing: "${any(cluster_node_entries.workers, # == null)}"

  - name: cluster
    value:
      # eks, aks or gke on aws, azure and gcp. talos on every other platform.
      driver: "${cluster.driver ?? (platform == 'aws' ? 'eks' : (platform == 'azure' ? 'aks' : (platform == 'gcp' ? 'gke' : 'talos')))}"
      # cilium on Talos. EKS, AKS and GKE keep the provider CNI.
      # Duplicates the driver default above, since sibling keys read only user input.
      cni:
        driver: "${cluster.cni.driver ?? ((cluster.driver ?? (platform == 'aws' ? 'eks' : (platform == 'azure' ? 'aks' : (platform == 'gcp' ? 'gke' : 'talos')))) == 'talos' ? 'cilium' : '')}"
      # The control plane is schedulable with one control plane and no workers.
      # Copies the cluster_nodes_effective counts to avoid a cycle.
      controlplanes:
        schedulable: >-
          ${cluster.controlplanes.schedulable
            ?? ((cluster.workers.count
                  ?? (len(cluster.workers.nodes ?? {}) > 0
                        ? len(cluster.workers.nodes)
                        : (platform == 'hetzner' ? 1 : 0))) == 0
                && max(1, cluster.controlplanes.count ?? len(cluster.controlplanes.nodes ?? {})) == 1)}

  # flannel on Docker Desktop, where Cilium can't bootstrap through the localhost API tunnel.
  - name: cluster
    when: workstation.runtime == 'docker-desktop'
    value:
      cni:
        driver: "${cluster.cni.driver ?? 'flannel'}"

  # Platform facets read node sizes here, since some replace cluster.controlplanes.
  - name: cluster_resources_effective
    value:
      controlplanes:
        # 4 by default, since docker rejects more CPUs than the host has.
        cpu: "${cluster.controlplanes.cpu ?? 4}"
        # 12 when the control plane is schedulable or there are no workers, else 8.
        memory: "${cluster.controlplanes.memory ?? ((cluster_nodes_effective.workers == 0 || (cluster.controlplanes.schedulable ?? false)) ? 12 : 8)}"
      workers:
        cpu: "${cluster.workers.cpu ?? 4}"
        memory: "${cluster.workers.memory ?? 8}"

  - name: gateway
    value:
      enabled: ${gateway.enabled ?? ingress.enabled ?? true}
      # gateway.driver, else the legacy ingress.driver with envoy-gateway and nginx mapped to envoy.
      # Without either, envoy on Docker Desktop and aws, cilium with the Cilium CNI, else envoy.
      driver: |-
        ${gateway.driver
          ?? (ingress.driver == 'envoy-gateway' || ingress.driver == 'nginx'
              ? 'envoy'
              : ingress.driver)
          ?? (workstation.runtime == 'docker-desktop' || platform == 'aws'
              ? 'envoy'
              : (cluster.cni.driver == 'cilium' ? 'cilium' : 'envoy'))}

  - name: lb_effective
    value:
      driver: "${network.loadbalancer_driver ?? (cluster.cni.driver == 'cilium' ? 'cilium' : 'kube-vip')}"
      mode: loadbalancer

  # kube-vip or MetalLB, on for metal, vsphere, hyperv, incus and proxmox, or when set by
  # network.loadbalancer_driver.
  - name: lb_effective
    value:
      enabled: >-
        ${(lb_effective.driver == 'kube-vip' || lb_effective.driver == 'metallb') &&
        ((network.loadbalancer_driver ?? '') != '' || platform == 'metal' || platform == 'vsphere' ||
        platform == 'hyperv' || platform == 'incus' || platform == 'proxmox')}

  # Off on Docker Desktop, which has no routable node network.
  - name: lb_effective
    when: workstation.runtime == 'docker-desktop'
    value:
      enabled: false

  - name: gateway_exposure
    value:
      # ClusterIP when tunnel.driver is set.
      # gateway.service_type is the deprecated setting for both gateways.
      external: >-
        ${(tunnel.driver ?? '') != '' ? 'ClusterIP' :
        (gateway.external.service_type ?? gateway.service_type ?? (workstation.runtime == 'docker-desktop' ? 'NodePort' : 'LoadBalancer'))}
      internal: "${gateway.internal.service_type ?? gateway.service_type ?? (workstation.runtime == 'docker-desktop' ? 'NodePort' : 'LoadBalancer')}"
      external_node_port: ${gateway.external.node_port ?? 30444}
      internal_node_port: ${gateway.internal.node_port ?? 30443}
      external_http_node_port: 30081
      internal_http_node_port: 30080

  - name: gateway_exposure
    value:
      nodeport: ${gateway_exposure.external == 'NodePort' && gateway_exposure.internal == 'NodePort'}

  - name: lb_effective
    value:
      mode: "${gateway_exposure.nodeport ? 'nodeport' : 'loadbalancer'}"

  # No in-cluster load balancer with both gateways on NodePort.
  - name: lb_effective
    when: >-
      (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' &&
      (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      enabled: false

  # True where an lb-install controller runs: EKS, hetzner, or an enabled kube-vip or MetalLB.
  # A platform facet that adds an lb-install MUST be added here.
  - name: lb_effective
    value:
      controller_required: "${(platform == 'aws' && (cluster.driver ?? 'eks') == 'eks') || platform == 'hetzner' || lb_effective.enabled == true}"

  - name: dns
    value:
      domain: "${dns.domain ?? (dev == true ? 'test' : '')}"
      public_domain: "${dns.public_domain ?? ''}"
      # dns.domain is the deprecated name for dns.private_domain.
      private_domain: "${dns.private_domain ?? dns.domain ?? (dev == true ? 'test' : '')}"
      enabled: "${(dns.private.enabled ?? false) == true || (dns.public_domain ?? '') != '' || (dns.private_domain ?? '') != ''}"

  - name: dns
    when: (dns.private.driver ?? '') == ''
    value:
      private:
        # coredns when dns.private.enabled is true. none without dns.private_domain or on hetzner.
        # cloud on EKS, azure and gcp. none when disabled, without a cluster, or for an internal
        # NodePort gateway outside a workstation. coredns otherwise.
        driver: >-
          ${dns.private.enabled == true ? 'coredns' :
          ((dns.private_domain ?? '') == '' || platform == 'hetzner' ? 'none' :
          ((platform == 'aws' && (cluster.driver ?? 'eks') == 'eks') || platform == 'azure' || platform == 'gcp' ? 'cloud' :
          (dns.private.enabled == false || cluster_provisioned != true ||
          ((gateway.enabled ?? true) == true && (workstation.runtime ?? '') == '' && gateway_exposure.internal == 'NodePort') ? 'none' : 'coredns')))}

  # CoreDNS serves the public zone on platforms without a cloud DNS zone.
  - name: dns_private_effective
    value:
      public_zone: >-
        ${(dns.public_domain ?? '') != '' && platform != 'aws' && platform != 'azure' && platform != 'gcp' && platform != 'hetzner'}

  # dns.public_zone false uses public_domain as a hostname with no zone.
  - name: dns_zone_effective
    value:
      enabled: "${(dns.public_domain ?? '') != '' && (dns.public_zone ?? true) == true}"
  # cloud is the platform's own DNS service.
  - name: dns_zone_effective
    value:
      driver: "${dns.public.driver ?? (platform in ['aws', 'azure', 'gcp', 'hetzner'] ? 'cloud' : 'none')}"
  - name: dns_zone_effective
    value:
      certificate_only: "${dns_zone_effective.driver == 'cloudflare' && (dns.public_domain ?? '') == ''}"
  - name: dns_zone_effective
    value:
      cloud: "${dns_zone_effective.enabled == true && dns_zone_effective.driver == 'cloud'}"
      cloudflare: "${(dns_zone_effective.enabled == true && dns_zone_effective.driver == 'cloudflare') || dns_zone_effective.certificate_only == true}"

  - name: tls_effective
    value:
      public_zone_writable: "${dns_zone_effective.cloud == true || dns_zone_effective.cloudflare == true}"
      private_subdomain: "${(dns.public_domain ?? '') != '' && hasSuffix(dns.private_domain ?? '', '.' + dns.public_domain)}"
      internal_acme: "${(pki.acme.server ?? '') != ''}"
      # gateway.<name>.tls.issuer overrides the inferred issuer.
      external_override: "${gateway.external.tls.issuer ?? ((pki.public_issuer ?? '') == 'selfsigned' ? 'selfsigned' : '')}"
      internal_override: "${gateway.internal.tls.issuer ?? ''}"
  - name: tls_effective
    value:
      # Resolves to the override, else public-acme with a writable zone, else private-acme,
      # else private behind a tunnel, else public-selfsigned.
      external_issuer: >-
        ${tls_effective.external_override == 'selfsigned' ? 'public-selfsigned' :
        (tls_effective.external_override == 'ca' ? 'private' :
        (tls_effective.public_zone_writable == true ? 'public-acme' :
        (tls_effective.internal_acme == true ? 'private-acme' :
        (tls_effective.external_override == 'acme' ? 'public-acme' :
        ((tunnel.driver ?? '') != '' ? 'private' : 'public-selfsigned')))))}
      # Resolves to the override, else private-acme, else public-acme for a subdomain of a cloud
      # zone or with certificate_only, else private.
      internal_issuer: >-
        ${tls_effective.internal_override == 'selfsigned' ? 'public-selfsigned' :
        (tls_effective.internal_override == 'ca' ? 'private' :
        (tls_effective.internal_acme == true ? 'private-acme' :
        (tls_effective.private_subdomain == true && dns_zone_effective.cloud == true ? 'public-acme' :
        (dns_zone_effective.certificate_only == true ? 'public-acme' :
        (tls_effective.internal_override == 'acme' ? 'public-acme' : 'private')))))}
  # Issuers that at least one gateway domain uses.
  - name: tls_effective
    value:
      public_acme: >-
        ${((dns.public_domain ?? '') != '' && tls_effective.external_issuer == 'public-acme') ||
        ((dns.private_domain ?? '') != '' && tls_effective.internal_issuer == 'public-acme')}
      private_acme: >-
        ${((dns.public_domain ?? '') != '' && tls_effective.external_issuer == 'private-acme') ||
        ((dns.private_domain ?? '') != '' && tls_effective.internal_issuer == 'private-acme')}
      selfsigned: >-
        ${((dns.public_domain ?? '') != '' && tls_effective.external_issuer == 'public-selfsigned') ||
        ((dns.private_domain ?? '') != '' && tls_effective.internal_issuer == 'public-selfsigned')}

  # pki.dns01_resolvers, else public resolvers when public-acme serves dns.private_domain or a
  # workstation. Empty uses the cluster resolver.
  - name: dns01_resolvers_effective
    value: >-
      ${pki.dns01_resolvers != null ? join(pki.dns01_resolvers, ',') :
      (((dns.private_domain ?? '') != '' && tls_effective.internal_issuer == 'public-acme') ||
      (tls_effective.public_acme == true && workstation.runtime != '') ? '1.1.1.1:53,8.8.8.8:53' : '')}

  # False with cluster.enabled false, and on docker without a workstation runtime.
  - name: cluster_provisioned
    value: "${(cluster.enabled ?? true) && (platform != 'docker' || (workstation.runtime != null && workstation.runtime != ''))}"
  - name: talos_enabled
    value: "${cluster.driver == 'talos' && (cluster.enabled ?? true)}"
  - name: talos_provisioned
    value: "${cluster.driver == 'talos' && cluster_provisioned}"
  - name: eks_enabled
    value: "${cluster.driver == 'eks' && (cluster.enabled ?? true)}"

  # single-node for one node, ha with 3 or more control planes, else multi-node.
  - name: topology
    value: >-
      ${
        topology
        ?? (
          (cluster_nodes_effective.controlplanes + cluster_nodes_effective.workers) == 1
            ? 'single-node'
            : (cluster_nodes_effective.controlplanes >= 3 ? 'ha' : 'multi-node')
        )
      }

  # Set with when: since a self-referencing default leaks the raw template to other facets.
  - name: network
    when: (network.cidr_block ?? '') == ''
    value:
      cidr_block: '10.5.0.0/16'

  - name: telemetry
    value:
      metrics:
        enabled: ${telemetry.metrics.enabled ?? true}
      logs:
        enabled: ${telemetry.logs.enabled ?? true}
        # fluentd by default. none runs fluent-bit with no aggregator.
        driver: "${telemetry.logs.driver ?? 'fluentd'}"

  # Prometheus alert rule components. addon-observability reuses this list.
  - name: telemetry
    when: (telemetry.alerts.enabled ?? true) && (telemetry.metrics.enabled ?? true)
    value:
      alert_components:
        - prometheus/alerts/node
        - prometheus/alerts/prometheus
        - prometheus/alerts/coredns
        - prometheus/alerts/cert-manager
        - prometheus/alerts/x509
        - prometheus/alerts/flux
        - "${gateway.enabled == true && gateway.driver == 'envoy' ? 'prometheus/alerts/envoy' : ''}"
        - "${(identity.driver ?? 'keycloak') == 'keycloak' && identity.enabled == true ? 'prometheus/alerts/identity' : ''}"
        - "${database.postgres.enabled == true ? 'prometheus/alerts/database' : ''}"
        - "${database.postgres.cloud.enabled == true && (database_effective.cloud_driver == 'rds' || database_effective.cloud_driver == 'azuredb') ? 'prometheus/alerts/postgres-exporter' : ''}"

  - name: telemetry
    when: telemetry.logs.enabled == false
    value:
      logs:
        driver: none

  # Platforms with a built-in metrics-server set this to false.
  - name: telemetry
    value:
      metrics_server_enabled: true

  # charts.registry as an oci:// URL with no trailing slash, empty when unset.
  - name: chart_registry
    value: "${(charts.registry ?? '') != '' ? 'oci://' + trimSuffix(trimPrefix(trimPrefix(charts.registry, 'oci://'), 'http://'), '/') : ''}"

  # True for an http:// registry or the workstation registry, which serves plain HTTP.
  - name: chart_registry_insecure
    value: "${(charts.registry ?? '') startsWith 'http://' || (workstation_chart_registry.key ?? '') != ''}"

  # Terraform uses the vendor chart URLs when the registry is insecure.
  - name: terraform_chart_registry
    value: "${chart_registry_insecure ? '' : chart_registry}"

# Substitutions
# =============================================================================
# Single-use values go on the kustomization instead.
substitutions:
  private_domain: ${dns.private_domain}

  public_domain: ${dns.public_domain}

  # Empty means each chart source uses its vendor URL.
  chart_registry: "${chart_registry}"

  chart_registry_insecure: "${chart_registry_insecure}"

# CRDs
# =============================================================================
# Vendored under kustomize/crds. The charts install with CRDs off.
crds:
  # renovate: datasource=github-releases depName=cert-manager/cert-manager package=cert-manager/cert-manager
  - cert-manager-1.21.3
  # renovate: datasource=github-releases depName=prometheus-operator/prometheus-operator package=prometheus-operator/prometheus-operator
  - "${telemetry.metrics.enabled ? 'prometheus-operator-0.94.2' : ''}"
  # renovate: datasource=docker depName=ghcr.io/fluent/helm-charts/fluent-operator package=ghcr.io/fluent/helm-charts/fluent-operator
  - "${telemetry.logs.enabled ? 'fluent-operator-4.3.0' : ''}"

# Terraform
# =============================================================================
terraform:
  - name: gitops
    path: gitops/flux
    inputs:
      mode: ${gitops.mode ?? 'push'}
      replicas: "${topology == 'ha' ? 2 : 1}"
      chart_repository: "${terraform_chart_registry != '' ? terraform_chart_registry : null}"

  # Cluster CA for workload certificates and Talos apiserver OIDC trust.
  - name: pki
    path: pki/ca
    inputs:
      cert: ${pki.ca.cert ?? pki.private_ca.cert ?? ''}
      key: ${pki.ca.key ?? pki.private_ca.key ?? ''}

  - name: backend
    path: backend/kubernetes
    when: backend_effective.kubernetes == true
    dependsOn:
      - "${cluster_provisioned ? 'cluster' : ''}"
    inputs:
      namespace: ${terraform.backend.kubernetes.namespace}
      config_path: "${terraform.backend.kubernetes.config_path ?? ''}"
      config_context: "${terraform.backend.kubernetes.config_context ?? ''}"

# Flux
# =============================================================================
flux:
  - name: policy
    when: (policies.enabled ?? true) == true
    globalDependency: true
    install:
      components:
        - kyverno
        - "${(policies.reporting ?? 'disabled') == 'enabled' ? 'kyverno/reports' : ''}"
        - "${(policies.cleanup ?? 'disabled') == 'enabled' ? 'kyverno/cleanup' : ''}"
        - "${topology == 'ha' ? 'kyverno/ha' : ''}"
      timeout: 30m
      interval: 5m
    resources:
      - components:
          - kyverno
          - "${(policies.resource_limits_requests ?? 'enabled') != 'disabled' ? 'kyverno/resource-limits-requests' : ''}"
          - "${(policies.require_image_digest ?? 'enabled') != 'disabled' ? 'kyverno/require-image-digest' : ''}"
          - "${(policies.external_dns_ttl ?? 'enabled') != 'disabled' ? 'kyverno/external-dns-ttl' : ''}"
          - "${chart_registry != '' ? 'kyverno/chart-registry' : ''}"
        healthChecks:
          - apiVersion: batch/v1
            kind: Job
            name: kyverno-webhook-probe
            namespace: system-policy
        timeout: 8m
        interval: 5m
        retryInterval: 1m

  # In-cluster load balancer, kube-vip or MetalLB.
  - name: lb
    when: lb_effective.enabled && workstation.runtime != 'docker-desktop'
    install:
      components:
        - ${lb_effective.driver}
        - "${lb_effective.driver == 'kube-vip' ? lb_effective.driver + '/' + (network.loadbalancer_mode ?? 'arp') : ''}"
        - "${lb_effective.driver == 'kube-vip' && topology == 'single-node' ? 'kube-vip/single-node' : ''}"
        - "${lb_effective.driver == 'kube-vip' && (network.loadbalancer_ips.start ?? '') != '' ? 'kube-vip/cloud-provider' : ''}"
        - "${chart_registry != '' && lb_effective.driver == 'kube-vip' ? 'kube-vip/chart-registry' : ''}"
        - "${chart_registry != '' && lb_effective.driver == 'kube-vip' && (network.loadbalancer_ips.start ?? '') != '' ? 'kube-vip/cloud-provider/chart-registry' : ''}"
      substitutions:
        loadbalancer_ip_range: "${(network.loadbalancer_ips.start ?? '') != '' ? network.loadbalancer_ips.start + '-' + network.loadbalancer_ips.end : ''}"
      timeout: 5m
      interval: 5m
    resources:
      - components:
          - "${lb_effective.driver == 'metallb' ? lb_effective.driver + '/' + (network.loadbalancer_mode ?? 'arp') : ''}"
          # MetalLB address for the internal gateway when it has a fixed IP.
          - >-
            ${lb_effective.driver == 'metallb' && gateway.enabled == true && gateway_effective.internal_enabled == true &&
            gateway_effective.internal_mode == 'loadbalancer' && (gateway_effective.internal_ip ?? '') != '' ?
            'metallb/' + (network.loadbalancer_mode ?? 'arp') + '/internal-gateway' : ''}
          # MetalLB address for the external gateway when it has a fixed IP.
          - >-
            ${lb_effective.driver == 'metallb' && gateway.enabled == true && gateway_effective.external_enabled == true &&
            gateway_effective.external_mode == 'loadbalancer' && (gateway_effective.external_ip ?? '') != '' ?
            'metallb/' + (network.loadbalancer_mode ?? 'arp') + '/external-gateway' : ''}
        substitutions:
          loadbalancer_ip_range: "${(network.loadbalancer_ips.start ?? '') != '' ? network.loadbalancer_ips.start + '-' + network.loadbalancer_ips.end : ''}"
          gateway_internal_ip: "${gateway_effective.internal_ip ?? ''}"
          gateway_external_ip: "${gateway_effective.external_ip ?? ''}"
        timeout: 5m
        interval: 5m

  # Prometheus, fluent-bit and metrics-server.
  # addon-observability replaces this system for the elasticsearch driver.
  - name: telemetry
    when: telemetry.metrics.enabled || telemetry.logs.enabled
    # Prometheus's PVC requires the CSI driver on Talos with openebs or longhorn.
    dependsOn:
      - "${cluster.driver == 'talos' && (talos_common.storage_driver == 'openebs' || talos_common.storage_driver == 'longhorn') ? 'csi-install' : ''}"
    install:
      components:
        - "${telemetry.metrics.enabled ? 'prometheus' : ''}"
        - "${telemetry.metrics.enabled ? 'prometheus/flux' : ''}"
        - "${telemetry.metrics.enabled ? 'x509-exporter' : ''}"
        - "${telemetry.logs.enabled ? 'fluentbit' : ''}"
        - "${telemetry.metrics.enabled && telemetry.metrics_server_enabled ? 'metrics-server' : ''}"
        - "${chart_registry != '' && telemetry.metrics.enabled && telemetry.metrics_server_enabled ? 'metrics-server/chart-registry' : ''}"
      timeout: 30m
      interval: 10m
    resources:
      - components:
          - "${telemetry.metrics.enabled ? 'prometheus' : ''}"
          - "${telemetry.metrics.enabled ? 'prometheus/flux' : ''}"
          - "${telemetry.alert_components ?? []}"
          - "${(telemetry.metrics.enabled ?? true) && (telemetry.alerts.slack.webhook_url ?? '') != '' ? 'prometheus/notifications/slack' : ''}"
          - "${telemetry.logs.enabled ? 'fluentbit' : ''}"
          - "${telemetry.logs.enabled ? 'fluentbit/containerd' : ''}"
          - "${telemetry.logs.enabled ? 'fluentbit/kubernetes' : ''}"
          - "${telemetry.logs.enabled ? 'fluentbit/parser' : ''}"
          - "${telemetry.logs.enabled ? 'fluentbit/systemd' : ''}"
          - "${telemetry.logs.enabled && telemetry.metrics.enabled ? 'fluentbit/prometheus' : ''}"
          - "${telemetry.logs.driver == 'fluentd' ? 'fluentbit/fluentd' : ''}"
        timeout: 10m
        interval: 5m

  - name: telemetry
    when: (telemetry.metrics.enabled ?? true) && (telemetry.alerts.slack.webhook_url ?? '') != ''
    resources:
      - substitutions:
          # Quoted, since kustomize strips the quotes and a bare # channel parses as a YAML comment.
          slack_channel: "\"${telemetry.alerts.slack.channel ?? '#alerts'}\""
          # warning|critical for both severities, else the one listed.
          severity_regex: >-
            ${len(telemetry.alerts.slack.severity ?? ['warning', 'critical']) >= 2
              ? 'warning|critical'
              : (telemetry.alerts.slack.severity ?? ['warning', 'critical'])[0]}
          # telemetry.alerts.grafana_url, else grafana.<public_domain>, else grafana.<private_domain>.
          grafana_base_url: >-
            ${telemetry.alerts.grafana_url
              ?? ('https://grafana.' + ((dns.public_domain ?? '') == ''
                    ? (dns.private_domain ?? '')
                    : dns.public_domain))}

  - name: telemetry
    when: (telemetry.alerts.slack.webhook_url ?? '') != ''
    secrets:
      alertmanager-notification-slack:
        data:
          url: ${telemetry.alerts.slack.webhook_url}

  - name: pki
    # cert-manager's ServiceMonitor requires Prometheus.
    dependsOn:
      - "${telemetry.metrics.enabled || telemetry.logs.enabled ? 'telemetry-install' : ''}"
    install:
      components:
        - cert-manager
        - "${telemetry.metrics.enabled ? 'cert-manager/prometheus' : ''}"
        - "${topology == 'ha' ? 'cert-manager/ha' : ''}"
        - "${dns01_resolvers_effective != '' ? 'cert-manager/public-resolvers' : ''}"
      timeout: 20m
      interval: 5m
    resources:
      - components:
          # Cloud platforms add their own public ACME issuer.
          - "${tls_effective.selfsigned == true ? 'public-issuer/selfsigned' : ''}"
          - "${tls_effective.private_acme == true ? 'private-issuer/acme' : ''}"
          - "${tls_effective.private_acme == true && (pki.acme.eab.key_id ?? '') != '' ? 'private-issuer/acme/eab' : ''}"
          - "${tls_effective.private_acme == true && (pki.acme.ca_bundle ?? '') != '' ? 'private-issuer/acme/ca-bundle' : ''}"
        timeout: 5m
        interval: 5m

  - name: pki
    when: dns01_resolvers_effective != ''
    install:
      substitutions:
        dns01_resolvers: "${dns01_resolvers_effective}"

  - name: pki
    when: tls_effective.private_acme == true
    resources:
      - substitutions:
          private_acme_server: "${pki.acme.server ?? ''}"
          private_acme_email: "${email ?? ''}"

  - name: pki
    when: tls_effective.private_acme == true && (pki.acme.eab.key_id ?? '') != ''
    resources:
      - substitutions:
          private_acme_eab_key_id: "${pki.acme.eab.key_id}"

  - name: pki
    when: tls_effective.private_acme == true && (pki.acme.ca_bundle ?? '') != ''
    resources:
      - substitutions:
          # Base64 of pki.acme.ca_bundle. A ${...} value such as secret() is wrapped in toBase64.
          private_acme_ca_bundle: >-
            ${hasPrefix(pki.acme.ca_bundle, '${') && hasSuffix(pki.acme.ca_bundle, '}') ?
            '${toBase64(' + pki.acme.ca_bundle[2:len(pki.acme.ca_bundle) - 1] + ')}' :
            toBase64(pki.acme.ca_bundle)}

  - name: pki
    when: tls_effective.private_acme == true && (pki.acme.eab.hmac_key ?? '') != ''
    secrets:
      private-acme-eab:
        namespaces: [system-pki]
        data:
          hmac-key: ${pki.acme.eab.hmac_key}

  # fluentd log aggregator, in the observability namespace where fluent-operator has RBAC.
  # Off with observability.logs_driver elasticsearch, which uses filebeat.
  - name: observability
    when: telemetry.logs.driver == 'fluentd' && (observability.logs_driver ?? '') != 'elasticsearch'
    dependsOn:
      - telemetry-install
    install:
      components:
        - fluentd
        # RBAC for the Kyverno mutation in fluentd's ClusterPolicy.
        - "${(policies.enabled ?? true) == true ? 'fluentd/kyverno-inject' : ''}"
      timeout: 15m
      interval: 10m
    resources:
      - timeout: 10m
        interval: 5m
        components:
          - fluentd/filters/otel
          - "${telemetry.metrics.enabled ? 'fluentd/prometheus' : ''}"
          - "${log_level != 'trace' ? 'fluentd/filters/log-level/' + (log_level ?? 'info') : ''}"

  # Flux receiver webhook for push mode.
  - name: gitops
    path: gitops
    when: (gitops.mode ?? 'push') == 'push'
    # The webhook HTTPRoute attaches to the internal Gateway.
    dependsOn:
      - "${gateway.enabled == true && gateway_effective.internal == true ? 'gateway-resources-internal' : ''}"
    resources:
      - components:
          - webhook
          - "${gateway.enabled == true && gateway_effective.internal == true ? 'webhook/gateway' : ''}"
          - "${gateway.enabled == true && gateway_effective.internal == true && gateway.driver == 'cilium' ? 'webhook/gateway/cilium' : ''}"
        substitutions:
          git_repository_name: ${gitops.repository.name ?? "local"}
        timeout: 5m
        interval: 5m

  # Flux web UI on the private gateway.
  - name: gitops
    path: gitops
    when: gateway.enabled == true && (gitops.web_ui ?? false) == true && gateway_effective.private.name != ''
    dependsOn:
      - "${'gateway-resources-' + gateway_effective.private.name}"
    resources:
      - components:
          - ui
          - "${gateway.driver == 'cilium' ? 'ui/cilium' : ''}"
        substitutions:
          flux_ui_domain: "${gateway_effective.private.domain}"
          flux_ui_gateway_name: "${gateway_effective.private.name}"
        timeout: 5m
        interval: 5m

# Messages
# =============================================================================
messages:
  # NS records to delegate, on platforms that provision a dns-zone.
  - when: >-
      dns_zone_effective.enabled == true &&
      platform in ['aws', 'azure', 'gcp', 'hetzner'] &&
      len(terraform_output('dns-zone', 'name_servers') ?? []) > 0
    text: |-
      Public DNS zone created for ${dns.public_domain}. Delegate it at your
      domain registrar by adding these as NS records:

        ${join(terraform_output('dns-zone', 'name_servers') ?? [], ', ')}

  - when: >-
      tls_effective.public_acme == true &&
      platform in ['aws', 'azure', 'gcp', 'hetzner'] &&
      len(terraform_output('dns-zone', 'name_servers') ?? []) > 0
    text: Certificate issuance won't succeed until delegation propagates.
