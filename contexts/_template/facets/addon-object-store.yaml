kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: object-store
  description: Object storage service with multiple drivers

when: object_store.enabled == true

# Flux
# =============================================================================
# object_store.driver selects the backend. Only MinIO is wired up.
# The operator manages Tenant CRs but creates none.
flux:

  # MinIO operator. Its PVCs require the CSI driver.
  - name: object-store
    when: object_store.driver == 'minio'
    dependsOn:
      - csi-install
    install:
      components:
        - minio
        - "${chart_registry != '' ? 'minio/chart-registry' : ''}"
      timeout: 10m
      interval: 5m
