kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: metal
  description: "Metal provider basic infrastructure"

when: platform == 'metal'

# Requires
# =============================================================================
requires:
  - paths:
      - cluster.controlplanes.nodes
    message: Metal provisions no machines; list the existing control planes in cluster.controlplanes.nodes.

# Config
# =============================================================================
config:

  # cluster.endpoint, else https://<host>:6443 of the first control plane in cluster.controlplanes.nodes.
  - name: cluster_endpoint_fallback
    value:
      endpoint: "${cluster.endpoint ?? ('https://' + split((let n = map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1))[0]; n.endpoint ?? n.node), ':')[0] + ':6443')}"

  # Image Factory official overlays by board, from factory.talos.dev/version/<talos version>/overlays/official.
  # The keys MUST match the talosBoard enum in schema.yaml.
  - name: metal_overlays
    value:
      bananapi_m64: siderolabs/sbc-allwinner
      libretech_all_h3_cc_h5: siderolabs/sbc-allwinner
      pine64: siderolabs/sbc-allwinner
      jetson_nano: siderolabs/sbc-jetson
      revpi_generic: siderolabs/sbc-raspberrypi
      rpi_generic: siderolabs/sbc-raspberrypi
      rpi_5: siderolabs/sbc-raspberrypi
      helios64: siderolabs/sbc-rockchip
      nanopi-r4s: siderolabs/sbc-rockchip
      nanopi-r5s: siderolabs/sbc-rockchip
      odroid-m1: siderolabs/sbc-rockchip
      orangepi-5: siderolabs/sbc-rockchip
      orangepi-5-max: siderolabs/sbc-rockchip
      orangepi-5-plus: siderolabs/sbc-rockchip
      orangepi-r1-plus-lts: siderolabs/sbc-rockchip
      radxa-zero-3e: siderolabs/sbc-rockchip
      rock3b: siderolabs/sbc-rockchip
      rock4cplus: siderolabs/sbc-rockchip
      rock4se: siderolabs/sbc-rockchip
      rock5a: siderolabs/sbc-rockchip
      rock5b: siderolabs/sbc-rockchip
      rock5b-plus: siderolabs/sbc-rockchip
      rock5t: siderolabs/sbc-rockchip
      rock64: siderolabs/sbc-rockchip
      rockpi4: siderolabs/sbc-rockchip
      rockpi4c: siderolabs/sbc-rockchip
      rockpro64: siderolabs/sbc-rockchip
      turingrk1: siderolabs/sbc-rockchip
      friendlyelec-cm3588-nas: siderolabs/sbc-rockchip

  # Each node sorted by name, with board, disks and config_patches from the node or its pool.
  # A node's install_image wins over the board overlay.
  - name: metal_nodes
    value:
      controlplanes: >-
        ${map(map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1)),
          fromPairs(concat(
            filter(toPairs(#), get(#, 0) not in ["board", "disks", "config_patches"]),
            let board = get(#, 'board') ?? cluster.controlplanes.board ?? '';
            let disks = get(#, 'disks') ?? cluster.controlplanes.disks ?? [];
            let patches = get(#, 'config_patches') ?? [];
            concat(
              board != '' ? [["overlay", {name: board, image: metal_overlays[board]}]] : [],
              len(disks) > 0 ? [["disks", disks]] : [],
              len(patches) > 0 ? [["config_patches", join(map(patches, string(#)), '\n---\n')]] : []))))}
      workers: >-
        ${(cluster.workers.count ?? 0) > 0
          ? map(map(sortBy(toPairs(cluster.workers.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1)),
              fromPairs(concat(
                filter(toPairs(#), get(#, 0) not in ["board", "disks", "config_patches"]),
                let board = get(#, 'board') ?? cluster.workers.board ?? '';
                let disks = get(#, 'disks') ?? cluster.workers.disks ?? [];
                let patches = get(#, 'config_patches') ?? [];
                concat(
                  board != '' ? [["overlay", {name: board, image: metal_overlays[board]}]] : [],
                  len(disks) > 0 ? [["disks", disks]] : [],
                  len(patches) > 0 ? [["config_patches", join(map(patches, string(#)), '\n---\n')]] : []))))
          : []}

  # Each node reduced to its node, endpoint, install_image and overlay fields.
  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(metal_nodes.controlplanes, fromPairs(filter(toPairs(#), get(#, 0) in ["node", "endpoint", "install_image", "overlay"])))}
      workers: >-
        ${map(metal_nodes.workers, fromPairs(filter(toPairs(#), get(#, 0) in ["node", "endpoint", "install_image", "overlay"])))}

# Terraform
# =============================================================================
# Talos is applied to machines provisioned outside Windsor.
terraform:

  - name: cluster
    path: cluster/talos
    parallelism: 1
    dependsOn:
      - pki
    inputs:
      # The same endpoint as cluster_endpoint_fallback.
      cluster_endpoint: ${cluster.endpoint ?? ("https://" + split((let n = map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1))[0]; n.endpoint ?? n.node), ":")[0] + ":6443")}
      # The VIP interface uses DHCP unless network.dhcp is false.
      vip_interface: "${cluster.vip == true ? {deviceSelector: {physical: true}, dhcp: network.dhcp != false} : null}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      upgrade_nodes: ${len(talos_common.extensions ?? []) == 0}
      controlplanes: ${metal_nodes.controlplanes}
      workers: ${metal_nodes.workers}
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: ${talos_common.controlplane_config_patches}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}

  - name: gitops
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      # Half the smaller of control plane CPU and memory, clamped to 4-10.
      concurrency: ${max(4, min(floor(cluster_resources_effective.controlplanes.cpu / 2), floor(cluster_resources_effective.controlplanes.memory / 2), 10))}
    # Skipped on destroy, since deleting the cluster removes Flux.
    destroy: false
