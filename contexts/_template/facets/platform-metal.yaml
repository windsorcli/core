kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: metal
  description: "Metal provider basic infrastructure"

# Bare metal: operator supplies fully-provisioned nodes; we run Talos apply
# against them. No compute terraform, no network creation.
when: platform == 'metal'

# =============================================================================
# Requires
# =============================================================================
requires:
  - paths:
      - cluster.controlplanes.nodes
    message: Metal has no compute layer; declare the controlplane nodes that windsor should talk to.

# =============================================================================
# Config
# =============================================================================
config:

  # Always at least one controlplane with a concrete endpoint, so the fallback
  # is always derivable (unlike incus/docker).
  - name: cluster_endpoint_fallback
    value:
      endpoint: "${cluster.endpoint ?? ('https://' + split(values(cluster.controlplanes.nodes)[0].endpoint, ':')[0] + ':6443')}"

  # Installer built from metal.talos_schematic_id at the pinned Talos version; empty when unset.
  - name: metal_effective
    value:
      install_image: "${(metal.talos_schematic_id ?? '') != '' ? 'factory.talos.dev/metal-installer/' + metal.talos_schematic_id + ':v' + talos.talos_version : ''}"

  # User-supplied nodes, with the schematic installer filled in where a node sets no install_image.
  - name: metal_nodes
    value:
      controlplanes: >-
        ${map(values(cluster.controlplanes.nodes ?? {}),
          metal_effective.install_image == '' || (get(#, 'install_image') ?? '') != ''
            ? #
            : fromPairs(concat(toPairs(#), [["install_image", metal_effective.install_image]])))}
      workers: >-
        ${(cluster.workers.count ?? 0) > 0
          ? map(values(cluster.workers.nodes),
              metal_effective.install_image == '' || (get(#, 'install_image') ?? '') != ''
                ? #
                : fromPairs(concat(toPairs(#), [["install_image", metal_effective.install_image]])))
          : []}

  # Node targets for post-cluster steps (e.g. extensions), from metal_nodes.
  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(metal_nodes.controlplanes, fromPairs(filter(toPairs(#), get(#, 0) in ["node", "endpoint", "install_image"])))}
      workers: >-
        ${map(metal_nodes.workers, fromPairs(filter(toPairs(#), get(#, 0) in ["node", "endpoint", "install_image"])))}

# =============================================================================
# Terraform — cluster/talos + gitops
# =============================================================================
# No compute step: metal nodes exist externally. Straight from the user-supplied
# node list to Talos bootstrap/apply.
terraform:

  - name: cluster
    path: cluster/talos
    parallelism: 1
    dependsOn:
      - pki
    inputs:
      cluster_endpoint: ${cluster.endpoint ?? ("https://" + split(values(cluster.controlplanes.nodes)[0].endpoint, ":")[0] + ":6443")}
      # Bare-metal nodes normally lease addresses, so the VIP interface keeps DHCP unless network.dhcp is false.
      vip_interface: "${cluster.vip == true ? {deviceSelector: {physical: true}, dhcp: network.dhcp != false} : null}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      controlplanes: ${metal_nodes.controlplanes}
      workers: ${metal_nodes.workers}
      controlplane_disks: ${talos_common.controlplane_disks}
      worker_disks: ${talos_common.worker_disks}
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: "${talos_common.oidc_ca_file_patch ?? ''}"
      worker_config_patches: "${talos_common.worker_config_patches ?? ''}"
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}

  # destroy: false — Flux is tied to cluster lifetime; teardown takes it along.
  - name: gitops
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      concurrency: ${max(4, min(floor(cluster_resources_effective.controlplanes.cpu / 2), floor(cluster_resources_effective.controlplanes.memory / 2), 10))}
    destroy: false
