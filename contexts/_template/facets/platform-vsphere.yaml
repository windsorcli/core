kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: vsphere
  description: VMware vSphere compute platform infrastructure

when: "platform == 'vsphere' && cluster.driver == 'talos'"

# Requires
# =============================================================================
requires:
  - paths:
      - vsphere.datacenter
    message: vSphere datacenter name is required (e.g. "dc-prod").
  - paths:
      - vsphere.cluster
    message: vSphere compute cluster name is required (e.g. "cluster-01").
  - paths:
      - vsphere.datastore
    message: vSphere datastore name is required (e.g. "datastore-01").
  - paths:
      - vsphere.network
    message: vSphere port group name is required (e.g. "VM Network" or "vlan-prod-100").
  - when: network.dhcp == true && (cluster.controlplanes.count ?? 1) > 1
    paths:
      - cluster.endpoint
    message: Several DHCP control planes share the API address in cluster.endpoint; pick one outside the DHCP scope.
  - when: network.dhcp != true && cluster_node_addresses.controlplanes_missing
    paths:
      - cluster.controlplanes.nodes.controlplane-N
    message: Set network.dhcp to true, or give each control plane an address in cluster.controlplanes.nodes under controlplane-1 to controlplane-N.
  - when: network.dhcp != true && cluster_node_addresses.workers_missing
    paths:
      - cluster.workers.nodes.worker-N
    message: Set network.dhcp to true, or give each worker an address in cluster.workers.nodes under worker-1 to worker-N.

# Config
# =============================================================================
config:

  - name: vsphere_effective
    value:
      datacenter: "${vsphere.datacenter}"
      cluster: "${vsphere.cluster}"
      datastore: "${vsphere.datastore}"
      network: "${vsphere.network}"
      folder: "${vsphere.folder ?? ''}"
      name_suffix: "${(id ?? '') != '' ? '-' + id : ''}"
      resource_pool: "${vsphere.resource_pool ?? ''}"
      host_system: "${vsphere.host_system ?? ''}"
      # Schematic with vmtoolsd-guest-agent, which reports guest IPs to vCenter and handles graceful shutdown.
      # Recompute when the extension list changes:
      #   curl -sX POST -H 'Content-Type: application/yaml' \
      #     -d $'customization:\n  systemExtensions:\n    officialExtensions:\n      - siderolabs/vmtoolsd-guest-agent\n' \
      #     https://factory.talos.dev/schematics
      talos_schematic_id: "903b2da78f99adef03cbbd4df6714563823f63218508800751560d3bc3557e40"
      # vmware-amd64.ova reads the machine config from guestinfo.
      image_url: "${'https://factory.talos.dev/image/903b2da78f99adef03cbbd4df6714563823f63218508800751560d3bc3557e40/v' + talos.talos_version + '/vmware-amd64.ova'}"
      dhcp: ${network.dhcp == true}

  # One VM per control plane, with a static IP unless DHCP.
  - name: vsphere_controlplanes
    value:
      nodes: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["name", int(cluster.controlplanes.count ?? 1) > 1 ? "controlplane-" + string(#) : "controlplane"],
          ["ipv4", vsphere_effective.dhcp ? null : cluster_node_addresses.controlplanes[# - 1].ipv4]
        ]))}

  # One VM per worker, addressed like the control planes.
  - name: vsphere_workers
    value:
      nodes: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count), fromPairs([
          ["name", int(cluster.workers.count) > 1 ? "worker-" + string(#) : "worker"],
          ["ipv4", vsphere_effective.dhcp ? null : cluster_node_addresses.workers[# - 1].ipv4]
        ]))}

  # Static addressing defaults to the .1 gateway and public nameservers.
  # network_effective holds the gateway, since cidrhost() on network's own name doesn't evaluate.
  - name: network_effective
    value:
      gateway: "${network.gateway ?? cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"
  - name: network
    when: len(network.nameservers ?? []) == 0 && network.dhcp != true
    value:
      nameservers: ['1.1.1.1', '8.8.8.8']

  # https://<first compute control plane host>:6443, or empty until vmtoolsd reports guest IPs.
  - name: cluster_endpoint_fallback
    value:
      endpoint: >-
        ${
          len(terraform_output("compute", "controlplanes") ?? []) > 0
          && terraform_output("compute", "controlplanes")[0].endpoint != null
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        }

  # Compute's nodes, else declared nodes unless DHCP, reduced to the node and endpoint fields.
  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? terraform_output("compute", "controlplanes")
            : (vsphere_effective.dhcp ? [] : filter(cluster_node_entries.controlplanes, # != null)),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${map(
          len(terraform_output("compute", "workers") ?? []) > 0
            ? terraform_output("compute", "workers")
            : (vsphere_effective.dhcp ? []
              : ((cluster.workers.count ?? 0) > 0 ? filter(cluster_node_entries.workers, # != null) : [])),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

  # dns.private_domain falls back to dns.domain, then <id>.local, since the gateway certificate requires a SAN.
  - name: dns
    when: (dns.private_domain ?? '') == '' && (dns.domain ?? '') != ''
    value:
      private_domain: "${dns.domain}"
  - name: dns
    when: (dns.private_domain ?? '') == '' && (dns.domain ?? '') == ''
    value:
      private_domain: "${(id ?? 'windsor') + '.local'}"

# Terraform
# =============================================================================
# Compute generates the machine secrets and machine configs, since guestinfo is set at VM creation.
terraform:

  # The guestinfo machine config is baked when cluster.endpoint is set.
  # Otherwise compute waits for vmtoolsd and cluster/talos applies to the leased IP.
  # Connects to vSphere through the VSPHERE_* environment variables.
  - name: compute
    path: compute/vsphere
    inputs:
      datacenter: "${vsphere_effective.datacenter}"
      cluster: "${vsphere_effective.cluster}"
      datastore: "${vsphere_effective.datastore}"
      network: "${vsphere_effective.network}"
      folder: "${vsphere_effective.folder}"
      name_suffix: "${vsphere_effective.name_suffix}"
      resource_pool: "${vsphere_effective.resource_pool}"
      host_system: "${vsphere_effective.host_system}"
      cluster_name: talos
      # cluster.endpoint, else the first control plane's static IP. Empty with DHCP.
      cluster_endpoint: "${(cluster.endpoint ?? '') != '' ? cluster.endpoint : (vsphere_effective.dhcp ? '' : ('https://' + vsphere_controlplanes.nodes[0].ipv4 + ':6443'))}"
      controlplane_vip: ${cluster.vip == true}
      talos_version: ${talos.talos_version}
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: ${talos_common.controlplane_config_patches}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}
      controlplane_disks: ${talos_common.controlplane_disks}
      worker_disks: ${talos_common.worker_disks}
      # A network patch per node: DHCP on the physical interface, or its static IP with a default route.
      per_node_config_patches: >-
        ${fromPairs(concat(
          map(vsphere_controlplanes.nodes, [
            get(#, "name"),
            vsphere_effective.dhcp
              ? string({machine: {network: fromPairs(concat(
                  [["interfaces", [{deviceSelector: {physical: true}, dhcp: true}]]],
                  len(network.nameservers ?? []) > 0 ? [["nameservers", network.nameservers]] : []
                ))}})
              : string({machine: {network: {
                  interfaces: [{
                    deviceSelector: {physical: true},
                    dhcp: false,
                    addresses: [get(#, "ipv4") + "/" + split(network.cidr_block ?? '10.5.0.0/16', "/")[1]],
                    routes: [{network: "0.0.0.0/0", gateway: network_effective.gateway}]
                  }],
                  nameservers: network.nameservers
                }}})
          ]),
          map(vsphere_workers.nodes, [
            get(#, "name"),
            vsphere_effective.dhcp
              ? string({machine: {network: fromPairs(concat(
                  [["interfaces", [{deviceSelector: {physical: true}, dhcp: true}]]],
                  len(network.nameservers ?? []) > 0 ? [["nameservers", network.nameservers]] : []
                ))}})
              : string({machine: {network: {
                  interfaces: [{
                    deviceSelector: {physical: true},
                    dhcp: false,
                    addresses: [get(#, "ipv4") + "/" + split(network.cidr_block ?? '10.5.0.0/16', "/")[1]],
                    routes: [{network: "0.0.0.0/0", gateway: network_effective.gateway}]
                  }],
                  nameservers: network.nameservers
                }}})
          ])
        ))}
      images:
        talos:
          url: ${vsphere_effective.image_url}
      # One compute instance per node.
      instances: >-
        ${concat(
          map(vsphere_controlplanes.nodes, fromPairs([
            ["name", get(#, "name")],
            ["role", "controlplane"],
            ["image", "talos"],
            ["count", 1],
            ["ipv4", get(#, "ipv4")],
            ["cpu", cluster.controlplanes.cpu],
            ["memory", cluster.controlplanes.memory],
            ["root_disk_size", cluster.controlplanes.root_disk_size ?? 30],
            ["notes", "Talos control plane node"]
          ])),
          map(vsphere_workers.nodes, fromPairs([
            ["name", get(#, "name")],
            ["role", "worker"],
            ["image", "talos"],
            ["count", 1],
            ["ipv4", get(#, "ipv4")],
            ["cpu", cluster.workers.cpu],
            ["memory", cluster.workers.memory],
            ["root_disk_size", cluster.workers.root_disk_size ?? 50],
            ["notes", "Talos worker node"]
          ]))
        )}

  - name: cluster
    path: cluster/talos
    dependsOn:
      - compute
      - pki
    parallelism: 1
    inputs:
      cluster_endpoint: "${(cluster.endpoint ?? '') != '' ? cluster.endpoint : cluster_endpoint_fallback.endpoint}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      upgrade_nodes: ${len(talos_common.extensions ?? []) == 0}
      # Compute's control planes, else declared nodes unless DHCP.
      controlplanes: >-
        ${len(terraform_output("compute", "controlplanes") ?? []) > 0
          ? terraform_output("compute", "controlplanes")
          : (vsphere_effective.dhcp ? [] : filter(cluster_node_entries.controlplanes, # != null))}
      # Compute's workers, else declared nodes unless DHCP.
      workers: >-
        ${len(terraform_output("compute", "workers") ?? []) > 0
          ? terraform_output("compute", "workers")
          : (vsphere_effective.dhcp ? [] : ((cluster.workers.count ?? 0) > 0
            ? filter(cluster_node_entries.workers, # != null) : []))}
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: ${talos_common.controlplane_config_patches}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}
      # From compute, which already delivered the machine config through guestinfo.
      machine_secrets: ${terraform_output("compute", "machine_secrets")}
      client_configuration: ${terraform_output("compute", "client_configuration")}

  - name: gitops
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      # Half the smaller of control plane CPU and memory, clamped to 2-10.
      concurrency: ${max(2, min(floor((cluster.controlplanes.cpu ?? 4) / 2), floor((cluster.controlplanes.memory ?? 8) / 2), 10))}
    destroy: false

# Flux
# =============================================================================
# vSphere VMs have routed IPs, so in-cluster LB announcements work.
flux:

  # In-cluster load balancer, kube-vip or MetalLB.
  - name: lb
    when: lb_effective.enabled
    dependsOn:
      - policy-resources
    install:
      components:
        - ${lb_effective.driver}
        # kube-vip/<mode> patches the kube-vip HelmRelease.
        - "${lb_effective.driver == 'kube-vip' ? lb_effective.driver + '/' + (network.loadbalancer_mode ?? 'arp') : ''}"
        - "${lb_effective.driver == 'kube-vip' && (network.loadbalancer_ips.start ?? '') != '' ? 'kube-vip/cloud-provider' : ''}"
        - "${chart_registry != '' && lb_effective.driver == 'kube-vip' ? 'kube-vip/chart-registry' : ''}"
        - "${chart_registry != '' && lb_effective.driver == 'kube-vip' && (network.loadbalancer_ips.start ?? '') != '' ? 'kube-vip/cloud-provider/chart-registry' : ''}"
      # The kube-vip cloud-provider reads loadbalancer_ip_range.
      substitutions:
        loadbalancer_ip_range: "${(network.loadbalancer_ips.start ?? '') != '' ? network.loadbalancer_ips.start + '-' + network.loadbalancer_ips.end : ''}"
      timeout: 5m
      interval: 5m
    # The MetalLB IPAddressPool and L2Advertisement.
    resources:
      - components:
          - "${lb_effective.driver == 'metallb' ? lb_effective.driver + '/' + (network.loadbalancer_mode ?? 'arp') : ''}"
          # MetalLB address for the internal gateway when it has a fixed IP.
          - >-
            ${lb_effective.driver == 'metallb' && gateway.enabled == true && gateway_effective.internal_enabled == true &&
            gateway_effective.internal_mode == 'loadbalancer' && (gateway_effective.internal_ip ?? '') != '' ?
            'metallb/' + (network.loadbalancer_mode ?? 'arp') + '/internal-gateway' : ''}
          # MetalLB address for the external gateway when it has a fixed IP.
          - >-
            ${lb_effective.driver == 'metallb' && gateway.enabled == true && gateway_effective.external_enabled == true &&
            gateway_effective.external_mode == 'loadbalancer' && (gateway_effective.external_ip ?? '') != '' ?
            'metallb/' + (network.loadbalancer_mode ?? 'arp') + '/external-gateway' : ''}
        substitutions:
          loadbalancer_ip_range: "${(network.loadbalancer_ips.start ?? '') != '' ? network.loadbalancer_ips.start + '-' + network.loadbalancer_ips.end : ''}"
          gateway_internal_ip: "${gateway_effective.internal_ip ?? ''}"
          gateway_external_ip: "${gateway_effective.external_ip ?? ''}"
        timeout: 5m
        interval: 5m
