kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: workstation
  description: Workstation stack for local development and cluster infrastructure.

when: "(platform == 'docker' || platform == 'incus') && workstation.runtime != null && workstation.runtime != ''"

# Config
# =============================================================================
config:

  # workstation.arch defaults to amd64 and selects the Talos Incus image.
  - name: workstation
    value:
      runtime: "${workstation.runtime ?? ''}"
      arch: "${workstation.arch ?? 'amd64'}"

  # Internal and external gateway IPs and the load balancer IP pool, at fixed hosts in network.cidr_block.
  - name: gateway
    when: >-
      workstation.runtime != 'docker-desktop' && (gateway.internal.ip ?? '') == '' &&
      (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'LoadBalancer'
    value:
      internal:
        ip: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 266)}"
  - name: gateway
    when: >-
      workstation.runtime != 'docker-desktop' && (gateway.external.ip ?? '') == '' &&
      (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'LoadBalancer'
    value:
      external:
        ip: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 267)}"
  - name: network
    when: (network.loadbalancer_ips.start ?? '') == ''
    value:
      loadbalancer_ips:
        start: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 268)}"
  - name: network
    when: (network.loadbalancer_ips.end ?? '') == ''
    value:
      loadbalancer_ips:
        end: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 356)}"

  # Talos container and Incus image references for talos.talos_version.
  - name: talos
    value:
      docker_image: "ghcr.io/siderolabs/talos:v${talos.talos_version}"
      incus_image: "windsor:talos/v${talos.talos_version}/${workstation.arch ?? 'amd64'}"

  # Mirrors from registries or the default upstreams, plus the local and chart registries.
  # Empty when workstation.services.registries is false.
  - name: workstation_registries
    value:
      registries: |
        ${(workstation.services.registries ?? true) == false ? {} : fromPairs(concat(filter(toPairs(registries ?? {
          "gcr.io": { "remote": "https://gcr.io" },
          "ghcr.io": { "remote": "https://ghcr.io" },
          "quay.io": { "remote": "https://quay.io" },
          "reg.kyverno.io": { "remote": "https://reg.kyverno.io" },
          "registry-1.docker.io": { "remote": "https://registry-1.docker.io", "local": "docker.io" },
          "registry.k8s.io": { "remote": "https://registry.k8s.io" }
        }), get(#, 0) != '*'), [['registry', {}]], workstation_chart_registry.key != '' ? [[workstation_chart_registry.key, {}]] : []))}

  # Local registry key when charts.registry names <key>.<workstation domain>, else empty.
  - name: workstation_chart_registry
    value:
      key: >-
        ${(split(split(trimPrefix(trimPrefix(charts.registry ?? '', 'oci://'), 'http://'), '/')[0], ':')[0] endsWith ('.' + ((dns.domain ?? '') != '' ? dns.domain : dns.private_domain)))
          && !(trimSuffix(split(split(trimPrefix(trimPrefix(charts.registry ?? '', 'oci://'), 'http://'), '/')[0], ':')[0], '.' + ((dns.domain ?? '') != '' ? dns.domain : dns.private_domain)) contains '.')
          ? trimSuffix(split(split(trimPrefix(trimPrefix(charts.registry ?? '', 'oci://'), 'http://'), '/')[0], ':')[0], '.' + ((dns.domain ?? '') != '' ? dns.domain : dns.private_domain))
          : ''}

  # Talos registry mirrors for each workstation registry with a remote and hostname, keyed by local else upstream.
  - name: talos_registry_mirrors
    when: cluster.driver == 'talos' && (cluster.enabled ?? true)
    value:
      mirrors: >-
        ${fromPairs(map(
          filter(toPairs(terraform_output("workstation", "registries") ?? {}),
            get(get(#, 1), "remote") != null && get(get(#, 1), "remote") != "" && get(get(#, 1), "hostname") != null && get(get(#, 1), "hostname") != ""
          ),
          [
            (get(get(#, 1), "local") != null && get(get(#, 1), "local") != "" ? get(get(#, 1), "local") : get(#, 0)),
            { endpoints: ["http://" + get(get(#, 1), "hostname") + ":5000"] }
          ]
        ))}


  # Schedules workloads on control planes with no workers, else per cluster.controlplanes.schedulable.
  - name: talos_common
    when: cluster.driver == 'talos' && (cluster.enabled ?? true) && platform == 'docker'
    value:
      allowSchedulingOnControlPlanes: "${(cluster.workers.count ?? 0) == 0 ? true : (cluster.controlplanes.schedulable ?? false)}"

  # Talos ignores eth0, which Docker Desktop manages.
  - name: talos_common
    when: cluster.driver == 'talos' && (cluster.enabled ?? true) && workstation.runtime == 'docker-desktop'
    value:
      common_patch:
        machine:
          network:
            interfaces:
              - ignore: true
                interface: eth0

  # Worker kubelet systemReserved covers the host CPU and memory beyond the worker quota.
  - name: talos_common
    when: platform == 'docker' && cluster.driver == 'talos' && (cluster.enabled ?? true)
    value:
      docker_worker_gap:
        cpu: >-
          ${let host_cpu = terraform_output('compute', 'host_cpu') ?? 0;
            let quota_cpu = cluster_resources_effective.workers.cpu;
            (host_cpu > quota_cpu ? string(max(500, (host_cpu - quota_cpu) * 1000 + 500)) : '0') + 'm'}
        memory: >-
          ${let host_memory = terraform_output('compute', 'host_memory') ?? cluster_resources_effective.workers.memory;
            let quota_memory = cluster_resources_effective.workers.memory;
            (host_memory > quota_memory ? string(max(1, host_memory - quota_memory + 1)) : '0') + 'Gi'}
      worker_patch:
        machine:
          kubelet:
            extraConfig:
              systemReserved:
                cpu: ${talos_common.docker_worker_gap.cpu}
                memory: ${talos_common.docker_worker_gap.memory}

  # Colima on Incus defaults to flannel, since Cilium's eBPF skews storage-driver tests.
  - name: cluster
    when: platform == 'incus' && workstation.runtime == 'colima'
    value:
      cni:
        driver: "${cluster.cni.driver ?? 'flannel'}"

# Terraform
# =============================================================================
# Workstation services, then Talos compute, then cluster bootstrap, then Flux.
terraform:

  # Flux with the workstation git credentials. option-cni and option-storage add its
  # cni and cluster-extensions dependencies.
  - name: gitops
    when: (cluster.enabled ?? true)
    path: gitops/flux
    # Skipped on destroy, since deleting the cluster removes Flux.
    destroy: false
    dependsOn:
      - cluster
    inputs:
      # gitops.concurrency, else half the smaller of control plane CPU and memory clamped to 4-10.
      # Incus uses 2, since its nested VM's slower vCPUs flood the apiserver.
      concurrency: >-
        ${gitops.concurrency ?? (platform == 'incus' ? 2 : max(4, min(
          floor(cluster_resources_effective.controlplanes.cpu / 2),
          floor(cluster_resources_effective.controlplanes.memory / 2),
          10
        )))}
      git_username: ${workstation.git.username ?? "local"}
      git_password: ${workstation.git.password ?? "local"}
      webhook_token: ${gitops.webhook.token ?? "abcdef123456"}


  # Docker Desktop has no in-cluster load balancer, so DNS forwards to NodePort 30053 on the first node.
  - name: workstation
    when: "platform == 'docker' && workstation.runtime == 'docker-desktop'"
    path: workstation/docker
    inputs:
      runtime: 'docker-desktop'
      domain_name: "${(dns.domain ?? '') != '' ? dns.domain : dns.private_domain}"
      private_domain_name: ${dns.private_domain}
      public_domain_name: ${gateway_external_effective.domain}
      network_name: windsor-${context}
      network_cidr: ${network.cidr_block}
      dns_forward_target: "${cidrhost(network.cidr_block, 10) + \":30053\"}"
      webhook_host: "${cidrhost(network.cidr_block, 10)}"
      webhook_port: 30292
      webhook_enabled: "${(workstation.git.livereload ?? false) && ((gitops.mode ?? 'push') == 'push')}"
      webhook_token: "${(workstation.git.livereload ?? false) ? (gitops.webhook.token ?? 'abcdef123456') : ''}"
      primary_node_ip: "${cidrhost(network.cidr_block, 10)}"
      enable_dns: ${workstation.services.dns ?? true}
      enable_git: ${workstation.services.git ?? true}
      registries: ${workstation_registries.registries ?? {}}

  # Colima, docker and linux runtimes target DNS and the webhook at gateway.internal.ip.
  - name: workstation
    when: "platform == 'docker' && workstation.runtime != \"docker-desktop\""
    path: workstation/docker
    inputs:
      # The module names the docker runtime linux.
      runtime: >-
        ${workstation.runtime == "docker" ? "linux" : (workstation.runtime ?? "linux")}
      domain_name: "${(dns.domain ?? '') != '' ? dns.domain : dns.private_domain}"
      private_domain_name: ${dns.private_domain}
      public_domain_name: ${gateway_external_effective.domain}
      network_name: windsor-${context}
      network_cidr: ${network.cidr_block}
      dns_forward_target: "${gateway.internal.ip ?? ''}"
      webhook_host: "${gateway.internal.ip ?? ''}"
      webhook_port: "${gateway.enabled == true ? 80 : 9292}"
      webhook_enabled: "${(workstation.git.livereload ?? false) && ((gitops.mode ?? 'push') == 'push')}"
      webhook_token: "${(workstation.git.livereload ?? false) ? (gitops.webhook.token ?? 'abcdef123456') : ''}"
      primary_node_ip: "${gateway.internal.ip ?? ''}"
      enable_dns: ${workstation.services.dns ?? true}
      enable_git: ${workstation.services.git ?? true}
      registries: ${workstation_registries.registries ?? {}}

  # Incus networking reuses incusbr0 under colima, else creates its own network.
  - name: workstation
    when: "platform == 'incus'"
    path: workstation/incus
    inputs:
      domain_name: "${(dns.domain ?? '') != '' ? dns.domain : dns.private_domain}"
      private_domain_name: ${dns.private_domain}
      public_domain_name: ${gateway_external_effective.domain}
      network_name: "${(workstation.runtime ?? '') == 'colima' ? 'incusbr0' : ''}"
      create_network: "${(workstation.runtime ?? '') != 'colima'}"
      network_cidr: ${network.cidr_block}
      loadbalancer_start_ip: "${gateway.internal.ip ?? ''}"
      dns_forward_target: "${gateway.internal.ip ?? ''}"
      webhook_host: "${gateway.internal.ip ?? ''}"
      webhook_port: 9292
      webhook_enabled: "${(workstation.git.livereload ?? false) && ((gitops.mode ?? 'push') == 'push')}"
      primary_node_ip: "${gateway.internal.ip ?? ''}"
      enable_dns: ${workstation.services.dns ?? true}
      enable_git: ${workstation.services.git ?? true}
      registries: ${workstation_registries.registries ?? {}}
      webhook_token: "${(workstation.git.livereload ?? false) ? (gitops.webhook.token ?? 'abcdef123456') : ''}"
      git_username: ${workstation.git.username ?? "local"}
      git_password: ${workstation.git.password ?? "local"}


  # Talos VMs on the workstation network.
  - name: compute
    when: "platform == 'incus' && (cluster.enabled ?? true)"
    path: compute/incus
    strategy: replace
    dependsOn:
      - workstation
    # One instance at a time, since images.windsorcli.dev rate-limits concurrent Talos image fetches.
    parallelism: 1
    inputs:
      create_network: false
      network_name: ${terraform_output("workstation", "network_name")}
      network_cidr: ${terraform_output("workstation", "network_cidr")}
      storage_pools:
        local:
          driver: "${(workstation.runtime ?? '') == 'colima' ? 'dir' : null}"
      instances:
        - name: controlplane
          role: controlplane
          count: ${cluster.controlplanes.count ?? 1}
          ipv4: ${cidrhost(network.cidr_block, 10)}
          image: ${cluster.controlplanes.image ?? talos.incus_image}
          type: virtual-machine
          description: Talos control plane node
          # The local dir pool under colima, for etcd's fsync path.
          storage_pool: "${(workstation.runtime ?? '') == 'colima' ? 'local' : 'default'}"
          root_disk_size: ${string(cluster.controlplanes.root_disk_size ?? 30) + "GB"}
          limits:
            cpu: ${string(cluster_resources_effective.controlplanes.cpu)}
            memory: ${string(cluster_resources_effective.controlplanes.memory) + "GB"}
          disks: ${talos_common.controlplane_disks}
          config:
            # The first cluster.controlplanes.nodes hostname in key order, else controlplane-1.
            user.hostname: "${len(cluster.controlplanes.nodes ?? {}) > 0 ? (map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1))[0].hostname ?? 'controlplane-1') : 'controlplane-1'}"
            environment.TALOSSKU: ${string(cluster_resources_effective.controlplanes.cpu) + "CPU-" + string(cluster_resources_effective.controlplanes.memory * 1024) + "RAM"}
            raw.qemu: -boot order=c,menu=off
        - name: worker
          role: worker
          count: ${cluster.workers.count ?? 0}
          ipv4: ${cidrhost(network.cidr_block, 20)}
          image: ${cluster.workers.image ?? talos.incus_image}
          type: virtual-machine
          description: Talos worker node
          storage_pool: default
          root_disk_size: ${string(cluster.workers.root_disk_size ?? 50) + "GB"}
          limits:
            cpu: ${string(cluster_resources_effective.workers.cpu)}
            memory: ${string(cluster_resources_effective.workers.memory) + "GB"}
          disks: ${talos_common.worker_disks}
          config:
            # The first cluster.workers.nodes hostname in key order, else worker-1.
            user.hostname: "${len(cluster.workers.nodes ?? {}) > 0 ? (map(sortBy(toPairs(cluster.workers.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1))[0].hostname ?? 'worker-1') : 'worker-1'}"
            environment.TALOSSKU: "${string(cluster_resources_effective.workers.cpu) + 'CPU-' + string(cluster_resources_effective.workers.memory * 1024) + 'RAM'}"
            raw.qemu: -boot order=c,menu=off

  # Talos containers on the workstation network, read by platform-docker's cluster stack.
  - name: compute
    when: "platform == 'docker' && (cluster.enabled ?? true)"
    path: compute/docker
    strategy: replace
    dependsOn:
      - workstation
    inputs:
      create_network: false
      network_name: ${terraform_output("workstation", "network_name")}
      network_cidr: ${terraform_output("workstation", "network_cidr")}
      start_ip: ${terraform_output("workstation", "next_ip")}
      runtime: ${workstation.runtime ?? "linux"}
      compose_project: ${terraform_output("workstation", "compose_project")}
      dns_servers: "${workstation.runtime == \"docker-desktop\" ? [terraform_output(\"workstation\", \"dns_internal_ip\")] : null}"
      cluster_nodes:
        version: ${talos.talos_version}
        controlplanes:
          count: ${cluster.controlplanes.count ?? 1}
          image: ${cluster.controlplanes.image ?? talos.docker_image}
          cpu: ${cluster_resources_effective.controlplanes.cpu}
          memory: ${cluster_resources_effective.controlplanes.memory}
          # On docker-desktop, cluster.controlplanes.hostports or the default gateway ports, plus listener host ports.
          hostports: >-
            ${workstation.runtime == "docker-desktop" ? concat(
            cluster.controlplanes.hostports ?? ["8080:30080/tcp", "8443:30443/tcp", "8081:30081/tcp", "8444:30444/tcp"],
            gateway_endpoints.listener_hostports ?? []) : []}
          volumes: ${cluster.controlplanes.volumes ?? []}
        workers:
          count: ${cluster.workers.count ?? 0}
          image: ${cluster.workers.image ?? talos.docker_image}
          cpu: ${cluster_resources_effective.workers.cpu}
          memory: ${cluster_resources_effective.workers.memory}
          # On docker-desktop, cluster.workers.hostports or the default gateway ports, plus listener host ports.
          hostports: >-
            ${workstation.runtime == "docker-desktop" ? concat(
            cluster.workers.hostports ?? ["8080:30080/tcp", "8443:30443/tcp", "8081:30081/tcp", "8444:30444/tcp"],
            gateway_endpoints.listener_hostports ?? []) : []}
          volumes: ${cluster.workers.volumes ?? []}


  # Talos bootstrap on Incus. Talos reads each hostname from the VM runtime.
  - name: cluster
    when: "platform == 'incus' && (cluster.enabled ?? true)"
    path: cluster/talos
    strategy: replace
    dependsOn:
      - compute
    parallelism: 1
    inputs:
      # cluster.endpoint, else https://<first compute control plane host>:6443, or empty before compute has outputs.
      cluster_endpoint: >-
        ${cluster.endpoint ?? (
          len(terraform_output("compute", "controlplanes") ?? []) > 0 && terraform_output("compute", "controlplanes")[0].endpoint != null
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        )}
      # Incus guests take their addresses from static DHCP leases.
      vip_interface: "${cluster.vip == true ? {deviceSelector: {physical: true}, dhcp: true} : null}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      upgrade_nodes: ${len(talos_common.extensions ?? []) == 0}
      powercycle_reboot: true
      # Compute's control planes, else cluster.controlplanes.nodes in key order.
      controlplanes: >-
        ${len(terraform_output("compute", "controlplanes") ?? []) > 0
          ? terraform_output("compute", "controlplanes")
          : map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1))}
      # Compute's workers, else cluster.workers.nodes in key order when cluster.workers.count is set.
      workers: >-
        ${len(terraform_output("compute", "controlplanes") ?? []) > 0
          ? (terraform_output("compute", "workers") ?? [])
          : ((cluster.workers.count ?? 0) > 0 ? map(sortBy(toPairs(cluster.workers.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1)) : [])}
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: ${talos_common.controlplane_config_patches}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}

  # Adds the compute dependency to platform-docker's cluster stack.
  - name: cluster
    when: "cluster.enabled == true && platform == 'docker'"
    dependsOn:
      - compute

# Flux
# =============================================================================
# Docker Desktop's load balancer IP is unreachable, so external-dns targets the fixed ClusterIP 10.96.0.53.
# The host resolves through the workstation Corefile and ignores this record.
flux:

  - name: gateway
    when: "platform == 'docker' && workstation.runtime == 'docker-desktop' && gateway.enabled == true && dns.private.driver in ['coredns', 'pdns']"
    resources:
      - name: internal
        components:
          - "${gateway.driver != 'cilium' ? 'dns/docker-desktop' : ''}"
        substitutions:
          gateway_dns_target: "10.96.0.53"
