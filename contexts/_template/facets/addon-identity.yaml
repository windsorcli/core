kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: identity
  description: Cluster identity provider (SSO) — hosts Keycloak, or points at an external OIDC issuer

when: identity.enabled == true

# Config
# =============================================================================
config:
  # The OIDC issuer and realm that consumers read.
  - name: identity_provider
    value:
      realm: "${identity.keycloak.realm ?? 'platform'}"
      display_name: "${identity.display_name ?? 'SSO'}"
      admin_group: "${identity.admin_group ?? 'platform-admins'}"
      # identity.oidc.issuer with the oidc driver. Else https://keycloak.<public or private domain>
      # with :8443 or :8444 on docker-desktop, unless set by identity.keycloak.hostname.
      issuer: >-
        ${(identity.driver ?? 'keycloak') == 'oidc' ? (identity.oidc.issuer ?? '') :
        (((identity.keycloak.hostname ?? '') == '' ?
        ('https://keycloak.' +
        (gateway_external_effective.domain == '' ? (dns.private_domain ?? '') : gateway_external_effective.domain) +
        (workstation.runtime == 'docker-desktop' ? (gateway_external_effective.domain == '' ? ':8443' : ':8444') : '')) :
        identity.keycloak.hostname) +
        '/realms/' + (identity.keycloak.realm ?? 'platform'))}
      # Back-channel issuer for in-cluster token and userinfo calls. With the keycloak driver this is
      # Keycloak's cluster Service, since the external URL doesn't resolve in the cluster.
      backchannel_issuer: >-
        ${(identity.driver ?? 'keycloak') == 'oidc' ? (identity.oidc.issuer ?? '') :
        ('http://keycloak-service.system-identity:8080/realms/' + (identity.keycloak.realm ?? 'platform'))}
      # Name of the Secret holding the initial admin credentials.
      admin_secret: "${((identity.keycloak.admin.password ?? '') != '' || dev == true) ? 'keycloak-bootstrap-admin' : 'keycloak-initial-admin'}"

  # Admin credentials stay inside core and are not exported.
  - name: identity_admin
    value:
      # Password for the console admin and the dev SSO admin user. admin-password in dev unless set.
      password: >-
        ${(identity.keycloak.admin.password ?? '') != '' ? identity.keycloak.admin.password :
        (dev == true ? 'admin-password' : '')}

  # Keycloak requires CloudNativePG, so the keycloak driver turns on database.postgres unless it is false.
  # The oidc driver leaves database.postgres unchanged.
  - name: database
    value:
      postgres:
        enabled: "${(identity.driver ?? 'keycloak') == 'keycloak' ? (database.postgres.enabled != false) : (database.postgres.enabled ?? false)}"

# CRDs
# =============================================================================
# Vendored Keycloak CRDs, for the keycloak driver only.
crds:
  # renovate: datasource=github-releases depName=keycloak/keycloak-k8s-resources package=keycloak/keycloak-k8s-resources
  - "${(identity.driver ?? 'keycloak') == 'keycloak' ? 'keycloak-26.8.0' : ''}"

# Flux
# =============================================================================
# Hosted Keycloak, for the keycloak driver. The oidc driver hosts nothing.
flux:

  # Keycloak operator, with its Postgres and server in resources.
  - name: identity
    when: (identity.driver ?? 'keycloak') == 'keycloak'
    install:
      components:
        - keycloak-operator
      timeout: 10m
      interval: 5m
    resources:
      # Postgres, gated on the Cluster's Ready condition.
      - name: database
        dependsOn:
          - database-resources-catalog
        components:
          - keycloak/database
          - "${topology == 'ha' ? 'keycloak/database/ha' : ''}"
        healthCheckExprs:
          - apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 15m
        interval: 5m

      # Keycloak server CR.
      - dependsOn:
          - identity-resources-database
          # The private ClusterIssuer signs Keycloak's serving certificate.
          - pki-resources
        components:
          - keycloak
          - "${topology == 'ha' ? 'keycloak/ha' : ''}"
          # Restricts Keycloak ingress to the Cilium gateway proxy.
          # Gated on gateway.enabled, since without a proxy the policy blocks all traffic.
          - "${gateway.enabled == true && gateway.driver == 'cilium' ? 'keycloak/cilium' : ''}"
          # Bootstrap admin overlay, on when an admin password resolves.
          - "${(identity_admin.password ?? '') != '' ? 'keycloak/admin' : ''}"
          # Server + user-event metrics, and the operator's own ServiceMonitor.
          - "${telemetry.metrics.enabled ? 'keycloak/prometheus' : ''}"
        timeout: 10m
        interval: 5m
        substitutions:
          # https://keycloak.<public or private domain>, with :8443 or :8444 on docker-desktop.
          # Keycloak can't infer the external port. identity.keycloak.hostname overrides it.
          keycloak_hostname: >-
            ${(identity.keycloak.hostname ?? '') == '' ?
            ('https://keycloak.' +
            (gateway_external_effective.domain == '' ? (dns.private_domain ?? '') : gateway_external_effective.domain) +
            (workstation.runtime == 'docker-desktop' ? (gateway_external_effective.domain == '' ? ':8443' : ':8444') : '')) :
            identity.keycloak.hostname}
          # Admin console on the internal gateway's domain.
          keycloak_admin_hostname: >-
            ${'https://keycloak-admin.' + (dns.private_domain ?? '') +
            (workstation.runtime == 'docker-desktop' ? ':8443' : '')}
          # The stock image builds at boot. A user-supplied image is assumed pre-built and starts optimized.
          # A custom image MUST be digest-pinned, since system-identity is policy-managed.
          # renovate: datasource=docker depName=keycloak/keycloak package=quay.io/keycloak/keycloak
          keycloak_image: "${(identity.keycloak.image ?? '') == '' ? 'quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3' : identity.keycloak.image}"
          keycloak_start_optimized: "${(identity.keycloak.image ?? '') == '' ? 'false' : 'true'}"

  # Login on the public route target, admin console on the internal gateway.
  - name: identity
    when: (identity.driver ?? 'keycloak') == 'keycloak' && gateway.enabled == true && gateway_endpoints.public.name != ''
    resources:
      - dependsOn:
          - "${'gateway-resources-' + gateway_endpoints.public.name}"
          - "${gateway_endpoints.internal == true && gateway_endpoints.public.name != 'internal' ? 'gateway-resources-internal' : ''}"
        components:
          - keycloak/gateway
          # Login on the external gateway exposes only the paths a login requires.
          - "${gateway_endpoints.public.name == 'external' ? 'keycloak/gateway/public-paths' : ''}"
          - "${gateway_endpoints.internal == true ? 'keycloak/gateway-admin' : ''}"
        timeout: 10m
        interval: 5m
        substitutions:
          keycloak_domain: "${gateway_endpoints.public.domain}"
          keycloak_gateway_name: "${gateway_endpoints.public.name}"
          private_domain: "${dns.private_domain ?? ''}"
          keycloak_realm: "${identity.keycloak.realm ?? 'platform'}"

  # Platform realm import with the security baseline and RBAC groups.
  # Each consumer's clients/ component patches its OIDC client into the import.
  - name: identity
    when: (identity.driver ?? 'keycloak') == 'keycloak'
    resources:
      - components:
          - keycloak/realm
          # Grafana client, on when Grafana SSO is.
          - "${observability.enabled == true && observability.grafana.sso != false ? 'keycloak/realm/clients/grafana' : ''}"
          # kube-apiserver OIDC client, on when cluster.oidc is on.
          - "${cluster.oidc.enabled == true && (cluster.oidc.client_id ?? 'kubernetes') == 'kubernetes' ? 'keycloak/realm/clients/kubernetes' : ''}"
          # Dev-only admin/viewer users.
          - "${dev == true ? 'keycloak/realm/dev-user' : ''}"
          # Dev-only: binds platform-admins to cluster-admin for kubectl OIDC login.
          - "${dev == true && cluster.oidc.enabled == true && (cluster.oidc.client_id ?? 'kubernetes') == 'kubernetes' ? 'keycloak/realm/clients/kubernetes/dev-rbac' : ''}"
        timeout: 10m
        interval: 5m
        substitutions:
          keycloak_realm: "${identity.keycloak.realm ?? 'platform'}"
          keycloak_admin_group: "${identity_provider.admin_group}"
          # Grafana client fields for the realm-client patch.
          grafana_url: "${grafana_effective.url ?? ''}"
          grafana_redirect_uri: "${(grafana_effective.url ?? '') + '/login/generic_oauth'}"
          # Dev SSO admin user password.
          dev_admin_password: "${identity_admin.password ?? ''}"

  # Bootstrap admin from identity.keycloak.admin.password.
  - name: identity
    when: (identity.driver ?? 'keycloak') == 'keycloak' && (identity.keycloak.admin.password ?? '') != ''
    secrets:
      keycloak-bootstrap-admin:
        data:
          username: ${identity.keycloak.admin.username ?? 'admin'}
          password: ${identity.keycloak.admin.password}
  # Bootstrap admin with the dev default password.
  - name: identity
    when: (identity.driver ?? 'keycloak') == 'keycloak' && (identity.keycloak.admin.password ?? '') == '' && dev == true
    secrets:
      keycloak-bootstrap-admin:
        data:
          username: ${identity.keycloak.admin.username ?? 'admin'}
          password: ${identity_admin.password}

  # Keycloak Grafana dashboard, with observability enabled.
  - name: observability
    when: (identity.driver ?? 'keycloak') == 'keycloak' && observability.enabled == true
    resources:
      - components:
          - grafana/dashboards/identity

