kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: aws
  description: "AWS provider basic infrastructure"

when: platform == 'aws'

# Requires
# =============================================================================
requires:
  - paths:
      - aws.region
    message: The AWS provider needs a region for every API call.
  - when: >-
      tls_effective.public_acme == true
    paths:
      - email
    message: ACME certificates for dns.public_domain or gateway.<name>.tls.issuer acme need email as the account contact.
  - when: cluster.driver == 'talos'
    paths:
      - cluster.controlplanes.instance_type
    message: Talos on AWS needs cluster.controlplanes.instance_type.
  - when: cluster.driver == 'talos' && len(cluster.pools ?? {}) > 0
    message: Talos on AWS does not support cluster.pools; use cluster.workers.
  - when: cluster.driver == 'talos' && (dns.public_domain ?? '') != ''
    message: Talos on AWS has no public DNS zone; unset dns.public_domain.
  - when: cluster.driver == 'talos' && dns.private.driver == 'cloud'
    message: Talos on AWS has no cloud private DNS; set dns.private.driver to coredns or none.
  - when: >-
      cluster.driver == 'talos' && gateway.enabled == true &&
      (gateway_exposure.external == 'LoadBalancer' || gateway_exposure.internal == 'LoadBalancer')
    message: Talos on AWS has no cloud load balancer; set gateway.service_type to NodePort or disable the gateway.

# Config
# =============================================================================
config:

  # The public issuer is selfsigned by default.
  - name: pki_effective
    value:
      issuer_component: public-issuer/selfsigned

  # The public issuer is ACME with Route53 DNS-01 when a gateway domain uses public-acme
  # and Route53 hosts the public zone.
  - name: pki_effective
    when: >-
      tls_effective.public_acme == true && dns_zone_effective.cloud == true
    value:
      issuer_component: public-issuer/acme/route53

  # Talos only from here to the end of config.
  # Talos nodes come from cluster.*.nodes, or are generated as controlplane-N and
  # worker-N per pool count.
  - name: aws_talos_nodes
    when: cluster.driver == 'talos'
    value:
      controlplanes: >-
        ${len(cluster.controlplanes.nodes ?? {}) > 0
          ? map(values(cluster.controlplanes.nodes), fromPairs([
              ["hostname", #.hostname],
              ["node", #.node ?? (#.endpoint == nil ? nil : split(#.endpoint, ":")[0])]
            ]))
          : map(1..int(cluster_nodes_effective.controlplanes), fromPairs([
              ["hostname", "controlplane-" + string(#)],
              ["node", nil]
            ]))}
      workers: >-
        ${cluster_nodes_effective.workers == 0
          ? []
          : (len(cluster.workers.nodes ?? {}) > 0
            ? map(values(cluster.workers.nodes), fromPairs([
                ["hostname", #.hostname],
                ["node", #.node ?? (#.endpoint == nil ? nil : split(#.endpoint, ":")[0])]
              ]))
            : map(1..int(cluster_nodes_effective.workers), fromPairs([
                ["hostname", "worker-" + string(#)],
                ["node", nil]
              ])))}

  # https://<first control plane host>:6443, or empty before compute has outputs.
  - name: cluster_endpoint_fallback
    when: cluster.driver == 'talos'
    value:
      endpoint: >-
        ${
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        }

  # Each compute instance, reduced to its node and endpoint fields.
  - name: talos_node_targets
    when: cluster.driver == 'talos'
    value:
      controlplanes: >-
        ${map(terraform_output("compute", "controlplanes") ?? [],
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${map(terraform_output("compute", "workers") ?? [],
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

  # No in-cluster load balancer unless set by network.loadbalancer_driver.
  - name: lb_effective
    when: cluster.driver == 'talos'
    value:
      driver: "${network.loadbalancer_driver ?? 'none'}"

# CRDs
# =============================================================================
# AWS Load Balancer Controller CRDs for EKS, vendored since Helm doesn't upgrade
# CRDs installed from a chart.
crds:
  # renovate: datasource=helm depName=aws-load-balancer-controller package=aws-load-balancer-controller helmRepo=https://aws.github.io/eks-charts
  - "${cluster.driver == 'eks' ? 'aws-load-balancer-controller-3.6.2' : ''}"

# Terraform
# =============================================================================
terraform:

  # Core provisions the S3 state bucket unless specified by terraform.backend.
  - name: backend
    path: backend/s3
    when: backend_effective.managed == true

  - name: network
    path: network/aws-vpc
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
    inputs:
      cidr_block: ${network.cidr_block}
      # On EKS, the VPC also provisions the private Route53 zone.
      domain_name: "${cluster.driver == 'eks' ? (dns.private_domain ?? '') : ''}"
      single_nat_gateway: "${topology != 'ha'}"

  # Public Route53 zone for dns.public_domain.
  - name: dns-zone
    path: dns/zone/route53
    when: "dns_zone_effective.cloud == true"
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
    inputs:
      domain_name: ${dns.public_domain}

  - name: cluster
    path: cluster/aws-eks
    when: cluster.driver == 'eks'
    dependsOn:
      - network
    inputs:
      vpc_id: ${terraform_output('network', 'vpc_id')}
      # EKS requires control plane subnets in at least 2 AZs.
      private_subnet_ids: ${terraform_output('network', 'private_subnet_ids')}
      # Nodes in a single AZ unless topology is ha.
      node_subnet_ids: "${topology == 'ha' ? terraform_output('network', 'private_subnet_ids') : [terraform_output('network', 'private_subnet_ids')[0]]}"
      system_node_pool:
        desired_size: "${topology == 'ha' ? 2 : 1}"
      manage_log_group: ${!(ephemeral ?? false)}
      # Route53 role for cert-manager, only when Route53 hosts the public zone.
      create_cert_manager_role: "${dns_zone_effective.cloud == true}"
      # The role's access is limited to the public zone.
      cert_manager_hosted_zone_ids: "${dns_zone_effective.cloud == true ? [terraform_output('dns-zone', 'zone_id')] : []}"
      # One general pool unless set by cluster.pools.
      pools: >-
        ${cluster.pools ?? {"general": {"class": "general", "count": 1}}}

  # Adds dns-zone to the cluster's dependsOn when Route53 hosts the public zone.
  - name: cluster
    when: "dns_zone_effective.cloud == true"
    dependsOn:
      - dns-zone

  - name: cluster-additions
    path: cluster/aws-eks/additions
    when: cluster.driver == 'eks'
    dependsOn:
      - cluster
    # Skipped on destroy, since deleting the EKS cluster removes these resources.
    destroy: false

  - name: cni
    when: "cluster.cni.driver == 'cilium'"
    path: cni/cilium
    dependsOn:
      - cluster
    inputs:
      cluster_endpoint: ${cluster.endpoint ?? terraform_output("cluster", "cluster_endpoint") ?? ""}
      chart_repository: "${terraform_chart_registry != '' ? terraform_chart_registry : null}"

  - name: compute
    path: compute/aws-ec2
    when: cluster.driver == 'talos'
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
      - network
    inputs:
      region: ${aws.region}
      subnet_id: ${terraform_output('network', 'private_subnet_ids')[0]}
      talos_version: ${talos.talos_version}
      controlplanes: ${aws_talos_nodes.controlplanes}
      workers: ${aws_talos_nodes.workers}
      controlplane_instance_type: ${cluster.controlplanes.instance_type}
      worker_instance_type: ${cluster.workers.instance_type ?? ''}
      controlplane_root_volume:
        size: ${cluster.controlplanes.root_disk_size ?? 100}
      worker_root_volume:
        size: ${cluster.workers.root_disk_size ?? 100}
      ephemeral: ${ephemeral ?? false}

  - name: cluster
    path: cluster/talos
    when: cluster.driver == 'talos'
    parallelism: 1
    dependsOn:
      - compute
      - pki
    inputs:
      cluster_endpoint: "${cluster.endpoint ?? cluster_endpoint_fallback.endpoint}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      controlplanes: ${terraform_output("compute", "controlplanes") ?? []}
      workers: ${terraform_output("compute", "workers") ?? []}
      controlplane_disks: ${talos_common.controlplane_disks}
      worker_disks: ${talos_common.worker_disks}
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: "${talos_common.oidc_ca_file_patch ?? ''}"
      worker_config_patches: "${talos_common.worker_config_patches ?? ''}"
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}

  - name: gitops
    path: gitops/flux
    dependsOn:
      - cluster
      - "${cluster.cni.driver == 'cilium' ? 'cni' : ''}"
    inputs:
      # On Talos, half the smaller of control plane CPU and memory, clamped to 4-10. 5 on EKS.
      concurrency: "${cluster.driver == 'talos' ? max(4, min(floor(cluster_resources_effective.controlplanes.cpu / 2), floor(cluster_resources_effective.controlplanes.memory / 2), 10)) : 5}"
    destroy: false

# Flux
# =============================================================================
# EKS only from here. Talos on AWS uses just the base flux systems.
flux:

  # Public ClusterIssuer from pki_effective.issuer_component.
  - name: pki
    when: cluster.driver == 'eks'
    resources:
      - components:
          - "${pki_effective.issuer_component}"
        timeout: 5m
        interval: 5m
        substitutions:
          acme_server: "${dev == true ? 'https://acme-staging-v02.api.letsencrypt.org/directory' : 'https://acme-v02.api.letsencrypt.org/directory'}"
          acme_email: "${email ?? ''}"
          acme_dns_zone: "${dns.public_domain ?? ''}"
          acme_region: "${aws.region ?? 'us-east-1'}"
          # The public zone ID from dns-zone, or empty without a Route53 public zone.
          acme_hosted_zone_id: "${dns_zone_effective.cloud == true ? (terraform_output('dns-zone', 'zone_id') ?? '') : ''}"

  # NLBs for the Envoy gateway Services, one external and one internal.
  - name: gateway
    when: "cluster.driver == 'eks' && gateway.enabled == true && gateway.driver == 'envoy' && lb_effective.mode == 'loadbalancer'"
    resources:
      - name: external
        when: (dns.public_domain ?? '') != '' && gateway_exposure.external == 'LoadBalancer'
        # aws-load-balancer-controller finalizes the NLB Service.
        dependsOn:
          - lb-install
        components:
          - envoy/loadbalancer/aws-nlb
      - name: internal
        when: (dns.private_domain ?? '') != ''
        dependsOn:
          - lb-install
        components:
          - envoy/loadbalancer/aws-nlb

  # AWS Load Balancer Controller, with its IAM role from the cluster module.
  - name: lb
    when: cluster.driver == 'eks'
    install:
      components:
        - aws-lb-controller
        - "${chart_registry != '' ? 'aws-lb-controller/chart-registry' : ''}"
      timeout: 5m
      interval: 5m
      substitutions:
        cluster_name: "${terraform_output('cluster', 'cluster_name') ?? ''}"
        # The controller can't read vpc_id from IMDS at a hop limit of 1.
        vpc_id: "${terraform_output('network', 'vpc_id') ?? ''}"
        aws_region: "${aws.region ?? ''}"

  # cluster-autoscaler for the node groups, discovered by their k8s.io/cluster-autoscaler tags.
  - name: compute
    when: cluster.driver == 'eks'
    install:
      components:
        - cluster-autoscaler
        - "${chart_registry != '' ? 'cluster-autoscaler/chart-registry' : ''}"
      timeout: 5m
      interval: 5m
      substitutions:
        cluster_name: "${terraform_output('cluster', 'cluster_name') ?? ''}"
        aws_region: "${aws.region ?? ''}"

  # EBS CSI driver for the default StorageClass.
  - name: csi
    when: cluster.driver == 'eks'
    install:
      components:
        - aws-ebs
      timeout: 5m
      interval: 5m
      substitutions:
        single_storage_type: ${cluster.storage.single_storage_type ?? "gp3"}

  # external-dns, one instance per Route53 zone: public when dns.public_domain is set,
  # private when dns.private.driver is cloud. IAM role comes from the cluster module.
  - name: dns
    when: "cluster.driver == 'eks' && (dns_zone_effective.cloud == true || dns.private.driver == 'cloud')"
    install:
      timeout: 5m
      interval: 5m
    resources:
      - name: account
        components:
          - service-account
        timeout: 5m
        interval: 5m
      - name: public
        when: dns_zone_effective.cloud == true
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/route53
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-public
          external_dns_domain: "${dns.public_domain ?? ''}"
          external_dns_zone_type: public
          external_dns_zone_id_filter: "${terraform_output('dns-zone', 'zone_id') ?? ''}"
          aws_region: "${aws.region ?? 'us-east-1'}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m
      - name: private
        when: dns.private.driver == 'cloud'
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/route53
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-private
          external_dns_domain: "${dns.private_domain ?? ''}"
          external_dns_zone_type: private
          external_dns_zone_id_filter: "${terraform_output('network', 'private_zone_id') ?? ''}"
          aws_region: "${aws.region ?? 'us-east-1'}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m
