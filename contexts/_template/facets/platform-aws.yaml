kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: aws
  description: "AWS provider basic infrastructure"

when: platform == 'aws'

# =============================================================================
# Requires
# =============================================================================
# aws.region has no default; lb-controller, external-dns, and the ACME issuer
# all need it. Public DNS also requires an operator email for TLS registration.
requires:
  - paths:
      - aws.region
    message: The AWS provider needs a region for every API call.
  - when: (dns.public_domain ?? '') != ''
    paths:
      - email
    message: Public DNS requires an operator email for TLS certificate registration.

# =============================================================================
# Config
# =============================================================================
config:

  # issuer_component selects the public ClusterIssuer variant (last match wins):
  # selfsigned floor, then ACME/route53 once a public domain is set.
  - name: pki_effective
    value:
      issuer_component: public-issuer/selfsigned
  - name: pki_effective
    when: (dns.public_domain ?? '') != ''
    value:
      issuer_component: public-issuer/acme/route53

# =============================================================================
# CRDs — vendored, applied ahead of the controller
# =============================================================================
# LB Controller CRDs vendored here (chart-installed CRDs never upgrade); the
# chart's own CRD install is skipped.
crds:
  # renovate: datasource=helm depName=aws-load-balancer-controller package=aws-load-balancer-controller helmRepo=https://aws.github.io/eks-charts
  - aws-load-balancer-controller-3.5.0

# =============================================================================
# Terraform — S3 state backend, VPC, EKS, optional Cilium bootstrap
# =============================================================================
# Dependency chain:
#   backend (S3) → network (VPC) → cluster (EKS) → cluster-additions → cni? → gitops
# database (KMS key) and crossplane-identity (IAM/Pod Identity) also branch
# off network and cluster, declared in addon-database.yaml instead.
# Reverse-order teardown lets dependent stacks empty their state before the
# backend bucket is removed. Cilium (optional) bootstraps before Flux.
terraform:

  # S3 + optional DynamoDB remote state; force_destroy flips on for destroy so
  # the bucket tears down with its contents.
  - name: backend
    path: backend/s3
    when: backend_effective.managed == true

  # VPC with the requested CIDR. domain_name feeds the private VPC-scoped
  # Route53 zone (from dns.private_domain); the public zone lives in dns-zone.
  - name: network
    path: network/aws-vpc
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
    inputs:
      cidr_block: ${network.cidr_block}
      domain_name: ${dns.private_domain ?? ""}
      # Cheap default runs a single shared NAT gateway; topology: ha lights up
      # one NAT per AZ. The subnet footprint stays multi-AZ either way.
      single_nat_gateway: "${topology != 'ha'}"

  # Public Route53 zone when dns.public_domain is set. Own stack so its
  # lifecycle (and NS delegation) is independent of the cluster's.
  - name: dns-zone
    path: dns/zone/route53
    when: "(dns.public_domain ?? '') != ''"
    dependsOn:
      - "${backend_effective.managed == true ? 'backend' : ''}"
    inputs:
      domain_name: ${dns.public_domain}

  # EKS cluster. cert-manager IAM role + Pod Identity only when ACME is on
  # (public_domain set); cert_manager_hosted_zone_ids scopes Route53 writes to
  # just the dns-zone, empty when ACME is off.
  - name: cluster
    path: cluster/aws-eks
    dependsOn:
      - network
    inputs:
      # vpc_id and private_subnet_ids come from the network module's outputs,
      # passed explicitly so the dependency is visible in the input contract.
      vpc_id: ${terraform_output('network', 'vpc_id')}
      private_subnet_ids: ${terraform_output('network', 'private_subnet_ids')}
      # Cheap default places node groups in a single AZ (first private subnet);
      # topology: ha spreads them across all private subnets. The control plane
      # always uses the full private_subnet_ids set (EKS needs >=2 AZs).
      node_subnet_ids: "${topology == 'ha' ? terraform_output('network', 'private_subnet_ids') : [terraform_output('network', 'private_subnet_ids')[0]]}"
      # topology: ha doubles the always-on system pool so a leader-election
      # standby survives a single node loss; no quorum is needed here.
      system_node_pool:
        desired_size: "${topology == 'ha' ? 2 : 1}"
      manage_log_group: ${!(ephemeral ?? false)}
      create_cert_manager_role: "${(dns.public_domain ?? '') != ''}"
      cert_manager_hosted_zone_ids: "${(dns.public_domain ?? '') != '' ? [terraform_output('dns-zone', 'zone_id')] : []}"
      # Portable user pools alongside the module's always-on system pool;
      # defaults to one general pool. Declaring cluster.pools replaces this.
      pools: >-
        ${cluster.pools ?? {"general": {"class": "general", "count": 1}}}

  # Dependency-edge only: with ACME on, cluster must wait for dns-zone so
  # zone_id resolves before the cert-manager policy renders — else it falls
  # back to the wildcard hostedzone/* scope.
  - name: cluster
    when: "(dns.public_domain ?? '') != ''"
    dependsOn:
      - dns-zone

  # destroy: false — IAM/IRSA/aws-auth entries; the cluster delete takes them.
  - name: cluster-additions
    path: cluster/aws-eks/additions
    dependsOn:
      - cluster
    destroy: false

  # Optional Cilium bootstrap (full BYO-CNI). EKS uses chart-default cgroup
  # auto-mount, unlike the Talos path, so no privileged/cgroup overrides here.
  - name: cni
    when: "cluster.cni.driver == 'cilium'"
    path: cni/cilium
    dependsOn:
      - cluster
    inputs:
      # Endpoint exists only after cluster applies; pull from output by default.
      # Explicit cluster.endpoint still wins (proxied / air-gapped).
      cluster_endpoint: ${cluster.endpoint ?? terraform_output("cluster", "cluster_endpoint") ?? ""}

  # GitOps (two variants). Without Cilium: Flux starts as soon as EKS is up.
  # With Cilium: wait for the `cni` step so pod networking is healthy first.
  - name: gitops
    when: "cluster.cni.driver != 'cilium'"
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      concurrency: 5
    destroy: false

  - name: gitops
    when: "cluster.cni.driver == 'cilium'"
    path: gitops/flux
    dependsOn:
      - cluster
      - cni
    inputs:
      concurrency: 5
    destroy: false

# =============================================================================
# Flux systems — pki resources overlay
# =============================================================================
# pki-resources always renders. The gateway cert needs a ClusterIssuer.
# Two modes: selfsigned by default, or ACME when dns.public_domain is set.
# ACME runs DNS-01 against the Route53 zone through the cluster module's
# IAM role. dev == true selects the ACME staging server.
flux:

  - name: pki
    resources:
      - components:
          # acme_hosted_zone_id defers terraform_output until dns-zone applies.
          # An eager lookup panics on first bootstrap.
          - "${pki_effective.issuer_component}"
        timeout: 5m
        interval: 5m
        substitutions:
          # ACME-only. Selfsigned doesn't reference these. acme_hosted_zone_id
          # gates on public_domain. dns-zone doesn't exist in selfsigned mode.
          acme_server: "${dev == true ? 'https://acme-staging-v02.api.letsencrypt.org/directory' : 'https://acme-v02.api.letsencrypt.org/directory'}"
          acme_email: "${email ?? ''}"
          acme_dns_zone: "${dns.public_domain ?? ''}"
          acme_region: "${aws.region ?? 'us-east-1'}"
          acme_hosted_zone_id: "${(dns.public_domain ?? '') != '' ? (terraform_output('dns-zone', 'zone_id') ?? '') : ''}"

  # Gateway install merge. Adds envoy/loadbalancer/aws-nlb (NLB annotations)
  # when Envoy runs in loadbalancer mode. Provisions an NLB, not an ALB: Envoy
  # already terminates L7 traffic. ALB stays available per-Ingress via the
  # alb ingress class.
  #
  # dependsOn lb-install: the Service these annotations create is finalized
  # by aws-load-balancer-controller. Ordering the controller to tear down
  # after the Service avoids stuck finalizers on destroy.
  - name: gateway
    when: "gateway.enabled == true && gateway.driver == 'envoy' && lb_effective.mode == 'loadbalancer'"
    resources:
      - name: external
        when: (dns.public_domain ?? '') != ''
        dependsOn:
          - lb-install
        components:
          - envoy/loadbalancer/aws-nlb
      - name: internal
        when: (dns.private_domain ?? '') != ''
        dependsOn:
          - lb-install
        components:
          - envoy/loadbalancer/aws-nlb

  # AWS Load Balancer Controller. Provisions NLB/ALB through the EKS API.
  # The in-tree CCM makes classic ELBs instead. Always rendered.
  #
  # IAM comes from the cluster module (create_aws_lb_controller_role, Pod
  # Identity in system-lb). vpc_id and aws_region pass explicitly: worker
  # hop-limit 1 blocks pod-network IMDS. aws_region has no default.
  - name: lb
    install:
      components:
        - aws-lb-controller
      timeout: 5m
      interval: 5m
      substitutions:
        cluster_name: "${terraform_output('cluster', 'cluster_name') ?? ''}"
        vpc_id: "${terraform_output('network', 'vpc_id') ?? ''}"
        aws_region: "${aws.region ?? ''}"

  # Compute — cluster-autoscaler scales the EKS node-group ASGs on pending pods.
  # Discovers groups via the k8s.io/cluster-autoscaler tags the aws-eks module
  # applies; authenticates through its Pod Identity association.
  - name: compute
    install:
      components:
        - cluster-autoscaler
      timeout: 5m
      interval: 5m
      substitutions:
        cluster_name: "${terraform_output('cluster', 'cluster_name') ?? ''}"
        aws_region: "${aws.region ?? ''}"

  # CSI — AWS EBS, default block storage on EKS. single_storage_type sets the
  # StorageClass volumeType (gp3 recommended).
  - name: csi
    install:
      components:
        - aws-ebs
      timeout: 5m
      interval: 5m
      substitutions:
        single_storage_type: ${cluster.storage.single_storage_type ?? "gp3"}

  # DNS: external-dns writes A/CNAME records from Ingress/HTTPRoute resources, one instance per zone.
  # IAM comes from the cluster module (create_external_dns_role, Pod Identity in system-dns).
  - name: dns
    when: "(dns.public_domain ?? '') != '' || (dns.private_domain ?? '') != ''"
    install:
      components:
        - external-dns
      timeout: 5m
      interval: 5m
    # One instance per zone. The HTTPRoute source needs the gateway CRDs.
    resources:
      - name: account
        components:
          - service-account
        timeout: 5m
        interval: 5m
      - name: public
        when: (dns.public_domain ?? '') != ''
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/route53
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
        substitutions:
          external_dns_name: external-dns-public
          external_dns_domain: "${dns.public_domain ?? ''}"
          external_dns_zone_type: public
          external_dns_zone_id_filter: "${terraform_output('dns-zone', 'zone_id') ?? ''}"
          aws_region: "${aws.region ?? 'us-east-1'}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m
      - name: private
        when: (dns.private_domain ?? '') != ''
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/route53
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
        substitutions:
          external_dns_name: external-dns-private
          external_dns_domain: "${dns.private_domain ?? ''}"
          external_dns_zone_type: private
          external_dns_zone_id_filter: "${terraform_output('network', 'private_zone_id') ?? ''}"
          aws_region: "${aws.region ?? 'us-east-1'}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m
