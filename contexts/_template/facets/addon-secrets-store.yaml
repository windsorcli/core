kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: secrets-store
  description: Secrets store for External Secrets Operator — self-hosted OpenBao, or an external Vault-API-compatible instance

when: secrets_store.enabled == true

# secrets_store on its own is meaningless without a controller to read from it.
requires:
  - paths:
      - external_secrets.enabled
    message: The secrets store needs External Secrets Operator turned on too.

# =============================================================================
# Flux systems — secrets store. Shares the "secrets" Kustomization with
# addon-external-secrets.yaml (kustomize/secrets/), same as platform-base.yaml
# and addon-private-ca.yaml both landing in "pki".
# =============================================================================
# openbao: self-hosted, single cluster. Depends on csi for the data PVC and
# pki-install for the server TLS Certificate. external: no install tier —
# only the ClusterSecretStore, pointed at an instance this cluster doesn't own.
flux:

  - name: secrets
    when: (secrets_store.driver ?? 'openbao') == 'openbao'
    dependsOn:
      - csi
      - pki-install
    secrets:
      openbao-ca-trust:
        namespaces: [system-secrets-store]
        data:
          ca.crt: ${terraform_output('pki', 'cert')}
    install:
      components:
        - openbao
        - openbao/bootstrap
        - "${telemetry.metrics.enabled ? 'openbao/prometheus' : ''}"
      timeout: 10m
      interval: 5m

  # Gateway route — private only. Waits for the shared Gateway to exist.
  - name: secrets
    when: (secrets_store.driver ?? 'openbao') == 'openbao' && gateway.access == 'private'
    resources:
      - dependsOn:
          - gateway-resources
        components:
          - openbao/gateway
        timeout: 10m
        interval: 5m
        substitutions:
          external_domain: "${(dns.public_domain ?? '') == '' ? (dns.private_domain ?? '') : dns.public_domain}"
