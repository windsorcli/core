kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: demo
  description: "Demo resources including sample databases and example applications"

when: demo.enabled == true

# =============================================================================
# Terraform — Cloud SQL admin credential
# =============================================================================
# Cloud SQL's own User resource has no auto-generate mechanism the way
# rds.aws.upbound.io Instance or dbforpostgresql.azure.upbound.io
# FlexibleServer do, so the demo declares which instance name needs one.
# Merges into platform-gcp.yaml's own "database" terraform entry.
terraform:
  - name: database
    path: database/gcp-cloudsql
    when: demo.resources.database == true && database.postgres.driver == 'cloudsql'
    inputs:
      admin_credentials:
        demo-db:
          username: demo

# Single source of truth for demo-db's database name, used by the
# Instance CR and the app-role component below.
config:
  - name: demo_database_name
    value: demo

# =============================================================================
# Flux — demo applications
# =============================================================================
#
# Sample apps reconciled onto the running cluster, a resources-only system.
# Each demo.resources.* flag toggles one app. database adds a shared
# namespace plus a driver variant (cloudnativepg or rds). dependsOn
# follows whichever operator owns the active driver.
#
flux:

  # cloudnativepg driver: shared namespace plus the in-cluster Cluster CR.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'cloudnativepg'
    dependsOn:
      - database
    resources:
      - components:
          - database
          - database/cloudnativepg
        substitutions:
          demo_db_name: "${demo_database_name}"
        timeout: 10m
        interval: 5m

  # rds driver: shared namespace and the Instance CR.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'rds'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/rds
        substitutions:
          # The demo reads the real terraform outputs directly; a
          # third-party chart (no Flux substitution access) has to
          # reconstruct the naming convention instead.
          db_subnet_group_name: "${terraform_output('network', 'db_subnet_group_name') ?? ''}"
          kms_key_arn: "${terraform_output('database', 'kms_key_arn') ?? ''}"
          rds_security_group_id: "${terraform_output('database', 'security_group_id') ?? ''}"
          demo_db_name: "${demo_database_name}"
          aws_region: "${aws.region ?? ''}"
        healthCheckExprs:
          - apiVersion: rds.aws.upbound.io/v1beta3
            kind: Instance
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        # Gated on the Instance's own Ready condition, not just the CR apply,
        # so windsor apply --wait blocks until RDS actually finishes
        # provisioning. A generous timeout costs nothing on the happy
        # path — it only affects how long Flux waits before giving up on
        # an unusually slow provision.
        timeout: 30m
        interval: 5m

  # flexibleserver driver: shared namespace and the FlexibleServer +
  # FlexibleServerDatabase CRs — Azure twin of the rds entry above.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'flexibleserver'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/flexibleserver
        substitutions:
          # The demo reads the real terraform outputs directly; a
          # third-party chart (no Flux substitution access) has to
          # reconstruct the naming convention instead.
          flexibleserver_subnet_id: "${terraform_output('network', 'flexibleserver_subnet_id') ?? ''}"
          flexibleserver_private_dns_zone_id: "${terraform_output('database', 'private_dns_zone_id') ?? ''}"
          flexibleserver_region: "${terraform_output('network', 'region') ?? ''}"
        healthCheckExprs:
          - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
            kind: FlexibleServer
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        # Gated on the FlexibleServer's own Ready condition, not just the CR
        # apply, so windsor apply --wait blocks until it actually finishes
        # provisioning. A generous timeout costs nothing on the happy
        # path — it only affects how long Flux waits before giving up on
        # an unusually slow provision.
        timeout: 30m
        interval: 5m

  # cloudsql driver: shared namespace and the DatabaseInstance + User +
  # Database CRs — GCP twin of the rds/flexibleserver entries above.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'cloudsql'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/cloudsql
        substitutions:
          # The demo reads the real terraform outputs directly; a
          # third-party chart (no Flux substitution access) has to
          # reconstruct the naming convention instead.
          cloudsql_network_id: "${terraform_output('network', 'network_id') ?? ''}"
          cloudsql_kms_key_name: "${terraform_output('database', 'kms_key_name') ?? ''}"
          cloudsql_region: "${terraform_output('network', 'region') ?? ''}"
        healthCheckExprs:
          - apiVersion: sql.gcp.upbound.io/v1beta2
            kind: DatabaseInstance
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        # Gated on the DatabaseInstance's own Ready condition, not just the
        # CR apply, so windsor apply --wait blocks until Cloud SQL actually
        # finishes provisioning. A generous timeout costs nothing on the
        # happy path — it only affects how long Flux waits before giving up
        # on an unusually slow provision. Empirically ~9m for a
        # db-f1-micro instance to go Ready.
        timeout: 30m
        interval: 5m

  # Application credential for demo-db. Depends on demo-resources for
  # namespace-before-RBAC ordering.
  - name: demo-app-role
    path: provisioning
    when: demo.resources.database == true && database.postgres.driver == 'rds'
    dependsOn:
      - demo-resources
    resources:
      - components:
          - crossplane/aws-rds/app-role
        substitutions:
          pg_instance_name: demo-db
          pg_database_name: "${demo_database_name}"
          pg_target_namespace: demo-database
          # Ownership already covers everything the demo needs; no extra
          # grants to layer on.
          pg_grant_sql: ""
        healthCheckExprs:
          # Gated on the one-shot Job's own Complete condition, not just its
          # apply, so windsor apply --wait blocks until the app credential
          # Secret genuinely exists.
          - apiVersion: batch/v1
            kind: Job
            current: status.conditions.exists(e, e.type == 'Complete' && e.status == 'True')
        timeout: 5m
        interval: 5m

  # Application credential for demo-db — Azure twin of the rds entry above.
  - name: demo-app-role
    path: provisioning
    when: demo.resources.database == true && database.postgres.driver == 'flexibleserver'
    dependsOn:
      - demo-resources
    resources:
      - components:
          - crossplane/azure-postgres/app-role
        substitutions:
          pg_instance_name: demo-db
          pg_database_name: "${demo_database_name}"
          pg_target_namespace: demo-database
          pg_grant_sql: ""
        healthCheckExprs:
          # Gated on the one-shot Job's own Complete condition, not just its
          # apply, so windsor apply --wait blocks until the app credential
          # Secret genuinely exists.
          - apiVersion: batch/v1
            kind: Job
            current: status.conditions.exists(e, e.type == 'Complete' && e.status == 'True')
        timeout: 5m
        interval: 5m

  # Application credential for demo-db — GCP twin of the rds/flexibleserver
  # entries above.
  - name: demo-app-role
    path: provisioning
    when: demo.resources.database == true && database.postgres.driver == 'cloudsql'
    dependsOn:
      - demo-resources
    resources:
      - components:
          - crossplane/gcp-cloudsql/app-role
        substitutions:
          pg_instance_name: demo-db
          pg_database_name: "${demo_database_name}"
          pg_target_namespace: demo-database
          pg_grant_sql: ""
        healthCheckExprs:
          # Gated on the one-shot Job's own Complete condition, not just its
          # apply, so windsor apply --wait blocks until the app credential
          # Secret genuinely exists.
          - apiVersion: batch/v1
            kind: Job
            current: status.conditions.exists(e, e.type == 'Complete' && e.status == 'True')
        timeout: 5m
        interval: 5m

  # static and bookinfo carry no database dependency.
  - name: demo
    path: demo
    resources:
      - components:
          - "${demo.resources.static == true ? 'static' : ''}"
          - "${demo.resources.bookinfo == true ? 'bookinfo' : ''}"

  # Bookinfo's productpage route. Waits for gateway-resources since the
  # HTTPRoute parents to the Gateway object created there.
  - name: demo
    path: demo
    when: demo.resources.bookinfo == true && gateway.enabled == true
    resources:
      - dependsOn:
          - gateway-resources
        components:
          - bookinfo/gateway
        substitutions:
          external_domain: ${gateway_effective.external_domain}
