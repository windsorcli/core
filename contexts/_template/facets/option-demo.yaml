kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: demo
  description: "Demo resources including sample databases and example applications"

when: demo.enabled == true

# Single source of truth for demo-db's own database name — referenced by
# the Instance CR, the app-role CronJob's SQL, and the monitoring
# component's substitutions below, so none of them can drift apart.
config:
  - name: demo_database_name
    value: demo

# =============================================================================
# Flux — demo applications
# =============================================================================
#
# Sample apps reconciled onto the running cluster, so a resources-only system.
# Each demo.resources.* flag toggles one app. database is a shared namespace
# plus a driver variant (cloudnativepg or rds); dependsOn tracks whichever
# operator's install tier owns that driver.
#
flux:

  - name: demo
    path: demo
    dependsOn:
      - "${demo.resources.database == true ? (database.postgres.driver == 'rds' ? 'provisioning' : 'database') : ''}"
    resources:
      - components:
          - "${demo.resources.database == true ? 'database' : ''}"
          - "${demo.resources.database == true ? (database.postgres.driver == 'rds' ? 'database/rds' : 'database/cloudnativepg') : ''}"
          - "${demo.resources.static == true ? 'static' : ''}"
          - "${demo.resources.bookinfo == true ? 'bookinfo' : ''}"
        substitutions:
          # The demo is Windsor's own tooling, so it reads the real
          # terraform outputs directly rather than reconstructing the
          # naming convention a third-party chart (with no Flux
          # substitution access) has to use instead — see ADR-0009 §3.
          db_subnet_group_name: "${terraform_output('network', 'db_subnet_group_name') ?? ''}"
          kms_key_arn: "${terraform_output('database', 'kms_key_arn') ?? ''}"
          rds_security_group_id: "${terraform_output('database', 'security_group_id') ?? ''}"
          demo_db_name: "${demo_database_name}"
          aws_region: "${aws.region ?? ''}"
        timeout: 10m
        interval: 5m

  # Application credential and (when a metrics pipeline exists to scrape
  # it) postgres_exporter monitoring for demo-db — core-provided and
  # reusable by any RDS-backed chart, not authored per-chart (see
  # ADR-0009 §7, §8). Merges into the same provisioning-resources
  # Kustomization addon-database.yaml already targets. Gated on
  # telemetry.metrics.enabled, not observability.enabled — the exporter
  # only needs Prometheus, not Grafana; the dashboard it feeds is what
  # actually needs observability.enabled, gated separately in
  # addon-database.yaml's observability entry.
  - name: provisioning
    when: demo.resources.database == true && database.postgres.driver == 'rds'
    resources:
      - components:
          - crossplane/aws-rds/app-role
          - "${(telemetry.metrics.enabled ?? true) ? 'crossplane/aws-rds/postgres-exporter' : ''}"
        substitutions:
          pg_instance_name: demo-db
          pg_database_name: "${demo_database_name}"
          pg_target_namespace: demo-database
          # One line — Flux substitution is literal text replacement, so
          # a multi-line value here would corrupt the CronJob's YAML.
          pg_grant_sql: "GRANT CONNECT ON DATABASE ${demo_database_name} TO ${demo_database_name}_app; GRANT USAGE ON SCHEMA public TO ${demo_database_name}_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ${demo_database_name}_app; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ${demo_database_name}_app;"
        timeout: 5m
        interval: 5m
