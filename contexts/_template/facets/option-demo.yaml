kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: demo
  description: "Demo resources including sample databases and example applications"

when: demo.enabled == true

# Single source of truth for demo-db's database name, used by the
# Instance CR and its DatabaseCredentials resources below.
config:
  - name: demo_database_name
    value: demo

# =============================================================================
# Flux — demo applications
# =============================================================================
#
# Sample apps reconciled onto the running cluster, a resources-only system.
# Each demo.resources.* flag toggles one app. database adds a shared
# namespace plus a driver variant (cloudnativepg, rds, flexibleserver, or
# cloudsql), bundling that driver's own credentials. dependsOn follows
# whichever operator owns the active driver.
#
# The three managed drivers read their own terraform outputs directly
# below; a third-party chart, with no Flux substitution access, has to
# reconstruct the same naming convention instead.
#
flux:

  # cloudnativepg driver: shared namespace plus the in-cluster Cluster CR.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'cloudnativepg'
    dependsOn:
      - database-install
    resources:
      - components:
          - database
          - database/cloudnativepg
        substitutions:
          demo_database_name: "${demo_database_name}"
        timeout: 10m
        interval: 5m

  # rds driver: shared namespace, the Instance CR, and its credentials as a
  # named variant. Its own dependsOn on the unnamed variant makes Flux
  # delete it first, dropping the Role/Grant while the Instance still
  # answers connections.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'rds'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/rds
        substitutions:
          db_subnet_group_name: "${terraform_output('network', 'db_subnet_group_name') ?? ''}"
          kms_key_arn: "${terraform_output('database', 'kms_key_arn') ?? ''}"
          rds_security_group_id: "${terraform_output('database', 'security_group_id') ?? ''}"
          demo_database_name: "${demo_database_name}"
          aws_region: "${aws.region ?? ''}"
        healthCheckExprs:
          # Gated on the Instance's own Ready condition, not the CR apply.
          - apiVersion: rds.aws.upbound.io/v1beta3
            kind: Instance
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 30m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/rds/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: DatabaseCredentials
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # flexibleserver driver: shared namespace, the FlexibleServer +
  # FlexibleServerDatabase CRs, and its credentials as a named variant —
  # Azure twin of rds. Its own dependsOn on the unnamed variant makes Flux
  # delete it first, dropping the Role/Grant while the server still
  # answers connections.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'flexibleserver'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/flexibleserver
        substitutions:
          flexibleserver_subnet_id: "${terraform_output('network', 'flexibleserver_subnet_id') ?? ''}"
          flexibleserver_private_dns_zone_id: "${terraform_output('database', 'private_dns_zone_id') ?? ''}"
          flexibleserver_region: "${terraform_output('network', 'region') ?? ''}"
          context_id: ${id}
        healthCheckExprs:
          - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
            kind: FlexibleServer
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
          # FlexibleServerDatabase is the CR that actually creates the database.
          - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
            kind: FlexibleServerDatabase
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        # Gated on the FlexibleServer's own Ready condition, not the CR apply.
        timeout: 30m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/flexibleserver/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
          context_id: ${id}
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: DatabaseCredentials
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # cloudsql driver: shared namespace, the DatabaseInstance + Database CRs,
  # and its credentials as a named variant — GCP twin of rds/flexibleserver.
  # Its own dependsOn on the unnamed variant makes Flux delete it first,
  # dropping the Role/Grant while the instance still answers connections.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'cloudsql'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/cloudsql
          - "${(database.postgres.encryption.managed ?? false) ? 'database/cloudsql/encryption-key' : ''}"
        substitutions:
          cloudsql_network_id: "${terraform_output('network', 'network_id') ?? ''}"
          cloudsql_kms_key_name: "${terraform_output('database', 'kms_key_name') ?? ''}"
          cloudsql_region: "${terraform_output('network', 'region') ?? ''}"
        healthCheckExprs:
          - apiVersion: sql.gcp.upbound.io/v1beta2
            kind: DatabaseInstance
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
          # Database is the CR that actually creates the database.
          - apiVersion: sql.gcp.upbound.io/v1beta1
            kind: Database
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        # Gated on the DatabaseInstance's own Ready condition, not the CR
        # apply. A db-f1-micro instance takes ~9m to go Ready.
        timeout: 30m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/cloudsql/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: DatabaseCredentials
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # Core-owned, driver-agnostic — not part of the demo's own database/
  # tree. Its Deployment waits on the monitor credential Secret the same
  # way any Kubernetes workload waits on a Secret, no Flux dependsOn needed.
  - name: monitoring-exporter
    path: database
    when: demo.resources.database == true && (database.postgres.driver == 'rds' || database.postgres.driver == 'flexibleserver' || database.postgres.driver == 'cloudsql') && (telemetry.metrics.enabled ?? true)
    resources:
      - components:
          - crossplane/postgres/monitoring-exporter
        substitutions:
          # Matches the DatabaseCredentials claim's fixed name, not the
          # cloud instance name, which is scoped per-context separately.
          pg_instance_name: demo-db
        timeout: 5m
        interval: 5m

  # static and bookinfo carry no database dependency.
  - name: demo
    path: demo
    resources:
      - components:
          - "${demo.resources.static == true ? 'static' : ''}"
          - "${demo.resources.bookinfo == true ? 'bookinfo' : ''}"

  # Bookinfo's productpage route. Waits for gateway-resources since the
  # HTTPRoute parents to the Gateway object created there.
  - name: demo
    path: demo
    when: demo.resources.bookinfo == true && gateway.enabled == true
    resources:
      - dependsOn:
          - gateway-resources
        components:
          - bookinfo/gateway
        substitutions:
          external_domain: ${gateway_effective.external_domain}
