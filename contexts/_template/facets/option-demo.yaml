kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: demo
  description: "Demo resources including sample databases and example applications"

when: demo.enabled == true

# Single source of truth for demo-db's database name, used by the
# Instance CR and the app-role component below.
config:
  - name: demo_database_name
    value: demo

# =============================================================================
# Flux — demo applications
# =============================================================================
#
# Sample apps reconciled onto the running cluster, a resources-only system.
# Each demo.resources.* flag toggles one app. database adds a shared
# namespace plus a driver variant (cloudnativepg or rds). dependsOn
# follows whichever operator owns the active driver.
#
flux:

  # cloudnativepg driver: shared namespace plus the in-cluster Cluster CR.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'cloudnativepg'
    dependsOn:
      - database
    resources:
      - components:
          - database
          - database/cloudnativepg
        substitutions:
          demo_db_name: "${demo_database_name}"
        timeout: 10m
        interval: 5m

  # rds driver: shared namespace and the Instance CR.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'rds'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/rds
        substitutions:
          # The demo reads the real terraform outputs directly; a
          # third-party chart (no Flux substitution access) has to
          # reconstruct the naming convention instead.
          db_subnet_group_name: "${terraform_output('network', 'db_subnet_group_name') ?? ''}"
          kms_key_arn: "${terraform_output('database', 'kms_key_arn') ?? ''}"
          rds_security_group_id: "${terraform_output('database', 'security_group_id') ?? ''}"
          demo_db_name: "${demo_database_name}"
          aws_region: "${aws.region ?? ''}"
        timeout: 10m
        interval: 5m

  # flexibleserver driver: shared namespace and the FlexibleServer +
  # FlexibleServerDatabase CRs — Azure twin of the rds entry above.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.driver == 'flexibleserver'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/flexibleserver
        substitutions:
          # The demo reads the real terraform outputs directly; a
          # third-party chart (no Flux substitution access) has to
          # reconstruct the naming convention instead.
          flexibleserver_subnet_id: "${terraform_output('network', 'flexibleserver_subnet_id') ?? ''}"
          flexibleserver_private_dns_zone_id: "${terraform_output('database', 'private_dns_zone_id') ?? ''}"
          flexibleserver_region: "${terraform_output('network', 'region') ?? ''}"
        timeout: 10m
        interval: 5m

  # Application credential for demo-db. Depends on demo-resources for
  # namespace-before-RBAC ordering.
  - name: demo-app-role
    path: provisioning
    when: demo.resources.database == true && database.postgres.driver == 'rds'
    dependsOn:
      - demo-resources
    resources:
      - components:
          - crossplane/aws-rds/app-role
        substitutions:
          pg_instance_name: demo-db
          pg_database_name: "${demo_database_name}"
          pg_target_namespace: demo-database
          # Ownership already covers everything the demo needs; no extra
          # grants to layer on.
          pg_grant_sql: ""
        timeout: 5m
        interval: 5m

  # Application credential for demo-db — Azure twin of the rds entry above.
  - name: demo-app-role
    path: provisioning
    when: demo.resources.database == true && database.postgres.driver == 'flexibleserver'
    dependsOn:
      - demo-resources
    resources:
      - components:
          - crossplane/azure-postgres/app-role
        substitutions:
          pg_instance_name: demo-db
          pg_database_name: "${demo_database_name}"
          pg_target_namespace: demo-database
          pg_grant_sql: ""
        timeout: 5m
        interval: 5m

  # static and bookinfo carry no database dependency.
  - name: demo
    path: demo
    resources:
      - components:
          - "${demo.resources.static == true ? 'static' : ''}"
          - "${demo.resources.bookinfo == true ? 'bookinfo' : ''}"

  # Bookinfo's productpage route. Waits for gateway-resources since the
  # HTTPRoute parents to the Gateway object created there.
  - name: demo
    path: demo
    when: demo.resources.bookinfo == true && gateway.enabled == true
    resources:
      - dependsOn:
          - gateway-resources
        components:
          - bookinfo/gateway
        substitutions:
          external_domain: ${gateway_effective.external_domain}
