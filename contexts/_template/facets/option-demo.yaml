kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: demo
  description: "Demo resources including sample databases and example applications"

when: demo.enabled == true

# Single source of truth for demo-db's database name, used by the
# Instance CR and the AppRole below.
config:
  - name: demo_database_name
    value: demo
  # Flexible Server names are globally unique in Azure; other drivers
  # keep the plain literal.
  - name: database_instance_name
    value: "${database_effective.cloud_driver == 'azuredb' ? 'demo-db-' + id : 'demo-db'}"

# =============================================================================
# Flux — demo applications
# =============================================================================
#
# Sample apps reconciled onto the running cluster, a resources-only system.
# Each demo.resources.* flag toggles one app. database adds a shared
# namespace plus a driver variant (cloudnativepg, rds, azuredb, or
# cloudsql), plus the shared app credential. The monitor
# credential and its exporter are provisioned automatically by the
# database facet's own WatchOperations, not by this facet.
# dependsOn follows whichever operator owns the active driver.
#
# The three managed drivers read their own terraform outputs directly
# below; a third-party chart, with no Flux substitution access, has to
# reconstruct the same naming convention instead.
#
flux:

  # cloudnativepg driver: shared namespace plus the in-cluster Cluster CR.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.enabled == true
    dependsOn:
      - database-install
    resources:
      - components:
          - database
          - database/cloudnativepg
        substitutions:
          demo_database_name: "${demo_database_name}"
        timeout: 10m
        interval: 5m

  # rds driver: the Instance CR and its credentials as a named variant.
  # dependsOn drops the Role/Grant before the Instance goes away.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'rds'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/rds
        substitutions:
          demo_database_name: "${demo_database_name}"
          database_instance_name: "${database_instance_name}"
          aws_region: "${aws.region ?? ''}"
        healthCheckExprs:
          # Gated on the Instance's own Ready condition, not the CR apply.
          - apiVersion: rds.aws.upbound.io/v1beta3
            kind: Instance
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 45m
        deleteTimeout: 60m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: AppRole
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # azuredb driver: Azure twin of rds.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'azuredb'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/azuredb
        substitutions:
          azuredb_region: "${terraform_output('network', 'region') ?? ''}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
            kind: FlexibleServer
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
          # FlexibleServerDatabase is the CR that actually creates the database.
          - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
            kind: FlexibleServerDatabase
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        # Gated on the FlexibleServer's own Ready condition, not the CR apply.
        timeout: 45m
        deleteTimeout: 60m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: AppRole
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # cloudsql driver: GCP twin of rds/azuredb.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'cloudsql'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/cloudsql
        substitutions:
          cloudsql_region: "${terraform_output('network', 'region') ?? ''}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: sql.gcp.upbound.io/v1beta2
            kind: DatabaseInstance
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
          # Database is the CR that actually creates the database.
          - apiVersion: sql.gcp.upbound.io/v1beta1
            kind: Database
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        # Gated on the DatabaseInstance's own Ready condition, not the CR apply.
        timeout: 45m
        deleteTimeout: 60m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: AppRole
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # static and bookinfo carry no database dependency.
  - name: demo
    path: demo
    resources:
      - components:
          - "${demo.resources.static == true ? 'static' : ''}"
          - "${demo.resources.bookinfo == true ? 'bookinfo' : ''}"

  # Bookinfo's productpage route. Waits for gateway-resources since the
  # HTTPRoute parents to the Gateway object created there.
  - name: demo
    path: demo
    when: demo.resources.bookinfo == true && gateway.enabled == true
    resources:
      - dependsOn:
          - gateway-resources
        components:
          - bookinfo/gateway
        substitutions:
          external_domain: ${gateway_effective.external_domain}
