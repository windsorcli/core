kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: demo
  description: "Demo resources including sample databases and example applications"

when: demo.enabled == true

# Config
# =============================================================================
config:
  # demo-db's database name, used by the Instance CR and the AppRole.
  - name: demo_database_name
    value: demo
  # Flexible Server names are globally unique in Azure, so azuredb appends the context id.
  - name: database_instance_name
    value: "${database_effective.cloud_driver == 'azuredb' ? 'demo-db-' + id : 'demo-db'}"

# Flux
# =============================================================================
# Sample apps, each toggled by a demo.resources.* flag.
# The database app adds a shared namespace, a driver variant and the shared app credential.
# addon-database provisions the monitor credential and its exporter.
flux:

  # cloudnativepg driver: shared namespace plus the in-cluster Cluster CR.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.enabled == true
    dependsOn:
      - database-install
    resources:
      - components:
          - database
          - database/cloudnativepg
        substitutions:
          demo_database_name: "${demo_database_name}"
        timeout: 10m
        interval: 5m

  # rds driver: the Instance CR, with its credentials as a named variant.
  # The credentials depend on demo-resources, so the Role and Grant are removed before the Instance.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'rds'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/rds
        substitutions:
          demo_database_name: "${demo_database_name}"
          database_instance_name: "${database_instance_name}"
          demo_database_instance_type: "${demo.database.instance_type ?? 'db.t4g.micro'}"
        healthCheckExprs:
          # Gated on the Instance's Ready condition.
          - apiVersion: rds.aws.upbound.io/v1beta3
            kind: Instance
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 45m
        deleteTimeout: 60m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: AppRole
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # azuredb driver: Azure twin of rds.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'azuredb'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/azuredb
        substitutions:
          azuredb_region: "${terraform_output('network', 'region') ?? ''}"
          demo_database_instance_type: "${demo.database.instance_type ?? 'B_Standard_B1ms'}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
            kind: FlexibleServer
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
          # FlexibleServerDatabase is the CR that actually creates the database.
          - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
            kind: FlexibleServerDatabase
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 45m
        deleteTimeout: 60m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: AppRole
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # cloudsql driver: GCP twin of rds/azuredb.
  - name: demo
    path: demo
    when: demo.resources.database == true && database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'cloudsql'
    dependsOn:
      - provisioning-resources
    resources:
      - components:
          - database
          - database/cloudsql
        substitutions:
          cloudsql_region: "${terraform_output('network', 'region') ?? ''}"
          demo_database_instance_type: "${demo.database.instance_type ?? 'db-f1-micro'}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: sql.gcp.upbound.io/v1beta2
            kind: DatabaseInstance
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
          # Database is the CR that actually creates the database.
          - apiVersion: sql.gcp.upbound.io/v1beta1
            kind: Database
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 45m
        deleteTimeout: 60m
        interval: 5m
      - name: credentials
        dependsOn:
          - demo-resources
        components:
          - database/credentials
        substitutions:
          demo_database_name: "${demo_database_name}"
          database_instance_name: "${database_instance_name}"
        healthCheckExprs:
          - apiVersion: database.windsorcli.dev/v1alpha1
            kind: AppRole
            current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        timeout: 10m
        interval: 5m

  # static and bookinfo carry no database dependency.
  - name: demo
    path: demo
    resources:
      - components:
          - "${demo.resources.static == true ? 'static' : ''}"
          - "${demo.resources.bookinfo == true ? 'bookinfo' : ''}"

  # Bookinfo route on the internal gateway.
  - name: demo
    path: demo
    when: demo.resources.bookinfo == true && gateway.enabled == true && gateway_effective.internal == true
    resources:
      - dependsOn:
          - gateway-resources-internal
        components:
          - bookinfo/gateway
        substitutions:
          bookinfo_gateway: internal
          bookinfo_domain: ${dns.private_domain}

  # Bookinfo route on the external gateway when there is no internal one.
  - name: demo
    path: demo
    when: >-
      demo.resources.bookinfo == true && gateway.enabled == true &&
      gateway_effective.internal != true && (dns.public_domain ?? '') != ''
    resources:
      - dependsOn:
          - gateway-resources-external
        components:
          - bookinfo/gateway
        substitutions:
          bookinfo_gateway: external
          bookinfo_domain: ${dns.public_domain}
