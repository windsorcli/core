kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: private-dns
  description: Self-hosted private DNS zones, served by CoreDNS or PowerDNS

when: dns.private.driver in ['coredns', 'pdns', 'pdns-remote']

requires:
  - paths:
      - dns.private_domain
    message: Self-hosted private DNS serves and publishes records into this zone.
  - when: dns.private.driver == 'pdns-remote'
    paths:
      - dns.private.pdns.url
      - dns.private.pdns.api_key
    message: An existing PowerDNS server is reached through its API URL and key.
  - when: dns.private.driver == 'pdns' && database.postgres.enabled == false
    message: The pdns driver stores its zones in the in-cluster PostgreSQL database; unset database.postgres.enabled or set it to true.
  # Workstation contexts reach the server through the node port instead.
  - when: >-
      dns.private.driver != 'pdns-remote' && gateway.enabled == true && (workstation.runtime ?? '') == '' &&
      gateway_exposure.internal == 'NodePort'
    message: Private DNS answers on port 53, which a NodePort cannot serve; set gateway.internal.service_type to LoadBalancer.

# pdns stores its zones in CloudNativePG.
config:
  - name: database
    when: dns.private.driver == 'pdns'
    value:
      postgres:
        enabled: "${database.postgres.enabled != false}"

# =============================================================================
# Kustomize — CoreDNS or PowerDNS + external-dns
# =============================================================================
#
# coredns waits for pki-resources (etcd certificates); pdns waits for the database resources tier.
# The gateway dep is cni under Cilium, gateway-install under Envoy.
#
# external-dns has no topology: ha component: no confirmed leader election at the pinned version.
#
terraform:
  - name: pdns
    path: dns/pdns-api-key
    when: dns.private.driver == 'pdns' && (dns.private.pdns.api_key ?? '') == ''

flux:

  - name: dns
    dependsOn:
      - "${dns.private.driver == 'coredns' ? 'pki-resources' : (dns.private.driver == 'pdns' ? 'database-resources-catalog' : '')}"
      - "${dns.private.driver == 'pdns-remote' ? '' : (gateway.driver == 'cilium' ? 'cni' : (gateway.enabled == true ? 'gateway-install' : ''))}"
    install:
      components:
        - "${dns.private.driver == 'pdns-remote' ? '' : dns.private.driver}"
        - "${dns.private.driver == 'coredns' ? 'coredns/etcd' : ''}"
        - "${dns_private_effective.public_zone == true && dns.private.driver == 'coredns' ? 'coredns/public-zone' : ''}"
        - "${telemetry.metrics.enabled && dns.private.driver != 'pdns-remote' ? dns.private.driver + '/prometheus' : ''}"
        - "${topology == 'ha' && dns.private.driver != 'pdns-remote' ? dns.private.driver + '/ha' : ''}"
        - "${gateway.driver == 'cilium' && dns.private.driver != 'pdns-remote' ? dns.private.driver + '/loadbalancer' : ''}"
        - "${gateway.driver == 'cilium' && dns.private.driver != 'pdns-remote' ? dns.private.driver + '/cilium' : ''}"
        - "${gateway.driver == 'envoy' && gateway.enabled == true && dns.private.driver != 'pdns-remote' ? dns.private.driver + '/gateway' : ''}"
      substitutions:
        private_domain: ${dns.private_domain}
        public_domain: "${dns_private_effective.public_zone == true ? dns.public_domain : ''}"
        dns_loadbalancer_ip: "${gateway_effective.internal_ip ?? ''}"
      healthCheckExprs:
        - apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
      timeout: 20m
      interval: 5m
    # One external-dns instance per zone, writing to the server's backend.
    resources:
      - name: account
        components:
          - service-account
        timeout: 5m
        interval: 5m
      - name: public
        when: dns_private_effective.public_zone == true
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - "external-dns/providers/${dns.private.driver}"
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-public
          external_dns_domain: "${dns.public_domain ?? ''}"
          txt_owner_id: "${id}"
          pdns_url: "${dns.private.pdns.url ?? ''}"
          pdns_server_id: "${dns.private.pdns.server_id ?? 'localhost'}"
        timeout: 5m
        interval: 5m
      - name: private
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - "external-dns/providers/${dns.private.driver}"
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-private
          external_dns_domain: ${dns.private_domain}
          txt_owner_id: "${id}"
          pdns_url: "${dns.private.pdns.url ?? ''}"
          pdns_server_id: "${dns.private.pdns.server_id ?? 'localhost'}"
        timeout: 5m
        interval: 5m

  # PowerDNS API key, supplied case.
  - name: dns
    when: dns.private.driver in ['pdns', 'pdns-remote'] && (dns.private.pdns.api_key ?? '') != ''
    secrets:
      pdns-api:
        data:
          username: ${'pdns'}
          api-key: ${dns.private.pdns.api_key}
  # PowerDNS API key, generated case.
  - name: dns
    when: dns.private.driver == 'pdns' && (dns.private.pdns.api_key ?? '') == ''
    secrets:
      pdns-api:
        data:
          username: ${'pdns'}
          api-key: ${terraform_output('pdns', 'api_key')}
