kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: docker
  description: "Docker provider basic infrastructure for local development"

when: "platform == 'docker' && cluster.driver == 'talos' && (cluster.enabled ?? true) && (workstation.runtime ?? '') != ''"

# Config
# =============================================================================
config:

  # Talos 1.13 outside Colima, since Talos 1.14 hides Docker's /etc/hostname and /etc/resolv.conf.
  - name: talos
    when: workstation.runtime != 'colima'
    value:
      # artifact: type=image name=ghcr.io/siderolabs/talos
      talos_image_tag: "v1.13.12"
      talos_version: "${trimPrefix(talos.talos_image_tag, 'v')}"
      # artifact: type=image name=registry.k8s.io/kube-apiserver
      # artifact: type=image name=registry.k8s.io/kube-controller-manager
      # artifact: type=image name=registry.k8s.io/kube-scheduler
      # artifact: type=image name=ghcr.io/siderolabs/kubelet
      # artifact: type=image name=registry.k8s.io/kube-proxy
      kubernetes_image_tag: "v1.36.7"
      kubernetes_version: "${trimPrefix(talos.kubernetes_image_tag, 'v')}"

  # Each compute instance, reduced to its node and endpoint fields.
  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(terraform_output("compute", "controlplanes") ?? [], fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${map(terraform_output("compute", "workers") ?? [], fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

  # https://<host>:6443 of the first compute control plane. localhost:6443 before compute has outputs.
  # When compute reports no endpoint, the host of the first cluster.controlplanes.nodes entry.
  - name: cluster_endpoint_fallback
    value:
      endpoint: >-
        ${len(terraform_output("compute", "controlplanes") ?? []) > 0
          && terraform_output("compute", "controlplanes")[0].endpoint != null
          ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
          : (len(terraform_output("compute", "controlplanes") ?? []) == 0
            ? "https://localhost:6443"
            : (len(map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1))) > 0
              ? "https://" + split(map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1))[0].endpoint, ":")[0] + ":6443"
              : "https://localhost:6443"))}

# Terraform
# =============================================================================
# The compute stack comes from option-workstation.
terraform:

  - name: cluster
    when: workstation.runtime != null && workstation.runtime != '' && (cluster.enabled ?? true)
    path: cluster/talos
    dependsOn:
      - compute
      - pki
    parallelism: 1
    inputs:
      cluster_endpoint: "${cluster.endpoint ?? cluster_endpoint_fallback.endpoint}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      upgrade_nodes: ${len(talos_common.extensions ?? []) == 0}
      kubernetes_version: ${talos.kubernetes_version ?? null}

      # Compute's control planes, else one entry per position at 127.0.0.1:50000+N for host talosctl.
      # On docker-desktop, each node carries a certSANs patch for its address, hostname, localhost and 127.0.0.1.
      controlplanes: >-
        ${map(
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? terraform_output("compute", "controlplanes")
            : reduce(
                take(map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1)), int(cluster.controlplanes.count ?? 1)),
                concat(#acc, [fromPairs(concat(
                  filter(toPairs(#), get(#, 0) != "endpoint" && get(#, 0) != "node"),
                  [["endpoint", "127.0.0.1:" + string(50000 + len(#acc))], ["node", "127.0.0.1"]]
                ))]),
                []
              ),
          workstation.runtime == 'docker-desktop'
            ? fromPairs(concat(
                toPairs(#),
                [["config_patches", "machine:\n  certSANs:\n  - " + (get(#, "node") != null && get(#, "node") != "" ? get(#, "node") : split(get(#, "endpoint"), ":")[0]) + (get(#, "hostname") != null && get(#, "hostname") != "" ? "\n  - " + get(#, "hostname") : "") + "\n  - localhost\n  - 127.0.0.1"]]
              ))
            : #
        )}

      # Compute's workers, else 127.0.0.1 ports numbered after the control plane ports.
      workers: >-
        ${len(terraform_output("compute", "controlplanes") ?? []) > 0
          ? (terraform_output("compute", "workers") ?? [])
          : ((cluster.workers.count ?? 0) == 0 ? [] : reduce(
              take(map(sortBy(toPairs(cluster.workers.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1)), int(cluster.workers.count ?? 0)),
              concat(#acc, [fromPairs(concat(
                filter(toPairs(#), get(#, 0) != "endpoint" && get(#, 0) != "node"),
                [["endpoint", "127.0.0.1:" + string(50000 + (cluster.controlplanes.count ?? 1) + len(#acc))], ["node", "127.0.0.1"]]
              ))]),
              []
            ))}

      common_config_patches: ${talos_common.common_config_patches}
      # A kubelet systemReserved patch for the gap between the Docker host and the control plane quota.
      # The gap patch comes first, so the role patches override it.
      # One expression, since another entry's deferred value is placeholder text at compose time.
      controlplane_config_patches: >-
        ${let host_cpu = terraform_output('compute', 'host_cpu') ?? 0;
          let host_memory = terraform_output('compute', 'host_memory') ?? cluster_resources_effective.controlplanes.memory;
          let quota_cpu = cluster_resources_effective.controlplanes.cpu;
          let quota_memory = cluster_resources_effective.controlplanes.memory;
          let gap = (host_cpu <= quota_cpu && host_memory <= quota_memory)
            ? ''
            : trimSuffix(string({
                machine: {
                  kubelet: {
                    extraConfig: {
                      systemReserved: {
                        cpu: (host_cpu > quota_cpu ? string(max(500, (host_cpu - quota_cpu) * 1000 + 500)) : '0') + 'm',
                        memory: (host_memory > quota_memory ? string(max(1, host_memory - quota_memory + 1)) : '0') + 'Gi'
                      }
                    }
                  }
                }
              }), '\n');
          join(filter([gap, talos_common.controlplane_config_patches], # != ''), '\n---\n')}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}
