kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: compute
  description: Launches the metal platform's declared nodes as Talos EC2 instances

when: platform == 'metal' && (compute.driver ?? '') == 'aws-ec2'

requires:
  - paths:
      - aws.region
      - compute.aws_ec2.subnet_id
      - cluster.controlplanes.instance_type
    message: The aws-ec2 compute driver needs aws.region, compute.aws_ec2.subnet_id and cluster.controlplanes.instance_type.

terraform:
  - name: compute
    path: compute/aws-ec2
    inputs:
      region: ${aws.region}
      subnet_id: ${compute.aws_ec2.subnet_id}
      talos_version: ${talos.talos_version}
      ami_id: ${compute.aws_ec2.ami_id ?? ''}
      controlplanes: ${values(cluster.controlplanes.nodes)}
      workers: "${(cluster.workers.count ?? 0) > 0 ? values(cluster.workers.nodes) : []}"
      controlplane_instance_type: ${cluster.controlplanes.instance_type}
      worker_instance_type: ${cluster.workers.instance_type ?? ''}
      root_volume_size: ${compute.aws_ec2.root_volume_size ?? 100}
      root_volume_iops: ${compute.aws_ec2.root_volume_iops ?? 3000}
      root_volume_throughput: ${compute.aws_ec2.root_volume_throughput ?? 125}
      kms_key_id: ${compute.aws_ec2.kms_key_id ?? 'alias/aws/ebs'}
      allowed_cidr: ${compute.aws_ec2.allowed_cidr ?? ''}
      tags: ${compute.aws_ec2.tags ?? {}}

  - name: cluster
    path: cluster/talos
    dependsOn:
      - compute
