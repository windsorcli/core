kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: hyperv
  description: Hyper-V compute platform infrastructure

when: "platform == 'hyperv' && cluster.driver == 'talos'"

# Requires
# =============================================================================
requires:
  - when: cluster.vip == true && (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    message: With both Hyper-V gateways on NodePort, the API is reached through the host's address, so cluster.vip does not apply.
  - when: network.dhcp == true && (cluster.controlplanes.count ?? 1) > 1
    paths:
      - cluster.endpoint
    message: Several DHCP control planes share the API address in cluster.endpoint; pick one outside the DHCP scope.
  - when: >-
      hyperv_effective.nat != true && network.dhcp != true
      && cluster_node_addresses.controlplanes_missing
    paths:
      - cluster.controlplanes.nodes.controlplane-N
    message: Set network.dhcp to true, or give each control plane an address in cluster.controlplanes.nodes under controlplane-1 to controlplane-N.
  - when: >-
      hyperv_effective.nat != true && network.dhcp != true
      && cluster_node_addresses.workers_missing
    paths:
      - cluster.workers.nodes.worker-N
    message: Set network.dhcp to true, or give each worker an address in cluster.workers.nodes under worker-1 to worker-N.

# Config
# =============================================================================
config:

  # True with both gateways on NodePort, which puts the VMs behind a NAT switch.
  - name: hyperv_effective
    value:
      nat: >-
        ${(gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' &&
        (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'}

  - name: hyperv_effective
    value:
      switch_type: "${len(hyperv.net_adapter ?? []) > 0 ? 'External' : 'Internal'}"
      net_adapter: ${hyperv.net_adapter ?? []}
      name_suffix: "${(id ?? '') != '' ? '-' + id : ''}"
      vhd_dir: "${(hyperv.base_dir ?? 'C:/hyperv') + '/vhds'}"
      images_dir: "${(hyperv.base_dir ?? 'C:/hyperv') + '/images'}"
      # nocloud schematic with hyperv-guest-agent, whose hv_kvp_daemon reports the guest IP for DHCP.
      # Recompute: curl -X POST -H 'Content-Type: application/yaml' \
      #   -d $'customization:\n  extraKernelArgs:\n    - talos.platform=nocloud\n  systemExtensions:\n    officialExtensions:\n      - siderolabs/hyperv-guest-agent\n' \
      #   https://factory.talos.dev/schematics
      talos_schematic_id: "a1f179c391c4f2dafe593c0a3d3fe95ce74e526c6e2e3120d46f230a2d24907b"
      image_destination: "${(hyperv.base_dir ?? 'C:/hyperv') + '/images/talos-' + talos.talos_version + '-metal-amd64' + ((id ?? '') != '' ? '-' + id : '') + '.iso'}"
      image_url: "${'https://factory.talos.dev/image/a1f179c391c4f2dafe593c0a3d3fe95ce74e526c6e2e3120d46f230a2d24907b/v' + talos.talos_version + '/metal-amd64.iso'}"
      dhcp: ${network.dhcp == true && hyperv_effective.nat != true}
      # The machine config is baked into the seed unless the VM uses DHCP without cluster.endpoint.
      bake_machineconfig: ${(cluster.endpoint ?? '') != '' || network.dhcp != true || hyperv_effective.nat == true}

  # Static addressing defaults to the .1 gateway and public nameservers.
  # Each cidr_block read repeats ?? '10.5.0.0/16', since the base default isn't visible to these expressions.
  - name: network
    when: (network.gateway ?? '') == '' && hyperv_effective.dhcp != true
    value:
      gateway: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"
  - name: network
    when: len(network.nameservers ?? []) == 0 && hyperv_effective.dhcp != true
    value:
      nameservers: ['1.1.1.1', '8.8.8.8']

  # flannel unless set by cluster.cni.driver.
  - name: cluster
    value:
      cni:
        driver: "${cluster.cni.driver ?? 'flannel'}"

  # In NAT mode, the VMs sit on a private NetNat subnet and ports publish on the bench IP.
  - name: hyperv_effective
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    requires:
      - paths:
          - cluster.endpoint
        message: With gateway.external.service_type and gateway.internal.service_type both NodePort, cluster.endpoint MUST point at the Hyper-V host.
    value:
      switch_type: NAT
      nat_name: "windsor-${id ?? 'hyperv'}"
      # In NAT mode, network.cidr_block is the NAT private subnet.
      nat_internal_prefix: "${network.cidr_block ?? '10.5.0.0/16'}"
      nat_prefix_length: "${split(network.cidr_block ?? '10.5.0.0/16', '/')[1]}"
      nat_host_address: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"
      # The host of cluster.endpoint.
      bench_ip: "${(cluster.endpoint ?? '') != '' ? split(split(cluster.endpoint, '://')[1], ':')[0] : ''}"

  # The VMs' gateway is the NAT host vNIC at .1.
  - name: network
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      gateway: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"

  # In NAT mode, control planes are at .10+ and workers at .20+.
  - name: hyperv_controlplanes
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      # Addresses for the CIDATA seed.
      for_config: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["hostname", "controlplane-" + string(#)],
          ["node", cidrhost(hyperv_effective.nat_internal_prefix, 9 + #)],
          ["address", cidrhost(hyperv_effective.nat_internal_prefix, 9 + #) + "/" + hyperv_effective.nat_prefix_length]
        ]))}
      # Endpoints for talosctl at bench:40000+, each forwarded to :50000 in the VM.
      # 40000 stays below the Windows dynamic port range, which Add-NetNatStaticMapping rejects.
      for_cluster: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["hostname", "controlplane-" + string(#)],
          ["node", cidrhost(hyperv_effective.nat_internal_prefix, 9 + #)],
          ["endpoint", hyperv_effective.bench_ip + ":" + string(39999 + #)]
        ]))}

  - name: hyperv_workers
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      # Addresses for the CIDATA seed.
      for_config: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count ?? 0), fromPairs([
          ["hostname", "worker-" + string(#)],
          ["node", cidrhost(hyperv_effective.nat_internal_prefix, 19 + #)],
          ["address", cidrhost(hyperv_effective.nat_internal_prefix, 19 + #) + "/" + hyperv_effective.nat_prefix_length]
        ]))}
      # Endpoints at bench:40100+, so a new worker doesn't renumber the control plane forwards.
      for_cluster: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count ?? 0), fromPairs([
          ["hostname", "worker-" + string(#)],
          ["node", cidrhost(hyperv_effective.nat_internal_prefix, 19 + #)],
          ["endpoint", hyperv_effective.bench_ip + ":" + string(40099 + #)]
        ]))}

  # In NAT mode, the node endpoints and the gateway NodePorts to publish on the bench IP.
  - name: nat_effective
    when: >-
      (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' &&
      (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      nodes: ${concat(hyperv_controlplanes.for_cluster, hyperv_workers.for_cluster)}
      # Internal gateway NodePorts, with Envoy and dns.private_domain.
      internal_ports: >-
        ${gateway.enabled == true && (gateway.driver ?? "envoy") == "envoy" &&
        (dns.private_domain ?? "") != "" ?
        [gateway_exposure.internal_http_node_port, gateway_exposure.internal_node_port] : []}
      # External gateway NodePorts, with Envoy and dns.public_domain.
      external_ports: >-
        ${gateway.enabled == true && (gateway.driver ?? "envoy") == "envoy" &&
        (dns.public_domain ?? "") != "" ?
        [gateway_exposure.external_http_node_port, gateway_exposure.external_node_port] : []}

  - name: nat_effective
    when: >-
      (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' &&
      (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      # Host forwards for 6443, the 30292 webhook in push mode, the gateway NodePorts,
      # and each node's Talos API port to :50000.
      tcp_forwards: >-
        ${fromPairs(concat(
          map(concat(
            [6443],
            (gitops.mode ?? "push") == "push" ? [30292] : [],
            nat_effective.internal_ports,
            nat_effective.external_ports
          ), [string(#), #]),
          map(nat_effective.nodes, [split(get(#, "endpoint"), ":")[1], 50000])
        ))}
      # Each Talos API forward port, mapped to its node's NAT IP.
      talos_api_targets: >-
        ${fromPairs(map(nat_effective.nodes, [split(get(#, "endpoint"), ":")[1], get(#, "node")]))}

  # One compute instance per VM, since each VM has its own CIDATA seed ISO.
  - name: hyperv_compute_instances
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      list: >-
        ${concat(
          map(hyperv_controlplanes.for_config, fromPairs([
            ["name", get(#, "hostname")],
            ["role", "controlplane"],
            ["count", 1],
            ["ipv4", get(#, "node")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.controlplanes.cpu],
            ["memory", cluster_resources_effective.controlplanes.memory],
            ["root_disk_size", cluster.controlplanes.root_disk_size ?? 30],
            ["notes", "Talos control plane node"]
          ])),
          map(hyperv_workers.for_config, fromPairs([
            ["name", get(#, "hostname")],
            ["role", "worker"],
            ["count", 1],
            ["ipv4", get(#, "node")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.workers.cpu],
            ["memory", cluster_resources_effective.workers.memory],
            ["root_disk_size", cluster.workers.root_disk_size ?? 50],
            ["notes", "Talos worker node"]
          ]))
        )}

  # In switch mode, nodes are named by pool position, with static IPs unless DHCP.
  # The name keys the VM, its VHDX and its seed.
  - name: hyperv_controlplanes
    when: "!((gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort')"
    value:
      nodes: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["name", int(cluster.controlplanes.count ?? 1) > 1 ? "controlplane-" + string(#) : "controlplane"],
          ["ipv4", hyperv_effective.dhcp ? null : cluster_node_addresses.controlplanes[# - 1].ipv4],
          ["mac_address", cluster_node_addresses.controlplanes[# - 1].mac_address]
        ]))}

  - name: hyperv_workers
    when: "!((gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort')"
    value:
      nodes: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count), fromPairs([
          ["name", int(cluster.workers.count) > 1 ? "worker-" + string(#) : "worker"],
          ["ipv4", hyperv_effective.dhcp ? null : cluster_node_addresses.workers[# - 1].ipv4],
          ["mac_address", cluster_node_addresses.workers[# - 1].mac_address]
        ]))}

  # One compute instance per switch-mode node.
  - name: hyperv_compute_instances
    when: "!((gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort')"
    value:
      list: >-
        ${concat(
          map(hyperv_controlplanes.nodes, fromPairs([
            ["name", get(#, "name")],
            ["role", "controlplane"],
            ["count", 1],
            ["ipv4", get(#, "ipv4")],
            ["mac_address", get(#, "mac_address")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.controlplanes.cpu],
            ["memory", cluster_resources_effective.controlplanes.memory],
            ["root_disk_size", cluster.controlplanes.root_disk_size ?? 30],
            ["notes", "Talos control plane node"]
          ])),
          map(hyperv_workers.nodes, fromPairs([
            ["name", get(#, "name")],
            ["role", "worker"],
            ["count", 1],
            ["ipv4", get(#, "ipv4")],
            ["mac_address", get(#, "mac_address")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.workers.cpu],
            ["memory", cluster_resources_effective.workers.memory],
            ["root_disk_size", cluster.workers.root_disk_size ?? 50],
            ["notes", "Talos worker node"]
          ]))
        )}

  # The installer image from the same schematic, so hv_kvp_daemon survives the boot from disk.
  - name: talos_common
    value:
      common_patch:
        machine:
          install:
            image: "${'factory.talos.dev/installer/' + hyperv_effective.talos_schematic_id + ':v' + talos.talos_version}"

  # In NAT mode, the bench IP is added to the Talos and apiserver certSANs.
  - name: talos_common
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      common_patch:
        machine:
          certSANs:
            - "${hyperv_effective.bench_ip}"
        cluster:
          apiServer:
            certSANs:
              - "${hyperv_effective.bench_ip}"

  # dns.private_domain falls back to dns.domain, then <id>.local, since the gateway certificate requires a SAN.
  - name: dns
    when: (dns.private_domain ?? '') == '' && (dns.domain ?? '') != ''
    value:
      private_domain: "${dns.domain}"
  - name: dns
    when: (dns.private_domain ?? '') == '' && (dns.domain ?? '') == ''
    value:
      private_domain: "${(id ?? 'windsor') + '.local'}"

  # https://<first compute control plane host>:6443, or empty until Hyper-V reports a guest IP.
  - name: cluster_endpoint_fallback
    value:
      endpoint: >-
        ${
          len(terraform_output("compute", "controlplanes") ?? []) > 0
          && terraform_output("compute", "controlplanes")[0].endpoint != null
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        }

  # Compute's nodes, else the NAT endpoints, else declared nodes unless DHCP.
  # Reduced to the node and endpoint fields.
  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? terraform_output("compute", "controlplanes")
            : (hyperv_effective.nat == true ? hyperv_controlplanes.for_cluster
              : (hyperv_effective.dhcp ? [] : filter(cluster_node_entries.controlplanes, # != null))),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${map(
          len(terraform_output("compute", "workers") ?? []) > 0
            ? terraform_output("compute", "workers")
            : (hyperv_effective.nat == true ? hyperv_workers.for_cluster
              : (hyperv_effective.dhcp ? []
                : ((cluster.workers.count ?? 0) > 0 ? filter(cluster_node_entries.workers, # != null) : []))),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

# Terraform
# =============================================================================
terraform:

  # Each VM has a dynamic VHDX, metal-amd64.iso on DVD slot 1, and its CIDATA seed on slot 2.
  # Boot is HDD-first, so a fresh disk falls through to the ISO.
  # The module generates machine secrets and per-node machineconfigs.
  # Connects to Hyper-V through the HYPERV_* environment variables.
  - name: compute
    path: compute/hyperv
    dependsOn:
      - pki
    inputs:
      network_name: "${hyperv_effective.nat == true ? '' : (hyperv.switch_name ?? '')}"
      create_network: ${hyperv_effective.nat == true || (hyperv.switch_name ?? '') == ''}
      switch_type: ${hyperv_effective.switch_type}
      net_adapter_names: ${hyperv_effective.net_adapter}
      force_management_os_migration: ${hyperv.force_management_os_migration ?? false}
      nat_name: "${hyperv_effective.switch_type == 'NAT' ? hyperv_effective.nat_name : null}"
      nat_internal_address_prefix: "${hyperv_effective.switch_type == 'NAT' ? hyperv_effective.nat_internal_prefix : null}"
      nat_host_address: "${hyperv_effective.switch_type == 'NAT' ? hyperv_effective.nat_host_address : null}"
      port_forwards: "${hyperv_effective.nat == true ? nat_effective.tcp_forwards : {}}"
      extra_port_forwards: "${hyperv_effective.nat == true ? (gateway.publish_ports ?? {}) : {}}"
      # Forwards target controlplane-1 at .10 unless overridden per port below.
      port_forward_target_ip: "${hyperv_effective.nat == true ? cidrhost(hyperv_effective.nat_internal_prefix, 10) : null}"
      port_forward_target_overrides: "${hyperv_effective.nat == true ? nat_effective.talos_api_targets : {}}"
      # 0.0.0.0 binds every host NIC.
      # Pinning an IP requires Add-NetNatExternalAddress.
      port_forward_external_ip: "0.0.0.0"
      port_forward_name_prefix: "windsor-${id ?? 'hyperv'}"
      network_cidr: ${network.cidr_block ?? '10.5.0.0/16'}
      cluster_name: talos
      # cluster.endpoint, else the first control plane: .10 in NAT mode, its static IP otherwise.
      # Empty with DHCP.
      cluster_endpoint: "${(cluster.endpoint ?? '') != '' ? cluster.endpoint : (hyperv_effective.dhcp ? '' : ('https://' + (hyperv_effective.nat == true ? cidrhost(network.cidr_block ?? '10.5.0.0/16', 10) : hyperv_controlplanes.nodes[0].ipv4) + ':6443'))}"
      controlplane_vip: ${cluster.vip == true}
      talos_version: ${talos.talos_version}
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: ${talos_common.controlplane_config_patches}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}
      controlplane_disks: ${talos_common.controlplane_disks}
      worker_disks: ${talos_common.worker_disks}
      destination_dir: "${hyperv_effective.images_dir}"
      network_gateway: ${network.gateway}
      network_nameservers: ${network.nameservers}
      network_dhcp: ${hyperv_effective.dhcp}
      vhd_dir: "${hyperv_effective.vhd_dir}"
      name_suffix: "${hyperv_effective.name_suffix}"
      images:
        talos:
          destination_path: "${hyperv_effective.image_destination}"
          url: ${hyperv_effective.image_url}
          runner_download: true
          keep_on_destroy: true
      instances: ${hyperv_compute_instances.list}

  - name: cluster
    path: cluster/talos
    dependsOn:
      - compute
    parallelism: 1
    inputs:
      cluster_endpoint: "${(cluster.endpoint ?? '') != '' ? cluster.endpoint : cluster_endpoint_fallback.endpoint}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      upgrade_nodes: ${len(talos_common.extensions ?? []) == 0}
      # The bench IP endpoints in NAT mode. Otherwise compute's nodes, else declared nodes unless DHCP.
      controlplanes: "${hyperv_effective.nat == true ? hyperv_controlplanes.for_cluster : (len(terraform_output(\"compute\", \"controlplanes\") ?? []) > 0 ? terraform_output(\"compute\", \"controlplanes\") : (hyperv_effective.dhcp ? [] : filter(cluster_node_entries.controlplanes, # != null)))}"
      workers: "${hyperv_effective.nat == true ? hyperv_workers.for_cluster : (len(terraform_output(\"compute\", \"workers\") ?? []) > 0 ? terraform_output(\"compute\", \"workers\") : (hyperv_effective.dhcp ? [] : ((cluster.workers.count ?? 0) > 0 ? filter(cluster_node_entries.workers, # != null) : [])))}"
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: ${talos_common.controlplane_config_patches}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}
      machine_secrets: ${terraform_output("compute", "machine_secrets")}
      # True when compute baked the machine config into the seed.
      skip_machine_config_apply: ${hyperv_effective.bake_machineconfig}
      client_configuration: ${terraform_output("compute", "client_configuration")}

  - name: gitops
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      # Half the smaller of control plane CPU and memory, clamped to 4-10.
      concurrency: ${max(4, min(floor(cluster_resources_effective.controlplanes.cpu / 2), floor(cluster_resources_effective.controlplanes.memory / 2), 10))}
    destroy: false
