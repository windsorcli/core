kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: hyperv
  description: Hyper-V compute platform infrastructure

# Talos-only. Connection details come from HYPERV_* env vars; no workstation overlay.
when: "platform == 'hyperv' && cluster.driver == 'talos'"

requires:
  - when: cluster.vip == true && (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    paths:
      - hyperv_effective.unsupported
    message: With both Hyper-V gateways on NodePort, the API is reached through the host's address, so cluster.vip does not apply.
  - when: network.dhcp == true && (cluster.controlplanes.count ?? 1) > 1
    paths:
      - cluster.endpoint
    message: Several DHCP control planes share the API address in cluster.endpoint; pick one outside the DHCP scope.

# =============================================================================
# Config — Hyper-V-specific Talos values
# =============================================================================
config:

  # nat: both gateways are NodePort, which puts the VMs behind an ICS network.
  - name: hyperv_effective
    value:
      nat: >-
        ${(gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' &&
        (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'}

  # nocloud CIDATA schematic. hyperv-guest-agent runs hv_kvp_daemon so the guest
  # reports its IP through integration services; DHCP discovery needs it.
  # Recompute: curl -X POST -H 'Content-Type: application/yaml' \
  #   -d $'customization:\n  extraKernelArgs:\n    - talos.platform=nocloud\n  systemExtensions:\n    officialExtensions:\n      - siderolabs/hyperv-guest-agent\n' \
  #   https://factory.talos.dev/schematics
  - name: hyperv_effective
    value:
      switch_type: "${len(hyperv.net_adapter ?? []) > 0 ? 'External' : 'Internal'}"
      net_adapter: ${hyperv.net_adapter ?? []}
      name_suffix: "${(id ?? '') != '' ? '-' + id : ''}"
      vhd_dir: "${(hyperv.base_dir ?? 'C:/hyperv') + '/vhds'}"
      images_dir: "${(hyperv.base_dir ?? 'C:/hyperv') + '/images'}"
      talos_schematic_id: "a1f179c391c4f2dafe593c0a3d3fe95ce74e526c6e2e3120d46f230a2d24907b"
      image_destination: "${(hyperv.base_dir ?? 'C:/hyperv') + '/images/talos-' + talos.talos_version + '-metal-amd64' + ((id ?? '') != '' ? '-' + id : '') + '.iso'}"
      image_url: "${'https://factory.talos.dev/image/a1f179c391c4f2dafe593c0a3d3fe95ce74e526c6e2e3120d46f230a2d24907b/v' + talos.talos_version + '/metal-amd64.iso'}"
      dhcp: ${network.dhcp == true || hyperv_effective.nat == true}
      # True when the compute step signs machineconfigs into the CIDATA seed.
      bake_machineconfig: ${(cluster.endpoint ?? '') != '' || network.dhcp != true || hyperv_effective.nat == true}

  # Network gateway and nameserver defaults for the CIDATA seed. Written only
  # when unset; see platform-base.yaml "Network defaults" for the pattern.
  #
  # Every network.cidr_block read below repeats `?? '10.5.0.0/16'`: neither the
  # schema default nor platform-base's when:-gated default reaches these
  # expressions yet, so an unguarded read fails composition with
  # "cidrhost() ... got <nil>" whenever cidr_block is unset.
  - name: network
    when: (network.gateway ?? '') == '' && hyperv_effective.dhcp != true
    value:
      gateway: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"
  - name: network
    when: len(network.nameservers ?? []) == 0 && hyperv_effective.dhcp != true
    value:
      nameservers: ['1.1.1.1', '8.8.8.8']

  # Default the CNI to Talos's built-in flannel (platform-base would default
  # talos to cilium). Operators can still opt into cilium via cluster.cni.driver.
  - name: cluster
    value:
      cni:
        driver: "${cluster.cni.driver ?? 'flannel'}"

  # NodePort mode: VMs sit on an ICS network behind host port forwards.
  - name: hyperv_effective
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    requires:
      - paths:
          - cluster.endpoint
        message: NodePort mode derives the host's bench IP from this URL.
    value:
      switch_type: ICS
      bench_ip: "${(cluster.endpoint ?? '') != '' ? split(split(cluster.endpoint, '://')[1], ':')[0] : ''}"

  # Talos API forwards: cp-N → bench:(40000+N-1), worker-N → bench:(40100+N-1), both → :50000 in-VM.
  - name: hyperv_controlplanes
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      nodes: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["hostname", "controlplane-" + string(#)],
          ["endpoint", hyperv_effective.bench_ip + ":" + string(39999 + #)]
        ]))}

  - name: hyperv_workers
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      nodes: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count ?? 0), fromPairs([
          ["hostname", "worker-" + string(#)],
          ["endpoint", hyperv_effective.bench_ip + ":" + string(40099 + #)]
        ]))}

  # Talos targets for NodePort: each node's bench forward, and the guest address compute reports.
  - name: hyperv_cluster_nodes
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      controlplanes: >-
        ${map(hyperv_controlplanes.nodes, fromPairs([
          ["hostname", get(#, "hostname")],
          ["endpoint", get(#, "endpoint")],
          ["node", get(fromPairs(map(terraform_output("compute", "controlplanes") ?? [], [get(#, "hostname"), get(#, "node")])), get(#, "hostname")) ?? ""]
        ]))}
      workers: >-
        ${map(hyperv_workers.nodes, fromPairs([
          ["hostname", get(#, "hostname")],
          ["endpoint", get(#, "endpoint")],
          ["node", get(fromPairs(map(terraform_output("compute", "workers") ?? [], [get(#, "hostname"), get(#, "node")])), get(#, "hostname")) ?? ""]
        ]))}

  # Inputs to the NAT forward maps: the VMs, and the in-cluster ports published as-is.
  - name: nat_effective
    when: >-
      (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' &&
      (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      nodes: ${concat(hyperv_controlplanes.nodes, hyperv_workers.nodes)}
      # Each envoy gateway's HTTP and HTTPS node ports, when its domain is set.
      internal_ports: >-
        ${gateway.enabled == true && (gateway.driver ?? "envoy") == "envoy" &&
        (dns.private_domain ?? "") != "" ?
        [gateway_exposure.internal_http_node_port, gateway_exposure.internal_node_port] : []}
      external_ports: >-
        ${gateway.enabled == true && (gateway.driver ?? "envoy") == "envoy" &&
        (dns.public_domain ?? "") != "" ?
        [gateway_exposure.external_http_node_port, gateway_exposure.external_node_port] : []}

  # Bench listen port to in-VM port. Each node's Talos API forward targets that node by name.
  - name: nat_effective
    when: >-
      (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' &&
      (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      tcp_forwards: >-
        ${fromPairs(concat(
          map(concat(
            [6443],
            (gitops.mode ?? "push") == "push" ? [30292] : [],
            nat_effective.internal_ports,
            nat_effective.external_ports
          ), [string(#), #]),
          map(nat_effective.nodes, [split(get(#, "endpoint"), ":")[1], 50000])
        ))}
      talos_api_targets: >-
        ${fromPairs(map(nat_effective.nodes, [split(get(#, "endpoint"), ":")[1], get(#, "hostname")]))}

  # Flat compute instance list, one DHCP VM per entry.
  - name: hyperv_compute_instances
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      list: >-
        ${concat(
          map(hyperv_controlplanes.nodes, fromPairs([
            ["name", get(#, "hostname")],
            ["role", "controlplane"],
            ["count", 1],
            ["ipv4", null],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.controlplanes.cpu],
            ["memory", cluster_resources_effective.controlplanes.memory],
            ["root_disk_size", cluster.controlplanes.root_disk_size ?? 30],
            ["notes", "Talos control plane node"]
          ])),
          map(hyperv_workers.nodes, fromPairs([
            ["name", get(#, "hostname")],
            ["role", "worker"],
            ["count", 1],
            ["ipv4", null],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.workers.cpu],
            ["memory", cluster_resources_effective.workers.memory],
            ["root_disk_size", cluster.workers.root_disk_size ?? 50],
            ["notes", "Talos worker node"]
          ]))
        )}

  # Guest IPv4 per LAN control plane: cluster.controlplanes.nodes, else cidrhost
  # offset 10. The name comes from the pool position, never nodes[].hostname:
  # it keys the VM, its VHDX and its seed, which renaming would replace.
  - name: hyperv_controlplanes
    when: "!((gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort')"
    value:
      nodes: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["name", int(cluster.controlplanes.count ?? 1) > 1 ? "controlplane-" + string(#) : "controlplane"],
          ["ipv4", hyperv_effective.dhcp ? null
            : (get(cluster.controlplanes.nodes ?? {}, "controlplane-" + string(#)) != null
            ? (get(cluster.controlplanes.nodes ?? {}, "controlplane-" + string(#)).node
               ?? split(get(cluster.controlplanes.nodes ?? {}, "controlplane-" + string(#)).endpoint, ":")[0])
            : cidrhost(network.cidr_block ?? '10.5.0.0/16', 9 + #))]
        ]))}

  # Guest IPv4 per LAN worker: cluster.workers.nodes, else cidrhost offset 20.
  # Named by pool position, like the control planes.
  - name: hyperv_workers
    when: "!((gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort')"
    value:
      nodes: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count), fromPairs([
          ["name", int(cluster.workers.count) > 1 ? "worker-" + string(#) : "worker"],
          ["ipv4", hyperv_effective.dhcp ? null
            : (get(cluster.workers.nodes ?? {}, "worker-" + string(#)) != null
            ? (get(cluster.workers.nodes ?? {}, "worker-" + string(#)).node
               ?? split(get(cluster.workers.nodes ?? {}, "worker-" + string(#)).endpoint, ":")[0])
            : cidrhost(network.cidr_block ?? '10.5.0.0/16', 19 + #))]
        ]))}

  - name: hyperv_compute_instances
    when: "!((gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort')"
    value:
      list: >-
        ${concat(
          map(hyperv_controlplanes.nodes, fromPairs([
            ["name", get(#, "name")],
            ["role", "controlplane"],
            ["count", 1],
            ["ipv4", get(#, "ipv4")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.controlplanes.cpu],
            ["memory", cluster_resources_effective.controlplanes.memory],
            ["root_disk_size", cluster.controlplanes.root_disk_size ?? 30],
            ["notes", "Talos control plane node"]
          ])),
          map(hyperv_workers.nodes, fromPairs([
            ["name", get(#, "name")],
            ["role", "worker"],
            ["count", 1],
            ["ipv4", get(#, "ipv4")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.workers.cpu],
            ["memory", cluster_resources_effective.workers.memory],
            ["root_disk_size", cluster.workers.root_disk_size ?? 50],
            ["notes", "Talos worker node"]
          ]))
        )}

  # Talos installs from the stock installer unless told otherwise, dropping the
  # schematic's hv_kvp_daemon once the node boots from disk.
  - name: talos_common
    value:
      common_patch:
        machine:
          install:
            image: "${'factory.talos.dev/installer/' + hyperv_effective.talos_schematic_id + ':v' + talos.talos_version}"

  # NodePort certSANs: workstations reach both APIs at the bench IP, which Talos does not add on its own.
  - name: talos_common
    when: (gateway.external.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort' && (gateway.internal.service_type ?? gateway.service_type ?? 'LoadBalancer') == 'NodePort'
    value:
      common_patch:
        machine:
          certSANs:
            - "${hyperv_effective.bench_ip}"
        cluster:
          apiServer:
            certSANs:
              - "${hyperv_effective.bench_ip}"

  # dns.private_domain default — the gateway cert needs a non-empty SAN or
  # cert-manager rejects it. Ordered fallback written only when unset (guards
  # mutually exclusive): dns.domain when set, else '<id>.local'. Empty-string
  # check because platform-base may have already resolved it to ''.
  - name: dns
    when: (dns.private_domain ?? '') == '' && (dns.domain ?? '') != ''
    value:
      private_domain: "${dns.domain}"
  - name: dns
    when: (dns.private_domain ?? '') == '' && (dns.domain ?? '') == ''
    value:
      private_domain: "${(id ?? 'windsor') + '.local'}"

  # Derive the endpoint from compute's controlplane output once Hyper-V surfaces
  # a guest IP; empty until then (callers fall back to explicit cluster.endpoint).
  - name: cluster_endpoint_fallback
    value:
      endpoint: >-
        ${
          len(terraform_output("compute", "controlplanes") ?? []) > 0
          && terraform_output("compute", "controlplanes")[0].endpoint != null
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        }

  - name: talos_node_targets
    value:
      controlplanes: >-
        ${hyperv_effective.nat == true ? hyperv_cluster_nodes.controlplanes : map(
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? terraform_output("compute", "controlplanes")
            : (hyperv_effective.dhcp ? [] : values(cluster.controlplanes.nodes ?? {})),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${hyperv_effective.nat == true ? hyperv_cluster_nodes.workers : map(
          len(terraform_output("compute", "workers") ?? []) > 0
            ? terraform_output("compute", "workers")
            : (hyperv_effective.dhcp ? []
              : ((cluster.workers.count ?? 0) > 0 ? values(cluster.workers.nodes ?? {}) : [])),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

# =============================================================================
# Terraform — compute → cluster → gitops
# =============================================================================
# No workstation overlays on Hyper-V, so this facet owns the full chain.
terraform:

  # compute — Talos VMs on a Hyper-V virtual switch. Each VM gets a fresh
  # dynamic VHDX, the metal-amd64.iso on DVD slot 1, and its CIDATA seed on
  # slot 2. Boot is HDD-first: UEFI falls through to the ISO on a fresh disk,
  # then boots from disk once installed. CIDATA stays attached (NoCloud reader
  # is idempotent). Machine secrets and per-node machineconfigs are generated
  # inside this module; it exports machine_secrets and client_configuration
  # for the cluster step.
  - name: compute
    path: compute/hyperv
    dependsOn:
      - pki
    inputs:
      network_name: "${hyperv_effective.nat == true ? '' : (hyperv.switch_name ?? '')}"
      create_network: ${hyperv_effective.nat == true || (hyperv.switch_name ?? '') == ''}
      switch_type: ${hyperv_effective.switch_type}
      net_adapter_names: ${hyperv_effective.net_adapter}
      force_management_os_migration: ${hyperv.force_management_os_migration ?? false}
      # gateway.publish_ports layers operator-pinned ports onto the baseline forwards.
      port_forwards: "${hyperv_effective.nat == true ? nat_effective.tcp_forwards : {}}"
      extra_port_forwards: "${hyperv_effective.nat == true ? (gateway.publish_ports ?? {}) : {}}"
      port_forward_target: "${hyperv_effective.nat == true ? 'controlplane-1' : null}"
      port_forward_target_overrides: "${hyperv_effective.nat == true ? nat_effective.talos_api_targets : {}}"
      port_forward_name_prefix: "windsor-${id ?? 'hyperv'}"
      network_cidr: ${network.cidr_block ?? '10.5.0.0/16'}
      cluster_name: talos
      cluster_endpoint: "${(cluster.endpoint ?? '') != '' ? cluster.endpoint : (hyperv_effective.dhcp ? '' : ('https://' + hyperv_controlplanes.nodes[0].ipv4 + ':6443'))}"
      controlplane_vip: ${cluster.vip == true}
      talos_version: ${talos.talos_version}
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: "${talos_common.oidc_ca_file_patch ?? ''}"
      worker_config_patches: "${talos_common.worker_config_patches ?? ''}"
      destination_dir: "${hyperv_effective.images_dir}"
      network_gateway: ${network.gateway}
      network_nameservers: ${network.nameservers}
      network_dhcp: ${hyperv_effective.dhcp}
      vhd_dir: "${hyperv_effective.vhd_dir}"
      name_suffix: "${hyperv_effective.name_suffix}"
      images:
        talos:
          destination_path: "${hyperv_effective.image_destination}"
          url: ${hyperv_effective.image_url}
          runner_download: true
          keep_on_destroy: true
      instances: ${hyperv_compute_instances.list}

  - name: cluster
    path: cluster/talos
    dependsOn:
      - compute
    parallelism: 1
    inputs:
      # Prefer the schema-declared cluster.endpoint; the compute-derived
      # fallback carries the leased IP once the guest reports it.
      cluster_endpoint: "${(cluster.endpoint ?? '') != '' ? cluster.endpoint : cluster_endpoint_fallback.endpoint}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      # Node targets: hyperv_cluster_nodes for NodePort, else compute output or declared nodes.
      controlplanes: "${hyperv_effective.nat == true ? hyperv_cluster_nodes.controlplanes : (len(terraform_output(\"compute\", \"controlplanes\") ?? []) > 0 ? terraform_output(\"compute\", \"controlplanes\") : (hyperv_effective.dhcp ? [] : values(cluster.controlplanes.nodes ?? {})))}"
      workers: "${hyperv_effective.nat == true ? hyperv_cluster_nodes.workers : (len(terraform_output(\"compute\", \"workers\") ?? []) > 0 ? terraform_output(\"compute\", \"workers\") : (hyperv_effective.dhcp ? [] : ((cluster.workers.count ?? 0) > 0 ? values(cluster.workers.nodes ?? {}) : [])))}"
      controlplane_disks: ${talos_common.controlplane_disks}
      worker_disks: ${talos_common.worker_disks}
      common_config_patches: ${talos_common.common_config_patches}
      worker_config_patches: "${talos_common.worker_config_patches ?? ''}"
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}
      # Shared identity from compute. skip_machine_config_apply follows
      # bake_machineconfig rather than machine_secrets presence, since DHCP
      # guests get an identity but no baked config until cluster/talos applies
      # one. Bootstrap, kubeconfig download, and health-check still run here.
      machine_secrets: ${terraform_output("compute", "machine_secrets")}
      skip_machine_config_apply: ${hyperv_effective.bake_machineconfig}
      client_configuration: ${terraform_output("compute", "client_configuration")}

  - name: gitops
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      concurrency: ${max(4, min(floor(cluster_resources_effective.controlplanes.cpu / 2), floor(cluster_resources_effective.controlplanes.memory / 2), 10))}
    destroy: false
