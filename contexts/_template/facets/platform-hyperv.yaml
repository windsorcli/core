kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: hyperv
  description: Hyper-V compute platform infrastructure

# Talos-only. Connection details come from HYPERV_* env vars; no workstation overlay.
when: "platform == 'hyperv' && cluster.driver == 'talos'"

# Remote state lives in the local Talos cluster (Kubernetes backend).
backend: cluster

requires:
  # Cilium's kube-proxy replacement needs the API address at render time, which
  # a DHCP lease cannot supply.
  - when: network.dhcp == true && gateway.service_type != 'NodePort' && (cluster.cni.driver ?? 'flannel') == 'cilium'
    paths:
      - cluster.endpoint
    message: Cilium on DHCP guests needs a fixed API endpoint for k8sServiceHost.

# =============================================================================
# Config — Hyper-V-specific Talos values
# =============================================================================
config:

  # nocloud CIDATA schematic. hyperv-guest-agent runs hv_kvp_daemon so the guest
  # reports its IP through integration services; DHCP discovery needs it.
  # Recompute: curl -X POST -H 'Content-Type: application/yaml' \
  #   -d $'customization:\n  extraKernelArgs:\n    - talos.platform=nocloud\n  systemExtensions:\n    officialExtensions:\n      - siderolabs/hyperv-guest-agent\n' \
  #   https://factory.talos.dev/schematics
  - name: hyperv_effective
    value:
      switch_type: "${len(hyperv.net_adapter ?? []) > 0 ? 'External' : 'Internal'}"
      net_adapter: ${hyperv.net_adapter ?? []}
      name_suffix: "${(id ?? '') != '' ? '-' + id : ''}"
      vhd_dir: "${(hyperv.base_dir ?? 'C:/hyperv') + '/vhds'}"
      images_dir: "${(hyperv.base_dir ?? 'C:/hyperv') + '/images'}"
      talos_schematic_id: "a1f179c391c4f2dafe593c0a3d3fe95ce74e526c6e2e3120d46f230a2d24907b"
      image_destination: "${(hyperv.base_dir ?? 'C:/hyperv') + '/images/talos-' + talos.talos_version + '-metal-amd64' + ((id ?? '') != '' ? '-' + id : '') + '.iso'}"
      image_url: "${'https://factory.talos.dev/image/a1f179c391c4f2dafe593c0a3d3fe95ce74e526c6e2e3120d46f230a2d24907b/v' + talos.talos_version + '/metal-amd64.iso'}"
      dhcp: ${network.dhcp == true && gateway.service_type != 'NodePort'}
      # True when cluster-config signs machineconfigs into the CIDATA seed.
      bake_machineconfig: ${(cluster.endpoint ?? '') != '' || network.dhcp != true || gateway.service_type == 'NodePort'}

  # Network gateway and nameserver defaults for the CIDATA seed. Written only
  # when unset; see platform-base.yaml "Network defaults" for the pattern.
  #
  # Every network.cidr_block read below repeats `?? '10.5.0.0/16'`: neither the
  # schema default nor platform-base's when:-gated default reaches these
  # expressions yet, so an unguarded read fails composition with
  # "cidrhost() ... got <nil>" whenever cidr_block is unset.
  - name: network
    when: (network.gateway ?? '') == '' && hyperv_effective.dhcp != true
    value:
      gateway: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"
  - name: network
    when: len(network.nameservers ?? []) == 0 && hyperv_effective.dhcp != true
    value:
      nameservers: ['1.1.1.1', '8.8.8.8']

  # Default the CNI to Talos's built-in flannel (platform-base would default
  # talos to cilium). Operators can still opt into cilium via cluster.cni.driver.
  - name: cluster
    value:
      cni:
        driver: "${cluster.cni.driver ?? 'flannel'}"

  # NodePort mode: move VMs onto a private NetNat subnet and publish cluster
  # ports on the bench LAN IP (kernel forwards into the VM). CIDR/gateway are
  # overridden to the NAT-internal subnet so per-node static IPs line up.
  # bench_ip derives from cluster.endpoint, required in NodePort mode.
  - name: hyperv_effective
    when: gateway.service_type == 'NodePort'
    requires:
      - paths:
          - cluster.endpoint
        message: NodePort mode derives the host's bench IP from this URL.
    value:
      switch_type: NAT
      nat_name: "windsor-${id ?? 'hyperv'}"
      # Derived from network.cidr_block, interpreted here as the NAT private
      # subnet. Override via values.yaml if it conflicts with another bench subnet.
      nat_internal_prefix: "${network.cidr_block ?? '10.5.0.0/16'}"
      nat_prefix_length: "${split(network.cidr_block ?? '10.5.0.0/16', '/')[1]}"
      nat_host_address: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"
      bench_ip: "${(cluster.endpoint ?? '') != '' ? split(split(cluster.endpoint, '://')[1], ':')[0] : ''}"

  # Point each node's default route at the NAT host vNIC (the only address
  # reachable from inside the NAT subnet), overriding any bench-LAN gateway.
  - name: network
    when: gateway.service_type == 'NodePort'
    value:
      gateway: "${cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"

  # Per-VM derivation lists (NodePort): each node is individually addressable
  # via a distinct bench-side port forward, all derived from count.
  # NAT-subnet IPs: controlplane-N → .(10+N-1), worker-N → .(20+N-1).
  # Talos API forwards: cp-N → bench:(40000+N-1), worker-N → bench:(40100+N-1),
  # both → :50000 in-VM. Base 40000 stays below Windows' 49152 dynamic-port
  # floor (Add-NetNatStaticMapping rejects above it); disjoint 100-port ranges
  # keep growing one role from renumbering the other's saved NAT mappings.
  # Each entry has two forms: for_config {hostname,node,address} bakes the
  # static IP into CIDATA seeds; for_cluster {hostname,node,endpoint} gives
  # talosctl a bench-side host:port to reach each node.
  - name: hyperv_controlplanes
    when: gateway.service_type == 'NodePort'
    value:
      for_config: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["hostname", "controlplane-" + string(#)],
          ["node", cidrhost(hyperv_effective.nat_internal_prefix, 9 + #)],
          ["address", cidrhost(hyperv_effective.nat_internal_prefix, 9 + #) + "/" + hyperv_effective.nat_prefix_length]
        ]))}
      for_cluster: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["hostname", "controlplane-" + string(#)],
          ["node", cidrhost(hyperv_effective.nat_internal_prefix, 9 + #)],
          ["endpoint", hyperv_effective.bench_ip + ":" + string(39999 + #)]
        ]))}

  - name: hyperv_workers
    when: gateway.service_type == 'NodePort'
    value:
      for_config: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count ?? 0), fromPairs([
          ["hostname", "worker-" + string(#)],
          ["node", cidrhost(hyperv_effective.nat_internal_prefix, 19 + #)],
          ["address", cidrhost(hyperv_effective.nat_internal_prefix, 19 + #) + "/" + hyperv_effective.nat_prefix_length]
        ]))}
      for_cluster: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count ?? 0), fromPairs([
          ["hostname", "worker-" + string(#)],
          ["node", cidrhost(hyperv_effective.nat_internal_prefix, 19 + #)],
          ["endpoint", hyperv_effective.bench_ip + ":" + string(40099 + #)]
        ]))}

  # Forward map: bench listen port → in-VM port, with per-port target_ip
  # overrides so each Talos API forward lands at its node. Gateway / k8s-API
  # forwards stay single-target (cp-1); apiserver replication handles the rest.
  # tcp_forwards: 6443→6443; 30053→30053 (only when private/dev DNS active);
  # 30292→30292 (only when gitops.mode=push); 40000+i / 40100+i → 50000 per node.
  # 30053 / 30292 gate on the same signals as the matching option-gateway
  # nodeport patches, keeping forward and Service NodePort in sync.
  - name: nat_effective
    when: gateway.service_type == 'NodePort'
    value:
      tcp_forwards: >-
        ${fromPairs(concat(
          [["6443", 6443]],
          (dns.private.enabled ?? (dev == true)) == true ? [["30053", 30053]] : [],
          (gitops.mode ?? "push") == "push" ? [["30292", 30292]] : [],
          map(
            concat(hyperv_controlplanes.for_cluster, hyperv_workers.for_cluster),
            [split(get(#, "endpoint"), ":")[1], 50000]
          )
        ))}
      udp_forwards: >-
        ${(dns.private.enabled ?? (dev == true)) == true ? {"30053": 30053} : {}}
      talos_api_targets: >-
        ${fromPairs(map(
          concat(hyperv_controlplanes.for_cluster, hyperv_workers.for_cluster),
          [split(get(#, "endpoint"), ":")[1], get(#, "node")]
        ))}

  # Flat compute instance list, one entry per VM (count=1). Needed because
  # cidata_iso_path is per-VM, so the module's count expansion (shared ISO)
  # can't be used. cpu/memory/root_disk_size still come from cluster.* pools.
  - name: hyperv_compute_instances
    when: gateway.service_type == 'NodePort'
    value:
      list: >-
        ${concat(
          map(hyperv_controlplanes.for_config, fromPairs([
            ["name", get(#, "hostname")],
            ["role", "controlplane"],
            ["count", 1],
            ["ipv4", get(#, "node")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["cidata_iso_path", hyperv_effective.images_dir + "/" + get(#, "hostname") + hyperv_effective.name_suffix + "-cidata.iso"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.controlplanes.cpu],
            ["memory", cluster_resources_effective.controlplanes.memory],
            ["root_disk_size", cluster.controlplanes.root_disk_size ?? 30],
            ["notes", "Talos control plane node"]
          ])),
          map(hyperv_workers.for_config, fromPairs([
            ["name", get(#, "hostname")],
            ["role", "worker"],
            ["count", 1],
            ["ipv4", get(#, "node")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["cidata_iso_path", hyperv_effective.images_dir + "/" + get(#, "hostname") + hyperv_effective.name_suffix + "-cidata.iso"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.workers.cpu],
            ["memory", cluster_resources_effective.workers.memory],
            ["root_disk_size", cluster.workers.root_disk_size ?? 50],
            ["notes", "Talos worker node"]
          ]))
        )}

  # Guest IPv4 per LAN control plane: cluster.controlplanes.nodes, else cidrhost
  # offset 10. The name comes from the pool position, never nodes[].hostname:
  # it keys the VM, its VHDX and its seed, which renaming would replace.
  - name: hyperv_controlplanes
    when: gateway.service_type != 'NodePort'
    value:
      nodes: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["name", int(cluster.controlplanes.count ?? 1) > 1 ? "controlplane-" + string(#) : "controlplane"],
          ["ipv4", hyperv_effective.dhcp ? null
            : (get(cluster.controlplanes.nodes ?? {}, "controlplane-" + string(#)) != null
            ? (get(cluster.controlplanes.nodes ?? {}, "controlplane-" + string(#)).node
               ?? split(get(cluster.controlplanes.nodes ?? {}, "controlplane-" + string(#)).endpoint, ":")[0])
            : cidrhost(network.cidr_block ?? '10.5.0.0/16', 9 + #))]
        ]))}

  # Guest IPv4 per LAN worker: cluster.workers.nodes, else cidrhost offset 20.
  # Named by pool position, like the control planes.
  - name: hyperv_workers
    when: gateway.service_type != 'NodePort'
    value:
      nodes: >-
        ${(cluster.workers.count ?? 0) == 0 ? [] : map(1..int(cluster.workers.count), fromPairs([
          ["name", int(cluster.workers.count) > 1 ? "worker-" + string(#) : "worker"],
          ["ipv4", hyperv_effective.dhcp ? null
            : (get(cluster.workers.nodes ?? {}, "worker-" + string(#)) != null
            ? (get(cluster.workers.nodes ?? {}, "worker-" + string(#)).node
               ?? split(get(cluster.workers.nodes ?? {}, "worker-" + string(#)).endpoint, ":")[0])
            : cidrhost(network.cidr_block ?? '10.5.0.0/16', 19 + #))]
        ]))}

  - name: hyperv_compute_instances
    when: gateway.service_type != 'NodePort'
    value:
      list: >-
        ${concat(
          map(hyperv_controlplanes.nodes, fromPairs([
            ["name", get(#, "name")],
            ["role", "controlplane"],
            ["count", 1],
            ["ipv4", get(#, "ipv4")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["cidata_iso_path", hyperv_effective.images_dir + "/" + get(#, "name") + hyperv_effective.name_suffix + "-cidata.iso"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.controlplanes.cpu],
            ["memory", cluster_resources_effective.controlplanes.memory],
            ["root_disk_size", cluster.controlplanes.root_disk_size ?? 30],
            ["notes", "Talos control plane node"]
          ])),
          map(hyperv_workers.nodes, fromPairs([
            ["name", get(#, "name")],
            ["role", "worker"],
            ["count", 1],
            ["ipv4", get(#, "ipv4")],
            ["image", ""],
            ["dvd_iso_path", "talos"],
            ["cidata_iso_path", hyperv_effective.images_dir + "/" + get(#, "name") + hyperv_effective.name_suffix + "-cidata.iso"],
            ["boot_from_dvd", false],
            ["generation", 2],
            ["secure_boot", false],
            ["cpu", cluster_resources_effective.workers.cpu],
            ["memory", cluster_resources_effective.workers.memory],
            ["root_disk_size", cluster.workers.root_disk_size ?? 50],
            ["notes", "Talos worker node"]
          ]))
        )}

  # First control-plane IPv4 for Cilium kube-proxy-replacement.
  - name: talos_common
    value:
      k8s_service_host: >-
        ${gateway.service_type == 'NodePort'
          ? cidrhost(network.cidr_block ?? '10.5.0.0/16', 10)
          : ((cluster.endpoint ?? '') != ''
            ? split(split(cluster.endpoint, '://')[1], ':')[0]
            : (len(terraform_output("compute", "controlplanes") ?? []) > 0
              ? split(terraform_output("compute", "controlplanes")[0].endpoint, ':')[0]
              : (hyperv_effective.dhcp ? '' : hyperv_controlplanes.nodes[0].ipv4)))}

  # Talos installs from the stock installer unless told otherwise, dropping the
  # schematic's hv_kvp_daemon once the node boots from disk.
  - name: talos_common
    value:
      common_patch:
        machine:
          install:
            image: "${'factory.talos.dev/installer/' + hyperv_effective.talos_schematic_id + ':v' + talos.talos_version}"

  # NodePort certSANs: workstations reach both APIs at the bench external IP,
  # but Talos auto-derives SANs only from NAT-internal addresses. Add the bench
  # IP to both certSANs lists so talosctl + kubectl pass TLS verification.
  - name: talos_common
    when: gateway.service_type == 'NodePort'
    value:
      common_patch:
        machine:
          certSANs:
            - "${hyperv_effective.bench_ip}"
        cluster:
          apiServer:
            certSANs:
              - "${hyperv_effective.bench_ip}"

  # dns.private_domain default — the gateway cert needs a non-empty SAN or
  # cert-manager rejects it. Ordered fallback written only when unset (guards
  # mutually exclusive): dns.domain when set, else '<id>.local'. Empty-string
  # check because platform-base may have already resolved it to ''.
  - name: dns
    when: (dns.private_domain ?? '') == '' && (dns.domain ?? '') != ''
    value:
      private_domain: "${dns.domain}"
  - name: dns
    when: (dns.private_domain ?? '') == '' && (dns.domain ?? '') == ''
    value:
      private_domain: "${(id ?? 'windsor') + '.local'}"

  # Derive the endpoint from compute's controlplane output once Hyper-V surfaces
  # a guest IP; empty until then (callers fall back to explicit cluster.endpoint).
  - name: cluster_endpoint_fallback
    value:
      endpoint: >-
        ${
          len(terraform_output("compute", "controlplanes") ?? []) > 0
          && terraform_output("compute", "controlplanes")[0].endpoint != null
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        }

  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? terraform_output("compute", "controlplanes")
            : (gateway.service_type == 'NodePort' ? hyperv_controlplanes.for_cluster
              : (hyperv_effective.dhcp ? [] : values(cluster.controlplanes.nodes ?? {}))),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${map(
          len(terraform_output("compute", "workers") ?? []) > 0
            ? terraform_output("compute", "workers")
            : (gateway.service_type == 'NodePort' ? hyperv_workers.for_cluster
              : (hyperv_effective.dhcp ? []
                : ((cluster.workers.count ?? 0) > 0 ? values(cluster.workers.nodes ?? {}) : []))),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

# =============================================================================
# Terraform — compute → cluster → gitops
# =============================================================================
# No workstation overlays on Hyper-V, so this facet owns the full chain.
terraform:

  # cluster-config — generates the Talos cluster identity, signs per-node
  # machineconfigs (with a static-IP interface patch), and wraps each into a
  # CIDATA seed ISO. Must complete before compute so VMs mount their seed at
  # boot. Identity is exported to the cluster step, which skips config apply
  # whenever CIDATA already carries the machineconfig.
  - name: cluster-config
    path: cluster/talos/config
    dependsOn:
      - "${pki.enabled == true ? 'pki' : ''}"
    inputs:
      talos_version: ${talos.talos_version}
      cluster_name: talos
      cluster_endpoint: "${(cluster.endpoint ?? '') != '' ? cluster.endpoint : (hyperv_effective.dhcp ? '' : ('https://' + (gateway.service_type == 'NodePort' ? cidrhost(network.cidr_block ?? '10.5.0.0/16', 10) : hyperv_controlplanes.nodes[0].ipv4) + ':6443'))}"
      destination_dir: "${hyperv_effective.images_dir}"
      name_suffix: "${hyperv_effective.name_suffix}"
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: "${talos_common.oidc_ca_file_patch ?? ''}"
      worker_config_patches: "${talos_common.worker_config_patches ?? ''}"
      network:
        cidr_block: ${network.cidr_block ?? '10.5.0.0/16'}
        gateway: ${network.gateway}
        nameservers: ${network.nameservers ?? []}
        dhcp: ${hyperv_effective.dhcp}
      controlplanes: >-
        ${gateway.service_type == 'NodePort' ? hyperv_controlplanes.for_config
          : map(hyperv_controlplanes.nodes, fromPairs(concat(
            [["hostname", get(#, "name")]],
            hyperv_effective.dhcp ? [] : [
              ["node", get(#, "ipv4")],
              ["address", get(#, "ipv4") + "/" + split(network.cidr_block ?? '10.5.0.0/16', "/")[1]]
            ]
          )))}
      workers: >-
        ${gateway.service_type == 'NodePort' ? hyperv_workers.for_config
          : map(hyperv_workers.nodes, fromPairs(concat(
            [["hostname", get(#, "name")]],
            hyperv_effective.dhcp ? [] : [
              ["node", get(#, "ipv4")],
              ["address", get(#, "ipv4") + "/" + split(network.cidr_block ?? '10.5.0.0/16', "/")[1]]
            ]
          )))}

  # compute — Talos VMs on a Hyper-V virtual switch. Each VM gets a fresh
  # dynamic VHDX, the metal-amd64.iso on DVD slot 1, and its CIDATA seed on
  # slot 2. Boot is HDD-first: UEFI falls through to the ISO on a fresh disk,
  # then boots from disk once installed. CIDATA stays attached (NoCloud reader
  # is idempotent).
  - name: compute
    path: compute/hyperv
    dependsOn:
      - cluster-config
    inputs:
      network_name: "${gateway.service_type == 'NodePort' ? '' : (hyperv.switch_name ?? '')}"
      create_network: ${gateway.service_type == 'NodePort' || (hyperv.switch_name ?? '') == ''}
      switch_type: ${hyperv_effective.switch_type}
      net_adapter_names: ${hyperv_effective.net_adapter}
      # NAT-only inputs — null otherwise (compute ignores them when not NAT).
      nat_name: "${hyperv_effective.switch_type == 'NAT' ? hyperv_effective.nat_name : null}"
      nat_internal_address_prefix: "${hyperv_effective.switch_type == 'NAT' ? hyperv_effective.nat_internal_prefix : null}"
      nat_host_address: "${hyperv_effective.switch_type == 'NAT' ? hyperv_effective.nat_host_address : null}"
      # nat_effective.tcp_forwards is the always-on baseline (k8s/Talos APIs,
      # gateway NodePorts); gateway.publish_ports layers operator-pinned ports.
      port_forwards: "${gateway.service_type == 'NodePort' ? nat_effective.tcp_forwards : {}}"
      extra_port_forwards: "${gateway.service_type == 'NodePort' ? (gateway.publish_ports ?? {}) : {}}"
      udp_port_forwards: "${gateway.service_type == 'NodePort' ? nat_effective.udp_forwards : {}}"
      # Default target = cp-1; per-port overrides redirect each Talos API
      # forward (40000+i) to its own node.
      port_forward_target_ip: "${gateway.service_type == 'NodePort' ? cidrhost(hyperv_effective.nat_internal_prefix, 10) : null}"
      port_forward_target_overrides: "${gateway.service_type == 'NodePort' ? nat_effective.talos_api_targets : {}}"
      # 0.0.0.0 = any host NIC. Pinning a bench IP would need
      # Add-NetNatExternalAddress first; identical on a single-LAN-NIC bench.
      port_forward_external_ip: "0.0.0.0"
      port_forward_name_prefix: "windsor-${id ?? 'hyperv'}"
      network_cidr: ${network.cidr_block ?? '10.5.0.0/16'}
      vhd_dir: "${hyperv_effective.vhd_dir}"
      name_suffix: "${hyperv_effective.name_suffix}"
      images:
        talos:
          destination_path: "${hyperv_effective.image_destination}"
          url: ${hyperv_effective.image_url}
          runner_download: true
          keep_on_destroy: true
      instances: ${hyperv_compute_instances.list}

  - name: cluster
    path: cluster/talos
    dependsOn:
      - compute
      - "${pki.enabled == true ? 'pki' : ''}"
      - cluster-config
    parallelism: 1
    inputs:
      # Prefer the schema-declared cluster.endpoint; the compute-derived
      # fallback carries the leased IP once the guest reports it.
      cluster_endpoint: "${(cluster.endpoint ?? '') != '' ? cluster.endpoint : cluster_endpoint_fallback.endpoint}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      # Length-check compute output (empty until the guest reports an IP) and
      # fall through to schema-declared nodes.
      # In NodePort+NAT, compute's NAT-internal endpoints are unreachable from
      # the runner, so use for_cluster (bench-side host:port routing to each VM).
      controlplanes: "${gateway.service_type == 'NodePort' ? hyperv_controlplanes.for_cluster : (len(terraform_output(\"compute\", \"controlplanes\") ?? []) > 0 ? terraform_output(\"compute\", \"controlplanes\") : (hyperv_effective.dhcp ? [] : values(cluster.controlplanes.nodes ?? {})))}"
      workers: "${gateway.service_type == 'NodePort' ? hyperv_workers.for_cluster : (len(terraform_output(\"compute\", \"workers\") ?? []) > 0 ? terraform_output(\"compute\", \"workers\") : (hyperv_effective.dhcp ? [] : ((cluster.workers.count ?? 0) > 0 ? values(cluster.workers.nodes ?? {}) : [])))}"
      controlplane_disks: ${talos_common.controlplane_disks}
      worker_disks: ${talos_common.worker_disks}
      common_config_patches: ${talos_common.common_config_patches}
      worker_config_patches: "${talos_common.worker_config_patches ?? ''}"
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}
      # Shared identity from cluster-config. Bootstrap, kubeconfig download,
      # and health-check still run here.
      machine_secrets: ${terraform_output("cluster-config", "machine_secrets")}
      skip_machine_config_apply: ${hyperv_effective.bake_machineconfig}
      client_configuration: ${terraform_output("cluster-config", "client_configuration")}

  - name: gitops
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      concurrency: ${max(4, min(floor(cluster_resources_effective.controlplanes.cpu / 2), floor(cluster_resources_effective.controlplanes.memory / 2), 10))}
    destroy: false
