kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: single-node
  description: Reduce control-plane chatter on single-node topologies

when: topology == 'single-node'

# Terraform
# =============================================================================
# On a single node, each leader-electing controller renews its lease against itself every ~2s.
# Leader election is off where a chart or controller allows it.
# config-talos covers kube-controller-manager and kube-scheduler.
terraform:

  # Turns off leader election on every Flux controller.
  - name: gitops
    path: gitops/flux
    inputs:
      leader_election: false

# Flux
# =============================================================================
flux:

  # cert-manager and trust-manager without leader election.
  - name: pki
    install:
      components:
        - cert-manager/single-node
        - trust-manager/single-node

  # openebs only. option-storage has longhorn's single-node component.
  - name: csi
    when: talos_common.storage_driver == 'openebs'
    install:
      components:
        - openebs/single-node

  # Only with database.postgres.enabled, since the component patches addon-database's HelmRelease.
  - name: database
    when: database.postgres.enabled == true
    install:
      components:
        - cloudnativepg/single-node
