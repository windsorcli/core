kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: dev
  description: "Development mode configurations including selfsigned certificates and dev-specific resources"

# Dev mode: enable local-iteration conveniences unsuitable for production
# (selfsigned certs, default Grafana password, auto-enabled capabilities).
when: dev == true

# =============================================================================
# Config — auto-enable common capabilities
# =============================================================================
# Enable common capabilities unless explicitly set to false; `!= false` preserves
# user overrides while defaulting unset fields on.
config:
  - name: pki
    value:
      enabled: ${pki.enabled != false}
  - name: dns
    value:
      private:
        enabled: ${dns.private.enabled != false}
  - name: observability
    value:
      enabled: ${observability.enabled != false}
  - name: database
    value:
      postgres:
        enabled: ${database.postgres.enabled != false}
        driver: "${database.postgres.driver ?? 'cloudnativepg'}"

# =============================================================================
# Flux systems — pki resources overlay
# =============================================================================
# Local-dev PKI: a selfsigned ClusterIssuer so certificates work without an
# external trust anchor. Production uses letsencrypt or pki.enabled.
flux:

  - name: pki
    resources:
      - timeout: 5m
        interval: 5m
        components:
          - public-issuer/selfsigned

  # Grafana dev credentials (default admin password "grafana"). In production
  # observability.admin_password is expected to come from a secret.
  - name: observability
    install:
      components:
        - grafana/dev
      substitutions:
        admin_password: ${observability.admin_password ?? "grafana"}

  # OpenBao dev credentials — a local userpass admin user, so the UI is
  # reachable without pasting the root token. admin_password is sensitive,
  # so it's placed as a Secret rather than a plaintext substitution.
  - name: secrets
    when: secrets_store.enabled == true && (secrets_store.driver ?? 'openbao') == 'openbao'
    secrets:
      openbao-dev-password:
        namespaces: [system-secrets-store]
        data:
          password: ${secrets_store.admin_password ?? "openbao"}
    install:
      components:
        - openbao/dev
