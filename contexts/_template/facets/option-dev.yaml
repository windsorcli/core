kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: dev
  description: "Development mode configurations including selfsigned certificates and dev-specific resources"

when: dev == true

# Config
# =============================================================================
# Observability and in-cluster Postgres are on unless set to false.
config:
  - name: observability
    value:
      enabled: ${observability.enabled != false}
  - name: database
    value:
      postgres:
        enabled: ${database.postgres.enabled != false}

# Flux
# =============================================================================
flux:

  # Selfsigned public ClusterIssuer, so certificates work without an external trust anchor.
  - name: pki
    resources:
      - timeout: 5m
        interval: 5m
        components:
          - public-issuer/selfsigned

  # Grafana admin password, grafana unless set by observability.admin_password.
  - name: observability
    when: observability.enabled != false
    install:
      components:
        - grafana/dev
      substitutions:
        admin_password: ${observability.admin_password ?? "grafana"}
