kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: incus
  description: Incus compute platform infrastructure

when: "platform == 'incus' && cluster.driver == 'talos'"

# Requires
# =============================================================================
requires:
  - when: (workstation.runtime ?? '') == '' && incus.host == true && (incus.storage_pool ?? 'local') == 'local'
    message: With incus.host set to true, set incus.storage_pool to a pool other than local, such as nvme.
  - when: (workstation.runtime ?? '') == '' && (incus.network ?? 'lan') == 'nat' && len(incus.bridges ?? {}) > 0
    message: Remove incus.bridges, or set incus.network to a host bridge instead of nat.
  - when: >-
      (workstation.runtime ?? '') == '' && (incus.network ?? 'lan') != 'nat'
      && cluster_node_addresses.controlplanes_missing
    paths:
      - cluster.controlplanes.nodes.controlplane-N
    message: On incus.network, give each control plane its reserved LAN address in cluster.controlplanes.nodes under controlplane-1 to controlplane-N.
  - when: >-
      (workstation.runtime ?? '') == '' && (incus.network ?? 'lan') != 'nat'
      && cluster_node_addresses.workers_missing
    paths:
      - cluster.workers.nodes.worker-N
    message: On incus.network, give each worker its reserved LAN address in cluster.workers.nodes under worker-1 to worker-N.
  - when: >-
      (workstation.runtime ?? '') == '' && (incus.network ?? 'lan') == 'nat' && network.dhcp != true
      && cluster_node_addresses.controlplanes_missing
    paths:
      - cluster.controlplanes.nodes.controlplane-N
    message: Set network.dhcp to true, or give each control plane an address in cluster.controlplanes.nodes under controlplane-1 to controlplane-N.
  - when: >-
      (workstation.runtime ?? '') == '' && (incus.network ?? 'lan') == 'nat' && network.dhcp != true
      && cluster_node_addresses.workers_missing
    paths:
      - cluster.workers.nodes.worker-N
    message: Set network.dhcp to true, or give each worker an address in cluster.workers.nodes under worker-1 to worker-N.

# Config
# =============================================================================
config:

  - name: incus_effective
    value:
      remote: ${incus.remote ?? null}
      targets: ${incus.targets ?? []}
      # Empty in nat mode, where compute creates its own network.
      network: "${(incus.network ?? 'lan') == 'nat' ? '' : (incus.network ?? 'lan')}"
      bridges: ${incus.bridges ?? {}}
      lan: ${(incus.network ?? 'lan') != 'nat'}
      storage_pool: "${incus.storage_pool ?? 'local'}"
      host: ${(workstation.runtime ?? '') == '' && incus.host == true}
      # /nocloud images in LAN mode, which configure the network through cloud-init.
      image_suffix: "${(incus.network ?? 'lan') != 'nat' ? '/nocloud' : ''}"
      gateway: "${network.gateway ?? cidrhost(network.cidr_block ?? '10.5.0.0/16', 1)}"
      nameservers: "${network.nameservers ?? ['1.1.1.1', '8.8.8.8']}"

  - name: talos_common
    value:
      # openebs by default, since the Incus Talos image has no iscsi-tools extension for longhorn.
      storage_driver: "${cluster.storage.driver ?? 'openebs'}"
      longhorn_default_disk:
        - name: longhorn
          size: 30

  # https://<first compute control plane host>:6443, or empty before compute has outputs.
  - name: cluster_endpoint_fallback
    value:
      endpoint: >-
        ${
          len(terraform_output("compute", "controlplanes") ?? []) > 0
          && terraform_output("compute", "controlplanes")[0].endpoint != null
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        }

  # Compute's nodes, else declared nodes, reduced to the node and endpoint fields.
  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? terraform_output("compute", "controlplanes")
            : filter(cluster_node_entries.controlplanes, # != null),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${map(
          len(terraform_output("compute", "workers") ?? []) > 0
            ? terraform_output("compute", "workers")
            : (cluster_nodes_effective.workers > 0 ? filter(cluster_node_entries.workers, # != null) : []),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

  # Incus limits and the TALOSSKU string per role.
  - name: incus_sizes
    value:
      controlplanes:
        limits:
          cpu: ${string(cluster_resources_effective.controlplanes.cpu)}
          memory: ${string(cluster_resources_effective.controlplanes.memory) + "GB"}
        sku: >-
          ${string(cluster_resources_effective.controlplanes.cpu) + "CPU-"
            + string(cluster_resources_effective.controlplanes.memory * 1024) + "RAM"}
      workers:
        limits:
          cpu: ${string(cluster_resources_effective.workers.cpu)}
          memory: ${string(cluster_resources_effective.workers.memory) + "GB"}
        sku: >-
          ${string(cluster_resources_effective.workers.cpu) + "CPU-"
            + string(cluster_resources_effective.workers.memory * 1024) + "RAM"}

  # Incus devices for each node's passthrough entries, USB by vendor:product or PCI by address.
  - name: incus_passthrough
    value:
      controlplanes: >-
        ${map(cluster_node_entries.controlplanes, let pt = (# ?? {}).passthrough ?? [];
          fromPairs(map(pt, ["passthrough-" + string(#index), #.type == "usb"
            ? {"type": "usb", "properties": {"vendorid": split(#.id ?? ":", ":")[0], "productid": split(#.id ?? ":", ":")[1]}}
            : {"type": "pci", "properties": {"address": #.id ?? ""}}])))}
      workers: >-
        ${map(cluster_node_entries.workers, let pt = (# ?? {}).passthrough ?? [];
          fromPairs(map(pt, ["passthrough-" + string(#index), #.type == "usb"
            ? {"type": "usb", "properties": {"vendorid": split(#.id ?? ":", ":")[0], "productid": split(#.id ?? ":", ":")[1]}}
            : {"type": "pci", "properties": {"address": #.id ?? ""}}])))}

  # One Incus VM per control plane, placed on its placement, else round-robin over incus.targets.
  # The IPv4 comes from cluster.controlplanes.nodes, or bridge DHCP.
  - name: incus_controlplanes
    value:
      instances: >-
        ${map(1..int(cluster_nodes_effective.controlplanes), fromPairs([
          ["name", int(cluster_nodes_effective.controlplanes) > 1 ? "controlplane-" + string(# - 1) : "controlplane"],
          ["role", "controlplane"],
          ["count", 1],
          ["target", (cluster_node_entries.controlplanes[# - 1] ?? {}).placement
            ?? (len(incus_effective.targets) > 0
              ? incus_effective.targets[(# - 1) % len(incus_effective.targets)] : null)],
          ["ipv4", network.dhcp == true && !incus_effective.lan ? null : cluster_node_addresses.controlplanes[# - 1].ipv4],
          ["wait_for_ipv4", !incus_effective.lan],
          ["network_config", cluster_node_addresses.controlplanes[# - 1].mac_address == null ? {}
            : {"hwaddr": cluster_node_addresses.controlplanes[# - 1].mac_address}],
          ["image", cluster.controlplanes.image
            ?? ("windsor:talos/v" + talos.talos_version + "/amd64" + incus_effective.image_suffix)],
          ["type", "virtual-machine"],
          ["description", "Talos control plane node"],
          ["storage_pool", "default"],
          ["root_disk_size", string(cluster.controlplanes.root_disk_size ?? 30) + "GB"],
          ["limits", incus_sizes.controlplanes.limits],
          ["disks", talos_common.controlplane_disks],
          ["devices", incus_passthrough.controlplanes[# - 1]],
          ["config", {
            "user.hostname": (cluster_node_entries.controlplanes[# - 1] ?? {}).hostname
              ?? ("controlplane-" + string(#)),
            "environment.TALOSSKU": incus_sizes.controlplanes.sku,
            "raw.qemu": "-boot order=c,menu=off"
          }]
        ]))}

  # One Incus VM per worker, placed and addressed like the control planes.
  - name: incus_workers
    value:
      instances: >-
        ${map(1..int(cluster_nodes_effective.workers), fromPairs([
          ["name", int(cluster_nodes_effective.workers) > 1 ? "worker-" + string(# - 1) : "worker"],
          ["role", "worker"],
          ["count", 1],
          ["target", (cluster_node_entries.workers[# - 1] ?? {}).placement
            ?? (len(incus_effective.targets) > 0
              ? incus_effective.targets[(# - 1) % len(incus_effective.targets)] : null)],
          ["ipv4", network.dhcp == true && !incus_effective.lan ? null : cluster_node_addresses.workers[# - 1].ipv4],
          ["wait_for_ipv4", !incus_effective.lan],
          ["network_config", cluster_node_addresses.workers[# - 1].mac_address == null ? {}
            : {"hwaddr": cluster_node_addresses.workers[# - 1].mac_address}],
          ["image", cluster.workers.image
            ?? ("windsor:talos/v" + talos.talos_version + "/amd64" + incus_effective.image_suffix)],
          ["type", "virtual-machine"],
          ["description", "Talos worker node"],
          ["storage_pool", "default"],
          ["root_disk_size", string(cluster.workers.root_disk_size ?? 50) + "GB"],
          ["limits", incus_sizes.workers.limits],
          ["disks", talos_common.worker_disks],
          ["devices", incus_passthrough.workers[# - 1]],
          ["config", {
            "user.hostname": (cluster_node_entries.workers[# - 1] ?? {}).hostname
              ?? ("worker-" + string(#)),
            "environment.TALOSSKU": incus_sizes.workers.sku,
            "raw.qemu": "-boot order=c,menu=off"
          }]
        ]))}

# Terraform
# =============================================================================
# Compute, cluster and gitops apply without a workstation. With one, option-workstation provides them.
terraform:

  # The storage pool every context on the Incus host shares.
  - name: host
    when: incus_effective.host
    path: host/incus
    inputs:
      remote: ${incus_effective.remote}
      storage_pool_name: "${incus_effective.storage_pool}"
    destroy: false

  - name: compute
    when: "workstation.runtime == null || workstation.runtime == ''"
    path: compute/incus
    dependsOn:
      - "${incus_effective.host ? 'host' : ''}"
    # Serial, since images.windsorcli.dev rate-limits concurrent image fetches.
    parallelism: 1
    inputs:
      remote: ${incus_effective.remote}
      network_name: "${incus_effective.network}"
      create_network: ${!incus_effective.lan}
      attach_to_bridge: ${incus_effective.lan}
      bridges: ${incus_effective.bridges}
      static_dhcp_leases: ${!incus_effective.lan}
      default_storage_pool: "${incus_effective.storage_pool}"
      node_health_check: true
      network_cidr: ${network.cidr_block}
      cloud_init_network: ${incus_effective.lan}
      network_gateway: "${incus_effective.lan ? incus_effective.gateway : null}"
      network_nameservers: "${incus_effective.lan ? incus_effective.nameservers : []}"
      storage_pools:
        local:
          driver: null
      instances: ${concat(incus_controlplanes.instances, incus_workers.instances)}

  - name: cluster
    when: "workstation.runtime == null || workstation.runtime == ''"
    path: cluster/talos
    dependsOn:
      - compute
      - pki
    parallelism: 1
    inputs:
      cluster_endpoint: "${cluster.endpoint ?? cluster_endpoint_fallback.endpoint}"
      # The VIP interface uses DHCP in nat mode, where guests take static DHCP leases.
      vip_interface: "${cluster.vip == true ? {deviceSelector: {physical: true}, dhcp: !incus_effective.lan} : null}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      upgrade_nodes: ${len(talos_common.extensions ?? []) == 0}
      powercycle_reboot: true
      # Compute's control planes, else declared nodes.
      controlplanes: "${terraform_output(\"compute\", \"controlplanes\") ?? filter(cluster_node_entries.controlplanes, # != null)}"
      # Compute's workers, else declared nodes.
      workers: "${terraform_output(\"compute\", \"workers\") ?? (cluster_nodes_effective.workers > 0 ? filter(cluster_node_entries.workers, # != null) : [])}"
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: ${talos_common.controlplane_config_patches}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}

  - name: gitops
    when: "workstation.runtime == null || workstation.runtime == ''"
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      # Half the smaller of control plane CPU and memory, clamped to 2-10.
      # The floor is 2, since nested VMs have slow vCPUs.
      concurrency: ${max(2, min(floor(cluster_resources_effective.controlplanes.cpu / 2), floor(cluster_resources_effective.controlplanes.memory / 2), 10))}
    # Skipped on destroy, since deleting the cluster removes Flux.
    destroy: false
