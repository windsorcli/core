kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: incus
  description: Incus compute platform infrastructure

# Incus requires Talos. Without workstation, this facet owns the full terraform
# chain; with workstation, option-workstation owns compute/cluster and this
# facet contributes config only.
when: "platform == 'incus' && cluster.driver == 'talos'"

requires:
  - when: >-
      (workstation.runtime ?? '') == '' && network.dhcp != true
      && cluster_node_addresses.controlplanes_missing
    paths:
      - cluster.controlplanes.nodes.controlplane-N
    message: Set network.dhcp to true, or give each control plane an address in cluster.controlplanes.nodes under controlplane-1 to controlplane-N.
  - when: >-
      (workstation.runtime ?? '') == '' && network.dhcp != true
      && cluster_node_addresses.workers_missing
    paths:
      - cluster.workers.nodes.worker-N
    message: Set network.dhcp to true, or give each worker an address in cluster.workers.nodes under worker-1 to worker-N.

# =============================================================================
# Config — Incus-specific Talos values
# =============================================================================
config:

  # openebs is the default storage: Incus's Talos image has no extensions mechanism
  # (unlike metal/cloud image factories), so longhorn's iscsi-tools requirement can't
  # be met here.
  - name: talos_common
    value:
      storage_driver: "${cluster.storage.driver ?? 'openebs'}"
      longhorn_default_disk:
        - name: longhorn
          size: 30

  # Derivable only from compute output; empty string otherwise, so the caller
  # falls back to an explicit cluster.endpoint.
  - name: cluster_endpoint_fallback
    value:
      endpoint: >-
        ${
          len(terraform_output("compute", "controlplanes") ?? []) > 0
          && terraform_output("compute", "controlplanes")[0].endpoint != null
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        }

  # Node targets for post-cluster steps (e.g. extensions), using the same
  # compute-output-or-fallback resolution as the `cluster` step.
  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? terraform_output("compute", "controlplanes")
            : values(cluster.controlplanes.nodes ?? {}),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${map(
          len(terraform_output("compute", "workers") ?? []) > 0
            ? terraform_output("compute", "workers")
            : ((cluster.workers.count ?? 0) > 0 ? values(cluster.workers.nodes) : []),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

  # Incus limits and Talos SKU label per pool.
  - name: incus_sizes
    value:
      controlplanes:
        limits:
          cpu: ${string(cluster_resources_effective.controlplanes.cpu)}
          memory: ${string(cluster_resources_effective.controlplanes.memory) + "GB"}
        sku: >-
          ${string(cluster_resources_effective.controlplanes.cpu) + "CPU-"
            + string(cluster_resources_effective.controlplanes.memory * 1024) + "RAM"}
      workers:
        limits:
          cpu: ${string(cluster_resources_effective.workers.cpu)}
          memory: ${string(cluster_resources_effective.workers.memory) + "GB"}
        sku: >-
          ${string(cluster_resources_effective.workers.cpu) + "CPU-"
            + string(cluster_resources_effective.workers.memory * 1024) + "RAM"}

  # One instance per control plane, addressed from cluster.controlplanes.nodes or by bridge DHCP.
  - name: incus_controlplanes
    value:
      instances: >-
        ${map(1..int(cluster.controlplanes.count ?? 1), fromPairs([
          ["name", int(cluster.controlplanes.count ?? 1) > 1 ? "controlplane-" + string(# - 1) : "controlplane"],
          ["role", "controlplane"],
          ["count", 1],
          ["ipv4", network.dhcp == true ? null : cluster_node_addresses.controlplanes[# - 1].ipv4],
          ["image", cluster.controlplanes.image
            ?? ("windsor:talos/v" + talos.talos_version + "/amd64")],
          ["type", "virtual-machine"],
          ["description", "Talos control plane node"],
          ["storage_pool", "default"],
          ["root_disk_size", string(cluster.controlplanes.root_disk_size ?? 30) + "GB"],
          ["limits", incus_sizes.controlplanes.limits],
          ["disks", talos_common.controlplane_disks],
          ["config", {
            "user.hostname": (cluster_node_entries.controlplanes[# - 1] ?? {}).hostname
              ?? ("controlplane-" + string(#)),
            "environment.TALOSSKU": incus_sizes.controlplanes.sku,
            "raw.qemu": "-boot order=c,menu=off"
          }]
        ]))}

  # One instance per worker, addressed from cluster.workers.nodes or by bridge DHCP.
  - name: incus_workers
    value:
      instances: >-
        ${map(1..int(cluster.workers.count ?? 0), fromPairs([
          ["name", int(cluster.workers.count ?? 0) > 1 ? "worker-" + string(# - 1) : "worker"],
          ["role", "worker"],
          ["count", 1],
          ["ipv4", network.dhcp == true ? null : cluster_node_addresses.workers[# - 1].ipv4],
          ["image", cluster.workers.image
            ?? ("windsor:talos/v" + talos.talos_version + "/amd64")],
          ["type", "virtual-machine"],
          ["description", "Talos worker node"],
          ["storage_pool", "default"],
          ["root_disk_size", string(cluster.workers.root_disk_size ?? 50) + "GB"],
          ["limits", incus_sizes.workers.limits],
          ["disks", talos_common.worker_disks],
          ["config", {
            "user.hostname": (cluster_node_entries.workers[# - 1] ?? {}).hostname
              ?? ("worker-" + string(#)),
            "environment.TALOSSKU": incus_sizes.workers.sku,
            "raw.qemu": "-boot order=c,menu=off"
          }]
        ]))}

# =============================================================================
# Terraform — standalone incus (no workstation)
# =============================================================================
# With workstation.runtime unset, this facet owns compute → cluster → gitops.
# With workstation set, option-workstation owns the chain and these are gated off.
terraform:

  # Talos VMs on a fresh Incus network (create_network: true — no workstation
  # stack to inherit one from). Uses the default incus storage pool.
  - name: compute
    when: "workstation.runtime == null || workstation.runtime == ''"
    path: compute/incus
    # Serialized: concurrent instance creation triggers concurrent Talos image
    # fetches, and images.windsorcli.dev rate-limits those (429).
    parallelism: 1
    inputs:
      network_name: ""
      create_network: true
      network_cidr: ${network.cidr_block}
      storage_pools:
        local:
          driver: null
      instances: ${concat(incus_controlplanes.instances, incus_workers.instances)}

  # Talos bootstrap/apply. Uses compute output when available, else user-supplied nodes.
  - name: cluster
    when: "workstation.runtime == null || workstation.runtime == ''"
    path: cluster/talos
    dependsOn:
      - compute
      - pki
    parallelism: 1
    inputs:
      cluster_endpoint: "${cluster.endpoint ?? cluster_endpoint_fallback.endpoint}"
      # Incus guests take their addresses from static DHCP leases.
      vip_interface: "${cluster.vip == true ? {deviceSelector: {physical: true}, dhcp: true} : null}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      controlplanes: ${terraform_output("compute", "controlplanes") ?? values(cluster.controlplanes.nodes)}
      workers: "${terraform_output(\"compute\", \"workers\") ?? ((cluster.workers.count ?? 0) > 0 ? values(cluster.workers.nodes) : [])}"
      controlplane_disks: ${talos_common.controlplane_disks}
      worker_disks: ${talos_common.worker_disks}
      common_config_patches: ${talos_common.common_config_patches}
      registry_mirrors: ${talos_common.registry_mirrors}
      registry_auths: ${talos_common.registry_auths}
      controlplane_config_patches: "${talos_common.oidc_ca_file_patch ?? ''}"
      worker_config_patches: "${talos_common.worker_config_patches ?? ''}"
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}

  # Flux. destroy: false — cluster teardown removes it; we don't uninstall on `windsor destroy`.
  - name: gitops
    when: "workstation.runtime == null || workstation.runtime == ''"
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      # Floor stays 2 here (other platforms use 4): incus runs the cluster in a
      # nested VM with slower vCPUs, so higher concurrency floods the apiserver.
      concurrency: ${max(2, min(floor(cluster_resources_effective.controlplanes.cpu / 2), floor(cluster_resources_effective.controlplanes.memory / 2), 10))}
    destroy: false
