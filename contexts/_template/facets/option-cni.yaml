kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: cni
  description: Kubernetes CNI driver configuration (Cilium)

when: cluster.cni.driver == 'cilium' && (cluster.enabled ?? true)

# Terraform
# =============================================================================
# Flux requires pod networking, so Terraform bootstraps Cilium through the Talos API.
# Flux adopts the same HelmRelease below.
terraform:

  - name: cni
    when: "talos_provisioned"
    path: cni/cilium
    dependsOn:
      - cluster
    inputs:
      # Talos KubePrism, the node-local API load balancer.
      k8s_service_host: localhost
      k8s_service_port: 7445
      # Talos forbids privileged pods and mounts cgroups at init.
      privileged: false
      cgroup_auto_mount: false
      # Matches the Flux HelmRelease's operator_replicas, so re-applies don't flap.
      operator_replicas: "${topology == 'single-node' ? 1 : 2}"
      chart_repository: "${terraform_chart_registry != '' ? terraform_chart_registry : null}"

  - name: gitops
    when: "talos_provisioned"
    path: gitops/flux
    dependsOn:
      - cni

# Flux
# =============================================================================
flux:

  # The Cilium gateways wait on cni-install, so Cilium and its LBIPAM sharing policy exist before
  # the LoadBalancer Service.
  - name: gateway
    when: gateway.enabled == true && gateway.driver == 'cilium'
    resources:
      - name: external
        when: gateway_endpoints.external_enabled == true
        dependsOn:
          - cni-install
      - name: internal
        when: gateway_endpoints.internal_enabled == true
        dependsOn:
          - cni-install

  # Flux adoption of the bootstrapped Cilium HelmRelease, in a Talos and an EKS variant.

  # Talos: cilium/talos sets the Talos security context and cgroup settings, with the API on
  # KubePrism at localhost:7445.
  # cilium/l2 is off when an lb-install controller owns LoadBalancer Services, since ARP-announced
  # IPs don't route on cloud networks.
  - name: cni
    when: talos_enabled
    install:
      components:
        - cilium
        - cilium/talos
        - "${(gateway.enabled == true && gateway.driver == 'cilium') ? 'cilium/gateway' : ''}"
        # LBIPAM sharing policy, off when an lb-install controller serves the Gateway Service.
        - "${(gateway.enabled == true && gateway.driver == 'cilium' && load_balancer.driver == 'cilium' && load_balancer.controller_required != true) ? 'cilium/gateway/lbipam' : ''}"
        - "${telemetry.metrics.enabled ? 'cilium/prometheus' : ''}"
        - cilium/hubble
        - "${load_balancer.driver == 'cilium' && load_balancer.controller_required != true ? 'cilium/l2' : ''}"
        # Encryption, on by default outside a workstation unless set by cluster.cni.encryption.
        - "${(cluster.cni.encryption ?? ((workstation.runtime ?? '') == '')) == true ? 'cilium/encryption' : ''}"
      substitutions:
        k8s_service_host: localhost
        k8s_service_port: "7445"
        cluster_name: ${context}
        operator_replicas: "${topology == 'single-node' ? 1 : 2}"
      timeout: 15m
      interval: 5m

  # LBIPAM pool and L2 announcement policy, whose CRDs come from the chart.
  - name: cni
    when: talos_enabled && load_balancer.driver == 'cilium' && load_balancer.controller_required != true
    resources:
      - components:
          - cilium/l2
          - "${(network.loadbalancer_ips.start ?? '') != '' ? 'cilium/l2/pool' : ''}"
        timeout: 5m
        interval: 5m

  # IP range for the Cilium LBIPAM pool, present only with the cilium/l2/pool component.
  - name: cni
    when: talos_enabled && load_balancer.driver == 'cilium' && load_balancer.controller_required != true && (network.loadbalancer_ips.start ?? '') != ''
    resources:
      - substitutions:
          loadbalancer_start_ip: "${network.loadbalancer_ips.start}"
          loadbalancer_end_ip: "${network.loadbalancer_ips.end ?? ''}"

  # EKS: no Talos settings and no L2 component.
  - name: cni
    when: eks_enabled
    install:
      components:
        - cilium
        - "${(gateway.enabled == true && gateway.driver == 'cilium') ? 'cilium/gateway' : ''}"
        # LBIPAM sharing policy, off when an lb-install controller serves the Gateway Service.
        - "${(gateway.enabled == true && gateway.driver == 'cilium' && load_balancer.driver == 'cilium' && load_balancer.controller_required != true) ? 'cilium/gateway/lbipam' : ''}"
        - "${telemetry.metrics.enabled ? 'cilium/prometheus' : ''}"
        - cilium/hubble
        # Encryption, on by default outside a workstation unless set by cluster.cni.encryption.
        - "${(cluster.cni.encryption ?? ((workstation.runtime ?? '') == '')) == true ? 'cilium/encryption' : ''}"
      substitutions:
        # The host of the EKS cluster_endpoint output.
        k8s_service_host: "${split(split(terraform_output(\"cluster\", \"cluster_endpoint\") ?? \"https://localhost:443\", \"://\")[1], \":\")[0]}"
        cluster_name: ${context}
        operator_replicas: "${topology == 'single-node' ? 1 : 2}"
      timeout: 15m
      interval: 5m

  # csi waits on cni-install, since node-driver-registrar crash-loops during Cilium's eBPF init.
  - name: csi
    dependsOn:
      - cni-install

  # Cilium dashboards with Grafana.
  - name: observability
    when: observability.enabled == true && observability.dashboards == 'grafana'
    resources:
      - components:
          - grafana/dashboards/cilium
