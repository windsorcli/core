kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: database
  description: PostgreSQL database service — in-cluster via CloudNativePG, or a cloud-managed instance via Crossplane

when: database.postgres.enabled == true

# =============================================================================
# Terraform — driver-specific cloud infrastructure and Crossplane identity.
# network/cluster come from the active platform's own terraform: block.
# =============================================================================
terraform:

  # KMS key and security group for RDS storage.
  - name: database
    path: database/aws-rds
    when: "database.postgres.driver == 'rds'"
    dependsOn:
      - network
      - cluster
    inputs:
      # Dedicated CMK except for ephemeral contexts.
      manage_encryption_key: ${!(ephemeral ?? false)}
      kms_key_arn: "${database.postgres.encryption.kms_key_arn ?? ''}"
      vpc_id: ${terraform_output('network', 'vpc_id')}
      # Scopes RDS ingress to this cluster's own nodes, not the whole VPC CIDR.
      cluster_security_group_id: ${terraform_output('cluster', 'cluster_security_group_id')}

  # IAM role, policy, and Pod Identity association for Crossplane's AWS
  # provider pods.
  - name: crossplane-identity
    path: provisioning/crossplane-identity/aws
    when: "database.postgres.driver == 'rds'"
    dependsOn:
      - network
      - cluster
      - database
    inputs:
      cluster_name: ${terraform_output('cluster', 'cluster_name')}
      cluster_arn: ${terraform_output('cluster', 'cluster_arn')}
      cluster_tag: ${terraform_output('cluster', 'cluster_name')}
      db_subnet_group_name: ${terraform_output('network', 'db_subnet_group_name')}
      kms_key_arn: ${terraform_output('database', 'kms_key_arn')}
      resources:
        - rds

  # Resource group, private DNS zone, NSG, and optional customer-managed
  # key for Flexible Server.
  - name: database
    path: database/azure-postgres
    when: "database.postgres.driver == 'flexibleserver'"
    dependsOn:
      - network
      - cluster
    inputs:
      # Derived from network's own output: Flexible Server must colocate
      # with its delegated subnet.
      region: ${terraform_output('network', 'region')}
      vnet_id: ${terraform_output('network', 'vnet_id')}
      flexibleserver_subnet_id: ${terraform_output('network', 'flexibleserver_subnet_id')}
      # Scopes Postgres ingress to this cluster's own node subnets rather
      # than the whole VNet.
      allowed_subnet_cidrs: ${terraform_output('network', 'private_subnet_cidrs')}
      # Dedicated key except for ephemeral contexts.
      manage_encryption_key: ${!(ephemeral ?? false)}
      key_vault_key_id: "${database.postgres.encryption.key_vault_key_id ?? ''}"

  # Workload Identity and RBAC for Crossplane's Azure provider pods.
  - name: crossplane-identity
    path: provisioning/crossplane-identity/azure
    when: "database.postgres.driver == 'flexibleserver'"
    dependsOn:
      - network
      - cluster
      - database
    inputs:
      region: ${terraform_output('network', 'region')}
      resource_group_name: ${terraform_output('cluster', 'resource_group_name')}
      cluster_name: ${terraform_output('cluster', 'cluster_name')}
      oidc_issuer_url: ${terraform_output('cluster', 'cluster_oidc_issuer_url')}
      postgres_resource_group_id: ${terraform_output('database', 'resource_group_id')}
      resources:
        - postgres

  # Private service connection and KMS key for Cloud SQL. Shared across
  # every database in a context.
  - name: database
    path: database/gcp-cloudsql
    when: "database.postgres.driver == 'cloudsql'"
    dependsOn:
      - network
      - cluster
    inputs:
      project_id: ${gcp.project_id}
      region: ${terraform_output('network', 'region')}
      network_id: ${terraform_output('network', 'network_id')}
      # Dedicated key unless the context is ephemeral.
      manage_encryption_key: ${!(ephemeral ?? false)}
      kms_key_name: "${database.postgres.encryption.kms_key_name ?? ''}"

  # Workload Identity for Crossplane's provider-gcp-sql pod.
  - name: crossplane-identity
    path: provisioning/crossplane-identity/gcp
    when: "database.postgres.driver == 'cloudsql'"
    dependsOn:
      - network
      - cluster
      - database
    inputs:
      project_id: ${gcp.project_id}
      cluster_name: ${terraform_output('cluster', 'cluster_name')}
      resources:
        - postgres

# =============================================================================
# Flux systems
# =============================================================================
flux:

  # CloudNativePG operator, or (rds/flexibleserver/cloudsql) just this
  # domain's namespace.
  - name: database
    install:
      components:
        - "${database.postgres.driver == 'cloudnativepg' ? 'cloudnativepg' : ''}"
        - "${database.postgres.driver == 'cloudnativepg' ? 'cloudnativepg/prometheus' : ''}"
        - "${database.postgres.driver == 'cloudnativepg' && topology == 'ha' ? 'cloudnativepg/ha' : ''}"
      timeout: 15m
      interval: 10m
    dependsOn:
      - "${database.postgres.driver == 'cloudnativepg' ? 'csi-install' : ''}"
      - "${database.postgres.driver == 'cloudnativepg' && (telemetry.metrics.enabled || telemetry.logs.enabled) ? 'telemetry' : ''}"
    resources:
      # Depends on provisioning-resources: gated on the Provider's own
      # Healthy/Installed conditions.
      - when: database.postgres.driver == 'rds'
        dependsOn:
          - provisioning-resources
        components:
          - crossplane/postgres/aws-rds
        substitutions:
          cluster_name: "${terraform_output('cluster', 'cluster_name') ?? ''}"
          context_id: ${id}
        timeout: 5m
        interval: 5m
      - when: database.postgres.driver == 'flexibleserver'
        dependsOn:
          - provisioning-resources
        components:
          - crossplane/postgres/azure-postgres
        substitutions:
          crossplane_azure_client_id: "${terraform_output('crossplane-identity', 'client_ids')['postgres'] ?? ''}"
          crossplane_azure_tenant_id: "${terraform_output('crossplane-identity', 'tenant_id') ?? ''}"
          crossplane_azure_subscription_id: "${terraform_output('network', 'subscription_id') ?? ''}"
          flexibleserver_resource_group_name: "${terraform_output('database', 'resource_group_name') ?? ''}"
          context_id: ${id}
        timeout: 5m
        interval: 5m
      - when: database.postgres.driver == 'cloudsql'
        dependsOn:
          - provisioning-resources
        components:
          - crossplane/postgres/gcp-cloudsql
        substitutions:
          crossplane_gcp_project_id: "${gcp.project_id ?? ''}"
          context_id: ${id}
        timeout: 5m
        interval: 5m

  # Grafana dashboard matching the active driver.
  - name: observability
    when: (database.postgres.driver == 'cloudnativepg' || database.postgres.driver == 'rds' || database.postgres.driver == 'flexibleserver' || database.postgres.driver == 'cloudsql') && observability.enabled == true
    resources:
      - components:
          - "${database.postgres.driver == 'cloudnativepg' ? 'grafana/dashboards/cloudnativepg' : ''}"
          - "${(database.postgres.driver == 'rds' || database.postgres.driver == 'flexibleserver' || database.postgres.driver == 'cloudsql') ? 'grafana/dashboards/postgres-exporter' : ''}"

  # Resources tier depends on install: destroy clears the driver's
  # provider before the Crossplane engine its finalizer needs running.
  - name: provisioning
    when: database.postgres.driver == 'rds' || database.postgres.driver == 'flexibleserver' || database.postgres.driver == 'cloudsql'
    install:
      components:
        - crossplane
      timeout: 15m
      interval: 5m
    resources:
      - components:
          - "${database.postgres.driver == 'rds' ? 'crossplane/aws-rds' : ''}"
          - "${database.postgres.driver == 'flexibleserver' ? 'crossplane/azure-postgres' : ''}"
          - "${database.postgres.driver == 'cloudsql' ? 'crossplane/gcp-cloudsql' : ''}"
          - crossplane/provider-sql
          - crossplane/function-python
        healthCheckExprs:
          - apiVersion: pkg.crossplane.io/v1
            kind: Provider
            current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') && status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
          - apiVersion: pkg.crossplane.io/v1
            kind: Function
            current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') && status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
        timeout: 15m
        interval: 5m
        substitutions:
          crossplane_azure_client_id: "${database.postgres.driver == 'flexibleserver' ? (terraform_output('crossplane-identity', 'client_ids')['postgres'] ?? '') : ''}"
          crossplane_azure_tenant_id: "${database.postgres.driver == 'flexibleserver' ? (terraform_output('crossplane-identity', 'tenant_id') ?? '') : ''}"
          crossplane_gcp_service_account_email: "${database.postgres.driver == 'cloudsql' ? (terraform_output('crossplane-identity', 'service_account_emails')['postgres'] ?? '') : ''}"
