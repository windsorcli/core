kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: database
  description: PostgreSQL database service — in-cluster via CloudNativePG, and/or a cloud-managed instance via Crossplane

when: database.postgres.enabled == true || database.postgres.cloud.enabled == true

# =============================================================================
# Config — derived values consumed by this facet
# =============================================================================
# database_effective.cloud_driver: each cloud platform serves exactly one
# cloud Postgres driver, so it defaults from platform; an explicit
# database.postgres.cloud.driver overrides it.
config:
  - name: database_effective
    when: platform == 'aws'
    value:
      cloud_driver: rds
  - name: database_effective
    when: platform == 'azure'
    value:
      cloud_driver: azuredb
  - name: database_effective
    when: platform == 'gcp'
    value:
      cloud_driver: cloudsql
  - name: database_effective
    when: (database.postgres.cloud.driver ?? '') != ''
    value:
      cloud_driver: "${database.postgres.cloud.driver}"

# =============================================================================
# Terraform — driver-specific cloud infrastructure and Crossplane identity.
# network/cluster come from the active platform's own terraform: block.
# =============================================================================
terraform:

  # KMS key and security group for RDS storage.
  - name: database
    path: database/aws-rds
    when: "database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'rds'"
    dependsOn:
      - network
      - cluster
    inputs:
      # Opt-in, and never for ephemeral contexts.
      manage_encryption_key: ${(database.postgres.cloud.encryption.managed ?? false) && !(ephemeral ?? false)}
      key_id: "${database.postgres.cloud.encryption.key_id ?? ''}"
      vpc_id: ${terraform_output('network', 'vpc_id')}
      # Scopes RDS ingress to this cluster's own nodes, not the whole VPC CIDR.
      cluster_security_group_id: ${terraform_output('cluster', 'cluster_security_group_id')}

  # IAM role, policy, and Pod Identity association for Crossplane's AWS
  # provider pods.
  - name: crossplane-identity
    path: provisioning/crossplane-identity/aws
    when: "database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'rds'"
    dependsOn:
      - network
      - cluster
      - database
    inputs:
      cluster_name: ${terraform_output('cluster', 'cluster_name')}
      cluster_arn: ${terraform_output('cluster', 'cluster_arn')}
      cluster_tag: ${terraform_output('cluster', 'cluster_name')}
      db_subnet_group_name: ${terraform_output('network', 'db_subnet_group_name')}
      kms_key_arn: ${terraform_output('database', 'key_id')}
      resources:
        - rds

  # Resource group, private DNS zone, NSG, and optional customer-managed
  # key for Flexible Server.
  - name: database
    path: database/azure-postgres
    when: "database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'azuredb'"
    dependsOn:
      - network
      - cluster
    inputs:
      # Derived from network's own output: Flexible Server must colocate
      # with its delegated subnet.
      region: ${terraform_output('network', 'region')}
      vnet_id: ${terraform_output('network', 'vnet_id')}
      azuredb_subnet_id: ${terraform_output('network', 'azuredb_subnet_id')}
      # Scopes Postgres ingress to this cluster's own node subnets rather
      # than the whole VNet.
      allowed_subnet_cidrs: ${terraform_output('network', 'private_subnet_cidrs')}
      # Opt-in, and never for ephemeral contexts.
      manage_encryption_key: ${(database.postgres.cloud.encryption.managed ?? false) && !(ephemeral ?? false)}
      key_id: "${database.postgres.cloud.encryption.key_id ?? ''}"

  # Workload Identity and RBAC for Crossplane's Azure provider pods.
  - name: crossplane-identity
    path: provisioning/crossplane-identity/azure
    when: "database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'azuredb'"
    dependsOn:
      - network
      - cluster
      - database
    inputs:
      region: ${terraform_output('network', 'region')}
      resource_group_name: ${terraform_output('cluster', 'resource_group_name')}
      cluster_name: ${terraform_output('cluster', 'cluster_name')}
      oidc_issuer_url: ${terraform_output('cluster', 'cluster_oidc_issuer_url')}
      postgres_resource_group_id: ${terraform_output('database', 'resource_group_id')}
      resources:
        - postgres

  # Private service connection and KMS key for Cloud SQL. Shared across
  # every database in a context.
  - name: database
    path: database/gcp-cloudsql
    when: "database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'cloudsql'"
    dependsOn:
      - network
      - cluster
    inputs:
      project_id: ${gcp.project_id}
      region: ${terraform_output('network', 'region')}
      network_id: ${terraform_output('network', 'network_id')}
      # Opt-in, and never for ephemeral contexts.
      manage_encryption_key: ${(database.postgres.cloud.encryption.managed ?? false) && !(ephemeral ?? false)}
      key_id: "${database.postgres.cloud.encryption.key_id ?? ''}"

  # Workload Identity for Crossplane's provider-gcp-sql pod.
  - name: crossplane-identity
    path: provisioning/crossplane-identity/gcp
    when: "database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'cloudsql'"
    dependsOn:
      - network
      - cluster
      - database
    inputs:
      project_id: ${gcp.project_id}
      cluster_name: ${terraform_output('cluster', 'cluster_name')}
      resources:
        - postgres

# =============================================================================
# Flux systems
# =============================================================================
flux:

  # CloudNativePG operator. cloud.enabled alone (no CNPG) still needs this
  # entry to exist so Crossplane's resources tier has an install tier to
  # depend on, hence the facet-wide when: rather than a per-entry one here.
  - name: database
    install:
      components:
        - "${database.postgres.enabled == true ? 'cloudnativepg' : ''}"
        - "${database.postgres.enabled == true ? 'cloudnativepg/prometheus' : ''}"
        - "${database.postgres.enabled == true && topology == 'ha' ? 'cloudnativepg/ha' : ''}"
      timeout: 15m
      interval: 10m
    dependsOn:
      - "${database.postgres.enabled == true ? 'csi-install' : ''}"
      - "${database.postgres.enabled == true && (telemetry.metrics.enabled || telemetry.logs.enabled) ? 'telemetry' : ''}"
    resources:
      # Depends on provisioning-resources: gated on the Provider's own
      # Healthy/Installed conditions.
      - when: database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'rds'
        dependsOn:
          - provisioning-resources
        components:
          - crossplane/postgres/aws-rds
        substitutions:
          cluster_name: "${terraform_output('cluster', 'cluster_name') ?? ''}"
          context_id: ${id}
          db_subnet_group_name: "${terraform_output('network', 'db_subnet_group_name') ?? ''}"
          kms_key_arn: "${terraform_output('database', 'key_id') ?? ''}"
          rds_security_group_id: "${terraform_output('database', 'security_group_id') ?? ''}"
        timeout: 5m
        interval: 5m
      - when: database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'azuredb'
        dependsOn:
          - provisioning-resources
        components:
          - crossplane/postgres/azure-postgres
        substitutions:
          crossplane_azure_client_id: "${terraform_output('crossplane-identity', 'client_ids')['postgres'] ?? ''}"
          crossplane_azure_tenant_id: "${terraform_output('crossplane-identity', 'tenant_id') ?? ''}"
          crossplane_azure_subscription_id: "${terraform_output('network', 'subscription_id') ?? ''}"
          azuredb_resource_group_name: "${terraform_output('database', 'resource_group_name') ?? ''}"
          azuredb_subnet_id: "${terraform_output('network', 'azuredb_subnet_id') ?? ''}"
          azuredb_private_dns_zone_id: "${terraform_output('database', 'private_dns_zone_id') ?? ''}"
          context_id: ${id}
        timeout: 5m
        interval: 5m
      - when: database.postgres.cloud.enabled == true && database_effective.cloud_driver == 'cloudsql'
        dependsOn:
          - provisioning-resources
        components:
          - crossplane/postgres/gcp-cloudsql
        substitutions:
          crossplane_gcp_project_id: "${gcp.project_id ?? ''}"
          context_id: ${id}
          cloudsql_network_id: "${terraform_output('network', 'network_id') ?? ''}"
        timeout: 5m
        interval: 5m

  # Grafana dashboard(s) matching whichever capabilities are active. CNPG
  # and cloud aren't mutually exclusive, so both can render at once.
  - name: observability
    when: (database.postgres.enabled == true || database.postgres.cloud.enabled == true) && observability.enabled == true
    resources:
      - components:
          - "${database.postgres.enabled == true ? 'grafana/dashboards/cloudnativepg' : ''}"
          - "${database.postgres.cloud.enabled == true ? 'grafana/dashboards/postgres-exporter' : ''}"

  # Resources tier depends on install: destroy clears the driver's
  # provider before the Crossplane engine its finalizer needs running.
  - name: provisioning
    when: database.postgres.cloud.enabled == true
    install:
      components:
        - crossplane
      timeout: 15m
      interval: 5m
    resources:
      - components:
          - "${database_effective.cloud_driver == 'rds' ? 'crossplane/aws-rds' : ''}"
          - "${database_effective.cloud_driver == 'azuredb' ? 'crossplane/azure-postgres' : ''}"
          - "${database_effective.cloud_driver == 'cloudsql' ? 'crossplane/gcp-cloudsql' : ''}"
          - crossplane/provider-sql
          - crossplane/function-python
          - crossplane/app-role
          - "${database_effective.cloud_driver == 'cloudsql' ? 'crossplane/gcp-admin-password' : ''}"
          - "${(telemetry.metrics.enabled ?? true) ? 'crossplane/postgres-monitor' : ''}"
          - "${(telemetry.metrics.enabled ?? true) ? 'crossplane/postgres-exporter' : ''}"
        healthCheckExprs:
          - apiVersion: pkg.crossplane.io/v1
            kind: Provider
            current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') && status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
          - apiVersion: pkg.crossplane.io/v1
            kind: Function
            current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') && status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
          - apiVersion: apiextensions.crossplane.io/v2
            kind: CompositeResourceDefinition
            current: status.conditions.exists(e, e.type == 'Established' && e.status == 'True')
        timeout: 15m
        interval: 5m
        substitutions:
          crossplane_azure_client_id: "${database_effective.cloud_driver == 'azuredb' ? (terraform_output('crossplane-identity', 'client_ids')['postgres'] ?? '') : ''}"
          crossplane_azure_tenant_id: "${database_effective.cloud_driver == 'azuredb' ? (terraform_output('crossplane-identity', 'tenant_id') ?? '') : ''}"
          crossplane_gcp_service_account_email: "${database_effective.cloud_driver == 'cloudsql' ? (terraform_output('crossplane-identity', 'service_account_emails')['postgres'] ?? '') : ''}"
