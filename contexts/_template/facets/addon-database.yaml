kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: database
  description: PostgreSQL database service — in-cluster via CloudNativePG, or a cloud-managed instance via Crossplane

when: database.postgres.enabled == true

# Crossplane's own CRDs, vendored (kustomize/crds/crossplane-2.4.0), owned by
# the crds: layer, not the chart. Only the rds driver needs them.
crds:
  # renovate: datasource=github-releases depName=crossplane/crossplane package=crossplane/crossplane
  - "${database.postgres.driver == 'rds' ? 'crossplane-2.4.0' : ''}"

# =============================================================================
# Flux systems — CloudNativePG operator
# =============================================================================
flux:

  # CloudNativePG operator. Depends on csi for WAL/data PVCs; `ha` topology
  # adds anti-affinity and PDBs. Install-only — manages Cluster CRs, creates none.
  - name: database
    when: database.postgres.driver == 'cloudnativepg'
    dependsOn:
      - csi
    install:
      components:
        - cloudnativepg
        - cloudnativepg/prometheus
        - "${database.postgres.driver == 'cloudnativepg' && topology == 'ha' ? 'cloudnativepg/ha' : ''}"
      timeout: 15m
      interval: 10m

  # Grafana dashboard — only when observability is active. Matches the
  # active driver: CloudNativePG's own metrics, or postgres_exporter for
  # rds (see kustomize/demo/resources/database/rds for a worked example
  # of deploying it against a chart's own Instance).
  - name: observability
    when: (database.postgres.driver == 'cloudnativepg' || database.postgres.driver == 'rds') && observability.enabled == true
    resources:
      - components:
          - "${database.postgres.driver == 'cloudnativepg' ? 'grafana/dashboards/cloudnativepg' : ''}"
          - "${database.postgres.driver == 'rds' ? 'grafana/dashboards/postgres-exporter' : ''}"

  # Crossplane (kustomize/provisioning) — a chart creates the Instance CR;
  # core only installs the engine and wires AWS credentials.
  - name: provisioning
    when: database.postgres.driver == 'rds'
    install:
      # Provider CR + DeploymentRuntimeConfig. Crossplane's own CRDs are
      # vendored (crds: above), so these are as safe here as the HelmRelease.
      components:
        - crossplane
        - crossplane/aws-rds
      healthCheckExprs:
        - apiVersion: pkg.crossplane.io/v1
          kind: Provider
          current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') && status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
      timeout: 15m
      interval: 5m
    resources:
      # ProviderConfig + the tag policy + the always-on monitoring
      # generate policies. ProviderConfig's CRD registers only once
      # install: reports the Provider Healthy/Installed. The exporter's
      # own generate policy is separate (monitoring-exporter component)
      # since it needs telemetry.metrics.enabled — PodMonitor only
      # exists once the metrics pipeline vendors that CRD.
      - components:
          - crossplane/aws-rds
          - "${(telemetry.metrics.enabled ?? true) ? 'crossplane/aws-rds/monitoring-exporter' : ''}"
        substitutions:
          cluster_name: "${terraform_output('cluster', 'cluster_name') ?? ''}"
        timeout: 5m
        interval: 5m
