kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: external-secrets
  description: External Secrets Operator for runtime secret sync

when: external_secrets.enabled == true

# CRDs vendored (kustomize/crds/external-secrets-2.8.0), owned by the crds:
# layer, not the operator.
crds:
  # renovate: datasource=helm depName=external-secrets package=external-secrets helmRepo=https://charts.external-secrets.io
  - external-secrets-2.8.0

# =============================================================================
# Flux systems — External Secrets Operator. Install-only: manages ExternalSecret
# and ClusterSecretStore CRs, creates none of its own. No ClusterSecretStore
# ships here — that's per-backend, added by whatever add-on backs it.
# =============================================================================
flux:

  - name: external-secrets
    install:
      components:
        - external-secrets
      timeout: 10m
      interval: 5m
