kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: hetzner
  description: Hetzner Cloud (Talos) platform infrastructure

when: "platform == 'hetzner' && cluster.driver == 'talos'"

# Requires
# =============================================================================
requires:
  - paths:
      - hetzner.token
    message: Set a Hetzner Cloud API token via hetzner.token or the HCLOUD_TOKEN environment variable.
  - when: >-
      tls_effective.public_acme == true
    paths:
      - email
    message: ACME certificates for dns.public_domain or gateway.<name>.tls.issuer acme need email as the account contact.
  - when: (dns.private_domain ?? '') != '' && dev != true
    message: Hetzner has no private DNS and no internal gateway; unset dns.private_domain and use dns.public_domain.
  - when: >-
      (hetzner.location ?? 'ash') in ['ash', 'hil'] &&
      !((cluster.controlplanes.instance_type ?? 'cpx31') in hetzner_us_instance_types &&
      (cluster.workers.instance_type ?? 'cpx31') in hetzner_us_instance_types)
    message: >-
      The US locations (ash, hil) only offer cpx11-cpx51 and ccx types. Set
      cluster.controlplanes.instance_type / cluster.workers.instance_type to one
      of those, or pick an EU/Asia location (fsn1, hel1, nbg1, sin) to use a Gen2
      cpx*2 or ARM cax type.

# Config
# =============================================================================
config:

  # hetzner.token falls back to HCLOUD_TOKEN.
  - name: hetzner
    when: (hetzner.token ?? '') == ''
    value:
      token: ${env("HCLOUD_TOKEN")}

  - name: talos_common
    value:
      storage_driver: "${cluster.storage.driver ?? 'hcloud'}"
      common_patch:
        machine:
          kubelet:
            nodeIP:
              # kubelet on the private NIC, since the hcloud firewall blocks 10250 on the public NIC.
              validSubnets:
                - "${network.cidr_block ?? '10.5.0.0/16'}"

  # On single-node, the control plane drops its LB exclusion label, so the Hetzner LB has a target.
  - name: talos_common
    when: topology == 'single-node'
    value:
      controlplane_patch:
        machine:
          nodeLabels:
            node.kubernetes.io/exclude-from-external-load-balancers:
              $patch: delete

  # vCPU and memory in GB per Hetzner server type.
  # Includes deprecated types the API still orders.
  - name: hetzner_sizes_by_type
    value:
      # CPX Gen2 (AMD Genoa, shared)
      cpx22: { cpu: 2, memory: 4 }
      cpx32: { cpu: 4, memory: 8 }
      cpx42: { cpu: 8, memory: 16 }
      cpx52: { cpu: 12, memory: 24 }
      cpx62: { cpu: 16, memory: 32 }
      # CX Gen3 (cost-optimized, shared)
      cx23: { cpu: 2, memory: 4 }
      cx33: { cpu: 4, memory: 8 }
      cx43: { cpu: 8, memory: 16 }
      cx53: { cpu: 16, memory: 32 }
      # CCX (dedicated vCPU)
      ccx13: { cpu: 2, memory: 8 }
      ccx23: { cpu: 4, memory: 16 }
      ccx33: { cpu: 8, memory: 32 }
      ccx43: { cpu: 16, memory: 64 }
      ccx53: { cpu: 32, memory: 128 }
      ccx63: { cpu: 48, memory: 192 }
      # CPX Gen1 and CX Gen2, deprecated in the Console but still orderable
      cpx11: { cpu: 2, memory: 2 }
      cpx21: { cpu: 3, memory: 4 }
      cpx31: { cpu: 4, memory: 8 }
      cpx41: { cpu: 8, memory: 16 }
      cpx51: { cpu: 16, memory: 32 }
      cx22: { cpu: 2, memory: 4 }
      cx32: { cpu: 4, memory: 8 }
      cx42: { cpu: 8, memory: 16 }
      cx52: { cpu: 16, memory: 32 }
  - name: hetzner_effective
    value:
      # Unknown types fall back to 4 vCPU and 8 GB.
      controlplane_size: "${get(hetzner_sizes_by_type, cluster.controlplanes.instance_type ?? 'cpx31') ?? { cpu: 4, memory: 8 }}"
      worker_size: "${get(hetzner_sizes_by_type, cluster.workers.instance_type ?? 'cpx31') ?? { cpu: 4, memory: 8 }}"
      network_zone: "${hetzner.network_zone ?? get(hetzner_zones_by_location, hetzner.location ?? 'ash') ?? 'us-east'}"

  - name: hetzner_zones_by_location
    value:
      fsn1: eu-central
      nbg1: eu-central
      hel1: eu-central
      ash: us-east
      hil: us-west
      sin: ap-southeast

  # Node sizes from the server types, which config-talos reads to detect small control planes.
  - name: cluster_resources_effective
    value:
      controlplanes: ${hetzner_effective.controlplane_size}
      workers: ${hetzner_effective.worker_size}

  # Server types available in the US locations, ash and hil.
  - name: hetzner_us_instance_types
    value:
      - cpx11
      - cpx21
      - cpx31
      - cpx41
      - cpx51
      - ccx13
      - ccx23
      - ccx33
      - ccx43
      - ccx53
      - ccx63

  # The public issuer is selfsigned by default.
  - name: pki_effective
    value:
      issuer_component: public-issuer/selfsigned

  # The public issuer is ACME with Hetzner DNS-01 when a gateway domain uses public-acme
  # and Hetzner DNS hosts the public zone.
  - name: pki_effective
    when: >-
      tls_effective.public_acme == true && dns_zone_effective.cloud == true
    value:
      issuer_component: public-issuer/acme/hetzner

  # https://<first compute control plane host>:6443, or empty before compute has outputs.
  - name: cluster_endpoint_fallback
    value:
      endpoint: >-
        ${
          len(terraform_output("compute", "controlplanes") ?? []) > 0
          && terraform_output("compute", "controlplanes")[0].endpoint != null
            ? "https://" + split(terraform_output("compute", "controlplanes")[0].endpoint, ":")[0] + ":6443"
            : ""
        }

  # Compute's nodes, else cluster.*.nodes sorted by name, reduced to node and endpoint fields.
  - name: talos_node_targets
    value:
      controlplanes: >-
        ${map(
          len(terraform_output("compute", "controlplanes") ?? []) > 0
            ? terraform_output("compute", "controlplanes")
            : map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1)),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}
      workers: >-
        ${map(
          len(terraform_output("compute", "workers") ?? []) > 0
            ? terraform_output("compute", "workers")
            : ((cluster.workers.count ?? 0) > 0 ? map(sortBy(toPairs(cluster.workers.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1)) : []),
          fromPairs(filter(toPairs(#), get(#, 0) == "node" || get(#, 0) == "endpoint")))}

# Terraform
# =============================================================================
# option-cni adds the cni stack.
terraform:

  # Hetzner servers, booted in maintenance mode from a Talos Image Factory snapshot.
  # cax* server types are arm.
  - name: compute
    path: compute/hcloud
    inputs:
      hcloud_token: ${hetzner.token}
      talos_version: ${talos.talos_version}
      location: ${hetzner.location ?? 'ash'}
      network_zone: ${hetzner_effective.network_zone}
      network_cidr: ${network.cidr_block ?? '10.5.0.0/16'}
      api_allowed_cidrs: ${cluster.api_allowed_cidrs ?? ['0.0.0.0/0']}
      instances:
        - name: controlplane
          role: controlplane
          count: ${cluster_nodes_effective.controlplanes}
          # cpx31 by default, available in every location.
          server_type: ${cluster.controlplanes.instance_type ?? 'cpx31'}
        - name: worker
          role: worker
          count: ${cluster_nodes_effective.workers}
          server_type: ${cluster.workers.instance_type ?? 'cpx31'}

  # Public Hetzner DNS zone for dns.public_domain.
  - name: dns-zone
    path: dns/zone/hetzner
    when: "dns_zone_effective.cloud == true"
    inputs:
      hcloud_token: ${hetzner.token}
      domain_name: ${dns.public_domain}
      parent_zone_name: "${hetzner.dns_parent_zone ?? ''}"

  - name: cluster
    path: cluster/talos
    dependsOn:
      - compute
      - pki
    parallelism: 1
    inputs:
      cluster_endpoint: "${cluster.endpoint ?? cluster_endpoint_fallback.endpoint}"
      cluster_name: talos
      talos_version: ${talos.talos_version}
      upgrade_nodes: ${len(talos_common.extensions ?? []) == 0}
      # Compute's control planes, else cluster.controlplanes.nodes sorted by name.
      controlplanes: ${terraform_output("compute", "controlplanes") ?? map(sortBy(toPairs(cluster.controlplanes.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1))}
      # Compute's workers, else cluster.workers.nodes sorted by name.
      workers: "${terraform_output(\"compute\", \"workers\") ?? ((cluster.workers.count ?? 0) > 0 ? map(sortBy(toPairs(cluster.workers.nodes ?? {}), repeat('0', 63 - len(get(#, 0))) + get(#, 0)), get(#, 1)) : [])}"
      common_config_patches: ${talos_common.common_config_patches}
      controlplane_config_patches: ${talos_common.controlplane_config_patches}
      worker_config_patches: ${talos_common.worker_config_patches}
      controlplane_volumes: ${talos_common.controlplane_volumes ?? []}
      worker_volumes: ${talos_common.worker_volumes ?? []}

  - name: gitops
    path: gitops/flux
    dependsOn:
      - cluster
    inputs:
      # Half the smaller of control plane CPU and memory, clamped to 4-10.
      concurrency: ${max(4, min(floor(hetzner_effective.controlplane_size.cpu / 2), floor(hetzner_effective.controlplane_size.memory / 2), 10))}
    # Skipped on destroy, since deleting the cluster removes Flux.
    destroy: false

# Flux
# =============================================================================
flux:

  # Public ClusterIssuer from pki_effective.issuer_component.
  # ACME solves DNS-01 through the Hetzner cert-manager webhook.
  - name: pki
    resources:
      - components:
          - "${pki_effective.issuer_component}"
          - "${chart_registry != '' && pki_effective.issuer_component == 'public-issuer/acme/hetzner' ? 'public-issuer/acme/hetzner/chart-registry' : ''}"
        timeout: 5m
        interval: 5m
        substitutions:
          acme_server: "${dev == true ? 'https://acme-staging-v02.api.letsencrypt.org/directory' : 'https://acme-v02.api.letsencrypt.org/directory'}"
          acme_email: "${email ?? ''}"
          acme_dns_zone: "${dns.public_domain ?? ''}"

  # Hetzner LB for the external gateway Service, Cilium or Envoy.
  - name: gateway
    when: "gateway.enabled == true && lb_effective.mode == 'loadbalancer' && gateway_exposure.external == 'LoadBalancer' && (dns.public_domain ?? '') != ''"
    resources:
      - name: external
        # hcloud-ccm finalizes the LB Service.
        dependsOn:
          - lb-install
        components:
          - "${gateway.driver == 'cilium' ? 'cilium/loadbalancer/hcloud-lb' : 'envoy/loadbalancer/hcloud-lb'}"
        substitutions:
          hcloud_location: "${hetzner.location ?? 'ash'}"

  # hcloud-ccm. LBs target nodes by private IP, past the public firewall.
  # Route mode is off since Cilium owns the pod network.
  # kubelet runs without --cloud-provider=external. compute/hcloud sets each node's provider-id.
  - name: lb
    secrets:
      hcloud:
        data:
          token: ${hetzner.token}
          # The secret keeps the numeric network ID a string.
          network: ${terraform_output("compute", "network_id")}
    install:
      components:
        - hcloud-ccm
        - "${chart_registry != '' ? 'hcloud-ccm/chart-registry' : ''}"
      substitutions:
        hcloud_location: "${hetzner.location ?? 'ash'}"
      timeout: 5m
      interval: 5m

  # hcloud CSI driver. option-storage provides openebs and longhorn.
  - name: csi
    when: talos_common.storage_driver == 'hcloud'
    secrets:
      hcloud:
        data:
          token: ${hetzner.token}
    install:
      components:
        - hcloud-csi
        - "${chart_registry != '' ? 'hcloud-csi/chart-registry' : ''}"
      timeout: 5m
      interval: 5m

  # external-dns through the Hetzner webhook provider, public zone only.
  - name: dns
    when: "dns_zone_effective.cloud == true"
    secrets:
      hetzner-dns:
        data:
          token: ${hetzner.token}
    install:
      timeout: 5m
      interval: 5m
    resources:
      - name: account
        components:
          - service-account
        timeout: 5m
        interval: 5m
      - name: public
        dependsOn:
          - dns-resources-account
        components:
          - external-dns
          - external-dns/providers/hetzner
          - "${gateway.enabled == true ? 'external-dns/sources/gateway-httproute' : ''}"
          - "${chart_registry != '' ? 'external-dns/chart-registry' : ''}"
        substitutions:
          external_dns_name: external-dns-public
          external_dns_domain: "${dns.public_domain ?? ''}"
          txt_owner_id: "${id}"
        timeout: 5m
        interval: 5m

  # The ACME DNS-01 solver reads the Hetzner token from system-pki.
  - name: pki
    when: "dns_zone_effective.cloud == true"
    secrets:
      hetzner-dns:
        # Named, since pki-install creates two namespaces.
        namespaces: [system-pki]
        data:
          token: ${hetzner.token}
