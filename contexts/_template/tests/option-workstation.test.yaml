# option-workstation.yaml facet tests
# Tests workstation stack (workstation/docker or incus, compute, cluster/talos) when workstation.enabled.
# Asserts cluster common_config_patches: cert_rotation (extraManifests + kubelet.extraArgs) and registries.mirrors
# so changes to config-talos or option-workstation patch logic are caught.

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  dns: &default-dns
    domain: test.local

  cluster: &default-cluster
    driver: talos
    controlplanes:
      # Above the resource_constrained thresholds on both axes, so
      # common_config_patches cases below don't also carry config-talos's
      # small-control-plane patch. memory must clear 2x its threshold (24)
      # too, not just cpu's.
      cpu: 8
      memory: 24
      nodes:
        controlplane-1: &cp1-node
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

  terraform-outputs: &default-terraform-outputs
    compute:
      controlplanes:
        - endpoint: 10.5.0.10:6443
          node: 10.5.0.10
          hostname: controlplane-1
      workers: []


cases:
  # Minimal: workstation enabled, docker (colima), minimal cluster → cluster and gitops. No certSANs (colima; only docker-desktop sets them).
  - name: minimal workstation creates terraform chain and talos config
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            cluster_name: talos
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: true
                controllerManager:
                  extraArgs:
                    leader-elect: "false"
                etcd:
                  extraArgs:
                    auto-compaction-mode: revision
                    auto-compaction-retention: "1000"
                    max-snapshots: "3"
                    max-wals: "3"
                extraManifests:
                - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/v0.8.7/deploy/standalone-install.yaml
                network:
                  cni:
                    name: none
                proxy:
                  disabled: true
                scheduler:
                  extraArgs:
                    leader-elect: "false"
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
                registries:
                  config: {}
                  mirrors: {}
        - name: gitops
          path: gitops/flux
          destroy: false

  # Full: fully populated cluster, dns, volumes
  - name: full workstation with cluster options and colima
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 4
          memory: 8
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 1
          cpu: 4
          memory: 8
          volumes:
            - /mnt/data
        storage:
          local_base_path: /mnt/data
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
        - name: gitops
          path: gitops/flux
          destroy: false

  # Edge: cluster.enabled false with workstation enabled → no cluster, no flux (compute and gitops not run)
  - name: cluster disabled with workstation yields no cluster terraform
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        enabled: false
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          volumes:
            - /var/mnt/local
    expect:
      terraform:
        - name: workstation
          path: workstation/docker

  # Edge: workstation.runtime docker → loadbalancer present (flannel CNI required for lb to fire)
  - name: workstation runtime docker yields loadbalancer
    values:
      platform: docker
      workstation:
        runtime: docker
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        cni:
          driver: flannel
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          volumes:
            - /var/mnt/local
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
        - name: gitops
          path: gitops/flux
          destroy: false
      flux:
        - name: lb
          install:
            components:
              - kube-vip
              - kube-vip/arp

  # Edge: services.registries false → effective registries empty; terraform chain still runs
  - name: workstation with services registries disabled still creates terraform chain
    values:
      platform: docker
      workstation:
        runtime: colima
        services:
          registries: false
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
        - name: gitops
          path: gitops/flux
          destroy: false

  # Incus with workstation enabled: option-workstation contributes workstation/incus, compute/incus, cluster/talos.
  # Asserts cluster common_config_patches: cert_rotation + registries.mirrors; no certSANs (incus path uses common_patch_with_registries only).
  - name: incus with workstation enabled creates workstation/incus compute cluster chain
    values:
      platform: incus
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          # Above the resource_constrained thresholds (isolates this case from
          # config-talos's small-control-plane patch) while keeping the
          # concurrency formula's floor(cpu/2)/floor(memory/2) at 2.
          cpu: 5
          memory: 13
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          count: 1
          volumes:
            - /var/mnt/local
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers:
          - endpoint: 10.5.0.20:50000
            node: 10.5.0.20
            hostname: worker-1
    expect:
      terraform:
        - name: workstation
          path: workstation/incus
        - name: compute
          path: compute/incus
          dependsOn:
            - workstation
        - name: cluster
          path: cluster/talos
          dependsOn:
            - compute
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                extraManifests:
                - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/v0.8.7/deploy/standalone-install.yaml
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
                registries:
                  config: {}
                  mirrors: {}
        - name: gitops
          path: gitops/flux
          inputs:
            concurrency: 2

  # Regression: colima-incus with no worker nodes configured resolves cluster.workers.nodes to an
  # empty map, not null — `!= null` alone doesn't guard the values(...)[0] index, so composition must
  # check length instead.
  - name: incus with colima and zero workers composes without indexing an empty nodes map
    values:
      platform: incus
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          count: 0
          nodes: {}
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
    expect:
      terraform:
        - name: compute
          path: compute/incus

  # Edge: flux concurrency derived from cluster CPU on docker workstation (not clamped).
  - name: docker workstation derives flux concurrency from cpu/memory
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 8
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      terraform:
        - name: gitops
          path: gitops/flux
          inputs:
            concurrency: 4

  # Edge: gitops.concurrency overrides the cpu/memory-derived formula, e.g.
  # for a CI runner where the container's quota is most of the host's own.
  - name: gitops.concurrency overrides the derived flux concurrency
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      gitops:
        concurrency: 2
      cluster:
        driver: talos
        controlplanes:
          cpu: 8
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      terraform:
        - name: gitops
          path: gitops/flux
          inputs:
            concurrency: 2

  # Edge: docker-desktop — no lb kustomize components. Asserts workstation inputs use 4+len(registries) for IPs.
  - name: docker-desktop workstation has node hostport dns and no lb
    values:
      platform: docker
      workstation:
        runtime: docker-desktop
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: workstation
          path: workstation/docker
          inputs:
            webhook_host: "10.5.0.10"
        - name: cluster
          path: cluster/talos
        - name: gitops
          path: gitops/flux
          destroy: false
    exclude:
      kustomize:
        - name: lb-install
        - name: lb-resources

  # Edge: custom webhook token propagates to all three workstation variants and gitops/flux so the sha256 hash matches.
  - name: custom webhook token propagates to docker-desktop workstation and gitops
    values:
      platform: docker
      workstation:
        runtime: docker-desktop
        git:
          livereload: true
      gitops:
        webhook:
          token: mysecrettoken
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: workstation
          path: workstation/docker
          inputs:
            webhook_token: mysecrettoken
        - name: gitops
          path: gitops/flux
          inputs:
            webhook_token: mysecrettoken

  - name: custom webhook token propagates to colima workstation and gitops
    values:
      platform: docker
      workstation:
        runtime: colima
        git:
          livereload: true
      gitops:
        webhook:
          token: mysecrettoken
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: workstation
          path: workstation/docker
          inputs:
            webhook_token: mysecrettoken
        - name: gitops
          path: gitops/flux
          inputs:
            webhook_token: mysecrettoken

  - name: custom webhook token propagates to incus workstation and gitops
    values:
      platform: incus
      workstation:
        runtime: colima
        git:
          livereload: true
      gitops:
        webhook:
          token: mysecrettoken
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 1
          volumes:
            - /var/mnt/local
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers:
          - endpoint: 10.5.0.20:50000
            node: 10.5.0.20
            hostname: worker-1
    expect:
      terraform:
        - name: workstation
          path: workstation/incus
          inputs:
            webhook_token: mysecrettoken
        - name: gitops
          path: gitops/flux
          inputs:
            webhook_token: mysecrettoken

  # Edge: gitops.mode=pull disables the Flux Receiver (kustomize) and tells the
  # workstation + gitops terraform modules to skip notification-controller/webhook.
  - name: gitops mode pull disables receiver component and notification controller
    values:
      platform: docker
      workstation:
        runtime: docker-desktop
      gitops:
        mode: pull
        repository:
          name: flux-primary
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: workstation
          path: workstation/docker
          inputs:
            webhook_enabled: false
        - name: gitops
          path: gitops/flux
          destroy: false
          inputs:
            mode: pull
    exclude:
      flux:
        - name: gitops

  # compute.host_cpu/host_memory (from the Docker daemon, via `docker info`)
  # exceed the quota: the control plane reserves the gap plus the
  # control-plane slice. Only controlplane_config_patches carries it —
  # common_config_patches (shared with workers) stays untouched.
  - name: docker workstation reserves the host-to-quota gap for the control plane
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 3
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
        host_cpu: 4
        host_memory: 16
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplane_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    systemReserved:
                      cpu: 1500m
                      memory: 9Gi

  # compute.host_cpu exceeds the quota but host_memory matches it: only the
  # cpu key reserves a gap, memory is omitted (regression for a bug where
  # the memory floor activated on the cpu gap instead of its own).
  - name: docker workstation reserves a cpu gap without inflating memory
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 3
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
        host_cpu: 4
        host_memory: 8
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplane_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    systemReserved:
                      cpu: 1500m
                      memory: 0Gi

  # compute.host_memory exceeds the quota but host_cpu matches it: only the
  # memory key reserves a gap. Regression for the mirror-image bug where a
  # cpu-only gate would have skipped the memory reservation entirely.
  - name: docker workstation reserves a memory gap without a cpu gap
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 4
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
        host_cpu: 4
        host_memory: 10
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplane_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    systemReserved:
                      cpu: 0m
                      memory: 3Gi

  # Controlplanes and workers commonly run different quotas against the same
  # shared host; each role reserves its own gap independently, not the
  # controlplane's gap broadcast to every node.
  - name: docker workstation reserves independent gaps for controlplanes and workers
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 3
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          count: 1
          cpu: 6
          memory: 10
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers:
          - endpoint: 10.5.0.20:6443
            node: 10.5.0.20
            hostname: worker-1
        host_cpu: 8
        host_memory: 20
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplane_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    systemReserved:
                      cpu: 5500m
                      memory: 13Gi
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 60m
                      memory: 1382Mi
                    systemReserved:
                      cpu: 2500m
                      memory: 11Gi

  # compute.host_cpu matches the quota (host and quota are the same size, e.g.
  # a dedicated runner): no gap to reserve.
  - name: docker workstation with host at quota size sets no kubelet reservation
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 4
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
        host_cpu: 4
        host_memory: 8
    expect:
      terraform:
        - name: cluster
          path: cluster/talos

  # compute.host_cpu absent (e.g. an upgrade where the compute step hasn't
  # re-applied yet): no reservation, not a composition error.
  - name: docker workstation without compute host output sets no kubelet reservation
    values:
      platform: docker
      workstation:
        runtime: colima
      dns: *default-dns
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
