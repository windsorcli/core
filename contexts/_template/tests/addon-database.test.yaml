# addon-database.yaml facet tests
# Tests CloudNativePG database operator with HA and observability integration

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local


cases:
  # Minimal: dev mode enables database addon.
  - name: minimal config creates database with defaults via dev mode
    values:
      platform: metal
      dev: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Full: database with HA and observability.
  - name: full config creates database with HA and observability integration
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      topology: ha
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
      observability:
        enabled: true
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
              - cloudnativepg/ha
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Regression: cloudnativepg's HelmRelease depends on the kube-prometheus-stack
  # HelmRelease, so database must depend on telemetry too. Otherwise destroy tears
  # telemetry down first and cloudnativepg's HelmRelease can never clear that dependency.
  - name: database depends on telemetry when the metrics pipeline is enabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      telemetry:
        metrics:
          enabled: true
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
            - telemetry-install

  # Regression: the dependsOn expression is an OR across metrics and logs, so the
  # logs-only branch needs its own case independent of the metrics one above.
  - name: database depends on telemetry when only the logs pipeline is enabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      telemetry:
        metrics:
          enabled: false
        logs:
          enabled: true
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
            - telemetry-install

  # Regression: the dashboard patch has no dependency on telemetry-install (a plain
  # ConfigMap Grafana's sidecar loads regardless of the telemetry pipeline's state), so
  # disabling telemetry entirely must not affect composition.
  - name: cloudnativepg dashboard patch composes with telemetry fully disabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      telemetry:
        metrics:
          enabled: false
        logs:
          enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
      observability:
        enabled: true
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Edge case: Explicit disable
  - name: excludes database when disabled
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      database:
        postgres:
          enabled: false
    exclude:
      flux:
        - name: database

  # Edge case: HA disabled explicitly - database created without HA component
  - name: creates database without HA when topology is multi-node
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      topology: multi-node
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus

  # rds driver installs Crossplane (kustomize/provisioning) instead of CNPG;
  # the driver's own database-specific consumption (ProviderConfig,
  # monitoring, app-role) is a separate database-named system so it lands
  # in system-database, not system-provisioning.
  # Regression (cli#3303): an install tier with an empty components list
  # used to compile to no Kustomization at all; install: {} here confirms
  # it still renders, so the namespace its own kustomization.yaml carries
  # still lands.
  - name: rds driver installs crossplane and provider-aws-rds
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    expect:
      flux:
        - name: provisioning
          install:
            components:
              - crossplane
          resources:
            - components:
                - crossplane/aws-rds
                - crossplane/provider-sql
              healthCheckExprs:
                - apiVersion: pkg.crossplane.io/v1
                  kind: Provider
                  current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') && status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
        - name: database
          install: {}
          resources:
            - dependsOn:
                - provisioning-resources
              components:
                - crossplane/postgres
                - crossplane/postgres/_shared/monitoring-exporter
                - crossplane/postgres/aws-rds

  # Regression (#2653): provisioning-install must outlive the Provider CR so
  # destroy tears the Provider down while Crossplane's engine can still clear
  # its package-manager finalizer, instead of leaving it stuck and blocking
  # crds-core's CRD cleanup. provisioning-resources depending on
  # provisioning-install is implicit in the tier model, not assertable here;
  # database-resources's own dependsOn on provisioning-resources is.
  - name: rds driver keeps provisioning-install alive until the Provider CR is gone
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    expect:
      flux:
        - name: database
          resources:
            - dependsOn:
                - provisioning-resources

  # Regression (#2653): Azure twin of the rds case above. Same ordering
  # guarantee, and the Azure path also carries crossplane_azure_client_id/
  # crossplane_azure_tenant_id substitutions on provisioning's own resources
  # tier.
  - name: flexibleserver driver keeps provisioning-install alive until the Provider CR is gone
    values:
      platform: azure
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: flexibleserver
    expect:
      flux:
        - name: database
          resources:
            - dependsOn:
                - provisioning-resources

  # cloudsql driver installs Crossplane (kustomize/provisioning) instead of
  # CNPG — GCP twin of the rds case above.
  - name: cloudsql driver installs crossplane and provider-gcp-sql
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
    expect:
      flux:
        - name: provisioning
          install:
            components:
              - crossplane
          resources:
            - components:
                - crossplane/gcp-cloudsql
                - crossplane/provider-sql
              healthCheckExprs:
                - apiVersion: pkg.crossplane.io/v1
                  kind: Provider
                  current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') && status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
        - name: database
          install: {}
          resources:
            - dependsOn:
                - provisioning-resources
              components:
                - crossplane/postgres
                - crossplane/postgres/_shared/monitoring-exporter
                - crossplane/postgres/gcp-cloudsql

  # Regression (#2653): GCP twin of the rds/flexibleserver cases above. Same
  # ordering guarantee.
  - name: cloudsql driver keeps provisioning-install alive until the Provider CR is gone
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
    expect:
      flux:
        - name: database
          resources:
            - dependsOn:
                - provisioning-resources

  # PodMonitor only exists once the metrics pipeline vendors
  # prometheus-operator's CRDs, so the exporter's generate policy is
  # excluded when it's off — the RBAC/CronJob generate policies (plain
  # crossplane/postgres/aws-rds) don't touch that CRD and stay unconditional.
  - name: rds driver excludes monitoring-exporter when metrics disabled
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
      telemetry:
        metrics:
          enabled: false
    expect:
      flux:
        - name: database
          resources:
            - components:
                - crossplane/postgres/aws-rds
    exclude:
      flux:
        - name: database
          resources:
            - components:
                - crossplane/postgres/_shared/monitoring-exporter

  # PodMonitor only exists once the metrics pipeline vendors
  # prometheus-operator's CRDs — GCP twin of the rds case above.
  - name: cloudsql driver excludes monitoring-exporter when metrics disabled
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
      telemetry:
        metrics:
          enabled: false
    expect:
      flux:
        - name: database
          resources:
            - components:
                - crossplane/postgres/gcp-cloudsql
    exclude:
      flux:
        - name: database
          resources:
            - components:
                - crossplane/postgres/_shared/monitoring-exporter

  # rds driver with observability enabled gets the postgres_exporter
  # dashboard, not the cloudnativepg one — the two are mutually exclusive.
  - name: rds driver with observability enables postgres-exporter dashboard
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
      observability:
        enabled: true
    expect:
      flux:
        - name: observability
          resources:
            - components:
                - grafana/dashboards/postgres-exporter

  # cloudsql driver with observability enabled gets the postgres_exporter
  # dashboard, not the cloudnativepg one — GCP twin of the rds case above.
  - name: cloudsql driver with observability enables postgres-exporter dashboard
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
      observability:
        enabled: true
    expect:
      flux:
        - name: observability
          resources:
            - components:
                - grafana/dashboards/postgres-exporter

  # Regression: the cloudnativepg driver (default) must not install Crossplane.
  - name: cloudnativepg driver excludes crossplane provisioning
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    exclude:
      flux:
        - name: provisioning

  # Schema: driver: rds installs AWS-specific IAM/Terraform wiring, so it's
  # rejected on any other platform rather than silently composing nothing.
  - name: rds driver on a non-aws platform fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      database:
        postgres:
          enabled: true
          driver: rds
    expectError: true

  # database.postgres.driver: rds wires a dedicated KMS key (database stack,
  # manage_encryption_key defaults on) and the Crossplane IAM/Pod-Identity
  # stack, both independent of the cluster stack itself.
  - name: rds driver wires the database key and crossplane-identity stacks
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    terraformOutputs:
      network:
        vpc_id: vpc-12345678
        db_subnet_group_name: test-rds
      cluster:
        cluster_name: cluster-test
        cluster_arn: arn:aws:eks:us-west-2:123456789012:cluster/cluster-test
        cluster_security_group_id: sg-0eks1234
      database:
        kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
    expect:
      terraform:
        - name: database
          path: database/aws-rds
          dependsOn:
            - network
            - cluster
          inputs:
            manage_encryption_key: true
            vpc_id: vpc-12345678
            cluster_security_group_id: sg-0eks1234
        - name: crossplane-identity
          path: provisioning/crossplane-identity/aws
          dependsOn:
            - network
            - cluster
            - database
          inputs:
            resources:
              - rds
            cluster_name: cluster-test
            cluster_arn: arn:aws:eks:us-west-2:123456789012:cluster/cluster-test
            db_subnet_group_name: test-rds
            kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab

  # ephemeral contexts skip the dedicated CMK in favor of the AWS-managed
  # default key.
  - name: ephemeral rds context skips the dedicated encryption key
    values:
      platform: aws
      aws:
        region: us-west-2
      ephemeral: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    expect:
      terraform:
        - name: database
          path: database/aws-rds
          inputs:
            manage_encryption_key: false

  # database.postgres.encryption.kms_key_arn threads a caller-supplied key
  # straight through, bypassing the dedicated CMK entirely.
  - name: rds driver with a supplied kms_key_arn passes it through
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
          encryption:
            kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
    expect:
      terraform:
        - name: database
          path: database/aws-rds
          inputs:
            kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab

  # database disabled (default cloudnativepg driver) renders neither stack.
  - name: no rds driver excludes the database and crossplane-identity stacks
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
    exclude:
      terraform:
        - name: database
        - name: crossplane-identity

  # flexibleserver driver wires database/azure-postgres and
  # crossplane-identity — Azure twin of the rds test above.
  - name: flexibleserver driver wires the database and crossplane-identity stacks
    values:
      platform: azure
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: flexibleserver
    terraformOutputs:
      network:
        region: eastus2
        vnet_id: /subscriptions/sub/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet-test
        flexibleserver_subnet_id: /subscriptions/sub/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet-test/subnets/flexibleserver-test
        private_subnet_cidrs:
          - 10.0.0.0/20
      cluster:
        cluster_name: cluster-test
        resource_group_name: cluster-test-rg
        cluster_oidc_issuer_url: https://eastus.oic.prod-aks.azure.com/tenant-id/oidc-id/
      database:
        resource_group_id: /subscriptions/sub/resourceGroups/cluster-test-postgres
    expect:
      terraform:
        - name: database
          path: database/azure-postgres
          dependsOn:
            - network
            - cluster
          inputs:
            region: eastus2
            manage_encryption_key: true
            vnet_id: /subscriptions/sub/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet-test
            flexibleserver_subnet_id: /subscriptions/sub/resourceGroups/rg-net/providers/Microsoft.Network/virtualNetworks/vnet-test/subnets/flexibleserver-test
            allowed_subnet_cidrs:
              - 10.0.0.0/20
        - name: crossplane-identity
          path: provisioning/crossplane-identity/azure
          dependsOn:
            - network
            - cluster
            - database
          inputs:
            region: eastus2
            resources:
              - postgres
            resource_group_name: cluster-test-rg
            cluster_name: cluster-test
            oidc_issuer_url: https://eastus.oic.prod-aks.azure.com/tenant-id/oidc-id/
            postgres_resource_group_id: /subscriptions/sub/resourceGroups/cluster-test-postgres

  # ephemeral contexts skip the dedicated Key Vault key in favor of
  # Flexible Server's platform-managed encryption.
  - name: ephemeral flexibleserver context skips the dedicated encryption key
    values:
      platform: azure
      ephemeral: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: flexibleserver
    expect:
      terraform:
        - name: database
          path: database/azure-postgres
          inputs:
            manage_encryption_key: false

  # database.postgres.encryption.key_vault_key_id threads a caller-supplied
  # key straight through, bypassing the dedicated Key Vault entirely.
  - name: flexibleserver driver with a supplied key_vault_key_id passes it through
    values:
      platform: azure
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: flexibleserver
          encryption:
            key_vault_key_id: https://byok.vault.azure.net/keys/postgres/abcd1234
    expect:
      terraform:
        - name: database
          path: database/azure-postgres
          inputs:
            key_vault_key_id: https://byok.vault.azure.net/keys/postgres/abcd1234

  # database disabled (default cloudnativepg driver) renders neither stack.
  - name: no flexibleserver driver excludes the database and crossplane-identity stacks
    values:
      platform: azure
      gateway:
        enabled: false
    exclude:
      terraform:
        - name: database
        - name: crossplane-identity

  # cloudsql driver wires database/gcp-cloudsql and crossplane-identity —
  # GCP twin of the rds/flexibleserver tests above.
  - name: cloudsql driver wires the database and crossplane-identity stacks
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
    terraformOutputs:
      network:
        region: us-east1
        network_id: projects/windsor-test/global/networks/vpc-test
      cluster:
        cluster_name: cluster-test
    expect:
      terraform:
        - name: database
          path: database/gcp-cloudsql
          dependsOn:
            - network
            - cluster
          inputs:
            project_id: windsor-test
            region: us-east1
            network_id: projects/windsor-test/global/networks/vpc-test
            manage_encryption_key: true
        - name: crossplane-identity
          path: provisioning/crossplane-identity/gcp
          dependsOn:
            - network
            - cluster
            - database
          inputs:
            project_id: windsor-test
            cluster_name: cluster-test
            resources:
              - postgres

  # ephemeral contexts skip the dedicated KMS key in favor of Cloud SQL's
  # platform-managed encryption.
  - name: ephemeral cloudsql context skips the dedicated encryption key
    values:
      platform: gcp
      ephemeral: true
      gcp:
        project_id: windsor-test
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
    expect:
      terraform:
        - name: database
          path: database/gcp-cloudsql
          inputs:
            manage_encryption_key: false

  # database.postgres.encryption.kms_key_name threads a caller-supplied key
  # straight through, bypassing the dedicated key ring entirely.
  - name: cloudsql driver with a supplied kms_key_name passes it through
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
          encryption:
            kms_key_name: projects/windsor-test/locations/us-central1/keyRings/byok/cryptoKeys/postgres
    expect:
      terraform:
        - name: database
          path: database/gcp-cloudsql
          inputs:
            kms_key_name: projects/windsor-test/locations/us-central1/keyRings/byok/cryptoKeys/postgres

  # database disabled (default cloudnativepg driver) renders neither stack.
  - name: no cloudsql driver excludes the database and crossplane-identity stacks
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      gateway:
        enabled: false
    exclude:
      terraform:
        - name: database
        - name: crossplane-identity
