# addon-database.yaml facet tests
# Tests CloudNativePG database operator with HA and observability integration

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local


cases:
  # Minimal: dev mode enables database addon. Intended: addon observability (grafana/dashboards/cloudnativepg) overrides. See docs/cli-bugs.md if this fails.
  - name: minimal config creates database with defaults via dev mode
    values:
      platform: metal
      dev: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Full: database with HA and observability. Intended: addon observability overrides. See docs/cli-bugs.md if this fails.
  - name: full config creates database with HA and observability integration
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      topology: ha
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
      observability:
        enabled: true
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
              - cloudnativepg/ha
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Regression: cloudnativepg's HelmRelease depends on the kube-prometheus-stack
  # HelmRelease, so database must depend on telemetry too. Otherwise destroy tears
  # telemetry down first and cloudnativepg's HelmRelease can never clear that dependency.
  - name: database depends on telemetry when the metrics pipeline is enabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      telemetry:
        metrics:
          enabled: true
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
            - telemetry-install

  # Regression: the dependsOn expression is an OR across metrics and logs, so the
  # logs-only branch needs its own case independent of the metrics one above.
  - name: database depends on telemetry when only the logs pipeline is enabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      telemetry:
        metrics:
          enabled: false
        logs:
          enabled: true
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
            - telemetry-install

  # Regression: the dashboard patch has no dependency on telemetry-install (a plain
  # ConfigMap Grafana's sidecar loads regardless of the telemetry pipeline's state), so
  # disabling telemetry entirely must not affect composition.
  - name: cloudnativepg dashboard patch composes with telemetry fully disabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      telemetry:
        metrics:
          enabled: false
        logs:
          enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
      observability:
        enabled: true
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Edge case: Explicit disable
  - name: excludes database when disabled
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      database:
        postgres:
          enabled: false
    exclude:
      flux:
        - name: database

  # Edge case: HA disabled explicitly - database created without HA component
  - name: creates database without HA when topology is multi-node
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      topology: multi-node
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus

  # rds driver installs Crossplane (kustomize/provisioning) instead of CNPG.
  - name: rds driver installs crossplane and provider-aws-rds
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    expect:
      flux:
        - name: provisioning
          install:
            components:
              - crossplane
          resources:
            - dependsOn:
                - provisioning-providers-install
              components:
                - crossplane/aws-rds
                - crossplane/aws-rds/monitoring-exporter
        - name: provisioning-providers
          path: provisioning
          dependsOn:
            - provisioning-install
          install:
            components:
              - crossplane/aws-rds
            healthCheckExprs:
              - apiVersion: pkg.crossplane.io/v1
                kind: Provider
                current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') && status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
      crds:
        - crossplane-2.4.0
    exclude:
      flux:
        - name: database

  # Regression (#2653): provisioning-install must outlive the Provider CR so
  # destroy tears the Provider down while Crossplane's engine can still clear
  # its package-manager finalizer, instead of leaving it stuck and blocking
  # crds-core's CRD cleanup. provisioning-providers-install carries the
  # dependsOn on provisioning-install directly; provisioning-resources adds
  # an explicit dependsOn on provisioning-providers alongside its implicit
  # dependsOn on provisioning-install.
  - name: rds driver keeps provisioning-install alive until the Provider CR is gone
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    expect:
      flux:
        - name: provisioning-providers
          path: provisioning
          dependsOn:
            - provisioning-install
        - name: provisioning
          resources:
            - dependsOn:
                - provisioning-providers-install

  # Regression (#2653): Azure twin of the rds case above. Same ordering
  # guarantee, and the Azure path also moves crossplane_azure_client_id/
  # crossplane_azure_tenant_id substitutions onto provisioning-providers.
  - name: flexibleserver driver keeps provisioning-install alive until the Provider CR is gone
    values:
      platform: azure
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: flexibleserver
    expect:
      flux:
        - name: provisioning-providers
          path: provisioning
          dependsOn:
            - provisioning-install
        - name: provisioning
          resources:
            - dependsOn:
                - provisioning-providers-install

  # PodMonitor only exists once the metrics pipeline vendors
  # prometheus-operator's CRDs, so the exporter's generate policy is
  # excluded when it's off — the RBAC/CronJob generate policies (plain
  # crossplane/aws-rds) don't touch that CRD and stay unconditional.
  - name: rds driver excludes monitoring-exporter when metrics disabled
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
      telemetry:
        metrics:
          enabled: false
    expect:
      flux:
        - name: provisioning
          resources:
            - components:
                - crossplane/aws-rds
    exclude:
      flux:
        - name: provisioning
          resources:
            - components:
                - crossplane/aws-rds/monitoring-exporter

  # rds driver with observability enabled gets the postgres_exporter
  # dashboard, not the cloudnativepg one — the two are mutually exclusive.
  - name: rds driver with observability enables postgres-exporter dashboard
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
      observability:
        enabled: true
    expect:
      flux:
        - name: observability
          resources:
            - components:
                - grafana/dashboards/postgres-exporter

  # Regression: the cloudnativepg driver (default) must not install Crossplane.
  - name: cloudnativepg driver excludes crossplane provisioning
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    exclude:
      flux:
        - name: provisioning
        - name: provisioning-providers

  # Schema: driver: rds installs AWS-specific IAM/Terraform wiring, so it's
  # rejected on any other platform rather than silently composing nothing.
  - name: rds driver on a non-aws platform fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      database:
        postgres:
          enabled: true
          driver: rds
    expectError: true
