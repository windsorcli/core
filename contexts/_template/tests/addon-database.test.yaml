# addon-database.yaml facet tests
# Tests CloudNativePG database operator with HA and observability integration

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local


cases:
  # Minimal: dev mode enables database addon. Intended: addon observability (grafana/dashboards/cloudnativepg) overrides. See docs/cli-bugs.md if this fails.
  - name: minimal config creates database with defaults via dev mode
    values:
      platform: metal
      dev: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Full: database with HA and observability. Intended: addon observability overrides. See docs/cli-bugs.md if this fails.
  - name: full config creates database with HA and observability integration
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      topology: ha
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
      observability:
        enabled: true
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
              - cloudnativepg/ha
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Regression: the dashboard patch has no dependency on telemetry-install (a plain
  # ConfigMap Grafana's sidecar loads regardless of the telemetry pipeline's state), so
  # disabling telemetry entirely must not affect composition.
  - name: cloudnativepg dashboard patch composes with telemetry fully disabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      telemetry:
        metrics:
          enabled: false
        logs:
          enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
      observability:
        enabled: true
    expect:
      flux:
        - name: observability
          resources:
            - components:
                - grafana/dashboards/cloudnativepg

  # Edge case: Explicit disable
  - name: excludes database when disabled
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      database:
        postgres:
          enabled: false
    exclude:
      flux:
        - name: database

  # Edge case: HA disabled explicitly - database created without HA component
  - name: creates database without HA when topology is multi-node
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      topology: multi-node
      database:
        postgres:
          enabled: true
          driver: cloudnativepg
    expect:
      flux:
        - name: database
          dependsOn:
            - csi-install
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
