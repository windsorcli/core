# addon-private-dns-pdns.yaml facet tests
# PowerDNS for private DNS zones, with external-dns writing through the API.

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  - name: cilium gateway exposes PowerDNS through a LoadBalancer and waits for the database
    values:
      platform: metal
      dev: true
      dns:
        private_domain: test
        private:
          driver: pdns
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          dependsOn:
            - database-install
            - cni-install
          install:
            components:
              - pdns
              - pdns/database
              - pdns/zone-init
              - pdns/network-policy
              - pdns/prometheus
              - pdns/loadbalancer
              - pdns/cilium
            substitutions:
              private_domain: test
              public_domain: ""
            healthCheckExprs:
              - apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
          resources:
            - name: private
              components:
                - external-dns/providers/pdns
              substitutions:
                external_dns_domain: test
        - name: database
    exclude:
      flux:
        - name: dns
          install:
            components:
              - coredns
              - coredns/etcd
              - pdns/ha
              - pdns/gateway
          resources:
            - name: private
              components:
                - external-dns/providers/coredns

  - name: envoy gateway routes port 53 to PowerDNS
    values:
      platform: metal
      dev: true
      dns:
        private_domain: test
        private:
          driver: pdns
      gateway:
        enabled: true
        driver: envoy
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          dependsOn:
            - database-install
            - gateway-install
          install:
            components:
              - pdns/gateway
          resources:
            - name: private
              components:
                - external-dns/providers/pdns
                - external-dns/sources/gateway-httproute
    exclude:
      flux:
        - name: dns
          install:
            components:
              - pdns/loadbalancer
              - pdns/cilium

  - name: topology ha scales PowerDNS and the database
    values:
      platform: metal
      dev: true
      topology: ha
      dns:
        private_domain: test
        private:
          driver: pdns
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          install:
            components:
              - pdns/ha
        - name: database
          install:
            components:
              - cloudnativepg
              - cloudnativepg/ha

  - name: public domain adds a public external-dns instance and zone
    values:
      platform: metal
      dev: true
      dns:
        public_domain: public.example.com
        private_domain: internal.example.com
        private:
          driver: pdns
      gateway:
        internal:
          ip: "10.5.1.10"
        external:
          ip: "10.5.1.11"
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          install:
            substitutions:
              private_domain: internal.example.com
              public_domain: public.example.com
          resources:
            - name: public
              components:
                - external-dns/providers/pdns
              substitutions:
                external_dns_name: external-dns-public
                external_dns_domain: public.example.com
            - name: private
              components:
                - external-dns/providers/pdns
              substitutions:
                external_dns_name: external-dns-private
                external_dns_domain: internal.example.com

  - name: aws pdns driver replaces the cloud private zone provider
    values:
      platform: aws
      aws:
        region: us-west-2
      dns:
        private_domain: internal.example.com
        private:
          driver: pdns
          pdns:
            api_key: test-api-key
    terraformOutputs:
      network:
        private_zone_id: Z9PRIVATEZONE
    expect:
      flux:
        - name: dns
          install:
            components:
              - pdns
          resources:
            - name: private
              components:
                - external-dns/providers/pdns
    exclude:
      flux:
        - name: dns
          resources:
            - name: private
              components:
                - external-dns/providers/route53

  - name: pdns driver outside dev mode without an API key fails composition
    values:
      platform: metal
      dns:
        private_domain: internal.example.com
        private:
          driver: pdns
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    expectError: true

  - name: pdns driver without a private domain fails composition
    values:
      platform: metal
      dns:
        private:
          driver: pdns
          pdns:
            api_key: test-api-key
      network: *default-network
      cluster: *default-cluster
    expectError: true

  - name: pdns driver with the PostgreSQL service disabled fails composition
    values:
      platform: metal
      dev: true
      database:
        postgres:
          enabled: false
      dns:
        private_domain: test
        private:
          driver: pdns
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    expectError: true

  - name: pdns driver with a NodePort internal gateway fails composition
    values:
      platform: metal
      dev: true
      dns:
        private_domain: example.local
        private:
          driver: pdns
      gateway:
        enabled: true
        driver: envoy
        internal:
          service_type: NodePort
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expectError: true

  - name: coredns driver does not render the pdns facet
    values:
      platform: metal
      dev: true
      dns:
        private_domain: test
        private:
          driver: coredns
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          install:
            components:
              - coredns
    exclude:
      flux:
        - name: dns
          install:
            components:
              - pdns
