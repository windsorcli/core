# platform-aws-talos.yaml facet tests: cluster.driver talos on aws launches Talos EC2 nodes instead of an EKS cluster.

x-defaults:
  aws: &default-aws
    region: us-east-2

  terraform-outputs: &default-terraform-outputs
    network:
      private_subnet_ids:
        - subnet-aaa
        - subnet-bbb
    compute:
      controlplanes:
        - endpoint: 10.5.1.37:50000
          node: 10.5.1.37
          hostname: controlplane-1
      workers: []

cases:
  - name: talos on aws launches nodes in the VPC it creates
    values:
      platform: aws
      aws: *default-aws
      gateway:
        enabled: false
      cluster:
        driver: talos
        controlplanes:
          instance_type: m6a.2xlarge
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: backend
          path: backend/s3
        - name: network
          path: network/aws-vpc
          dependsOn:
            - backend
          inputs:
            single_nat_gateway: true
        - name: compute
          path: compute/aws-ec2
          dependsOn:
            - backend
            - network
          inputs:
            region: us-east-2
            subnet_id: subnet-aaa
            controlplanes:
              - hostname: controlplane-1
                node: null
            workers: []
            controlplane_instance_type: m6a.2xlarge
            controlplane_root_volume:
              size: 100
              iops: 3000
              throughput: 125
            ephemeral: false
        - name: cluster
          path: cluster/talos
          dependsOn:
            - pki
            - compute
          inputs:
            cluster_endpoint: https://10.5.1.37:6443
            controlplanes:
              - endpoint: 10.5.1.37:50000
                node: 10.5.1.37
                hostname: controlplane-1
        - name: gitops
          path: gitops/flux
          dependsOn:
            - cluster
    exclude:
      terraform:
        - name: cluster-additions
      flux:
        - name: lb
        - name: compute
      crds:
        - aws-load-balancer-controller-3.6.0

  - name: talos on aws uses an existing subnet and declared node addresses
    values:
      platform: aws
      ephemeral: true
      aws: *default-aws
      terraform:
        backend:
          type: local
      gateway:
        enabled: false
      network:
        cidr_block: 10.150.0.0/16
        subnet_id: subnet-0123456789abcdef0
      cluster:
        driver: talos
        controlplanes:
          instance_type: m6a.2xlarge
          root_disk_size: 200
          root_disk_iops: 6000
          root_disk_throughput: 250
          nodes:
            controlplane-1:
              endpoint: 10.150.1.37:50000
              node: 10.150.1.37
              hostname: controlplane-1
        workers:
          count: 1
          instance_type: m6a.large
          root_disk_size: 50
          nodes:
            worker-1:
              endpoint: 10.150.1.40:50000
              node: 10.150.1.40
              hostname: worker-1
    expect:
      terraform:
        - name: compute
          path: compute/aws-ec2
          inputs:
            subnet_id: subnet-0123456789abcdef0
            controlplanes:
              - hostname: controlplane-1
                node: 10.150.1.37
            workers:
              - hostname: worker-1
                node: 10.150.1.40
            worker_instance_type: m6a.large
            controlplane_root_volume:
              size: 200
              iops: 6000
              throughput: 250
            worker_root_volume:
              size: 50
              iops: 3000
              throughput: 125
            ephemeral: true
    exclude:
      terraform:
        - name: network
        - name: backend

  - name: talos on aws generates a hostname per counted worker
    values:
      platform: aws
      aws: *default-aws
      gateway:
        enabled: false
      cluster:
        driver: talos
        controlplanes:
          instance_type: m6a.2xlarge
        workers:
          count: 2
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: compute
          path: compute/aws-ec2
          inputs:
            workers:
              - hostname: worker-1
                node: null
              - hostname: worker-2
                node: null

  - name: talos on aws without an instance type fails
    values:
      platform: aws
      aws: *default-aws
      gateway:
        enabled: false
      cluster:
        driver: talos
    expectError: true

  - name: talos on aws with a public domain fails
    values:
      platform: aws
      aws: *default-aws
      email: ops@example.com
      gateway:
        enabled: false
      dns:
        public_domain: example.com
      cluster:
        driver: talos
        controlplanes:
          instance_type: m6a.2xlarge
    expectError: true

  - name: talos on aws with a LoadBalancer gateway fails
    values:
      platform: aws
      aws: *default-aws
      cluster:
        driver: talos
        controlplanes:
          instance_type: m6a.2xlarge
    expectError: true
