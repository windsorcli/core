# option-gateway.yaml facet tests
# Tests configurable gateway and legacy ingress compatibility.

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

  # CRDs (gateway-api, envoy-gateway) live in the blueprint's top-level `crds:`
  # section, not in `flux:`. Kustomizations do not name individual CRDs in
  # dependsOn; the composer wires only dependency-less roots to the `crds` layer,
  # and gateway-install/gateway-resources are not roots.

  # Shared assertion: gateway install tier with envoy.
  gateway-install-envoy: &gateway-install-envoy
    components:
      - envoy
      - envoy/prometheus
    timeout: 10m
    interval: 5m

  # Shared assertion: gateway install tier with cilium. Installs independently;
  # Gateway API CRDs come from the crds layer, so neither cni nor the controller
  # order against each other.
  gateway-install-cilium: &gateway-install-cilium
    components:
      - cilium
    timeout: 10m
    interval: 5m

  # Shared assertion: external gateway resources variant, envoy + loadbalancer mode.
  gateway-resources-envoy: &gateway-resources-envoy
    name: external
    dependsOn:
      - pki-resources
    components:
      - envoy/base
      - envoy/loadbalancer
      - envoy/parameters
      - envoy/default-404
      - envoy/default-404/external-dns
    substitutions:
      gateway_name: external
      gateway_class_name: envoy
      gateway_lb_scheme: internet-facing
    timeout: 10m
    interval: 5m

  # Shared assertion: internal gateway variant, with the utility components.
  gateway-resources-envoy-internal: &gateway-resources-envoy-internal
    name: internal
    dependsOn:
      - pki-resources
    components:
      - envoy/base
      - envoy/loadbalancer
      - envoy/parameters
      - envoy/default-404
      - envoy/default-404/external-dns
      - flux-webhook
    substitutions:
      gateway_name: internal
      gateway_class_name: envoy
      gateway_cert_issuer: private
    timeout: 10m
    interval: 5m

  gateway-resources-cilium: &gateway-resources-cilium
    name: external
    dependsOn:
      - pki-resources
      - cni-install
    substitutions:
      gateway_class_name: cilium
      gateway_loadbalancer_ip: "10.5.1.10"
    timeout: 10m
    interval: 5m

  # Internal variant: the single-gateway case takes the pool start.
  gateway-resources-cilium-internal: &gateway-resources-cilium-internal
    name: internal
    dependsOn:
      - pki-resources
      - cni-install
    substitutions:
      gateway_class_name: cilium
    timeout: 10m
    interval: 5m

cases:
  # Zero config on metal: the cilium gateway, with dns.private_domain standing in for the dev default.
  - name: zero config on metal defaults to cilium gateway
    values:
      gateway:
        internal:
          ip: "10.5.1.10"
      platform: metal
      dns:
        private_domain: test
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-cilium
          resources:
            - <<: *gateway-resources-cilium-internal
      crds:
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
        - gateway-api-experimental-1.6.2
    exclude:
      crds:
        # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
        - envoy-gateway-1.9.2

  # Docker Desktop: nodeport (docker-desktop defaults to envoy; no cilium bootstrap)
  - name: Docker Desktop uses nodeport gateway
    values:
      platform: docker
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - name: internal
              components:
                - envoy/base
                - envoy/nodeport
                - envoy/parameters
                - envoy/default-404
                - envoy/default-404/external-dns
                - flux-webhook
              # docker-desktop reaches HTTPS on host :8443 (internal nodeport), so the redirect targets it.
              substitutions:
                gateway_class_name: envoy
                gateway_redirect_port: "8443"

  # Docker Desktop with private DNS: external-dns needs an in-cluster target
  # other than 127.0.0.1 (unreachable from pods). gateway_dns_target points at
  # the dns/docker-desktop Service's fixed ClusterIP instead.
  - name: Docker Desktop with private DNS targets the docker-desktop gateway Service
    values:
      platform: docker
      dev: true
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          resources:
            - components:
                - dns/docker-desktop
              substitutions:
                gateway_dns_target: "10.96.0.53"

  - name: platform docker with runtime colima uses gateway loadbalancer
    values:
      platform: docker
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: colima
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal

  # Envoy driver
  - name: envoy driver deploys gateway-install with envoy and gateway-resources
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          dependsOn:
            - telemetry-install
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal
      crds:
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
        - gateway-api-experimental-1.6.2
        # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
        - envoy-gateway-1.9.2

  # Envoy + Docker Desktop: nodeport variant
  - name: envoy on Docker Desktop uses nodeport variant
    values:
      platform: docker
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - name: internal
              components:
                - envoy/base
                - envoy/nodeport
                - envoy/parameters
                - envoy/default-404
                - envoy/default-404/external-dns
                - flux-webhook

  # Explicit gateway.service_type: NodePort works on any platform (e.g. a bare
  # metal single-node cluster with no cluster LB). Network omits
  # loadbalancer_driver so lb_effective.enabled is false — proves the nodeport
  # component is selected purely from gateway.service_type.
  - name: explicit gateway.service_type NodePort selects nodeport variant on metal with no LB
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
        service_type: NodePort
      network:
        cidr_block: 10.5.0.0/16
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - name: internal
              components:
                - envoy/base
                - envoy/nodeport
                - envoy/parameters
                - envoy/default-404
                - envoy/default-404/external-dns
                - flux-webhook

  # NodePort must suppress lb_effective.enabled even when loadbalancer_driver
  # is configured: a NodePort service will never get a LoadBalancer IP, so
  # lb-address (which patches the Gateway with that IP) and gateway_dns_target
  # must not apply. Uses *default-network which has loadbalancer_driver set,
  # and flannel CNI so lb_effective.enabled would otherwise be true.
  - name: explicit NodePort suppresses lb-address even when loadbalancer_driver is set
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
        service_type: NodePort
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - name: internal
              components:
                - flux-webhook
              substitutions:
                gateway_class_name: envoy

  # Explicit gateway.service_type: LoadBalancer overrides docker-desktop's
  # default NodePort fallback.
  - name: explicit gateway.service_type LoadBalancer overrides docker-desktop default
    values:
      platform: docker
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
        service_type: LoadBalancer
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal

  # Backward compatibility: ingress alias still works
  - name: legacy ingress alias maps envoy-gateway to envoy
    values:
      gateway:
        internal:
          ip: "10.5.1.10"
      platform: metal
      dns:
        private_domain: test
      ingress:
        enabled: true
        driver: envoy-gateway
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal
      crds:
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
        - gateway-api-experimental-1.6.2
        # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
        - envoy-gateway-1.9.2

  - name: legacy ingress alias maps nginx to envoy
    values:
      gateway:
        internal:
          ip: "10.5.1.10"
      platform: metal
      dns:
        private_domain: test
      ingress:
        enabled: true
        driver: nginx
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal

  # Gateway disabled
  - name: excludes gateway when disabled
    values:
      platform: metal
      gateway:
        enabled: false
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: gateway
      crds:
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
        - gateway-api-experimental-1.6.2
        # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
        - envoy-gateway-1.9.2

  # Gateway disabled: gitops is a resources-only system, so it composes to a
  # gitops-resources kustomization with the plain webhook (no webhook/gateway,
  # no gateway-resources dep) and emits neither an install tier nor a flat
  # gitops kustomization.
  - name: gitops without gateway is webhook-only resources tier with no install tier
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - webhook
    exclude:
      kustomize:
        - name: gitops-install
        - name: gitops

  # Flux webhook receiver includes webhook/gateway for Gateway API drivers
  # (push mode is the default, so no explicit gitops.mode needed)
  - name: envoy driver includes webhook/gateway in gitops component
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          dependsOn:
            - gateway-resources-internal
          resources:
            - components:
                - webhook
                - webhook/gateway

  # dev mode enables coredns/gateway via the dns component
  - name: dev mode with envoy adds coredns/gateway to dns component
    values:
      platform: metal
      dev: true
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy

  # Cilium driver — GatewayClass only; controller is part of Cilium CNI DaemonSet
  - name: cilium driver deploys gateway-install with cilium and gateway-resources
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: cilium
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-cilium
          resources:
            - <<: *gateway-resources-cilium-internal

  - name: cilium driver includes webhook/gateway and webhook/gateway/cilium in gitops component
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: cilium
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          dependsOn:
            - gateway-resources-internal
          resources:
            - components:
                - webhook
                - webhook/gateway
                - webhook/gateway/cilium

  # gitops.web_ui exposes the operator web UI through the gateway. It merges
  # into the gitops system (own `when:`, same name) rather than a separate
  # flux-ui system, so it lands in the one gitops-resources kustomization
  # alongside the webhook. Off by default.
  - name: web_ui enabled adds ui component to gitops-resources on envoy
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      gitops:
        web_ui: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          dependsOn:
            - gateway-resources-internal
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - webhook
                - webhook/gateway
                - ui
    exclude:
      kustomize:
        - name: flux-ui-install
        - name: flux-ui

  - name: web_ui enabled on cilium adds ui/cilium to gitops-resources
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: cilium
      gitops:
        web_ui: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          resources:
            - components:
                - webhook
                - webhook/gateway
                - webhook/gateway/cilium
                - ui
                - ui/cilium

  - name: web_ui defaults off so gitops-resources has no ui component
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          resources:
            - components:
                - webhook
                - webhook/gateway

  # lb-address: included when lb_effective.enabled (non-Cilium CNI + loadbalancer_driver set); IP pinned in gateway spec
  - name: local envoy gateway-resources includes lb-address when loadbalancer IP configured
    values:
      platform: metal
      dns:
        public_domain: test
      gateway:
        internal:
          ip: "10.5.1.10"
        external:
          tls:
            issuer: selfsigned
          ip: "10.5.1.11"
        enabled: true
        driver: envoy
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expect:
      flux:
        - name: gateway
          resources:
            - name: external
              components:
                - lb-address
              substitutions:
                gateway_class_name: envoy
                gateway_loadbalancer_ip: "10.5.1.11"

  # AWS uses a cloud-managed LB (lb_effective.enabled == false) and is not cilium,
  # so gateway_loadbalancer_ip and gateway_dns_target both evaluate to "" and are
  # omitted from output. Only gateway_class_name remains.
  - name: aws envoy gateway-resources omits loadbalancer substitutions
    values:
      platform: aws
      aws:
        region: us-west-2
      email: ops@example.com
      dns:
        public_domain: example.com
      gateway:
        enabled: true
        driver: envoy
    expect:
      flux:
        - name: gateway
          resources:
            - name: external
              substitutions:
                gateway_class_name: envoy
              timeout: 10m
              interval: 5m

  # The internal gateway's issuer is always `private`, and gateway_domain is dns.private_domain.
  - name: non-ACME platform defaults gateway_cert_issuer to private and uses private_domain
    values:
      platform: metal
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      dns:
        private_domain: cluster.local
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          resources:
            - name: internal
              substitutions:
                gateway_class_name: envoy
                gateway_cert_issuer: private
                gateway_domain: cluster.local

  # No domain set: neither gateway is provisioned.
  - name: aws with no domain provisions no gateway at all
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: gateway
          resources:
            - name: external
        - name: gateway
          resources:
            - name: internal

  # dns.private_domain alone provisions the internal gateway only, with the private issuer.
  - name: aws with only dns.private_domain provisions the internal gateway with a private issuer
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: true
        driver: envoy
      dns:
        private_domain: example.com
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          resources:
            - name: internal
              substitutions:
                gateway_class_name: envoy
                gateway_cert_issuer: private
                gateway_domain: example.com
                # No docker-desktop host-forward: redirect targets the standard :443.
                gateway_redirect_port: "443"
    exclude:
      flux:
        - name: gateway
          resources:
            - name: external

  # gitops.mode=pull drops the Flux Receiver kustomize entirely and propagates
  # mode=pull to the gitops/flux terraform module (which then skips
  # notification-controller and the webhook-token secret).
  - name: gitops mode pull excludes receiver and propagates pull to gitops terraform
    values:
      platform: metal
      gateway:
        enabled: true
        driver: envoy
      gitops:
        mode: pull
      network: *default-network
      cluster: *default-cluster
    expect:
      terraform:
        - name: gitops
          path: gitops/flux
          inputs:
            mode: pull
    exclude:
      flux:
        - name: gitops

  # The gateway resources tier depends only on pki-resources, since dns-install may not exist.
  - name: gateway resources omit dns-install when dns is enabled on a provider-less platform
    values:
      platform: metal
      dns:
        domain: internal.example.com
        public_domain: example.com
      gateway:
        internal:
          ip: "10.5.1.10"
        external:
          tls:
            issuer: selfsigned
          ip: "10.5.1.11"
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          resources:
            - <<: *gateway-resources-envoy

  # The deprecated dns.domain is the private domain only; it never provisions the external gateway.
  - name: deprecated dns.domain provisions only the internal gateway
    values:
      platform: metal
      dns:
        domain: example.com
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          resources:
            - name: internal
              substitutions:
                gateway_domain: example.com
    exclude:
      flux:
        - name: gateway
          resources:
            - name: external

  # Both domains: the internal gateway takes the pool start, the external one the next address.
  - name: both gateways split the load balancer pool start and the next address
    values:
      gateway:
        internal:
          ip: "10.5.1.10"
        external:
          tls:
            issuer: selfsigned
          ip: "10.5.1.11"
      platform: metal
      dns:
        public_domain: example.com
        private_domain: example.internal
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          resources:
            - name: external
              substitutions:
                gateway_loadbalancer_ip: "10.5.1.11"
            - name: internal
              substitutions:
                gateway_loadbalancer_ip: "10.5.1.10"

  # External gateway: a public domain with no writable zone and no other source fails outside dev.
  - name: public domain on metal without a certificate source fails composition
    values:
      gateway:
        internal:
          ip: "10.5.1.10"
        external:
          ip: "10.5.1.11"
      platform: metal
      dns:
        public_domain: example.com
        private_domain: example.internal
      network: *default-network
      cluster: *default-cluster
    expectError: true

  - name: dns.public_zone false on aws without a certificate source fails composition
    values:
      platform: aws
      aws:
        region: us-west-2
      dns:
        public_domain: example.com
        public_zone: false
    expectError: true

  - name: public domain on metal in dev falls back to the selfsigned public issuer
    values:
      dev: true
      gateway:
        internal:
          ip: "10.5.1.10"
        external:
          ip: "10.5.1.11"
      platform: metal
      dns:
        public_domain: example.com
        private_domain: example.internal
