# option-gateway.yaml facet tests
# Tests configurable gateway and legacy ingress compatibility.

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

  # CRDs (gateway-api, envoy-gateway) live in the blueprint's top-level `crds:`
  # section, not in `flux:`. Kustomizations do not name individual CRDs in
  # dependsOn; the composer wires only dependency-less roots to the `crds` layer,
  # and gateway-install/gateway-resources are not roots.

  # Shared assertion: gateway install tier with envoy. Per-gateway data-plane
  # config (EnvoyProxy, loadbalancer/nodeport annotations) lives in the
  # resources tier now, not install — see gateway-resources-envoy-lb/np below.
  gateway-install-envoy: &gateway-install-envoy
    components:
      - envoy
      - envoy/prometheus
    timeout: 10m
    interval: 5m

  # Shared assertion: gateway install tier with cilium. Installs independently;
  # Gateway API CRDs come from the crds layer, so neither cni nor the controller
  # order against each other.
  gateway-install-cilium: &gateway-install-cilium
    components:
      - cilium
    timeout: 10m
    interval: 5m

  # Shared assertion: external gateway resources variant, envoy + loadbalancer
  # mode. The Gateway cert needs cert-manager (pki-install) for admission.
  gateway-resources-envoy: &gateway-resources-envoy
    name: external
    dependsOn:
      - pki-install
    components:
      - envoy/proxy
      - envoy/loadbalancer
      - envoy/parameters
      - envoy/default-404
      - envoy/default-404/external-dns
    substitutions:
      gateway_name: external
      gateway_class_name: envoy
      gateway_lb_scheme: internet-facing
    timeout: 10m
    interval: 5m

  # Same shape, internal gateway (loadbalancer mode) — plus the utility
  # components (dns, flux-webhook) that only ever bind to internal.
  gateway-resources-envoy-internal: &gateway-resources-envoy-internal
    name: internal
    dependsOn:
      - pki-install
    components:
      - envoy/proxy
      - envoy/loadbalancer
      - envoy/parameters
      - envoy/default-404
      - envoy/default-404/external-dns
      - dns
      - flux-webhook
    substitutions:
      gateway_name: internal
      gateway_class_name: envoy
      gateway_cert_issuer: private
    timeout: 10m
    interval: 5m

  gateway-resources-cilium: &gateway-resources-cilium
    name: external
    dependsOn:
      - pki-install
      - cni-install
    substitutions:
      gateway_class_name: cilium
      gateway_loadbalancer_ip: "10.5.1.10"
    timeout: 10m
    interval: 5m

  # Internal variant: network.loadbalancer_ips.internal_start is unset in
  # *default-network, so gateway_loadbalancer_ip evaluates empty (Cilium
  # auto-assigns) unlike the external anchor's pinned "10.5.1.10".
  gateway-resources-cilium-internal: &gateway-resources-cilium-internal
    name: internal
    dependsOn:
      - pki-install
      - cni-install
    substitutions:
      gateway_class_name: cilium
    timeout: 10m
    interval: 5m

cases:
  # Minimal: zero-config on metal defaults to cilium CNI → cilium gateway.
  # dns.private_domain: test stands in for dev-mode's default so the internal
  # gateway (the only one reachable with no dns.public_domain) is provisioned.
  - name: zero config on metal defaults to cilium gateway
    values:
      platform: metal
      dns:
        private_domain: test
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-cilium
          resources:
            - <<: *gateway-resources-cilium-internal
      crds:
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
        - gateway-api-experimental-1.6.1
    exclude:
      crds:
        # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
        - envoy-gateway-1.8.3

  # Docker Desktop: nodeport (docker-desktop defaults to envoy; no cilium bootstrap)
  - name: Docker Desktop uses nodeport gateway
    values:
      platform: docker
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - name: internal
              components:
                - envoy/proxy
                - envoy/nodeport
                - envoy/parameters
                - envoy/default-404
                - envoy/default-404/external-dns
                - dns
                - flux-webhook
              # docker-desktop reaches HTTPS on host :8444 (internal nodeport), so the redirect targets it.
              substitutions:
                gateway_class_name: envoy
                gateway_redirect_port: "8444"

  - name: platform docker with runtime colima uses gateway loadbalancer
    values:
      platform: docker
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: colima
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal

  # Envoy driver
  - name: envoy driver deploys gateway-install with envoy and gateway-resources
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal
      crds:
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
        - gateway-api-experimental-1.6.1
        # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
        - envoy-gateway-1.8.3

  # Envoy + Docker Desktop: nodeport variant
  - name: envoy on Docker Desktop uses nodeport variant
    values:
      platform: docker
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - name: internal
              components:
                - envoy/proxy
                - envoy/nodeport
                - envoy/parameters
                - envoy/default-404
                - envoy/default-404/external-dns
                - dns
                - flux-webhook

  # Explicit gateway.service_type: NodePort works on any platform (e.g. a bare
  # metal single-node cluster with no cluster LB). Network omits
  # loadbalancer_driver so lb_effective.enabled is false — proves the nodeport
  # component is selected purely from gateway.service_type.
  - name: explicit gateway.service_type NodePort selects nodeport variant on metal with no LB
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
        service_type: NodePort
      network:
        cidr_block: 10.5.0.0/16
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - name: internal
              components:
                - envoy/proxy
                - envoy/nodeport
                - envoy/parameters
                - envoy/default-404
                - envoy/default-404/external-dns
                - dns
                - flux-webhook

  # NodePort must suppress lb_effective.enabled even when loadbalancer_driver
  # is configured: a NodePort service will never get a LoadBalancer IP, so
  # lb-address (which patches the Gateway with that IP) and gateway_dns_target
  # must not apply. Uses *default-network which has loadbalancer_driver set,
  # and flannel CNI so lb_effective.enabled would otherwise be true.
  - name: explicit NodePort suppresses lb-address even when loadbalancer_driver is set
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
        service_type: NodePort
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - name: internal
              components:
                - flux-webhook
              substitutions:
                gateway_class_name: envoy

  # Explicit gateway.service_type: LoadBalancer overrides docker-desktop's
  # default NodePort fallback.
  - name: explicit gateway.service_type LoadBalancer overrides docker-desktop default
    values:
      platform: docker
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
        service_type: LoadBalancer
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal

  # Backward compatibility: ingress alias still works
  - name: legacy ingress alias maps envoy-gateway to envoy
    values:
      platform: metal
      dns:
        private_domain: test
      ingress:
        enabled: true
        driver: envoy-gateway
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal
      crds:
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
        - gateway-api-experimental-1.6.1
        # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
        - envoy-gateway-1.8.3

  - name: legacy ingress alias maps nginx to envoy
    values:
      platform: metal
      dns:
        private_domain: test
      ingress:
        enabled: true
        driver: nginx
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy
          resources:
            - <<: *gateway-resources-envoy-internal

  # Gateway disabled
  - name: excludes gateway when disabled
    values:
      platform: metal
      gateway:
        enabled: false
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: gateway
      crds:
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api package=kubernetes-sigs/gateway-api
        - gateway-api-experimental-1.6.1
        # renovate: datasource=github-releases depName=envoyproxy/gateway package=envoyproxy/gateway
        - envoy-gateway-1.8.3

  # Gateway disabled: gitops is a resources-only system, so it composes to a
  # gitops-resources kustomization with the plain webhook (no webhook/gateway,
  # no gateway-resources dep) and emits neither an install tier nor a flat
  # gitops kustomization.
  - name: gitops without gateway is webhook-only resources tier with no install tier
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - webhook
    exclude:
      kustomize:
        - name: gitops-install
        - name: gitops

  # Flux webhook receiver includes webhook/gateway for Gateway API drivers
  # (push mode is the default, so no explicit gitops.mode needed)
  - name: envoy driver includes webhook/gateway in gitops component
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          dependsOn:
            - gateway-resources-internal
          resources:
            - components:
                - webhook
                - webhook/gateway

  # dev mode enables coredns/gateway via the dns component
  - name: dev mode with envoy adds coredns/gateway to dns component
    values:
      platform: metal
      dev: true
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-envoy

  # Cilium driver — GatewayClass only; controller is part of Cilium CNI DaemonSet
  - name: cilium driver deploys gateway-install with cilium and gateway-resources
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: cilium
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          install:
            <<: *gateway-install-cilium
          resources:
            - <<: *gateway-resources-cilium-internal

  - name: cilium driver includes webhook/gateway and webhook/gateway/cilium in gitops component
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: cilium
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          dependsOn:
            - gateway-resources-internal
          resources:
            - components:
                - webhook
                - webhook/gateway
                - webhook/gateway/cilium

  # gitops.web_ui exposes the operator web UI through the gateway. It merges
  # into the gitops system (own `when:`, same name) rather than a separate
  # flux-ui system, so it lands in the one gitops-resources kustomization
  # alongside the webhook. Off by default.
  - name: web_ui enabled adds ui component to gitops-resources on envoy
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      gitops:
        web_ui: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          dependsOn:
            - gateway-resources-internal
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - webhook
                - webhook/gateway
                - ui
    exclude:
      kustomize:
        - name: flux-ui-install
        - name: flux-ui

  - name: web_ui enabled on cilium adds ui/cilium to gitops-resources
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: cilium
      gitops:
        web_ui: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          resources:
            - components:
                - webhook
                - webhook/gateway
                - webhook/gateway/cilium
                - ui
                - ui/cilium

  - name: web_ui defaults off so gitops-resources has no ui component
    values:
      platform: metal
      dns:
        private_domain: test
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gitops
          path: gitops
          resources:
            - components:
                - webhook
                - webhook/gateway

  # lb-address: included when lb_effective.enabled (non-Cilium CNI + loadbalancer_driver set); IP pinned in gateway spec
  - name: local envoy gateway-resources includes lb-address when loadbalancer IP configured
    values:
      platform: metal
      dns:
        public_domain: test
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expect:
      flux:
        - name: gateway
          resources:
            - name: external
              components:
                - lb-address
              substitutions:
                gateway_class_name: envoy
                gateway_loadbalancer_ip: "10.5.1.10"

  # AWS uses a cloud-managed LB (lb_effective.enabled == false) and is not cilium,
  # so gateway_loadbalancer_ip and gateway_dns_target both evaluate to "" and are
  # omitted from output. Only gateway_class_name remains.
  - name: aws envoy gateway-resources omits loadbalancer substitutions
    values:
      platform: aws
      aws:
        region: us-west-2
      email: ops@example.com
      dns:
        public_domain: example.com
      gateway:
        enabled: true
        driver: envoy
    expect:
      flux:
        - name: gateway
          resources:
            - name: external
              substitutions:
                gateway_class_name: envoy
              timeout: 10m
              interval: 5m

  # Cert issuer + gateway_domain defaults: the internal gateway's issuer is
  # always `private` (never ACME-eligible — a VPC-only/local zone can't
  # validate DNS-01) and gateway_domain comes straight from dns.private_domain.
  # Regression guard for the cert-issuer abstraction in option-gateway.
  - name: non-ACME platform defaults gateway_cert_issuer to private and uses private_domain
    values:
      platform: metal
      gateway:
        enabled: true
        driver: envoy
      dns:
        private_domain: cluster.local
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          resources:
            - name: internal
              substitutions:
                gateway_class_name: envoy
                gateway_cert_issuer: private
                gateway_domain: cluster.local

  # No domain set at all: neither gateway is provisioned. This
  # replaced the old single-gateway "<id>.local" selfsigned floor — a
  # cluster with no dns.public_domain and no dns.private_domain now has no
  # ingress, cert, or LB of any kind.
  - name: aws with no domain provisions no gateway at all
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: gateway
          resources:
            - name: external
        - name: gateway
          resources:
            - name: internal

  # dns.domain set (no explicit public/private) flows into dns.private_domain
  # (platform-base's dns config falls back private_domain -> domain), so this
  # provisions the internal gateway only, with a private (not public-ACME)
  # issuer -- dns.domain alone never makes a gateway internet-facing.
  - name: aws with only dns.domain provisions the internal gateway with a private issuer
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: true
        driver: envoy
      dns:
        domain: example.com
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          resources:
            - name: internal
              substitutions:
                gateway_class_name: envoy
                gateway_cert_issuer: private
                gateway_domain: example.com
                # No docker-desktop host-forward: redirect targets the standard :443.
                gateway_redirect_port: "443"
    exclude:
      flux:
        - name: gateway
          resources:
            - name: external

  # gitops.mode=pull drops the Flux Receiver kustomize entirely and propagates
  # mode=pull to the gitops/flux terraform module (which then skips
  # notification-controller and the webhook-token secret).
  - name: gitops mode pull excludes receiver and propagates pull to gitops terraform
    values:
      platform: metal
      gateway:
        enabled: true
        driver: envoy
      gitops:
        mode: pull
      network: *default-network
      cluster: *default-cluster
    expect:
      terraform:
        - name: gitops
          path: gitops/flux
          inputs:
            mode: pull
    exclude:
      flux:
        - name: gitops

  # Regression (#2311): dns.public_domain enables dns without shipping dns-install on
  # metal/incus. The gateway resources tier must depend only on pki-install, or composition
  # dangles on a dns-install that was never contributed.
  - name: gateway resources omit dns-install when dns is enabled on a provider-less platform
    values:
      platform: metal
      dns:
        domain: example.com
        public_domain: example.com
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: gateway
          resources:
            - <<: *gateway-resources-envoy
