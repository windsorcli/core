# config-talos.yaml facet tests
# Tests API-server OIDC (cluster.oidc), network.ntp_servers, and registries mirrors
# Talos machine config composition. Uses platform: metal and flannel CNI to isolate
# these patches from the cilium-driver and single-node-topology patches
# (covered by option-cni and option-single-node tests).

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      # Above the resource_constrained thresholds on both axes, so OIDC cases
      # below don't also carry the small-control-plane patch (covered
      # separately). memory must clear 2x its threshold (24) too, not just
      # cpu's.
      cpu: 8
      memory: 24
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      nodes:
        worker-1:
          endpoint: 10.5.0.20:50000
          node: 10.5.0.20
          hostname: worker-1
      volumes:
        - /var/mnt/local
    cni:
      driver: flannel

  # Registry mode cases (talos_images table).
  registry-network: &registry-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  registry-dns: &registry-dns
    domain: test.local

  registry-cluster: &registry-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1

  registry-terraform-outputs: &registry-terraform-outputs
    compute:
      controlplanes:
        - endpoint: 10.5.0.10:6443
          node: 10.5.0.10
          hostname: controlplane-1
      workers: []

cases:
  - name: oidc disabled by default omits apiServer patch
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
      terraform:
        - name: cluster
          path: cluster/talos
    exclude:
      config:
        talos_common:
          common_patch:
            cluster:
              apiServer: {}

  - name: oidc enabled maps issuer/client_id/claims to apiServer extraArgs
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://keycloak.example.com/realms/windsor
          client_id: kubernetes
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                extraArgs:
                  oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                  oidc-client-id: kubernetes
                  oidc-groups-claim: groups
                  oidc-issuer-url: https://keycloak.example.com/realms/windsor
                  oidc-username-claim: sub
                extraVolumes:
                - hostPath: /var/kubernetes/oidc-ca.crt
                  mountPath: /etc/kubernetes/oidc-ca.crt
                  readonly: true
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: oidc enabled with keycloak identity infers issuer and client_id
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
      identity:
        enabled: true
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                extraArgs:
                  oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                  oidc-client-id: kubernetes
                  oidc-groups-claim: groups
                  oidc-issuer-url: https://keycloak.example.local/realms/platform
                  oidc-username-claim: sub
                extraVolumes:
                - hostPath: /var/kubernetes/oidc-ca.crt
                  mountPath: /etc/kubernetes/oidc-ca.crt
                  readonly: true
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
      terraform:
        - name: cluster
          path: cluster/talos

  # kube-apiserver fetches the inferred issuer's JWKS itself, and kubectl clients
  # validate the same token against it — without a gateway neither can reach it.
  - name: oidc enabled with keycloak identity fails without a gateway
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
      identity:
        enabled: true
    expectError: true

  - name: oidc issuer_url/client_id overrides take precedence over keycloak inference
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://sso.corp/realms/other
          client_id: other-client
      identity:
        enabled: true
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                extraArgs:
                  oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                  oidc-client-id: other-client
                  oidc-groups-claim: groups
                  oidc-issuer-url: https://sso.corp/realms/other
                  oidc-username-claim: sub
                extraVolumes:
                - hostPath: /var/kubernetes/oidc-ca.crt
                  mountPath: /etc/kubernetes/oidc-ca.crt
                  readonly: true
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: oidc enabled adds oidc-ca-file from the pki terraform output
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://keycloak.example.com/realms/windsor
          client_id: kubernetes
    terraformOutputs:
      pki:
        cert: |-
          -----BEGIN CERTIFICATE-----
          FAKECERT
          -----END CERTIFICATE-----
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                extraArgs:
                  oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                  oidc-client-id: kubernetes
                  oidc-groups-claim: groups
                  oidc-issuer-url: https://keycloak.example.com/realms/windsor
                  oidc-username-claim: sub
                extraVolumes:
                - hostPath: /var/kubernetes/oidc-ca.crt
                  mountPath: /etc/kubernetes/oidc-ca.crt
                  readonly: true
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplane_config_patches: "machine:\n  files:\n  - op: create\n    path: /var/kubernetes/oidc-ca.crt\n    permissions: 420\n    content: |\n      \n        -----BEGIN CERTIFICATE-----\n        FAKECERT\n        -----END CERTIFICATE-----"

  - name: small dedicated control plane gets the larger reservation tier
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          cpu: 2
          memory: 4
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
              controllerManager:
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
              scheduler:
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
                extraConfig:
                  kubeReserved:
                    cpu: 500m
                    memory: 512Mi
      terraform:
        - name: cluster
          path: cluster/talos

  - name: control plane constrained on cpu alone still gets the reservation
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          cpu: 2
          memory: 64
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
              controllerManager:
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
              scheduler:
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
                extraConfig:
                  kubeReserved:
                    cpu: 500m
                    memory: 512Mi
      terraform:
        - name: cluster
          path: cluster/talos

  - name: control plane between the threshold and 2x it gets a tapered reservation
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          cpu: 3
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                resources:
                  requests:
                    cpu: 125m
                    memory: 128Mi
              controllerManager:
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
              scheduler:
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
                extraConfig:
                  kubeReserved:
                    cpu: 250m
                    memory: 256Mi
      terraform:
        - name: cluster
          path: cluster/talos

  - name: default-sized worker gets its own kubeReserved independent of the control plane
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 80m
                      memory: 1843Mi

  - name: large worker gets an explicit zero override, correcting the small control plane's leaked kubeReserved
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 2
          memory: 4
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          cpu: 16
          memory: 32
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
        cni:
          driver: flannel
    expect:
      config:
        talos_common:
          # The small control plane's kubeReserved lands in the common patch, which every role shares.
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
              controllerManager:
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
              scheduler:
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
                extraConfig:
                  kubeReserved:
                    cpu: 500m
                    memory: 512Mi
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            # worker_config_patches applies after common_config_patches, so
            # this zero override wins on the worker and cancels the leak.
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 0m
                      memory: 0Mi

  - name: small worker gets its own reservation even when the control plane is comfortably large
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        workers:
          cpu: 2
          memory: 4
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
          volumes:
            - /var/mnt/local
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 80m
                      memory: 1843Mi

  - name: worker between its threshold and 2x it gets a tapered reservation
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        workers:
          cpu: 6
          memory: 12
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
          volumes:
            - /var/mnt/local
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 40m
                      memory: 922Mi

  - name: default dedicated control plane gets no reservation
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
      terraform:
        - name: cluster
          path: cluster/talos
    exclude:
      config:
        talos_common:
          common_patch:
            cluster:
              apiServer: {}

  - name: small schedulable control plane gets the minimal reservation tier
    values:
      platform: metal
      # Explicit multi-node + controlplanes.schedulable: isolates this case
      # from the single-node-topology patches (leader-elect, etcd compaction),
      # covered separately by option-single-node tests.
      topology: multi-node
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          schedulable: true
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
        cni:
          driver: flannel
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: true
              apiServer:
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
              controllerManager:
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
              scheduler:
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
                extraConfig:
                  kubeReserved:
                    cpu: 100m
                    memory: 256Mi
      terraform:
        - name: cluster
          path: cluster/talos

  - name: oidc username_claim and groups_claim overrides pass through
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://keycloak.example.com/realms/windsor
          client_id: kubernetes
          username_claim: email
          groups_claim: roles
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
              apiServer:
                extraArgs:
                  oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                  oidc-client-id: kubernetes
                  oidc-groups-claim: roles
                  oidc-issuer-url: https://keycloak.example.com/realms/windsor
                  oidc-username-claim: email
                extraVolumes:
                - hostPath: /var/kubernetes/oidc-ca.crt
                  mountPath: /etc/kubernetes/oidc-ca.crt
                  readonly: true
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: network.ntp_servers sets machine.time.servers
    values:
      platform: metal
      gateway:
        enabled: false
      network:
        <<: *default-network
        ntp_servers:
          - 10.5.0.1
          - pool.ntp.org
      cluster: *default-cluster
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
              time:
                servers:
                - 10.5.0.1
                - pool.ntp.org
      terraform:
        - name: cluster
          path: cluster/talos

  - name: common patch inlines the kubelet-csr-approver manifest
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              inlineManifests:
                - name: kubelet-csr-approver

  - name: common patch turns off Talos discovery
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              discovery:
                enabled: false

  - name: no ntp_servers omits machine.time patch
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              allowSchedulingOnControlPlanes: false
            machine:
              kubelet:
                extraArgs:
                  rotate-server-certificates: "true"
      terraform:
        - name: cluster
          path: cluster/talos
    exclude:
      config:
        talos_common:
          common_patch:
            machine:
              time: {}

  - name: registries entries with a hostname become https mirrors keyed by image host
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        ghcr.io:
          endpoint: ghcr.mirror.example.com
        registry-1.docker.io:
          local: docker.io
          endpoint: docker.mirror.example.com
        quay.io:
          remote: https://quay.io
    expect:
      config:
        talos_common:
          registry_auth_documents: []
          registry_mirror_documents:
            - "apiVersion: v1alpha1\nendpoints:\n- url: https://docker.mirror.example.com\nkind: RegistryMirrorConfig\nname: docker.io\nskipFallback: true"
            - "apiVersion: v1alpha1\nendpoints:\n- url: https://ghcr.mirror.example.com\nkind: RegistryMirrorConfig\nname: ghcr.io\nskipFallback: true"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: deprecated docker.registries still renders registry mirrors
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      docker:
        registries:
          ghcr.io:
            endpoint: ghcr.mirror.example.com
    expect:
      config:
        talos_common:
          registry_mirror_documents:
            - "apiVersion: v1alpha1\nendpoints:\n- url: https://ghcr.mirror.example.com\nkind: RegistryMirrorConfig\nname: ghcr.io\nskipFallback: true"

  - name: no registries renders no registry mirrors
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      config:
        talos_common:
          registry_auth_documents: []
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registries credentials render auths keyed by endpoint host
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        ghcr.io:
          endpoint: registry.example.com
          username: robot
          password: secret
    expect:
      config:
        talos_common:
          registry_auth_documents:
            - "apiVersion: v1alpha1\nkind: RegistryAuthConfig\nname: registry.example.com\npassword: secret\nusername: robot"
          registry_mirror_documents:
            - "apiVersion: v1alpha1\nendpoints:\n- url: https://registry.example.com\nkind: RegistryMirrorConfig\nname: ghcr.io\nskipFallback: true"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registries entries sharing an endpoint host render one auth
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        docker.io:
          endpoint: registry.example.com
          username: robot
          password: secret
        ghcr.io:
          endpoint: registry.example.com
          username: robot
          password: secret
    expect:
      config:
        talos_common:
          registry_auth_documents:
            - "apiVersion: v1alpha1\nkind: RegistryAuthConfig\nname: registry.example.com\npassword: secret\nusername: robot"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registries different credentials for one endpoint host fail composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        docker.io:
          endpoint: registry.example.com
          username: robot
          password: secret
        ghcr.io:
          endpoint: registry.example.com
          username: other
          password: secret
    expectError: true

  - name: registries catch-all endpoint with a port and path overrides the path
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        '*':
          endpoint: harbor.example.com:8443/windsor
          username: robot
          password: secret
    expect:
      config:
        talos_common:
          registry_auth_documents:
            - "apiVersion: v1alpha1\nkind: RegistryAuthConfig\nname: harbor.example.com:8443\npassword: secret\nusername: robot"
          registry_mirror_documents:
            - "apiVersion: v1alpha1\nendpoints:\n- overridePath: true\n  url: https://harbor.example.com:8443/v2/windsor\nkind: RegistryMirrorConfig\nname: \"*\"\nskipFallback: true"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registries http endpoint keeps its scheme
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        ghcr.io:
          endpoint: http://registry.internal:5000/windsor
          username: robot
          password: secret
    expect:
      config:
        talos_common:
          registry_auth_documents:
            - "apiVersion: v1alpha1\nkind: RegistryAuthConfig\nname: registry.internal:5000\npassword: secret\nusername: robot"
          registry_mirror_documents:
            - "apiVersion: v1alpha1\nendpoints:\n- overridePath: true\n  url: http://registry.internal:5000/v2/windsor\nkind: RegistryMirrorConfig\nname: ghcr.io\nskipFallback: true"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registries https endpoint keeps its scheme
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        ghcr.io:
          endpoint: https://registry.example.com
    expect:
      config:
        talos_common:
          registry_mirror_documents:
            - "apiVersion: v1alpha1\nendpoints:\n- url: https://registry.example.com\nkind: RegistryMirrorConfig\nname: ghcr.io\nskipFallback: true"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registries endpoints with pki.trusted_cas render one TLS document per host
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      pki:
        trusted_cas:
          - CERT
      registries:
        docker.io:
          endpoint: harbor.example.com/docker
        ghcr.io:
          endpoint: harbor.example.com/ghcr
    expect:
      config:
        talos_common:
          registry_tls_documents:
            - "apiVersion: v1alpha1\nca: CERT\nkind: RegistryTLSConfig\nname: harbor.example.com"
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registries http endpoint renders no TLS document
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      pki:
        trusted_cas:
          - CERT
      registries:
        ghcr.io:
          endpoint: http://registry.internal:5000
    expect:
      config:
        talos_common:
          registry_tls_documents: []
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registries hostname without endpoint off a workstation fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        ghcr.io:
          hostname: ghcr.test
    expectError: true

  - name: registries catch-all without endpoint fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      registries:
        '*':
          hostname: registry.example.com
    expectError: true

  - name: registries endpoint with an unsupported scheme fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
