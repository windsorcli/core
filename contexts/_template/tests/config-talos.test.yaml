  - name: oidc with trusted_cas appends the roots to the OIDC CA file
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://keycloak.example.com/realms/windsor
          client_id: kubernetes
      pki:
        trusted_cas:
          - |-
            -----BEGIN CERTIFICATE-----
            ROOTA
            -----END CERTIFICATE-----
    terraformOutputs:
      pki:
        cert: |-
          -----BEGIN CERTIFICATE-----
          FAKECERT
          -----END CERTIFICATE-----
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplane_config_patches: "machine:\n  files:\n  - op: create\n    path: /var/kubernetes/oidc-ca.crt\n    permissions: 420\n    content: |\n      \n        -----BEGIN CERTIFICATE-----\n        FAKECERT\n        -----END CERTIFICATE-----\n      \n        -----BEGIN CERTIFICATE-----\n        ROOTA\n        -----END CERTIFICATE-----"

  # A Keycloak gateway on public ACME gets no oidc-ca-file.
  - name: oidc with keycloak behind a public acme gateway omits oidc-ca-file
    values:
      platform: hetzner
      hetzner:
        token: test-token
        location: fsn1
        network_zone: eu-central
      email: ops@example.com
      dns:
        public_domain: example.com
      network:
        cidr_block: 10.5.0.0/16
      cluster:
        oidc:
          enabled: true
      identity:
        enabled: true
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
    expect:
      config:
        talos_oidc:
          public_ca: true
        talos_common:
          common_patch:
            cluster:
              apiServer:
                extraArgs:
                  oidc-client-id: kubernetes
                  oidc-groups-claim: groups
                  oidc-issuer-url: https://keycloak.example.com/realms/platform
                  oidc-username-claim: sub
    exclude:
      config:
        talos_common:
          common_patch:
            cluster:
              apiServer:
                extraArgs:
                  oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                extraVolumes: []

  # Registry mode needs a talos_images entry for the Talos version of the context.
  # The docker pin (Talos 1.13) has a table entry.
  - name: registry mode composes on docker
    values:
      platform: docker
      workstation:
        runtime: docker-desktop
      charts:
        registry: charts.test:5000/windsor
      dns: *registry-dns
      gateway:
        enabled: false
      network: *registry-network
      cluster: *registry-cluster
    terraformOutputs: *registry-terraform-outputs
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              coreDNS:
                image: registry.k8s.io/coredns/coredns:v1.14.7
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            talos_version: "1.13.11"

  # The default pin (Talos 1.14) has a table entry.
  - name: registry mode composes on incus
    values:
      platform: incus
      charts:
        registry: registry.example.com/windsor
      network: *registry-network
      cluster: *registry-cluster
    terraformOutputs: *registry-terraform-outputs
    expect:
      config:
        talos_common:
          common_patch:
            cluster:
              coreDNS:
                image: registry.k8s.io/coredns/coredns:v1.14.7
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            talos_version: "1.14.2"

  - name: registry mode accepts a node image of a pinned Talos version
    values:
      platform: incus
      charts:
        registry: registry.example.com/windsor
      network: *registry-network
      cluster:
        <<: *registry-cluster
        controlplanes:
          image: windsor:talos/v1.14.2/amd64
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
              image: ghcr.io/siderolabs/talos:v1.13.11
    terraformOutputs: *registry-terraform-outputs
    expect:
      terraform:
        - name: cluster
          path: cluster/talos

  - name: registry mode fails for a pool image of an unpinned Talos version
    values:
