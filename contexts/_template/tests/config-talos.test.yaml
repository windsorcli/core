# config-talos.yaml facet tests
# Tests API-server OIDC (cluster.oidc), network.ntp_servers, and cluster.registry_mirror
# Talos machine config composition. Uses platform: metal and flannel CNI to isolate
# these patches from the cilium-driver and single-node-topology patches
# (covered by option-cni and option-single-node tests).

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      # Above the resource_constrained thresholds on both axes, so OIDC cases
      # below don't also carry the small-control-plane patch (covered
      # separately). memory must clear 2x its threshold (24) too, not just
      # cpu's.
      cpu: 8
      memory: 24
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      nodes:
        worker-1:
          endpoint: 10.5.0.20:50000
          node: 10.5.0.20
          hostname: worker-1
      volumes:
        - /var/mnt/local
    cni:
      driver: flannel

cases:
  - name: oidc disabled by default omits apiServer patch
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"

  - name: oidc enabled maps issuer/client_id/claims to apiServer extraArgs
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://keycloak.example.com/realms/windsor
          client_id: kubernetes
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  extraArgs:
                    oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                    oidc-client-id: kubernetes
                    oidc-groups-claim: groups
                    oidc-issuer-url: https://keycloak.example.com/realms/windsor
                    oidc-username-claim: sub
                  extraVolumes:
                  - hostPath: /var/kubernetes/oidc-ca.crt
                    mountPath: /etc/kubernetes/oidc-ca.crt
                    readonly: true
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"

  - name: oidc enabled with keycloak identity infers issuer and client_id
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
      identity:
        enabled: true
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  extraArgs:
                    oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                    oidc-client-id: kubernetes
                    oidc-groups-claim: groups
                    oidc-issuer-url: https://keycloak.example.local/realms/platform
                    oidc-username-claim: sub
                  extraVolumes:
                  - hostPath: /var/kubernetes/oidc-ca.crt
                    mountPath: /etc/kubernetes/oidc-ca.crt
                    readonly: true
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"

  # kube-apiserver fetches the inferred issuer's JWKS itself, and kubectl clients
  # validate the same token against it — without a gateway neither can reach it.
  - name: oidc enabled with keycloak identity fails without a gateway
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
      identity:
        enabled: true
    expectError: true

  - name: oidc issuer_url/client_id overrides take precedence over keycloak inference
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://sso.corp/realms/other
          client_id: other-client
      identity:
        enabled: true
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  extraArgs:
                    oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                    oidc-client-id: other-client
                    oidc-groups-claim: groups
                    oidc-issuer-url: https://sso.corp/realms/other
                    oidc-username-claim: sub
                  extraVolumes:
                  - hostPath: /var/kubernetes/oidc-ca.crt
                    mountPath: /etc/kubernetes/oidc-ca.crt
                    readonly: true
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"

  - name: oidc enabled adds oidc-ca-file from the pki terraform output
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://keycloak.example.com/realms/windsor
          client_id: kubernetes
    terraformOutputs:
      pki:
        cert: |-
          -----BEGIN CERTIFICATE-----
          FAKECERT
          -----END CERTIFICATE-----
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  extraArgs:
                    oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                    oidc-client-id: kubernetes
                    oidc-groups-claim: groups
                    oidc-issuer-url: https://keycloak.example.com/realms/windsor
                    oidc-username-claim: sub
                  extraVolumes:
                  - hostPath: /var/kubernetes/oidc-ca.crt
                    mountPath: /etc/kubernetes/oidc-ca.crt
                    readonly: true
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
            controlplane_config_patches: "machine:\n  files:\n  - op: create\n    path: /var/kubernetes/oidc-ca.crt\n    permissions: 420\n    content: |\n      \n        -----BEGIN CERTIFICATE-----\n        FAKECERT\n        -----END CERTIFICATE-----"

  - name: small dedicated control plane gets the larger reservation tier
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          cpu: 2
          memory: 4
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  resources:
                    requests:
                      cpu: 250m
                      memory: 256Mi
                controllerManager:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                scheduler:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
                  extraConfig:
                    kubeReserved:
                      cpu: 500m
                      memory: 512Mi

  - name: control plane constrained on cpu alone still gets the reservation
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          cpu: 2
          memory: 64
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  resources:
                    requests:
                      cpu: 250m
                      memory: 256Mi
                controllerManager:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                scheduler:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
                  extraConfig:
                    kubeReserved:
                      cpu: 500m
                      memory: 512Mi

  - name: control plane between the threshold and 2x it gets a tapered reservation
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          cpu: 3
          memory: 8
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  resources:
                    requests:
                      cpu: 125m
                      memory: 128Mi
                controllerManager:
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                scheduler:
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
                  extraConfig:
                    kubeReserved:
                      cpu: 250m
                      memory: 256Mi

  - name: default-sized worker gets its own kubeReserved independent of the control plane
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 80m
                      memory: 1843Mi

  - name: large worker gets an explicit zero override, correcting the small control plane's leaked kubeReserved
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          cpu: 2
          memory: 4
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          cpu: 16
          memory: 32
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
        cni:
          driver: flannel
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            # The small control plane's kubeReserved lands in
            # common_config_patches, which every role shares.
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  resources:
                    requests:
                      cpu: 250m
                      memory: 256Mi
                controllerManager:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                scheduler:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
                  extraConfig:
                    kubeReserved:
                      cpu: 500m
                      memory: 512Mi
            # worker_config_patches applies after common_config_patches, so
            # this zero override wins on the worker and cancels the leak.
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 0m
                      memory: 0Mi

  - name: small worker gets its own reservation even when the control plane is comfortably large
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        workers:
          cpu: 2
          memory: 4
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
          volumes:
            - /var/mnt/local
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 80m
                      memory: 1843Mi

  - name: worker between its threshold and 2x it gets a tapered reservation
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        workers:
          cpu: 6
          memory: 12
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
          volumes:
            - /var/mnt/local
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 40m
                      memory: 922Mi

  - name: default dedicated control plane gets no reservation
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"

  - name: small schedulable control plane gets the minimal reservation tier
    values:
      platform: metal
      # Explicit multi-node + controlplanes.schedulable: isolates this case
      # from the single-node-topology patches (leader-elect, etcd compaction),
      # covered separately by option-single-node tests.
      topology: multi-node
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          schedulable: true
          nodes:
            controlplane-1:
              endpoint: 10.5.0.10:50000
              node: 10.5.0.10
              hostname: controlplane-1
        workers:
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
        cni:
          driver: flannel
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: true
                apiServer:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                controllerManager:
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                scheduler:
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
                  extraConfig:
                    kubeReserved:
                      cpu: 100m
                      memory: 256Mi

  - name: oidc username_claim and groups_claim overrides pass through
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          issuer_url: https://keycloak.example.com/realms/windsor
          client_id: kubernetes
          username_claim: email
          groups_claim: roles
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
                apiServer:
                  extraArgs:
                    oidc-ca-file: /etc/kubernetes/oidc-ca.crt
                    oidc-client-id: kubernetes
                    oidc-groups-claim: roles
                    oidc-issuer-url: https://keycloak.example.com/realms/windsor
                    oidc-username-claim: email
                  extraVolumes:
                  - hostPath: /var/kubernetes/oidc-ca.crt
                    mountPath: /etc/kubernetes/oidc-ca.crt
                    readonly: true
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"

  - name: network.ntp_servers sets machine.time.servers
    values:
      platform: metal
      gateway:
        enabled: false
      network:
        <<: *default-network
        ntp_servers:
          - 10.5.0.1
          - pool.ntp.org
      cluster: *default-cluster
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"
                time:
                  servers:
                  - 10.5.0.1
                  - pool.ntp.org

  - name: no ntp_servers omits machine.time patch
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            common_config_patches: |-
              cluster:
                allowSchedulingOnControlPlanes: false
              machine:
                kubelet:
                  extraArgs:
                    rotate-server-certificates: "true"

  - name: cluster.registry_mirror maps every upstream registry under its path
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        registry_mirror:
          url: package.copia.io/copia
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            registry_mirrors:
              docker.elastic.co:
                endpoints:
                  - url: https://package.copia.io/v2/copia/docker.elastic.co
                    override_path: true
                skip_fallback: false
              docker.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/docker.io
                    override_path: true
                skip_fallback: false
              gcr.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/gcr.io
                    override_path: true
                skip_fallback: false
              ghcr.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/ghcr.io
                    override_path: true
                skip_fallback: false
              quay.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/quay.io
                    override_path: true
                skip_fallback: false
              reg.kyverno.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/reg.kyverno.io
                    override_path: true
                skip_fallback: false
              registry.k8s.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/registry.k8s.io
                    override_path: true
                skip_fallback: false
              xpkg.crossplane.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/xpkg.crossplane.io
                    override_path: true
                skip_fallback: false
              xpkg.upbound.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/xpkg.upbound.io
                    override_path: true
                skip_fallback: false

  - name: cluster.registry_mirror without a path maps upstreams at the registry root
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        registry_mirror:
          url: mirror.test:5000
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            registry_mirrors:
              docker.elastic.co:
                endpoints:
                  - url: https://mirror.test:5000/v2/docker.elastic.co
                    override_path: true
                skip_fallback: false
              docker.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/docker.io
                    override_path: true
                skip_fallback: false
              gcr.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/gcr.io
                    override_path: true
                skip_fallback: false
              ghcr.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/ghcr.io
                    override_path: true
                skip_fallback: false
              quay.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/quay.io
                    override_path: true
                skip_fallback: false
              reg.kyverno.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/reg.kyverno.io
                    override_path: true
                skip_fallback: false
              registry.k8s.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/registry.k8s.io
                    override_path: true
                skip_fallback: false
              xpkg.crossplane.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/xpkg.crossplane.io
                    override_path: true
                skip_fallback: false
              xpkg.upbound.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/xpkg.upbound.io
                    override_path: true
                skip_fallback: false

  - name: cluster.registry_mirror.upstreams replaces the default upstream list
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        registry_mirror:
          url: package.copia.io/copia
          upstreams:
            - docker.io
            - registry.example.com
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            registry_mirrors:
              docker.io:
                endpoints:
                  - url: https://package.copia.io/v2/copia/docker.io
                    override_path: true
                skip_fallback: false
              registry.example.com:
                endpoints:
                  - url: https://package.copia.io/v2/copia/registry.example.com
                    override_path: true
                skip_fallback: false

  - name: no registry_mirror renders no registry mirrors
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            registry_mirrors: {}
            registry_auths: {}

  - name: cluster.registry_mirror credentials and skip_fallback reach cluster terraform
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        registry_mirror:
          url: mirror.test:5000/copia
          upstreams:
            - docker.io
          username: robot
          password: secret
          skip_fallback: true
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            registry_mirrors:
              docker.io:
                endpoints:
                  - url: https://mirror.test:5000/v2/copia/docker.io
                    override_path: true
                skip_fallback: true
            registry_auths:
              mirror.test:5000:
                username: robot
                password: secret

  - name: cluster.registry_mirror username without password fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        registry_mirror:
          url: package.copia.io/copia
          username: robot
    expectError: true

  - name: cluster.registry_mirror password without username fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        registry_mirror:
          url: package.copia.io/copia
          password: secret
    expectError: true
