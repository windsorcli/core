# addon-observability.yaml facet tests
# Tests observability stack with multiple log drivers and time format options

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Grafana SSO against a hosted Keycloak is inferred from identity + observability both
  # being on, with no grafana.sso. The keycloak driver generates the client secret, so none
  # is supplied here.
  - name: grafana sso is inferred and wires generic oauth against the identity issuer
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
      addons:
        observability:
          enabled: true
    expect:
      flux:
        - name: observability
          install:
            components:
              - grafana
              - grafana/prometheus
              - grafana/oidc
            substitutions:
              oidc_name: SSO
              oidc_client_id: grafana
              oidc_auth_url: https://keycloak.example.local/realms/platform/protocol/openid-connect/auth
              oidc_token_url: http://keycloak-service.system-identity:8080/realms/platform/protocol/openid-connect/token
              grafana_root_url: https://grafana.example.local

  # External OIDC issuer (identity driver oidc): the effective issuer flows straight
  # through to Grafana's generic_oauth; the external client secret is supplied.
  - name: external oidc issuer flows to grafana sso
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        driver: oidc
        oidc:
          issuer: https://sso.corp/realms/platform
      addons:
        observability:
          enabled: true
          grafana:
            client_secret: ${secret("v", "grafana", "s")}
    expect:
      flux:
        - name: observability
          install:
            components:
              - grafana/oidc
            substitutions:
              oidc_auth_url: https://sso.corp/realms/platform/protocol/openid-connect/auth

  # Grafana SSO outside dev must be given a client secret.
  # External OIDC (driver oidc) must be given a client secret; the hosted keycloak
  # driver generates its own, so only oidc fails without one.
  - name: external oidc sso without a client secret fails composition
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        driver: oidc
        oidc:
          issuer: https://sso.corp/realms/platform
      addons:
        observability:
          enabled: true
    expectError: true

  # Minimal: dev mode enables observability addon; addon wins (last-wins)
  # Metal defaults to cilium gateway driver, cilium dashboard included.
  - name: minimal config creates observability with defaults via dev mode
    values:
      platform: metal
      dev: true
      dns:
        domain: example.local
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: observability
          install:
            components:
              - grafana
              - grafana/prometheus
            substitutions:
              external_domain: example.local
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - grafana/dashboards/node
                - grafana/dashboards/kubernetes
                - grafana/dashboards/flux
                - grafana/dashboards/cert-manager
                - grafana/dashboards/cilium
                - grafana/dashboards/fluent-bit
                - grafana/dashboards/fluentd
              substitutions:
                date_full: "YYYY-MM-DD HH:mm:ss"
                date_interval_second: "HH:mm:ss"
                date_interval_minute: "HH:mm"
                date_interval_hour: "MM/DD HH:mm"
                date_interval_day: "MM/DD"
      messages:
        - text: |-
            Grafana is ready at https://grafana.example.local

            Sign in with username 'admin' and password 'grafana'.

            The gateway cert is self-signed. Trust the local CA, or click through
            the browser warning on your first visit.

  # Dev + identity: the SSO login message replaces the Grafana admin one.
  - name: dev sso message replaces the grafana admin message
    values:
      platform: metal
      dev: true
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    expect:
      messages:
        - text: |-
            Grafana is ready at https://grafana.example.local

            Single sign-on is on: clicking Grafana goes straight to the login.
            Sign in with either seeded user (they work for every SSO app):

              ┌──────────┬─────────────────┬────────────┐
              │ username │ password        │ role       │
              ├──────────┼─────────────────┼────────────┤
              │ admin    │ admin-password  │ full admin │
              │ viewer   │ viewer-password │ read-only  │
              └──────────┴─────────────────┴────────────┘

            The gateway cert is self-signed. Trust the local CA, or click through
            the browser warning on your first visit.

  # Full: stdout driver with Gateway API (envoy); grafana/gateway route included.
  - name: full config with stdout driver creates FluentD pipeline and log filtering
    values:
      platform: metal
      dns:
        domain: full.example.com
      time_format: 24h
      log_level: warn
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
      addons:
        observability:
          enabled: true
          logs_driver: stdout
    expect:
      flux:
        - name: telemetry
          resources:
            - components:
                - fluentbit/fluentd
        - name: observability
          install:
            components:
              - grafana
              - grafana/prometheus
            substitutions:
              external_domain: full.example.com
          resources:
            - dependsOn:
                - gateway-resources
                - telemetry-resources
              components:
                - grafana/dashboards/node
                - grafana/dashboards/kubernetes
                - grafana/dashboards/flux
                - grafana/dashboards/cert-manager
                - grafana/dashboards/cilium
                - grafana/dashboards/fluent-bit
                - grafana/dashboards/fluentd
                - grafana/gateway
                - fluentd/outputs/stdout
              substitutions:
                external_domain: full.example.com
                date_full: "YYYY-MM-DD HH:mm:ss"
                date_interval_second: "HH:mm:ss"
                date_interval_minute: "HH:mm"
                date_interval_hour: "MM/DD HH:mm"
                date_interval_day: "MM/DD"

  # Full: quickwit driver; addon wins (last-wins), addon contributes quickwit + fluentd output only
  - name: full config with quickwit driver creates storage pipeline with PVC and dashboards
    values:
      platform: metal
      dns:
        domain: quickwit.example.com
      network: *default-network
      cluster: *default-cluster
      addons:
        observability:
          enabled: true
          logs_driver: quickwit
    expect:
      flux:
        - name: telemetry
          resources:
            - components:
                - fluentbit/fluentd
        - name: observability
          dependsOn:
            - csi-install
          install:
            timeout: 20m
            interval: 5m
            components:
              - quickwit
              - quickwit/pvc
              - quickwit/prometheus
              - grafana/quickwit
          resources:
            - dependsOn:
                - telemetry-resources
              timeout: 10m
              interval: 5m
              components:
                - fluentd/outputs/quickwit
                - grafana/dashboards/logs/quickwit
                - grafana/dashboards/quickwit

  # Full: elasticsearch driver. Addon overrides the telemetry flux: system (filebeat) via strategy: replace.
  - name: full config with elasticsearch driver creates ELK stack with filebeat
    values:
      platform: metal
      dns:
        domain: elk.example.com
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
      addons:
        observability:
          enabled: true
          logs_driver: elasticsearch
    expect:
      flux:
        - name: telemetry
          install:
            components:
              - prometheus
              - prometheus/flux
              - filebeat
              - metrics-server
            timeout: 30m
            interval: 10m
          resources:
            - components:
                - prometheus
                - prometheus/flux
                - prometheus/alerts/node
                - prometheus/alerts/prometheus
                - prometheus/alerts/coredns
                - prometheus/alerts/cert-manager
                - prometheus/alerts/flux
                - prometheus/alerts/envoy
              timeout: 10m
          interval: 5m
        - name: observability
          dependsOn:
            - csi-install
          install:
            timeout: 20m
            interval: 5m
            components:
              - elasticsearch
              - kibana
          resources:
            - dependsOn:
                - gateway-resources
              timeout: 10m
              interval: 5m
              components:
                - kibana/gateway
              substitutions:
                external_domain: elk.example.com

  # Addon disabled: Grafana / log-storage outputs are not created, but the FluentD
  # aggregator (part of base telemetry) still runs.
  - name: excludes observability when addon disabled
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      addons:
        observability:
          enabled: false
    expect:
      flux:
        - name: observability
          install:
            components:
              - fluentd
          resources:
            - components:
                - fluentd/filters/otel
                - fluentd/prometheus

  # Edge: trace log level; grafana dashboards appear without a route (gateway disabled), stdout output included.
  - name: trace log level creates stdout pipeline without log filter
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      log_level: trace
      addons:
        observability:
          enabled: true
          logs_driver: stdout
    expect:
      flux:
        - name: observability
          install:
            components:
              - grafana
              - grafana/prometheus
          resources:
            - dependsOn:
                - telemetry-resources
              components:
                - grafana/dashboards/node
                - grafana/dashboards/kubernetes
                - grafana/dashboards/flux
                - grafana/dashboards/cert-manager
                - grafana/dashboards/cilium
                - grafana/dashboards/fluent-bit
                - grafana/dashboards/fluentd
                - fluentd/outputs/stdout

  # Edge: gateway disabled → gateway.enabled is false → filebeat replacement skipped.
  # telemetry keeps its default fluentbit components; elasticsearch/kibana not deployed.
  - name: elasticsearch with gateway disabled skips filebeat and ELK stack
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      addons:
        observability:
          enabled: true
          logs_driver: elasticsearch
    expect:
      flux:
        - name: telemetry
          install:
            components:
              - fluentbit

  # Edge: Envoy gateway mode uses Gateway API route components for Grafana and Kibana.
  - name: elasticsearch observability with envoy uses gateway routes
    values:
      platform: metal
      gateway:
        enabled: true
        driver: envoy
      dns:
        domain: envoy-observability.example.com
      network: *default-network
      cluster: *default-cluster
      addons:
        observability:
          enabled: true
          logs_driver: elasticsearch
    expect:
      flux:
        - name: observability
          dependsOn:
            - csi-install
          resources:
            - dependsOn:
                - gateway-resources
              components:
                - grafana/gateway
                - kibana/gateway
