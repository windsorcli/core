# addon-secrets-store.yaml facet tests
# Tests the secrets store addon (openbao self-hosted / external Vault-API-compatible).

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Minimal: openbao driver merges into the same "secrets" Kustomization as
  # addon-external-secrets.yaml, same as platform-base.yaml and
  # addon-private-ca.yaml both landing in "pki".
  - name: enabling secrets_store with the openbao driver installs it alongside external-secrets
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      external_secrets:
        enabled: true
      secrets_store:
        enabled: true
    expect:
      flux:
        - name: secrets
          dependsOn:
            - csi-install
            - pki-install
          install:
            components:
              - external-secrets
              - openbao
              - openbao/bootstrap
            timeout: 10m
            interval: 5m

  # Monitoring: openbao/prometheus only when metrics are on.
  - name: telemetry metrics enabled adds openbao/prometheus
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      external_secrets:
        enabled: true
      secrets_store:
        enabled: true
      telemetry:
        metrics:
          enabled: true
    expect:
      flux:
        - name: secrets
          install:
            components:
              - external-secrets
              - openbao
              - openbao/bootstrap
              - openbao/prometheus

  # Gateway route: private access only, waits for gateway-resources.
  - name: gateway access private adds the openbao gateway route
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      dns:
        private_domain: test
      gateway:
        enabled: true
        access: private
      external_secrets:
        enabled: true
      secrets_store:
        enabled: true
    expect:
      flux:
        - name: secrets
          resources:
            - dependsOn:
                - gateway-resources
              components:
                - openbao/gateway
              timeout: 10m
              interval: 5m
              substitutions:
                external_domain: test

  # Edge case: public gateway access does not add the openbao route.
  - name: gateway access public does not add the openbao gateway route
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      gateway:
        enabled: true
      external_secrets:
        enabled: true
      secrets_store:
        enabled: true
    exclude:
      flux:
        - name: secrets
          resources:
            - components:
                - openbao/gateway

  # Requires: secrets_store alone is meaningless without a controller to read from it.
  - name: secrets_store without external_secrets fails composition
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      secrets_store:
        enabled: true
    expectError: true

  # Edge case: default is disabled — no openbao component.
  - name: excludes openbao when secrets_store disabled by default
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      external_secrets:
        enabled: true
    expect:
      flux:
        - name: secrets
          install:
            components:
              - external-secrets

  # AWS: seal "awskms" component + region/kms_key_id substitutions.
  - name: aws platform adds the aws-kms-unseal component
    values:
      platform: aws
      aws:
        region: us-west-2
      gateway:
        enabled: false
      external_secrets:
        enabled: true
      secrets_store:
        enabled: true
    expect:
      flux:
        - name: secrets
          install:
            components:
              - openbao/aws-kms-unseal
            substitutions:
              aws_region: us-west-2
              openbao_kms_key_id: "${terraform_output('cluster', 'openbao_kms_key_id') ?? ''}"

  # Azure: seal "azurekeyvault" + Workload Identity components and substitutions.
  - name: azure platform adds the azure-keyvault-unseal and workload-identity components
    values:
      platform: azure
      gateway:
        enabled: false
      external_secrets:
        enabled: true
      secrets_store:
        enabled: true
    expect:
      flux:
        - name: secrets
          install:
            components:
              - openbao/azure-keyvault-unseal
              - openbao/azure-workload-identity
            substitutions:
              openbao_tenant_id: "${terraform_output('cluster', 'tenant_id') ?? ''}"
              openbao_client_id: "${terraform_output('cluster', 'openbao_client_id') ?? ''}"
              openbao_vault_name: "${terraform_output('cluster', 'openbao_key_vault_name') ?? ''}"
              openbao_key_name: "${terraform_output('cluster', 'openbao_key_name') ?? ''}"
