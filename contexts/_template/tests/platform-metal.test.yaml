# platform-metal.yaml facet tests
# Tests Talos cluster infrastructure with load balancer and ingress configuration
#
# Note: platform: metal requires cluster.controlplanes.nodes because
# cluster_endpoint is derived from the first node.

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1: &cp1-node
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local


cases:
  # Minimal: Test default behavior with required fields only
  - name: minimal config creates Talos cluster with Cilium L2 and default CSI
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          parallelism: 1
          inputs:
            cluster_endpoint: https://10.5.0.10:6443
            cluster_name: talos
        - name: cni
          path: cni/cilium
          dependsOn:
            - cluster
          inputs:
            k8s_service_host: localhost
            k8s_service_port: 7445
            privileged: false
            cgroup_auto_mount: false
        - name: gitops
          path: gitops/flux
          dependsOn:
            - cluster
            - cni
          destroy: false
          inputs:
            concurrency: 4
            mode: push
      flux:
        - name: policy
          install:
            components:
              - kyverno
            timeout: 30m
            interval: 5m
          resources:
            - components:
                - kyverno/resource-limits-requests
                - kyverno/require-image-digest
                - kyverno/external-dns-ttl
                - kyverno
              timeout: 8m
              interval: 5m
        - name: telemetry
          install:
            components:
              - prometheus
              - prometheus/flux
              - fluentbit
              - metrics-server
            timeout: 30m
            interval: 10m
          resources:
            - components:
                - prometheus
                - prometheus/flux
                - prometheus/alerts/node
                - prometheus/alerts/prometheus
                - prometheus/alerts/coredns
                - prometheus/alerts/cert-manager
                - prometheus/alerts/flux
                - fluentbit
                - fluentbit/containerd
                - fluentbit/kubernetes
                - fluentbit/parser
                - fluentbit/systemd
                - fluentbit/prometheus
              timeout: 10m
              interval: 5m
        - name: pki
          dependsOn:
            - policy-resources
            - telemetry-install
          install:
            components:
              - cert-manager
              - cert-manager/prometheus
            timeout: 20m
            interval: 5m
        - name: cni
          dependsOn:
            - policy-resources
          install:
            components:
              - cilium
              - cilium/talos
              - cilium/l2
            substitutions:
              k8s_service_host: localhost
        - name: cni
          resources:
            - components:
                - cilium/l2
              substitutions:
                loadbalancer_start_ip: "10.5.1.20"
                loadbalancer_end_ip: "10.5.1.100"
        - name: csi
          dependsOn:
            - policy-resources
          install:
            components:
              - openebs
              - openebs/dynamic-localpv
            substitutions:
              local_volume_path: /var/mnt/local
              local_volume_quota: "true"
    exclude:
      kustomize:
        - name: lb-install
        - name: lb-resources

  # Full: Test all configurable options together (explicit flannel CNI to exercise MetalLB path)
  - name: full config with MetalLB, custom resources, ingress, and custom worker volume
    values:
      platform: metal
      workstation:
        runtime: colima
      gateway:
        enabled: true
        driver: envoy
      network:
        loadbalancer_driver: metallb
        loadbalancer_mode: arp
        loadbalancer_ips:
          start: "192.168.1.100"
          end: "192.168.1.200"
      cluster:
        driver: talos
        cni:
          driver: flannel
        controlplanes:
          cpu: 20
          memory: 32
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 1
          volumes:
            - /mnt/data
        storage:
          local_base_path: /mnt/data
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          parallelism: 1
          inputs:
            cluster_endpoint: https://10.5.0.10:6443
            cluster_name: talos
        - name: gitops
          path: gitops/flux
          dependsOn:
            - cluster
          destroy: false
          inputs:
            concurrency: 10
      flux:
        - name: policy
          install:
            components:
              - kyverno
            timeout: 30m
            interval: 5m
          resources:
            - components:
                - kyverno/resource-limits-requests
                - kyverno/require-image-digest
                - kyverno/external-dns-ttl
                - kyverno
              timeout: 8m
              interval: 5m
        - name: telemetry
          install:
            components:
              - prometheus
              - prometheus/flux
              - fluentbit
              - metrics-server
            timeout: 30m
            interval: 10m
          resources:
            - components:
                - prometheus
                - prometheus/flux
                - prometheus/alerts/node
                - prometheus/alerts/prometheus
                - prometheus/alerts/coredns
                - prometheus/alerts/cert-manager
                - prometheus/alerts/flux
                - prometheus/alerts/envoy
                - fluentbit
                - fluentbit/containerd
                - fluentbit/kubernetes
                - fluentbit/parser
                - fluentbit/systemd
                - fluentbit/prometheus
              timeout: 10m
              interval: 5m
        - name: pki
          dependsOn:
            - policy-resources
            - telemetry-install
          install:
            components:
              - cert-manager
              - cert-manager/prometheus
            timeout: 20m
            interval: 5m
        - name: lb
          dependsOn:
            - policy-resources
          install:
            components:
              - metallb
            timeout: 5m
            interval: 5m
          resources:
            - components:
                - metallb/arp
              substitutions:
                loadbalancer_ip_range: 192.168.1.100-192.168.1.200
              timeout: 5m
              interval: 5m
        - name: csi
          dependsOn:
            - policy-resources
          install:
            components:
              - openebs
              - openebs/dynamic-localpv
            substitutions:
              local_volume_path: /mnt/data
              local_volume_quota: "true"

  # Edge case: longhorn storage driver passes Talos extensions via cluster-extensions step.
  # Also asserts the controlplanes/workers inputs come from the user-supplied node map
  # (no compute layer on metal), projected to the {node, endpoint} shape the
  # extensions module accepts — i.e. talos_node_targets is wired correctly.
  - name: longhorn storage driver passes iscsi and util-linux extensions to cluster terraform
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 1
          volumes:
            - /var/mnt/longhorn
        storage:
          driver: longhorn
          local_base_path: /var/mnt/longhorn
    expect:
      terraform:
        - name: cluster-extensions
          path: cluster/talos/extensions
          dependsOn:
            - cni
          parallelism: 1
          inputs:
            extensions:
              - siderolabs/iscsi-tools
              - siderolabs/util-linux-tools
            base_extensions: []
            installer: installer
            powercycle_reboot: false
            controlplanes:
              - node: 10.5.0.10
                endpoint: 10.5.0.10:50000

  # A node's install_image reaches the cluster step and the extensions upgrade.
  - name: node install_image reaches cluster and cluster-extensions
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1:
              <<: *cp1-node
              install_image: factory.talos.dev/metal-installer/a636242df247ad4aad2e36d1026d8d4727b716a3061749bd7b19651e548f65e4:v1.14.5
        workers:
          count: 1
          volumes:
            - /var/mnt/longhorn
        storage:
          driver: longhorn
          local_base_path: /var/mnt/longhorn
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplanes:
              - endpoint: 10.5.0.10:50000
                node: 10.5.0.10
                hostname: controlplane-1
                install_image: factory.talos.dev/metal-installer/a636242df247ad4aad2e36d1026d8d4727b716a3061749bd7b19651e548f65e4:v1.14.5
        - name: cluster-extensions
          path: cluster/talos/extensions
          inputs:
            controlplanes:
              - node: 10.5.0.10
                endpoint: 10.5.0.10:50000
                install_image: factory.talos.dev/metal-installer/a636242df247ad4aad2e36d1026d8d4727b716a3061749bd7b19651e548f65e4:v1.14.5

  # A pool's board gives its nodes the board's Image Factory overlay, for the cluster and extensions steps.
  - name: pool board sets the overlay on the pool's nodes
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          board: rpi_5
          nodes:
            controlplane-1: *cp1-node
        workers:
          board: rpi_5
          count: 1
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
          volumes:
            - /var/mnt/longhorn
        storage:
          driver: longhorn
          local_base_path: /var/mnt/longhorn
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplanes:
              - endpoint: 10.5.0.10:50000
                node: 10.5.0.10
                hostname: controlplane-1
                overlay:
                  name: rpi_5
                  image: siderolabs/sbc-raspberrypi
            workers:
              - endpoint: 10.5.0.20:50000
                node: 10.5.0.20
                overlay:
                  name: rpi_5
                  image: siderolabs/sbc-raspberrypi
        - name: cluster-extensions
          path: cluster/talos/extensions
          inputs:
            controlplanes:
              - node: 10.5.0.10
                endpoint: 10.5.0.10:50000
                overlay:
                  name: rpi_5
                  image: siderolabs/sbc-raspberrypi
            workers:
              - node: 10.5.0.20
                endpoint: 10.5.0.20:50000
                overlay:
                  name: rpi_5
                  image: siderolabs/sbc-raspberrypi

  # A node's board wins over its pool's board; a node's install_image passes through for the cluster
  # step to prefer; a node in a pool without a board keeps the stock installer.
  - name: node board overrides pool board and install_image passes through
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          board: rpi_5
          count: 2
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              board: rpi_generic
            worker-2:
              endpoint: 10.5.0.21:50000
              node: 10.5.0.21
              install_image: ghcr.io/siderolabs/installer:v1.14.5
          volumes:
            - /var/mnt/local
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplanes:
              - endpoint: 10.5.0.10:50000
                node: 10.5.0.10
                hostname: controlplane-1
            workers:
              - endpoint: 10.5.0.20:50000
                node: 10.5.0.20
                overlay:
                  name: rpi_generic
                  image: siderolabs/sbc-raspberrypi
              - endpoint: 10.5.0.21:50000
                node: 10.5.0.21
                install_image: ghcr.io/siderolabs/installer:v1.14.5
                overlay:
                  name: rpi_5
                  image: siderolabs/sbc-raspberrypi

  # Pool config_patches reach the cluster step as YAML documents; a node's config_patches ride on the node.
  - name: pool and node config_patches reach cluster
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          config_patches:
            - machine:
                sysctls:
                  vm.swappiness: "1"
          nodes:
            controlplane-1:
              <<: *cp1-node
              config_patches:
                - apiVersion: v1alpha1
                  kind: VolumeConfig
                  name: EPHEMERAL
                  provisioning:
                    diskSelector:
                      match: "!system_disk && disk.transport == 'usb'"
                - machine:
                    sysctls:
                      vm.dirty_ratio: "5"
        workers:
          count: 1
          config_patches:
            - machine:
                sysctls:
                  vm.swappiness: "10"
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
          volumes:
            - /var/mnt/local
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplane_config_patches: |-
              machine:
                sysctls:
                  vm.swappiness: "1"
            worker_config_patches: |-
              machine:
                kubelet:
                  extraConfig:
                    kubeReserved:
                      cpu: 80m
                      memory: 1843Mi
              ---
              machine:
                sysctls:
                  vm.swappiness: "10"
            controlplanes:
              - endpoint: 10.5.0.10:50000
                node: 10.5.0.10
                hostname: controlplane-1
                config_patches: |-
                  apiVersion: v1alpha1
                  kind: VolumeConfig
                  name: EPHEMERAL
                  provisioning:
                    diskSelector:
                      match: "!system_disk && disk.transport == 'usb'"
                  ---
                  machine:
                    sysctls:
                      vm.dirty_ratio: "5"
            workers:
              - endpoint: 10.5.0.20:50000
                node: 10.5.0.20

  # A board with no Image Factory overlay fails composition.
  - name: unknown pool board fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        workers:
          board: rpi_6
    expectError: true

  # A node board with no Image Factory overlay fails composition.
  - name: unknown node board fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1:
              <<: *cp1-node
              board: rpi_6
    expectError: true

  # Neither a board nor install_image: nodes pass through unchanged, so the cluster module
  # falls back to the stock installer.
  - name: no board or install_image passes nodes through unchanged
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplanes:
              - endpoint: 10.5.0.10:50000
                node: 10.5.0.10
                hostname: controlplane-1
            workers: []

  - name: pool disks reach every node in the pool
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          disks:
            - name: etcd-data
              selector: "disk.transport == 'nvme'"
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 2
          disks:
            - name: data-1
              selector: "disk.transport == 'usb'"
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
            worker-2:
              endpoint: 10.5.0.21:50000
              node: 10.5.0.21
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplanes:
              - endpoint: 10.5.0.10:50000
                node: 10.5.0.10
                hostname: controlplane-1
                disks:
                  - name: etcd-data
                    selector: "disk.transport == 'nvme'"
            workers:
              - endpoint: 10.5.0.20:50000
                node: 10.5.0.20
                disks:
                  - name: data-1
                    selector: "disk.transport == 'usb'"
              - endpoint: 10.5.0.21:50000
                node: 10.5.0.21
                disks:
                  - name: data-1
                    selector: "disk.transport == 'usb'"

  - name: node disks replace pool disks for that node
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 2
          disks:
            - name: data-1
              selector: "disk.transport == 'usb'"
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
            worker-2:
              endpoint: 10.5.0.21:50000
              node: 10.5.0.21
              disks:
                - name: data-2
                  selector: "disk.serial == 'WD-ABC123'"
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplanes:
              - endpoint: 10.5.0.10:50000
                node: 10.5.0.10
                hostname: controlplane-1
            workers:
              - endpoint: 10.5.0.20:50000
                node: 10.5.0.20
                disks:
                  - name: data-1
                    selector: "disk.transport == 'usb'"
              - endpoint: 10.5.0.21:50000
                node: 10.5.0.21
                disks:
                  - name: data-2
                    selector: "disk.serial == 'WD-ABC123'"

  - name: no pool or node disks passes nodes without disks
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 1
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplanes:
              - endpoint: 10.5.0.10:50000
                node: 10.5.0.10
                hostname: controlplane-1
            workers:
              - endpoint: 10.5.0.20:50000
                node: 10.5.0.20

  # Edge case: openebs (default) does not need Talos extensions, so cluster-extensions
  # must NOT appear in the rendered blueprint and gitops must not depend on it.
  # Guards against regressions in the option-storage `when:` filter.
  - name: openebs storage driver excludes cluster-extensions terraform step
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    exclude:
      terraform:
        - name: cluster-extensions

  - name: flannel defaults the load balancer to kube-vip with the cloud provider
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expect:
      flux:
        - name: lb
          install:
            components:
              - kube-vip
              - kube-vip/arp
              - kube-vip/cloud-provider
            substitutions:
              loadbalancer_ip_range: 10.5.1.20-10.5.1.100

  - name: cilium with the none load balancer driver skips the l2 pool
    values:
      platform: metal
      gateway:
        enabled: false
      network:
        <<: *default-network
        loadbalancer_driver: none
      cluster: *default-cluster
    exclude:
      kustomize:
        - name: cni-resources
        - name: lb-install

  - name: cilium with the kube-vip load balancer driver fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network:
        <<: *default-network
        loadbalancer_driver: kube-vip
      cluster: *default-cluster
    expectError: true

  - name: flannel with the cilium load balancer driver fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network:
        <<: *default-network
        loadbalancer_driver: cilium
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expectError: true

  # The VIP interface takes DHCP by default, since bare-metal nodes normally lease addresses.
  - name: metal cluster.vip passes a DHCP VIP interface to the cluster step
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        endpoint: https://10.5.0.5:6443
        vip: true
    expect:
      terraform:
        - name: cluster
          inputs:
            cluster_endpoint: https://10.5.0.5:6443
            vip_interface:
              deviceSelector:
                physical: true
              dhcp: true

  - name: metal cluster.vip with network.dhcp false passes a static VIP interface
    values:
      platform: metal
      gateway:
        enabled: false
      network:
        <<: *default-network
        dhcp: false
      cluster:
        <<: *default-cluster
        endpoint: https://10.5.0.5:6443
        vip: true
    expect:
      terraform:
        - name: cluster
          inputs:
            cluster_endpoint: https://10.5.0.5:6443
            vip_interface:
              deviceSelector:
                physical: true
              dhcp: false

  - name: metal without cluster.vip passes no VIP interface
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        endpoint: https://10.5.0.5:6443
    expect:
      terraform:
        - name: cluster
          inputs:
            cluster_endpoint: https://10.5.0.5:6443
            vip_interface: null

  - name: metal cluster.vip without cluster.endpoint fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        vip: true
    expectError: true

  # Requires: metal has no compute layer, so the operator must declare the
  # controlplane nodes that windsor talks to.
  - name: metal without controlplane nodes fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
    expectError: true
