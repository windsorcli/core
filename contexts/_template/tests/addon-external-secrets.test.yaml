# addon-external-secrets.yaml facet tests
# Tests the External Secrets Operator install-only addon.

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Minimal: enabling the addon installs the operator and vendors its CRDs.
  # Shares the "secrets" Kustomization with addon-secrets-store.yaml.
  - name: enabling external_secrets installs the operator
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      external_secrets:
        enabled: true
    expect:
      flux:
        - name: secrets
          install:
            components:
              - external-secrets
            timeout: 10m
            interval: 5m
      crds:
        - external-secrets-2.8.0

  # Edge case: default is disabled — no flux entry, no vendored CRDs.
  - name: excludes external-secrets when disabled by default
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: secrets
      crds:
        - external-secrets-2.8.0
