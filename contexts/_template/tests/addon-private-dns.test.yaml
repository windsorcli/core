# addon-private-dns.yaml facet tests
# Tests CoreDNS for private DNS zones with external-dns integration

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local


cases:
  # Minimal: Test default behavior with dev mode (implicit enablement).
  # Metal defaults to Cilium CNI → gateway driver is cilium → dns depends on cni for LBIPAM.
  - name: minimal config creates CoreDNS with defaults via dev mode
    values:
      gateway:
        internal:
          ip: "10.5.1.10"
      platform: metal
      dev: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          dependsOn:
            - pki-resources
            - cni-install
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
          install:
            components:
              - coredns
              - coredns/etcd
              - coredns/prometheus
              - coredns/loadbalancer
              - coredns/cilium

  # Full: Test all options with Docker Desktop (envoy gateway — docker-desktop default).
  - name: full config creates CoreDNS on Docker Desktop
    values:
      platform: metal
      dev: true
      workstation:
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: dns
          dependsOn:
            - pki-resources
            - gateway-install
            - policy-resources
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
          install:
            components:
              - coredns
              - coredns/etcd
              - coredns/prometheus
              - coredns/gateway

  # Docker platform + docker-desktop + dev: gateway defaults to envoy (no cilium CNI on docker-desktop),
  # so dns depends on gateway-install (not cni) and gets coredns/gateway instead of coredns/loadbalancer.
  - name: docker-desktop with dev mode uses envoy gateway and coredns/gateway
    values:
      platform: docker
      dev: true
      workstation:
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: dns
          dependsOn:
            - pki-resources
            - gateway-install
            - policy-resources
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
          install:
            components:
              - coredns
              - coredns/etcd
              - coredns/prometheus
              - coredns/gateway
    exclude:
      flux:
        - name: cni

  # Cilium: CoreDNS gets a LoadBalancer IP via LBIPAM; depends on cni.
  - name: cilium gateway uses coredns/loadbalancer and depends on cni
    values:
      platform: metal
      dns:
        private_domain: test
        private:
          enabled: true
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: cilium
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          dependsOn:
            - pki-resources
            - cni-install
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
          install:
            components:
              - coredns
              - coredns/etcd
              - coredns/prometheus
              - coredns/loadbalancer
              - coredns/cilium

  # Edge: Envoy gateway path includes coredns/gateway for DNS routing through
  # the gateway, and external-dns/gateway-httproute so external-dns watches
  # HTTPRoute resources (the CRDs are present here because gateway-install ships).
  - name: private dns works with envoy gateway mode
    values:
      platform: metal
      dns:
        private_domain: test
        private:
          enabled: true
      gateway:
        internal:
          ip: "10.5.1.10"
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          dependsOn:
            - pki-resources
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
                - external-dns/sources/gateway-httproute
          install:
            components:
              - coredns
              - coredns/etcd
              - coredns/prometheus
              - coredns/gateway

  # Edge: Gateway disabled with non-cilium CNI — dns must not depend on gateway-install (it doesn't exist).
  - name: private dns with gateway disabled does not depend on gateway-install
    values:
      platform: metal
      dns:
        private_domain: test
        private:
          enabled: true
      gateway:
        enabled: false
        driver: envoy
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expect:
      flux:
        - name: dns
          dependsOn:
            - pki-resources

  # Edge case: private DNS disabled
  - name: excludes DNS when private DNS disabled
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      dns:
        private:
          enabled: false
    exclude:
      flux:
        - name: dns

  # Requires: enabling private DNS without a private zone fails at config-load.
  - name: missing dns.private_domain fails composition
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      dns:
        private:
          enabled: true
    expectError: true

  # Port 53 cannot sit on a node port outside a workstation context.
  - name: private dns with a NodePort internal gateway fails composition
    values:
      platform: metal
      dns:
        private_domain: example.local
        private:
          enabled: true
      gateway:
        enabled: true
        driver: envoy
        internal:
          service_type: NodePort
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    expectError: true

  # A public domain adds the public zone to the in-cluster DNS.
  - name: public domain adds the public zone to the private DNS add-on
    values:
      gateway:
        internal:
          ip: "10.5.1.10"
        external:
          ip: "10.5.1.11"
      platform: metal
      dev: true
      dns:
        public_domain: public.example.com
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          install:
            components:
              - coredns/public-zone
            substitutions:
              public_domain: public.example.com
          resources:
            - name: public
              components:
                - external-dns/providers/coredns
              substitutions:
                external_dns_name: external-dns-public
                external_dns_domain: public.example.com
            - name: private
              substitutions:
                external_dns_name: external-dns-private

  # dns.private.driver: metal defaults to coredns once dns.private_domain is set.
  - name: metal defaults the private zone driver to coredns
    values:
      platform: metal
      dns:
        private_domain: internal.example.com
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: dns
          install:
            components:
              - coredns
              - coredns/etcd
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
              substitutions:
                external_dns_domain: internal.example.com

  - name: metal private zone driver none excludes CoreDNS
    values:
      platform: metal
      dns:
        private_domain: internal.example.com
        private:
          driver: none
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: dns

  - name: metal deprecated private enabled false excludes CoreDNS
    values:
      platform: metal
      dns:
        private_domain: internal.example.com
        private:
          enabled: false
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: dns

  - name: metal private zone driver cloud fails composition
    values:
      platform: metal
      dns:
        private_domain: internal.example.com
        private:
          driver: cloud
      gateway:
        internal:
          ip: "10.5.1.10"
      network: *default-network
      cluster: *default-cluster
    expectError: true

  - name: metal NodePort internal gateway defaults the private zone driver to none
    values:
      platform: metal
      dns:
        private_domain: internal.example.com
      gateway:
        driver: envoy
        internal:
          service_type: NodePort
      network: *default-network
      cluster:
        <<: *default-cluster
        cni:
          driver: flannel
    exclude:
      flux:
        - name: dns

  - name: hetzner defaults the private zone driver to none
    values:
      platform: hetzner
      dev: true
      hetzner:
        token: test-token
      dns:
        private_domain: internal.example.com
      gateway:
        enabled: false
      network: *default-network
    exclude:
      flux:
        - name: dns

  - name: hetzner private zone driver cloud fails composition
    values:
      platform: hetzner
      dev: true
      hetzner:
        token: test-token
      dns:
        private_domain: internal.example.com
        private:
          driver: cloud
      gateway:
        enabled: false
      network: *default-network
    expectError: true

  - name: hetzner private zone driver coredns fails composition
    values:
      platform: hetzner
      hetzner:
        token: test-token
      dns:
        private:
          driver: coredns
      gateway:
        enabled: false
      network: *default-network
    expectError: true

  - name: aws defaults the private zone driver to cloud
    values:
      platform: aws
      aws:
        region: us-west-2
      dns:
        private_domain: internal.example.com
    terraformOutputs:
      network:
        private_zone_id: Z9PRIVATEZONE
    expect:
      flux:
        - name: dns
          resources:
            - name: private
              components:
                - external-dns/providers/route53
              substitutions:
                external_dns_zone_id_filter: Z9PRIVATEZONE
    exclude:
      flux:
        - name: dns
          install:
            components:
              - coredns
          resources:
            - name: private
              components:
                - external-dns/providers/coredns

  # Cloud plus CoreDNS: each zone keeps exactly one external-dns provider.
  - name: aws private zone driver coredns replaces the cloud private zone provider
    values:
      platform: aws
      aws:
        region: us-west-2
      email: ops@example.com
      dns:
        public_domain: example.com
        private_domain: internal.example.com
        private:
          driver: coredns
    terraformOutputs:
      network:
        private_zone_id: Z9PRIVATEZONE
      dns-zone:
        zone_id: Z1ABCDEF12345
    expect:
      flux:
        - name: dns
          install:
            components:
              - coredns
              - coredns/etcd
          resources:
            - name: public
              components:
                - external-dns/providers/route53
            - name: private
              components:
                - external-dns/providers/coredns
    exclude:
      flux:
        - name: dns
          install:
            components:
              - coredns/public-zone
          resources:
            - name: public
              components:
                - external-dns/providers/coredns
            - name: private
              components:
                - external-dns/providers/route53

  - name: aws deprecated private enabled true selects coredns
    values:
      platform: aws
      aws:
        region: us-west-2
      dns:
        private_domain: internal.example.com
        private:
          enabled: true
    expect:
      flux:
        - name: dns
          install:
            components:
              - coredns
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
    exclude:
      flux:
        - name: dns
          resources:
            - name: private
              components:
                - external-dns/providers/route53

  - name: aws private zone driver none excludes private external-dns
    values:
      platform: aws
      aws:
        region: us-west-2
      dns:
        private_domain: internal.example.com
        private:
          driver: none
    exclude:
      flux:
        - name: dns

  - name: aws private zone driver cloud without a private domain fails composition
    values:
      platform: aws
      aws:
        region: us-west-2
      dns:
        private:
          driver: cloud
    expectError: true

  - name: azure defaults the private zone driver to cloud
    values:
      platform: azure
      dns:
        private_domain: internal.example.com
    terraformOutputs: &azure-network-outputs
      network:
        private_zone_id: /subscriptions/sub-123/resourceGroups/rg-net/providers/Microsoft.Network/privateDnsZones/internal.example.com
        subscription_id: sub-123
        resource_group_name: rg-net
    expect:
      flux:
        - name: dns
          resources:
            - name: private
              components:
                - external-dns/providers/azure
              substitutions:
                external_dns_azure_provider: azure-private-dns
    exclude:
      flux:
        - name: dns
          install:
            components:
              - coredns

  - name: azure private zone driver coredns replaces the cloud private zone provider
    values:
      platform: azure
      dns:
        private_domain: internal.example.com
        private:
          driver: coredns
    terraformOutputs: *azure-network-outputs
    expect:
      flux:
        - name: dns
          install:
            components:
              - coredns
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
    exclude:
      flux:
        - name: dns
          resources:
            - name: private
              components:
                - external-dns/providers/azure

  - name: azure private zone driver none excludes private external-dns
    values:
      platform: azure
      dns:
        private_domain: internal.example.com
        private:
          driver: none
    terraformOutputs: *azure-network-outputs
    exclude:
      flux:
        - name: dns

  - name: gcp defaults the private zone driver to cloud
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      dns:
        private_domain: internal.example.com
    expect:
      flux:
        - name: dns
          resources:
            - name: private
              components:
                - external-dns/providers/google
    exclude:
      flux:
        - name: dns
          install:
            components:
              - coredns

  - name: gcp private zone driver coredns replaces the cloud private zone provider
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      dns:
        private_domain: internal.example.com
        private:
          driver: coredns
    expect:
      flux:
        - name: dns
          install:
            components:
              - coredns
          resources:
            - name: private
              components:
                - external-dns/providers/coredns
    exclude:
      flux:
        - name: dns
          resources:
            - name: private
              components:
                - external-dns/providers/google

  - name: gcp private zone driver none excludes private external-dns
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      dns:
        private_domain: internal.example.com
        private:
          driver: none
    exclude:
      flux:
        - name: dns
