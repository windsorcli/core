# option-demo.yaml facet tests
# Tests demo resources including sample databases

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Minimal: Demo mode creates demo database
  - name: demo mode creates demo database
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - database-install
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - database
                - database/cloudnativepg

  # rds driver: demo database creates an Instance CR and depends on
  # provisioning-resources, not just provisioning-install — the
  # ProviderConfig the Instance references lives in the resources tier.
  # dbSubnetGroupName/kmsKeyId read the real terraform outputs directly,
  # unlike a third-party chart, which has to use the documented naming
  # convention instead. app-role shares this Kustomization with the
  # demo-database namespace, so its RBAC never races the namespace.
  - name: demo mode with rds driver creates demo rds instance
    values:
      platform: aws
      aws:
        region: us-west-2
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    terraformOutputs:
      network:
        db_subnet_group_name: test-rds
      database:
        kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
        security_group_id: sg-0abcd1234
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - database
                - database/rds
                - crossplane/aws-rds/app-role
              substitutions:
                aws_region: us-west-2
                db_subnet_group_name: test-rds
                kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
                rds_security_group_id: sg-0abcd1234
                demo_db_name: demo
                pg_instance_name: demo-db
                pg_database_name: demo
                pg_target_namespace: demo-database
                pg_grant_sql: "GRANT CONNECT ON DATABASE demo TO demo_app; GRANT USAGE ON SCHEMA public TO demo_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO demo_app; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO demo_app;"
    exclude:
      flux:
        - name: database

  # static + bookinfo apps carry no database dependency, and demo is a
  # resources-only system, so no demo-install tier is emitted.
  - name: demo static and bookinfo apps compose as resources tier without install
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          static: true
          bookinfo: true
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          resources:
            - components:
                - static
                - bookinfo
    exclude:
      kustomize:
        - name: demo-install

  # Edge case: Demo disabled excludes demo database
  - name: excludes demo database when demo disabled
    values:
      platform: metal
      dev: true
      demo:
        enabled: false
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: demo
