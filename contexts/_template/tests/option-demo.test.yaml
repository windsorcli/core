# option-demo.yaml facet tests
# Tests demo resources including sample databases

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Minimal: Demo mode creates demo database
  - name: demo mode creates demo database
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - database-install
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - database
                - database/cloudnativepg
              substitutions:
                demo_database_name: demo

  # rds driver: creates an Instance CR. Kyverno defaults its network/KMS fields.
  - name: demo mode with rds driver creates demo rds instance
    values:
      platform: aws
      aws:
        region: us-west-2
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: false
          cloud:
            enabled: true
            driver: rds
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 45m
              deleteTimeout: 60m
              interval: 5m
              components:
                - database
                - database/rds
              substitutions:
                aws_region: us-west-2
                demo_database_name: demo
                database_instance_name: demo-db
              healthCheckExprs:
                - apiVersion: rds.aws.upbound.io/v1beta3
                  kind: Instance
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
            - name: credentials
              dependsOn:
                - demo-resources
              timeout: 10m
              interval: 5m
              components:
                - database/credentials
              substitutions:
                demo_database_name: demo
                database_instance_name: demo-db
              healthCheckExprs:
                - apiVersion: database.windsorcli.dev/v1alpha1
                  kind: AppRole
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')

  - name: demo mode with azuredb driver creates demo azuredb instance
    values:
      id: test1
      platform: azure
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: false
          cloud:
            enabled: true
            driver: azuredb
    terraformOutputs:
      network:
        region: eastus2
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 45m
              deleteTimeout: 60m
              interval: 5m
              components:
                - database
                - database/azuredb
              substitutions:
                azuredb_region: eastus2
                database_instance_name: demo-db-test1
              healthCheckExprs:
                - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
                  kind: FlexibleServer
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
                - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
                  kind: FlexibleServerDatabase
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
            - name: credentials
              dependsOn:
                - demo-resources
              timeout: 10m
              interval: 5m
              components:
                - database/credentials
              substitutions:
                demo_database_name: demo
                database_instance_name: demo-db-test1
              healthCheckExprs:
                - apiVersion: database.windsorcli.dev/v1alpha1
                  kind: AppRole
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')

  # cloudsql driver: creates a DatabaseInstance + User + Database CR trio.
  # GCP twin of the rds/azuredb cases above; Kyverno defaults its fields too.
  - name: demo mode with cloudsql driver creates demo cloudsql instance
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: false
          cloud:
            enabled: true
            driver: cloudsql
    terraformOutputs:
      network:
        region: us-central1
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 45m
              deleteTimeout: 60m
              interval: 5m
              components:
                - database
                - database/cloudsql
              substitutions:
                cloudsql_region: us-central1
                database_instance_name: demo-db
              healthCheckExprs:
                - apiVersion: sql.gcp.upbound.io/v1beta2
                  kind: DatabaseInstance
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
                - apiVersion: sql.gcp.upbound.io/v1beta1
                  kind: Database
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
            - name: credentials
              dependsOn:
                - demo-resources
              timeout: 10m
              interval: 5m
              components:
                - database/credentials
              substitutions:
                demo_database_name: demo
                database_instance_name: demo-db
              healthCheckExprs:
                - apiVersion: database.windsorcli.dev/v1alpha1
                  kind: AppRole
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')

  # database.postgres.cloud.encryption.managed/key_id no longer touch the
  # demo — the CMK lands via the Kyverno policy tested in addon-database.test.yaml.

  # static + bookinfo apps carry no database dependency, and demo is a
  # resources-only system, so no demo-install tier is emitted.
  - name: demo static and bookinfo apps compose as resources tier without install
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          static: true
          bookinfo: true
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          resources:
            - components:
                - static
                - bookinfo
    exclude:
      kustomize:
        - name: demo-install

  # bookinfo's HTTPRoute is a separate resources entry, gated on gateway.enabled
  # and waiting for gateway-resources since it parents to the Gateway object
  # created there.
  - name: bookinfo route uses HTTPRoute when gateway enabled
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          bookinfo: true
      gateway:
        enabled: true
      dns:
        domain: demo.example.com
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          resources:
            - dependsOn:
                - gateway-resources
              components:
                - bookinfo/gateway
              substitutions:
                external_domain: demo.example.com

  # Edge case: Demo disabled excludes demo database
  - name: excludes demo database when demo disabled
    values:
      platform: metal
      dev: true
      demo:
        enabled: false
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: demo
