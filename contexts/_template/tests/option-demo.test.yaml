# option-demo.yaml facet tests
# Tests demo resources including sample databases

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Minimal: Demo mode creates demo database
  - name: demo mode creates demo database
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - database-install
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - database
                - database/cloudnativepg

  # rds driver: creates an Instance CR. Depends on provisioning-resources
  # for its ProviderConfig, not just provisioning-install.
  # dbSubnetGroupName/kmsKeyId read the real terraform outputs directly.
  # A third-party chart uses the documented naming convention instead.
  # app-role is its own Kustomization, dependent on demo-resources for
  # namespace-before-RBAC ordering.
  - name: demo mode with rds driver creates demo rds instance
    values:
      platform: aws
      aws:
        region: us-west-2
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    terraformOutputs:
      network:
        db_subnet_group_name: test-rds
      database:
        kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
        security_group_id: sg-0abcd1234
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - database
                - database/rds
              substitutions:
                aws_region: us-west-2
                db_subnet_group_name: test-rds
                kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
                rds_security_group_id: sg-0abcd1234
                demo_db_name: demo
        - name: demo-app-role
          path: provisioning
          dependsOn:
            - demo-resources
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - crossplane/aws-rds/app-role
              substitutions:
                pg_instance_name: demo-db
                pg_database_name: demo
                pg_target_namespace: demo-database
                pg_grant_sql: ""
    exclude:
      flux:
        - name: database

  - name: demo mode with flexibleserver driver creates demo flexibleserver instance
    values:
      platform: azure
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: flexibleserver
    terraformOutputs:
      network:
        flexibleserver_subnet_id: /subscriptions/sub/resourceGroups/rg/providers/Microsoft.Network/virtualNetworks/vnet-test/subnets/flexibleserver-test
        region: eastus2
      database:
        private_dns_zone_id: /subscriptions/sub/resourceGroups/test-postgres/providers/Microsoft.Network/privateDnsZones/test.postgres.database.azure.com
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - database
                - database/flexibleserver
              substitutions:
                flexibleserver_subnet_id: /subscriptions/sub/resourceGroups/rg/providers/Microsoft.Network/virtualNetworks/vnet-test/subnets/flexibleserver-test
                flexibleserver_private_dns_zone_id: /subscriptions/sub/resourceGroups/test-postgres/providers/Microsoft.Network/privateDnsZones/test.postgres.database.azure.com
                flexibleserver_region: eastus2
        - name: demo-app-role
          path: provisioning
          dependsOn:
            - demo-resources
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - crossplane/azure-postgres/app-role
              substitutions:
                pg_instance_name: demo-db
                pg_database_name: demo
                pg_target_namespace: demo-database
                pg_grant_sql: ""
    exclude:
      flux:
        - name: database

  # static + bookinfo apps carry no database dependency, and demo is a
  # resources-only system, so no demo-install tier is emitted.
  - name: demo static and bookinfo apps compose as resources tier without install
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          static: true
          bookinfo: true
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          resources:
            - components:
                - static
                - bookinfo
    exclude:
      kustomize:
        - name: demo-install

  # Edge case: Demo disabled excludes demo database
  - name: excludes demo database when demo disabled
    values:
      platform: metal
      dev: true
      demo:
        enabled: false
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: demo
