# option-demo.yaml facet tests
# Tests demo resources including sample databases

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Minimal: Demo mode creates demo database
  - name: demo mode creates demo database
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - database-install
          resources:
            - timeout: 10m
              interval: 5m
              components:
                - database
                - database/cloudnativepg

  # rds driver: creates an Instance CR.
  # dbSubnetGroupName/kmsKeyId read the real terraform outputs directly.
  # A third-party chart uses the documented naming convention instead.
  - name: demo mode with rds driver creates demo rds instance
    values:
      platform: aws
      aws:
        region: us-west-2
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
    terraformOutputs:
      network:
        db_subnet_group_name: test-rds
      database:
        kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
        security_group_id: sg-0abcd1234
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 30m
              interval: 5m
              components:
                - database
                - database/rds
              substitutions:
                aws_region: us-west-2
                db_subnet_group_name: test-rds
                kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
                rds_security_group_id: sg-0abcd1234
                demo_db_name: demo
              healthCheckExprs:
                - apiVersion: rds.aws.upbound.io/v1beta3
                  kind: Instance
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        - name: database-credentials
          path: database
          resources:
            - dependsOn:
                - provisioning-resources
                - demo-resources
              timeout: 10m
              interval: 5m
              components:
                - crossplane/postgres/instance-connection
                - crossplane/postgres/app-role
                - crossplane/postgres/monitor-role
                - crossplane/postgres/monitoring-exporter
              substitutions:
                pg_instance_name: demo-db
                pg_database_name: demo
                pg_target_namespace: demo-database
                pg_crd_apiversion: rds.aws.upbound.io/v1beta3
                pg_crd_kind: Instance
                pg_endpoint_field: address
                pg_username_field: username
                pg_username_from_secret: "false"
                pg_admin_username: demo
              healthCheckExprs:
                - apiVersion: postgresql.sql.crossplane.io/v1alpha1
                  kind: Role
                  current: status.conditions.exists(e, e.type == 'Synced' && e.status == 'True')

  # app-role and monitor-role stay unconditional.
  - name: demo mode with rds driver excludes monitoring-exporter when metrics disabled
    values:
      platform: aws
      aws:
        region: us-west-2
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: rds
      telemetry:
        metrics:
          enabled: false
    terraformOutputs:
      network:
        db_subnet_group_name: test-rds
      database:
        kms_key_arn: arn:aws:kms:us-west-2:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab
        security_group_id: sg-0abcd1234
    expect:
      flux:
        - name: database-credentials
          path: database
          resources:
            - components:
                - crossplane/postgres/instance-connection
                - crossplane/postgres/app-role
                - crossplane/postgres/monitor-role
    exclude:
      flux:
        - name: database-credentials
          path: database
          resources:
            - components:
                - crossplane/postgres/monitoring-exporter

  - name: demo mode with flexibleserver driver creates demo flexibleserver instance
    values:
      platform: azure
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: flexibleserver
    terraformOutputs:
      network:
        flexibleserver_subnet_id: /subscriptions/sub/resourceGroups/rg/providers/Microsoft.Network/virtualNetworks/vnet-test/subnets/flexibleserver-test
        region: eastus2
      database:
        private_dns_zone_id: /subscriptions/sub/resourceGroups/test-postgres/providers/Microsoft.Network/privateDnsZones/test.postgres.database.azure.com
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 30m
              interval: 5m
              components:
                - database
                - database/flexibleserver
              substitutions:
                flexibleserver_subnet_id: /subscriptions/sub/resourceGroups/rg/providers/Microsoft.Network/virtualNetworks/vnet-test/subnets/flexibleserver-test
                flexibleserver_private_dns_zone_id: /subscriptions/sub/resourceGroups/test-postgres/providers/Microsoft.Network/privateDnsZones/test.postgres.database.azure.com
                flexibleserver_region: eastus2
              healthCheckExprs:
                - apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
                  kind: FlexibleServer
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        - name: database-credentials
          path: database
          resources:
            - dependsOn:
                - provisioning-resources
                - demo-resources
              timeout: 10m
              interval: 5m
              components:
                - crossplane/postgres/instance-connection
                - crossplane/postgres/app-role
                - crossplane/postgres/monitor-role
                - crossplane/postgres/monitoring-exporter
              substitutions:
                pg_instance_name: demo-db
                pg_database_name: demo
                pg_target_namespace: demo-database
                pg_crd_apiversion: dbforpostgresql.azure.upbound.io/v1beta1
                pg_crd_kind: FlexibleServer
                pg_endpoint_field: fqdn
                pg_username_field: administratorLogin
                pg_username_from_secret: "false"
                pg_admin_username: demo

  # cloudsql driver: creates a DatabaseInstance + User + Database CR trio.
  # GCP twin of the rds/flexibleserver cases above. network_id/kms_key_name
  # read the real terraform outputs directly, matching that convention.
  - name: demo mode with cloudsql driver creates demo cloudsql instance
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
    terraformOutputs:
      network:
        network_id: projects/windsor-test/global/networks/vpc-test
        region: us-central1
      database:
        kms_key_name: projects/windsor-test/locations/us-central1/keyRings/cloudsql-test/cryptoKeys/cloudsql-test
    expect:
      flux:
        - name: demo
          path: demo
          dependsOn:
            - provisioning-resources
          resources:
            - timeout: 30m
              interval: 5m
              components:
                - database
                - database/cloudsql
              substitutions:
                cloudsql_network_id: projects/windsor-test/global/networks/vpc-test
                cloudsql_kms_key_name: projects/windsor-test/locations/us-central1/keyRings/cloudsql-test/cryptoKeys/cloudsql-test
                cloudsql_region: us-central1
              healthCheckExprs:
                - apiVersion: sql.gcp.upbound.io/v1beta2
                  kind: DatabaseInstance
                  current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
        - name: database-credentials
          path: database
          resources:
            - dependsOn:
                - provisioning-resources
                - demo-resources
              timeout: 10m
              interval: 5m
              components:
                - crossplane/postgres/instance-connection
                - crossplane/postgres/app-role
                - crossplane/postgres/monitor-role
                - crossplane/postgres/monitoring-exporter
              substitutions:
                pg_instance_name: demo-db
                pg_database_name: demo
                pg_target_namespace: demo-database
                pg_crd_apiversion: sql.gcp.upbound.io/v1beta2
                pg_crd_kind: DatabaseInstance
                pg_endpoint_field: privateIpAddress
                pg_username_field: username
                pg_username_from_secret: "true"
                pg_admin_username: demo

  # database.postgres.encryption.managed adds the encryption-key component,
  # setting encryptionKeyName only when a real key exists.
  - name: demo mode with cloudsql driver and managed encryption sets the CMK
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      dev: true
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
          encryption:
            managed: true
    terraformOutputs:
      network:
        network_id: projects/windsor-test/global/networks/vpc-test
        region: us-central1
      database:
        kms_key_name: projects/windsor-test/locations/us-central1/keyRings/cloudsql-test/cryptoKeys/cloudsql-test
    expect:
      flux:
        - name: demo
          path: demo
          resources:
            - components:
                - database
                - database/cloudsql
                - database/cloudsql/encryption-key

  # cloudsql's admin credential Secret is declared here (the instance name is
  # demo-specific) but the terraform component itself lives in
  # platform-gcp.yaml — confirms the two facets' inputs merge into one call.
  - name: demo mode with cloudsql driver merges admin_credentials into the shared database component
    values:
      platform: gcp
      gcp:
        project_id: windsor-test
      demo:
        enabled: true
        resources:
          database: true
      gateway:
        enabled: false
      database:
        postgres:
          enabled: true
          driver: cloudsql
    expect:
      terraform:
        - name: database
          path: database/gcp-cloudsql
          inputs:
            project_id: windsor-test
            admin_credentials:
              demo-db:
                username: demo

  # static + bookinfo apps carry no database dependency, and demo is a
  # resources-only system, so no demo-install tier is emitted.
  - name: demo static and bookinfo apps compose as resources tier without install
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          static: true
          bookinfo: true
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          resources:
            - components:
                - static
                - bookinfo
    exclude:
      kustomize:
        - name: demo-install

  # bookinfo's HTTPRoute is a separate resources entry, gated on gateway.enabled
  # and waiting for gateway-resources since it parents to the Gateway object
  # created there.
  - name: bookinfo route uses HTTPRoute when gateway enabled
    values:
      platform: metal
      dev: true
      demo:
        enabled: true
        resources:
          bookinfo: true
      gateway:
        enabled: true
      dns:
        domain: demo.example.com
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: demo
          path: demo
          resources:
            - dependsOn:
                - gateway-resources
              components:
                - bookinfo/gateway
              substitutions:
                external_domain: demo.example.com

  # Edge case: Demo disabled excludes demo database
  - name: excludes demo database when demo disabled
    values:
      platform: metal
      dev: true
      demo:
        enabled: false
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: demo
