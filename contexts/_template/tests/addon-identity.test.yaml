# addon-identity.yaml facet tests
# Cluster identity provider: hosted Keycloak (driver keycloak) or an external OIDC
# issuer (driver oidc); the platform realm; and per-consumer SSO clients.

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Enabled (keycloak driver by default): auto-enables postgres, installs the
  # operator, server + CNPG resources, gateway route, platform realm, and CRDs.
  - name: enabled hosts keycloak, auto-enables postgres, creates realm and crds
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          install:
            components:
              - keycloak-operator
          resources:
            - dependsOn:
                - database-install
              components:
                - keycloak
              substitutions:
                keycloak_hostname: https://keycloak.example.local
                keycloak_image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
                keycloak_start_optimized: "false"
            - dependsOn:
                - gateway-resources
              components:
                - keycloak/gateway
              substitutions:
                external_domain: example.local
            - dependsOn:
                - identity-install
              components:
                - keycloak/realm
              substitutions:
                keycloak_realm: platform
        - name: database
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
      crds:
        # renovate: datasource=github-releases depName=keycloak/keycloak-k8s-resources package=keycloak/keycloak-k8s-resources
        - keycloak-26.7.0

  # Custom pre-built image: use it verbatim and start optimized.
  - name: custom image runs optimized
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          image: registry.example.com/keycloak-optimized:26.7.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
              substitutions:
                keycloak_image: registry.example.com/keycloak-optimized:26.7.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                keycloak_start_optimized: "true"

  # Explicit hostname pins a fixed base URL instead of the bare default.
  - name: custom hostname pins the base url
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          hostname: https://sso.example.com
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
              substitutions:
                keycloak_hostname: https://sso.example.com

  # docker-desktop reaches the gateway on :8443, so the derived hostname keeps that port.
  - name: docker-desktop derives the 8443 gateway port
    values:
      platform: docker
      dns:
        domain: example.local
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
              substitutions:
                keycloak_hostname: https://keycloak.example.local:8443

  # HA topology: the keycloak/ha overlay is flagged on (scales server + Postgres).
  - name: ha topology adds the keycloak ha overlay
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      topology: ha
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
                - keycloak/ha

  # Cilium gateway: the keycloak/cilium overlay is flagged on.
  - name: cilium gateway adds the keycloak cilium netpol overlay
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
        driver: cilium
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
                - keycloak/cilium

  # Supplied admin: the keycloak/admin overlay is flagged on and the
  # keycloak-bootstrap-admin secret is materialized from the given credentials.
  - name: supplied admin credentials add the bootstrap admin overlay and secret
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          admin:
            username: root
            password: s3cret
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
                - keycloak/admin

  # Custom realm name flows through to the realm import substitution.
  - name: custom realm name overrides the platform default
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          realm: corp
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/realm
              substitutions:
                keycloak_realm: corp

  # Inferred SSO (dev): identity + Grafana both on registers the grafana realm client and
  # the Job that copies Keycloak's generated secret to Grafana. Dev seeds the admin/viewer
  # users and shares one admin password with the console (keycloak-bootstrap-admin).
  - name: grafana sso is inferred and patches the client into the realm
    values:
      platform: metal
      dev: true
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
      observability:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/realm
                - keycloak/realm/clients/grafana
                - keycloak/realm/dev-user
              substitutions:
                keycloak_realm: platform
                grafana_url: https://grafana.example.local
                grafana_redirect_uri: https://grafana.example.local/login/generic_oauth
                keycloak_admin_secret: keycloak-bootstrap-admin
                dev_admin_password: admin-password

  # A supplied admin password overrides the dev default and drives both the Keycloak console
  # admin and the dev SSO admin user.
  - name: supplied admin password drives the console and dev sso user
    values:
      platform: metal
      dev: true
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          admin:
            password: sup3r-secret-admin
      observability:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/realm
                - keycloak/realm/clients/grafana
                - keycloak/realm/dev-user
              substitutions:
                keycloak_admin_secret: keycloak-bootstrap-admin
                dev_admin_password: sup3r-secret-admin

  # API-server OIDC (cluster.oidc.enabled) registers the kubernetes realm client.
  - name: cluster oidc enabled patches the kubernetes client into the realm
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/realm
                - keycloak/realm/clients/kubernetes

  # Dev + cluster oidc: binds platform-admins to cluster-admin so the seeded
  # dev admin user can do something after a kubectl OIDC login.
  - name: dev with cluster oidc enabled adds the dev rbac binding
    values:
      platform: metal
      dev: true
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/realm/clients/kubernetes
                - keycloak/realm/clients/kubernetes/dev-rbac

  # Outside dev, no cluster-admin binding is auto-created.
  - name: cluster oidc enabled without dev skips the dev rbac binding
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
      identity:
        enabled: true
    exclude:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/realm/clients/kubernetes/dev-rbac

  # An overridden client_id means the operator already has their own client;
  # core doesn't patch a competing "kubernetes" one into the realm.
  - name: overridden oidc client_id skips the kubernetes realm client
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster:
        <<: *default-cluster
        oidc:
          enabled: true
          client_id: other-client
      identity:
        enabled: true
    exclude:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/realm/clients/kubernetes

  # External OIDC issuer (driver oidc): host nothing — no operator, no server, no
  # realm, no CRDs. Consumers read identity_effective.issuer instead.
  - name: oidc driver hosts nothing and skips keycloak crds
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        driver: oidc
        oidc:
          issuer: https://sso.corp/realms/platform
    exclude:
      flux:
        - name: identity
      crds:
        # renovate: datasource=github-releases depName=keycloak/keycloak-k8s-resources package=keycloak/keycloak-k8s-resources
        - keycloak-26.7.0

  # Disabled: no identity system and no Keycloak CRDs.
  - name: excludes identity when disabled
    values:
      platform: metal
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: false
      database:
        postgres:
          enabled: true
    exclude:
      flux:
        - name: identity
      crds:
        # renovate: datasource=github-releases depName=keycloak/keycloak-k8s-resources package=keycloak/keycloak-k8s-resources
        - keycloak-26.7.0

  # Metrics enabled (default): keycloak/prometheus overlay wires the operator's
  # own ServiceMonitor + Keycloak's server/user-event metrics, and the resources
  # block waits for telemetry-install so the ServiceMonitor CRD exists.
  - name: metrics enabled adds the keycloak prometheus overlay and waits on telemetry-install
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - dependsOn:
                - database-install
                - telemetry-install
              components:
                - keycloak
                - keycloak/prometheus

  # Metrics disabled: no point wiring a ServiceMonitor for a server with no
  # metrics endpoint enabled.
  - name: metrics disabled skips the keycloak prometheus overlay
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
      telemetry:
        metrics:
          enabled: false
    exclude:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/prometheus

  # Observability enabled: Keycloak dashboards land in the Identity folder.
  - name: observability enabled adds the keycloak grafana dashboards
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
      observability:
        enabled: true
    expect:
      flux:
        - name: observability
          resources:
            - components:
                - grafana/dashboards/identity

  # Observability disabled (default): no dashboard ConfigMap to place.
  - name: observability disabled skips the keycloak grafana dashboards
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    exclude:
      flux:
        - name: observability
          resources:
            - components:
                - grafana/dashboards/identity
