# addon-identity.yaml facet tests
# Cluster identity provider: hosted Keycloak (driver keycloak) or an external OIDC
# issuer (driver oidc); the platform realm; and per-consumer SSO clients.

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

cases:
  # Enabled (keycloak driver by default): auto-enables postgres, installs the
  # operator, server + CNPG resources, gateway route, platform realm, and CRDs.
  - name: enabled hosts keycloak, auto-enables postgres, creates realm and crds
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          install:
            components:
              - keycloak-operator
          resources:
            - dependsOn:
                - database-install
              components:
                - keycloak
              substitutions:
                keycloak_hostname: https://keycloak.example.local
                keycloak_image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
                keycloak_start_optimized: "false"
            - dependsOn:
                - gateway-resources
              components:
                - keycloak/gateway
              substitutions:
                external_domain: example.local
            - dependsOn:
                - identity-install
              components:
                - keycloak/realm
              substitutions:
                keycloak_realm: platform
        - name: database
          install:
            components:
              - cloudnativepg
              - cloudnativepg/prometheus
      crds:
        # renovate: datasource=github-releases depName=keycloak/keycloak-k8s-resources package=keycloak/keycloak-k8s-resources
        - keycloak-26.7.0

  # Custom pre-built image: use it verbatim and start optimized.
  - name: custom image runs optimized
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          image: registry.example.com/keycloak-optimized:26.7.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
              substitutions:
                keycloak_image: registry.example.com/keycloak-optimized:26.7.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                keycloak_start_optimized: "true"

  # Explicit hostname pins a fixed base URL instead of the bare default.
  - name: custom hostname pins the base url
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          hostname: https://sso.example.com
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
              substitutions:
                keycloak_hostname: https://sso.example.com

  # docker-desktop reaches the gateway on :8443, so the derived hostname keeps that port.
  - name: docker-desktop derives the 8443 gateway port
    values:
      platform: docker
      dns:
        domain: example.local
      gateway:
        enabled: true
        driver: envoy
      workstation:
        enabled: true
        runtime: docker-desktop
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.5.0.10:6443
            node: 10.5.0.10
            hostname: controlplane-1
        workers: []
      workstation:
        registries: {}
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
              substitutions:
                keycloak_hostname: https://keycloak.example.local:8443

  # HA topology: the keycloak/ha overlay is flagged on (scales server + Postgres).
  - name: ha topology adds the keycloak ha overlay
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      topology: ha
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
                - keycloak/ha

  # Cilium gateway: the keycloak/cilium overlay is flagged on.
  - name: cilium gateway adds the keycloak cilium netpol overlay
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
        driver: cilium
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
                - keycloak/cilium

  # Supplied admin: the keycloak/admin overlay is flagged on and the
  # keycloak-bootstrap-admin secret is materialized from the given credentials.
  - name: supplied admin credentials add the bootstrap admin overlay and secret
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          admin:
            username: root
            password: s3cret
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak
                - keycloak/admin

  # Custom realm name flows through to the realm import substitution.
  - name: custom realm name overrides the platform default
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        keycloak:
          realm: corp
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/realm
              substitutions:
                keycloak_realm: corp

  # Inferred SSO, generated secret: identity + Grafana both on (no grafana.sso needed)
  # registers the OIDC client, replicates via Kyverno (keycloak/grafana-sync), and
  # generates the secret (keycloak/grafana-secret) since none was supplied.
  - name: grafana sso is inferred and generates the client secret
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
      addons:
        observability:
          enabled: true
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/grafana
                - keycloak/grafana-sync
                - keycloak/grafana-secret
              substitutions:
                keycloak_realm: platform
                grafana_url: https://grafana.example.local
                grafana_redirect_uri: https://grafana.example.local/login/generic_oauth

  # Supplied secret: the generation Job is dropped; the secret is materialized into
  # system-identity for the client CR (Kyverno still replicates it to Grafana).
  - name: supplied grafana client secret drops the generation job
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
      addons:
        observability:
          enabled: true
          grafana:
            client_secret: s3cret-oidc
    expect:
      flux:
        - name: identity
          resources:
            - components:
                - keycloak/grafana
                - keycloak/grafana-sync
          secrets:
            grafana-oidc-client:
              data:
                clientSecret: s3cret-oidc

  # External OIDC issuer (driver oidc): host nothing — no operator, no server, no
  # realm, no CRDs. Consumers read identity_effective.issuer instead.
  - name: oidc driver hosts nothing and skips keycloak crds
    values:
      platform: metal
      dns:
        domain: example.local
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: true
        driver: oidc
        oidc:
          issuer: https://sso.corp/realms/platform
    exclude:
      flux:
        - name: identity
      crds:
        - keycloak-26.7.0

  # Disabled: no identity system and no Keycloak CRDs.
  - name: excludes identity when disabled
    values:
      platform: metal
      gateway:
        enabled: true
      network: *default-network
      cluster: *default-cluster
      identity:
        enabled: false
      addons:
        database:
          postgres:
            enabled: true
    exclude:
      flux:
        - name: identity
      crds:
        - keycloak-26.7.0
