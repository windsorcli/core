# addon-devices.yaml facet tests
# Covers the devices Flux system, the Talos device extensions and patches, the requires rules, and passthrough.

x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1: &cp1-node
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local

  incus-outputs: &incus-outputs
    compute:
      controlplanes:
        - endpoint: 10.5.0.10:6443
          node: 10.5.0.10
          hostname: controlplane-1
      workers:
        - endpoint: 10.5.0.20:50000
          node: 10.5.0.20
          hostname: worker-1

  proxmox-cluster: &proxmox-cluster
    driver: talos
    controlplanes:
      count: 1
      nodes:
        controlplane-1:
          endpoint: 10.10.0.10:50000
          node: 10.10.0.10
    workers:
      count: 1
      nodes:
        worker-1:
          endpoint: 10.10.0.20:50000
          node: 10.10.0.20
          passthrough:
            - type: usb
              mapping: zigbee
            - type: pci
              mapping: igpu

cases:
  - name: devices enabled with no serial devices or render GPU installs nfd without the generic device plugin
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      devices:
        enabled: true
    expect:
      flux:
        - name: devices
          install:
            components:
              - node-feature-discovery
            timeout: 10m
            interval: 5m
          resources:
            - components:
                - node-feature-rules
              timeout: 5m
              interval: 5m
      config:
        talos_common:
          extensions: []
          common_patch:
            machine:
              files:
                - op: create
                  path: /etc/cri/conf.d/20-customization.part
                  content: |
                    [plugins."io.containerd.cri.v1.runtime"]
                      device_ownership_from_security_context = true
    exclude:
      terraform:
        - name: cluster-extensions

  - name: devices disabled adds no devices system and no extensions
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    exclude:
      flux:
        - name: devices
      terraform:
        - name: cluster-extensions

  - name: intel driver adds the i915 and xe extensions and the dri device
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      devices:
        enabled: true
        gpu:
          drivers: [intel]
    expect:
      flux:
        - name: devices
          install:
            components:
              - node-feature-discovery
              - generic-device-plugin
            substitutions:
              generic_device_plugin_devices: '[{"groups": [{"count": 10,"paths": [{"mountPath": "/dev/dri/","path": "/dev/dri/renderD*"}]}],"name": "dri"}]'
      terraform:
        - name: cluster-extensions
          path: cluster/talos/extensions
          inputs:
            extensions:
              - siderolabs/i915
              - siderolabs/xe
        - name: gitops
          dependsOn:
            - cluster-extensions

  - name: amd driver adds the amdgpu extension and the dri device
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      devices:
        enabled: true
        gpu:
          drivers: [amd]
    expect:
      flux:
        - name: devices
          install:
            substitutions:
              generic_device_plugin_devices: '[{"groups": [{"count": 10,"paths": [{"mountPath": "/dev/dri/","path": "/dev/dri/renderD*"}]}],"name": "dri"}]'
      terraform:
        - name: cluster-extensions
          inputs:
            extensions:
              - siderolabs/amdgpu

  - name: nvidia driver adds its extensions, plugin, kernel modules, and sysctl without the dri device
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      devices:
        enabled: true
        gpu:
          drivers: [nvidia]
    expect:
      flux:
        - name: devices
          install:
            components:
              - node-feature-discovery
              - nvidia-device-plugin
      terraform:
        - name: cluster-extensions
          inputs:
            extensions:
              - siderolabs/nonfree-kmod-nvidia-lts
              - siderolabs/nvidia-container-toolkit-lts
      config:
        talos_common:
          common_patch:
            machine:
              kernel:
                modules:
                  - name: nvidia
                  - name: nvidia_uvm
                  - name: nvidia_drm
                  - name: nvidia_modeset
              sysctls:
                net.core.bpf_jit_harden: "1"

  - name: nvidia driver with charts.registry pulls its chart from the registry
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      charts:
        registry: registry.example.com/windsor
      devices:
        enabled: true
        gpu:
          drivers: [nvidia]
    expect:
      flux:
        - name: devices
          install:
            components:
              - node-feature-discovery
              - nvidia-device-plugin
              - nvidia-device-plugin/chart-registry

  - name: every driver with longhorn unions the storage and device extensions
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        workers:
          volumes:
            - /var/mnt/longhorn
        storage:
          driver: longhorn
          local_base_path: /var/mnt/longhorn
      devices:
        enabled: true
        gpu:
          drivers: [intel, amd, nvidia]
    expect:
      terraform:
        - name: cluster-extensions
          inputs:
            extensions:
              - siderolabs/iscsi-tools
              - siderolabs/util-linux-tools
              - siderolabs/i915
              - siderolabs/xe
              - siderolabs/amdgpu
              - siderolabs/nonfree-kmod-nvidia-lts
              - siderolabs/nvidia-container-toolkit-lts

  - name: each devices.serial name becomes a device with its globs
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      devices:
        enabled: true
        serial:
          zigbee: ["*Zigbee*", "*ZBT-1*"]
          ups: ["*UPS*"]
    expect:
      flux:
        - name: devices
          install:
            components:
              - node-feature-discovery
              - generic-device-plugin
            substitutions:
              generic_device_plugin_devices: '[{"groups": [{"paths": [{"mountPath": "/dev/ups","path": "/dev/serial/by-id/*UPS*"}]}],"name": "ups"},{"groups": [{"paths": [{"mountPath": "/dev/zigbee","path": "/dev/serial/by-id/*Zigbee*"}]},{"paths": [{"mountPath": "/dev/zigbee","path": "/dev/serial/by-id/*ZBT-1*"}]}],"name": "zigbee"}]'

  - name: devices.serial named dri fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      devices:
        enabled: true
        serial:
          dri: ["*Zigbee*"]
    expectError: true

  - name: gpu drivers without devices.enabled fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      devices:
        gpu:
          drivers: [intel]
    expectError: true

  - name: devices.enabled on docker fails composition
    values:
      platform: docker
      workstation:
        runtime: docker-desktop
      devices:
        enabled: true
    expectError: true

  - name: devices.enabled on aws fails composition
    values:
      platform: aws
      aws:
        region: us-east-2
      devices:
        enabled: true
    expectError: true

  - name: passthrough on metal fails composition
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          nodes:
            controlplane-1:
              <<: *cp1-node
              passthrough:
                - type: usb
                  id: "10c4:ea60"
    expectError: true

  - name: passthrough on hyperv fails composition
    values:
      platform: hyperv
      gateway:
        enabled: false
      network: *default-network
      cluster:
        <<: *default-cluster
        controlplanes:
          nodes:
            controlplane-1:
              <<: *cp1-node
              passthrough:
                - type: usb
                  id: "10c4:ea60"
    expectError: true

  - name: incus passthrough maps usb and pci entries to incus devices
    values:
      platform: incus
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 1
          nodes:
            worker-1:
              endpoint: 10.5.0.20:50000
              node: 10.5.0.20
              hostname: worker-1
              placement: host-a
              passthrough:
                - type: usb
                  id: "10c4:ea60"
                - type: pci
                  id: "0000:00:02.0"
    terraformOutputs: *incus-outputs
    expect:
      terraform:
        - name: compute
          inputs:
            instances:
              - name: controlplane
                devices: {}
              - name: worker
                target: host-a
                devices:
                  passthrough-0:
                    type: usb
                    properties:
                      vendorid: 10c4
                      productid: ea60
                  passthrough-1:
                    type: pci
                    properties:
                      address: "0000:00:02.0"

  - name: incus passthrough entry with only a mapping fails composition
    values:
      platform: incus
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1:
              <<: *cp1-node
              passthrough:
                - type: usb
                  mapping: zigbee
    terraformOutputs: *incus-outputs
    expectError: true

  - name: proxmox passthrough maps entries to usb and pci mappings
    values:
      platform: proxmox
      gateway:
        enabled: false
      network:
        cidr_block: 10.10.0.0/24
      cluster: *proxmox-cluster
      proxmox:
        nodes: [pve]
    expect:
      terraform:
        - name: compute
          inputs:
            instances:
              - name: controlplane
                usb_mappings: []
                pci_mappings: []
              - name: worker
                usb_mappings: [zigbee]
                pci_mappings: [igpu]

  - name: proxmox passthrough entry with only an id fails composition
    values:
      platform: proxmox
      gateway:
        enabled: false
      network:
        cidr_block: 10.10.0.0/24
      cluster:
        <<: *proxmox-cluster
        workers:
          count: 1
          nodes:
            worker-1:
              endpoint: 10.10.0.20:50000
              node: 10.10.0.20
              passthrough:
                - type: usb
                  id: "10c4:ea60"
      proxmox:
        nodes: [pve]
    expectError: true
