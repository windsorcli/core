# addon-private-ca.yaml facet tests
# Tests private Certificate Authority with trust-manager integration

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local


cases:
  # Minimal: dev mode enables private-ca addon. Intended: addon pki install tier (trust-manager) overrides provider. See docs/cli-bugs.md if this fails.
  - name: minimal config creates private CA with defaults via dev mode
    values:
      gateway:
        internal:
          ip: "10.5.1.10"
      platform: metal
      dev: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: pki
          install:
            timeout: 20m
            interval: 5m
            components:
              - trust-manager
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - private-issuer/ca

  # Full: pki explicitly enabled. Intended: addon pki install tier (trust-manager) overrides. See docs/cli-bugs.md if this fails.
  - name: full config creates private CA when pki explicitly enabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        enabled: true
    expect:
      flux:
        - name: pki
          install:
            timeout: 20m
            interval: 5m
            components:
              - trust-manager
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - private-issuer/ca

  # pki/ca terraform_output flows into the private-ca-keypair Secret (key, via
  # secrets: so it never lands in the Kustomization spec) and the trust
  # ConfigMap substitution (cert, not sensitive).
  - name: pki enabled materializes the CA cert/key from the pki terraform output
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        enabled: true
    terraformOutputs:
      pki:
        cert: |-
          -----BEGIN CERTIFICATE-----
          FAKECERT
          -----END CERTIFICATE-----
        key: |-
          -----BEGIN EC PRIVATE KEY-----
          FAKEKEY
          -----END EC PRIVATE KEY-----
    expect:
      flux:
        - name: pki
          secrets:
            private-ca-keypair:
              namespaces: [system-pki]
              data:
                tls.crt: |-
                  -----BEGIN CERTIFICATE-----
                  FAKECERT
                  -----END CERTIFICATE-----
                tls.key: |-
                  -----BEGIN EC PRIVATE KEY-----
                  FAKEKEY
                  -----END EC PRIVATE KEY-----
            private-ca-trust-cert:
              namespaces: [system-pki-trust]
              data:
                tls.crt: |-
                  -----BEGIN CERTIFICATE-----
                  FAKECERT
                  -----END CERTIFICATE-----

  # Supplying only one of cert/key must fail composition, not silently fall
  # back to a generated CA.
  - name: cert without key fails composition
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        ca:
          cert: "-----BEGIN CERTIFICATE-----\nFAKE\n-----END CERTIFICATE-----"
    expectError: true

  - name: key without cert fails composition
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        ca:
          key: "-----BEGIN PRIVATE KEY-----\nFAKE\n-----END PRIVATE KEY-----"
    expectError: true

  # pki.private_ca is the deprecated fallback for pki.ca.
  - name: deprecated private_ca cert without key fails composition
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        private_ca:
          cert: "-----BEGIN CERTIFICATE-----\nFAKE\n-----END CERTIFICATE-----"
    expectError: true

  - name: pki.ca passes the BYO CA to the pki terraform step
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        ca:
          cert: CERT
          key: KEY
    expect:
      terraform:
        - name: pki
          inputs:
            cert: CERT
            key: KEY

  - name: deprecated private_ca passes the BYO CA to the pki terraform step
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        private_ca:
          cert: CERT
          key: KEY
    expect:
      terraform:
        - name: pki
          inputs:
            cert: CERT
            key: KEY

  # pki.enabled is deprecated and ignored.
  - name: pki disabled still creates the cluster CA
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      pki:
        enabled: false
    expect:
      terraform:
        - name: pki
      kustomize:
        - name: pki-resources
          components:
            - private-issuer/ca
