# addon-private-ca.yaml facet tests
# Tests private Certificate Authority with trust-manager integration

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_driver: kube-vip
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.10"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1:
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local


cases:
  # Minimal: dev mode enables private-ca addon. Intended: addon pki install tier (trust-manager) overrides provider. See docs/cli-bugs.md if this fails.
  - name: minimal config creates private CA with defaults via dev mode
    values:
      platform: metal
      dev: true
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - name: pki
          install:
            timeout: 10m
            interval: 5m
            components:
              - trust-manager
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - private-issuer/ca

  # Full: pki explicitly enabled. Intended: addon pki install tier (trust-manager) overrides. See docs/cli-bugs.md if this fails.
  - name: full config creates private CA when pki explicitly enabled
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        enabled: true
    expect:
      flux:
        - name: pki
          install:
            timeout: 10m
            interval: 5m
            components:
              - trust-manager
          resources:
            - timeout: 5m
              interval: 5m
              components:
                - private-issuer/ca

  # pki/ca terraform_output flows into the private-ca-keypair Secret (key, via
  # secrets: so it never lands in the Kustomization spec) and the trust
  # ConfigMap substitution (cert, not sensitive).
  - name: pki enabled materializes the CA cert/key from the pki terraform output
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        enabled: true
    terraformOutputs:
      pki:
        cert: |-
          -----BEGIN CERTIFICATE-----
          FAKECERT
          -----END CERTIFICATE-----
        key: |-
          -----BEGIN EC PRIVATE KEY-----
          FAKEKEY
          -----END EC PRIVATE KEY-----
    expect:
      flux:
        - name: pki
          secrets:
            private-ca-keypair:
              namespaces: [system-pki]
              data:
                tls.crt: |-
                  -----BEGIN CERTIFICATE-----
                  FAKECERT
                  -----END CERTIFICATE-----
                tls.key: |-
                  -----BEGIN EC PRIVATE KEY-----
                  FAKEKEY
                  -----END EC PRIVATE KEY-----
          resources:
            - substitutions:
                private_ca_cert: |-
                  -----BEGIN CERTIFICATE-----
                  FAKECERT
                  -----END CERTIFICATE-----

  # Supplying only one of cert/key must fail composition, not silently fall
  # back to a generated CA.
  - name: cert without key fails composition
    values:
      platform: metal
      network: *default-network
      cluster: *default-cluster
      pki:
        enabled: true
        private_ca:
          cert: "-----BEGIN CERTIFICATE-----\nFAKE\n-----END CERTIFICATE-----"
    expectError: true

  # Edge case: pki disabled
  - name: excludes private CA when pki disabled
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      pki:
        enabled: false
    exclude:
      kustomize:
        - name: pki-resources
          components:
            - private-issuer/ca
