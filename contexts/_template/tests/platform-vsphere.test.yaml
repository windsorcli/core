# platform-vsphere.yaml facet tests
# Tests vSphere compute platform with Talos cluster infrastructure.
#
# Note: tests must provide terraformOutputs.compute to mock terraform_output()
# calls used by cluster_endpoint_fallback and the cluster step's controlplanes
# / workers inputs.

x-defaults:
  network: &default-network
    cidr_block: 10.10.0.0/24
    loadbalancer_ips:
      start: "10.10.0.100"
      end: "10.10.0.110"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      count: 1
      nodes:
        controlplane-1:
          endpoint: 10.10.0.10:50000
          node: 10.10.0.10
          hostname: controlplane-1
    workers:
      count: 0

  vsphere: &default-vsphere
    datacenter: dc-prod
    cluster: cluster-01
    datastore: datastore-01
    network: VM Network

  terraform-outputs: &default-terraform-outputs
    compute:
      controlplanes:
        - endpoint: 10.10.0.10:50000
          node: 10.10.0.10
          hostname: controlplane-1
      workers: []

cases:
  # Minimal: all required vsphere fields, no workers, no MetalLB.
  # Verifies the compute step path, dependency chain, and that the cluster step
  # receives machine_secrets / client_configuration from the compute output.
  - name: minimal config creates compute and cluster steps
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere: *default-vsphere
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            datacenter: dc-prod
            cluster: cluster-01
            datastore: datastore-01
            network: VM Network
            cluster_name: talos
        - name: cluster
          path: cluster/talos
          dependsOn:
            - compute
          parallelism: 1
          inputs:
            cluster_name: talos
        - name: gitops
          path: gitops/flux
          dependsOn:
            - cluster
          destroy: false

  # Cluster endpoint: when cluster.endpoint is set, it takes precedence over
  # the compute output fallback in the cluster step.
  - name: explicit cluster endpoint flows through to cluster step
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        endpoint: https://10.10.0.10:6443
        controlplanes:
          count: 1
          nodes:
            controlplane-1:
              endpoint: 10.10.0.10:50000
              node: 10.10.0.10
              hostname: controlplane-1
        workers:
          count: 0
      vsphere: *default-vsphere
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            cluster_endpoint: https://10.10.0.10:6443

  # Compute cluster_endpoint uses the first control-plane IPv4 when unset.
  - name: compute cluster_endpoint defaults to first control-plane IP when not set
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere: *default-vsphere
    terraformOutputs: *default-terraform-outputs
    expect:
      config:
        talos_common:
          k8s_service_host: "10.10.0.10"
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            cluster_endpoint: https://10.10.0.10:6443

  # Cluster endpoint fallback: once vmtoolsd reports guest IPs, the compute
  # output controlplanes[0].endpoint (host:50000) is split to extract just the
  # IP, then wrapped as https://<ip>:6443. The cluster step receives this
  # derived value when cluster.endpoint is not explicitly set.
  - name: cluster_endpoint_fallback derives https endpoint from compute output
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere: *default-vsphere
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            cluster_endpoint: https://10.10.0.10:6443

  # Folder and resource_pool flow through to compute inputs when set.
  - name: folder and resource_pool flow through to compute inputs
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere:
        datacenter: dc-prod
        cluster: cluster-01
        datastore: datastore-01
        network: VM Network
        folder: prod/talos
        resource_pool: talos-pool
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            folder: prod/talos
            resource_pool: talos-pool

  # host_system flows through to compute inputs when set. Required for
  # multi-host / DRS clusters where the vsphere_host data source cannot
  # auto-select a sole host.
  - name: host_system flows through to compute inputs
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere:
        datacenter: dc-prod
        cluster: cluster-01
        datastore: datastore-01
        network: VM Network
        host_system: esxi-01.dc-prod.local
    terraformOutputs: *default-terraform-outputs
    expect:
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            host_system: esxi-01.dc-prod.local

  # With workers: instances list includes a worker pool entry. Both
  # controlplanes and workers appear in the cluster step's inputs from compute
  # output.
  - name: worker nodes included in compute instances and cluster step
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          count: 1
          nodes:
            controlplane-1:
              endpoint: 10.10.0.10:50000
              node: 10.10.0.10
              hostname: controlplane-1
        workers:
          count: 2
          nodes:
            worker-1:
              endpoint: 10.10.0.20:50000
              node: 10.10.0.20
              hostname: worker-1
            worker-2:
              endpoint: 10.10.0.21:50000
              node: 10.10.0.21
              hostname: worker-2
      vsphere: *default-vsphere
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.10.0.10:50000
            node: 10.10.0.10
            hostname: controlplane-1
        workers:
          - endpoint: 10.10.0.20:50000
            node: 10.10.0.20
            hostname: worker-1
          - endpoint: 10.10.0.21:50000
            node: 10.10.0.21
            hostname: worker-2
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            controlplanes:
              - endpoint: 10.10.0.10:50000
                node: 10.10.0.10
                hostname: controlplane-1
            workers:
              - endpoint: 10.10.0.20:50000
                node: 10.10.0.20
                hostname: worker-1
              - endpoint: 10.10.0.21:50000
                node: 10.10.0.21
                hostname: worker-2

  # Guest IPv4 from cluster.*.nodes; cidr_block and gateway stay the shared LAN.
  - name: declared node IPs override cidrhost offsets on a shared LAN
    values:
      platform: vsphere
      gateway:
        enabled: false
      network:
        cidr_block: 10.41.0.0/22
        gateway: 10.41.3.1
        loadbalancer_ips:
          start: "10.41.3.10"
          end: "10.41.3.20"
      cluster:
        driver: talos
        controlplanes:
          count: 1
          nodes:
            controlplane-1:
              endpoint: 10.41.0.30:50000
              node: 10.41.0.30
              hostname: controlplane-1
        workers:
          count: 1
          nodes:
            worker-1:
              endpoint: 10.41.0.40:50000
              node: 10.41.0.40
              hostname: worker-1
      vsphere: *default-vsphere
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.41.0.30:50000
            node: 10.41.0.30
            hostname: controlplane
        workers:
          - endpoint: 10.41.0.40:50000
            node: 10.41.0.40
            hostname: worker
    expect:
      config:
        network_effective:
          gateway: 10.41.3.1
        talos_common:
          k8s_service_host: "10.41.0.30"
        vsphere_controlplanes:
          nodes:
            - name: controlplane
              ipv4: 10.41.0.30
        vsphere_workers:
          nodes:
            - name: worker
              ipv4: 10.41.0.40
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            cluster_endpoint: https://10.41.0.30:6443
            instances:
              - name: controlplane
                role: controlplane
                count: 1
                ipv4: 10.41.0.30
              - name: worker
                role: worker
                count: 1
                ipv4: 10.41.0.40

  # Non-sequential control-plane IPs emit one count-1 instance each.
  - name: non-sequential control-plane IPs emit one instance each
    values:
      platform: vsphere
      gateway:
        enabled: false
      network:
        cidr_block: 10.41.0.0/22
        gateway: 10.41.3.1
        loadbalancer_ips:
          start: "10.41.3.10"
          end: "10.41.3.20"
      cluster:
        driver: talos
        controlplanes:
          count: 2
          nodes:
            controlplane-1:
              endpoint: 10.41.0.30:50000
              node: 10.41.0.30
              hostname: controlplane-1
            controlplane-2:
              endpoint: 10.41.0.35:50000
              node: 10.41.0.35
              hostname: controlplane-2
        workers:
          count: 0
      vsphere: *default-vsphere
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.41.0.30:50000
            node: 10.41.0.30
            hostname: controlplane-1
          - endpoint: 10.41.0.35:50000
            node: 10.41.0.35
            hostname: controlplane-2
        workers: []
    expect:
      config:
        talos_common:
          k8s_service_host: "10.41.0.30"
        vsphere_controlplanes:
          nodes:
            - name: controlplane-1
              ipv4: 10.41.0.30
            - name: controlplane-2
              ipv4: 10.41.0.35
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            cluster_endpoint: https://10.41.0.30:6443
            instances:
              - name: controlplane-1
                role: controlplane
                count: 1
                ipv4: 10.41.0.30
              - name: controlplane-2
                role: controlplane
                count: 1
                ipv4: 10.41.0.35

  # Omitted nodes map uses cidrhost offsets (.10 / .20).
  - name: cidrhost offsets when nodes are omitted
    values:
      platform: vsphere
      gateway:
        enabled: false
      network:
        cidr_block: 10.10.0.0/24
        loadbalancer_ips:
          start: "10.10.0.100"
          end: "10.10.0.110"
      cluster:
        driver: talos
        controlplanes:
          count: 1
        workers:
          count: 1
      vsphere: *default-vsphere
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.10.0.10:50000
            node: 10.10.0.10
            hostname: controlplane
        workers:
          - endpoint: 10.10.0.20:50000
            node: 10.10.0.20
            hostname: worker
    expect:
      config:
        talos_common:
          k8s_service_host: "10.10.0.10"
        vsphere_controlplanes:
          nodes:
            - name: controlplane
              ipv4: 10.10.0.10
        vsphere_workers:
          nodes:
            - name: worker
              ipv4: 10.10.0.20
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            cluster_endpoint: https://10.10.0.10:6443
            instances:
              - name: controlplane
                role: controlplane
                count: 1
                ipv4: 10.10.0.10
              - name: worker
                role: worker
                count: 1
                ipv4: 10.10.0.20

  # DHCP guests omit static ipv4; cluster.endpoint is the API URL.
  - name: dhcp guests omit static ipv4 and use cluster.endpoint
    values:
      platform: vsphere
      gateway:
        enabled: false
      network:
        cidr_block: 10.41.0.0/22
        dhcp: true
        loadbalancer_ips:
          start: "10.41.3.10"
          end: "10.41.3.20"
      cluster:
        driver: talos
        endpoint: https://talos.plant.local:6443
        controlplanes:
          count: 1
        workers:
          count: 1
      vsphere: *default-vsphere
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.41.0.80:50000
            node: 10.41.0.80
            hostname: controlplane
        workers:
          - endpoint: 10.41.0.81:50000
            node: 10.41.0.81
            hostname: worker
    expect:
      config:
        vsphere_effective:
          dhcp: true
        talos_common:
          k8s_service_host: talos.plant.local
        vsphere_controlplanes:
          nodes:
            - name: controlplane
              ipv4: null
        vsphere_workers:
          nodes:
            - name: worker
              ipv4: null
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            cluster_endpoint: https://talos.plant.local:6443
            instances:
              - name: controlplane
                role: controlplane
                count: 1
                ipv4: null
              - name: worker
                role: worker
                count: 1
                ipv4: null
        - name: cluster
          path: cluster/talos
          inputs:
            cluster_endpoint: https://talos.plant.local:6443

  # DHCP ignores declared node IPs for guest addressing.
  - name: dhcp ignores declared node IPs
    values:
      platform: vsphere
      gateway:
        enabled: false
      network:
        cidr_block: 10.41.0.0/22
        dhcp: true
        loadbalancer_ips:
          start: "10.41.3.10"
          end: "10.41.3.20"
      cluster:
        driver: talos
        endpoint: https://10.41.3.50:6443
        controlplanes:
          count: 1
          nodes:
            controlplane-1:
              endpoint: 10.41.0.30:50000
              node: 10.41.0.30
              hostname: controlplane-1
        workers:
          count: 0
      vsphere: *default-vsphere
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.41.0.80:50000
            node: 10.41.0.80
            hostname: controlplane
        workers: []
    expect:
      config:
        talos_common:
          k8s_service_host: "10.41.3.50"
        vsphere_controlplanes:
          nodes:
            - name: controlplane
              ipv4: null
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            cluster_endpoint: https://10.41.3.50:6443
            instances:
              - name: controlplane
                role: controlplane
                count: 1
                ipv4: null

  # DHCP without cluster.endpoint: compute leaves cluster_endpoint empty so
  # GuestInfo is not baked; cluster derives https://<first-cp>:6443 from
  # compute's controlplanes output after vmtoolsd reports the lease.
  - name: dhcp without cluster.endpoint derives API URL from compute output
    values:
      platform: vsphere
      gateway:
        enabled: false
      network:
        cidr_block: 10.41.0.0/22
        dhcp: true
        loadbalancer_ips:
          start: "10.41.3.10"
          end: "10.41.3.20"
      cluster:
        driver: talos
        controlplanes:
          count: 1
        workers:
          count: 0
      vsphere: *default-vsphere
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.41.0.80:50000
            node: 10.41.0.80
            hostname: controlplane
        workers: []
    expect:
      config:
        vsphere_effective:
          dhcp: true
        talos_common:
          k8s_service_host: "10.41.0.80"
        vsphere_controlplanes:
          nodes:
            - name: controlplane
              ipv4: null
        cluster_endpoint_fallback:
          endpoint: https://10.41.0.80:6443
      terraform:
        - name: compute
          path: compute/vsphere
          inputs:
            instances:
              - name: controlplane
                role: controlplane
                count: 1
                ipv4: null
        - name: cluster
          path: cluster/talos
          inputs:
            cluster_endpoint: https://10.41.0.80:6443

  # kube-vip: the lb flux system's install tier lands when loadbalancer_driver
  # is kube-vip and the CNI is flannel (Cilium uses its own L2 path;
  # lb_effective.enabled is false when Cilium is the CNI). kube-vip/arp is a
  # patch on the install HelmRelease, so it builds in install; resources has no
  # kube-vip component (only metallb ships an IPAddressPool/L2Advertisement).
  - name: kube-vip lb install lands with explicit flannel CNI
    values:
      platform: vsphere
      gateway:
        enabled: false
      network:
        cidr_block: 10.10.0.0/24
        loadbalancer_driver: kube-vip
        loadbalancer_mode: arp
        loadbalancer_ips:
          start: "10.10.0.100"
          end: "10.10.0.110"
      cluster:
        driver: talos
        cni:
          driver: flannel
        controlplanes:
          count: 1
          nodes:
            controlplane-1:
              endpoint: 10.10.0.10:50000
              node: 10.10.0.10
              hostname: controlplane-1
        workers:
          count: 0
      vsphere: *default-vsphere
    terraformOutputs: *default-terraform-outputs
    expect:
      flux:
        - name: lb
          install:
            components:
              - kube-vip
              - kube-vip/arp
            substitutions:
              loadbalancer_ip_range: 10.10.0.100-10.10.0.110

  # pki.enabled swaps the `private` ClusterIssuer from platform-base's selfsigned
  # variant to addon-private-ca's CA-backed one. Both carry the name `private`, so
  # exactly one must render; two would collide in the same kustomization.
  - name: pki enabled uses the ca issuer and not the selfsigned one
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere: *default-vsphere
      pki:
        enabled: true
    terraformOutputs: *default-terraform-outputs
    expect:
      flux:
        - name: pki
          resources:
            - components:
                - private-issuer/ca
    exclude:
      flux:
        - name: pki
          resources:
            - components:
                - private-issuer/selfsigned

  - name: pki-resources selfsigned issuer present by default
    values:
      platform: vsphere
      gateway:
        enabled: true
        driver: envoy
      network: *default-network
      cluster: *default-cluster
      vsphere: *default-vsphere
    terraformOutputs: *default-terraform-outputs
    expect:
      flux:
        - name: pki
          resources:
            - components:
                - private-issuer/selfsigned

  # Requires: missing vsphere.datacenter fails composition.
  - name: missing vsphere.datacenter fails composition
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere:
        cluster: cluster-01
        datastore: datastore-01
        network: VM Network
    expectError: true

  # Requires: missing vsphere.cluster fails composition.
  - name: missing vsphere.cluster fails composition
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere:
        datacenter: dc-prod
        datastore: datastore-01
        network: VM Network
    expectError: true

  # Requires: missing vsphere.datastore fails composition.
  - name: missing vsphere.datastore fails composition
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere:
        datacenter: dc-prod
        cluster: cluster-01
        network: VM Network
    expectError: true

  # Requires: missing vsphere.network fails composition.
  - name: missing vsphere.network fails composition
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere:
        datacenter: dc-prod
        cluster: cluster-01
        datastore: datastore-01
    expectError: true

  # Network defaults: gateway and nameservers are derived from cidr_block when
  # not explicitly set. These resolve into the network config and are baked
  # into each node's machineconfig (per_node_config_patches) via guestinfo.
  - name: network gateway and nameservers default from cidr_block
    values:
      platform: vsphere
      gateway:
        enabled: false
      network:
        cidr_block: 10.10.0.0/24
        loadbalancer_ips:
          start: "10.10.0.100"
          end: "10.10.0.110"
      cluster: *default-cluster
      vsphere: *default-vsphere
    terraformOutputs: *default-terraform-outputs
    expect:
      config:
        network_effective:
          gateway: 10.10.0.1
        network:
          nameservers:
            - "1.1.1.1"
            - "8.8.8.8"

  # dns.private_domain defaults to '<id>.local' when no dns.domain is set.
  - name: dns.private_domain defaults to id.local
    values:
      platform: vsphere
      id: myplant
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere: *default-vsphere
    terraformOutputs: *default-terraform-outputs
    expect:
      config:
        dns:
          private_domain: myplant.local

  # dns.private_domain falls back to dns.domain when domain is set but
  # private_domain is not. Verifies the first dns config branch (domain != '').
  - name: dns.private_domain falls back to dns.domain
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere: *default-vsphere
      dns:
        domain: plant.example.com
    terraformOutputs: *default-terraform-outputs
    expect:
      config:
        dns:
          private_domain: plant.example.com

  # machine_secrets and client_configuration from compute output flow through
  # to the cluster step. These are the key vSphere-vs-hyperv architectural
  # difference — machineconfig is delivered via guestinfo at VM creation, so
  # cluster/talos needs the shared cluster CA rather than generating new secrets.
  - name: machine_secrets and client_configuration flow to cluster step
    values:
      platform: vsphere
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
      vsphere: *default-vsphere
    terraformOutputs:
      compute:
        controlplanes:
          - endpoint: 10.10.0.10:50000
            node: 10.10.0.10
            hostname: controlplane-1
        workers: []
        machine_secrets:
          certs:
            etcd:
              crt: mock-etcd-crt
              key: mock-etcd-key
          cluster:
            id: mock-cluster-id
            secret: mock-cluster-secret
        client_configuration:
          ca_certificate: mock-ca-crt
          client_certificate: mock-client-crt
          client_key: mock-client-key
    expect:
      terraform:
        - name: cluster
          path: cluster/talos
          inputs:
            machine_secrets:
              certs:
                etcd:
                  crt: mock-etcd-crt
                  key: mock-etcd-key
              cluster:
                id: mock-cluster-id
                secret: mock-cluster-secret
            client_configuration:
              ca_certificate: mock-ca-crt
              client_certificate: mock-client-crt
              client_key: mock-client-key
