# option-storage.yaml facet tests
# Tests CSI driver selection and component composition.
# Uses platform: metal to keep tests platform-agnostic (option-storage applies to any Talos cluster).

# Common configurations
x-defaults:
  network: &default-network
    cidr_block: 10.5.0.0/16
    loadbalancer_mode: arp
    loadbalancer_ips:
      start: "10.5.1.20"
      end: "10.5.1.100"

  cluster: &default-cluster
    driver: talos
    controlplanes:
      nodes:
        controlplane-1: &cp1-node
          endpoint: 10.5.0.10:50000
          node: 10.5.0.10
          hostname: controlplane-1
    workers:
      volumes:
        - /var/mnt/local


  # Shared CSI assertion fields
  csi-base: &csi-base
    name: csi
    dependsOn:
      - policy-resources

  csi-longhorn: &csi-longhorn
    name: csi
    dependsOn:
      - policy-resources

cases:
  # Minimal: no explicit storage config — defaults to openebs
  - name: minimal config defaults to openebs
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster: *default-cluster
    expect:
      flux:
        - <<: *csi-base
          install:
            components:
              - openebs
              - openebs/dynamic-localpv
            substitutions:
              local_volume_path: /var/mnt/local
              local_volume_quota: "true"

  # Full: longhorn with HA, custom volume path, workers
  - name: full longhorn config with HA and custom volume path
    values:
      platform: metal
      topology: ha
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 3
          volumes:
            - /var/mnt/longhorn
        storage:
          driver: longhorn
          local_base_path: /var/mnt/longhorn
    expect:
      flux:
        - <<: *csi-longhorn
          install:
            components:
              - longhorn
              - longhorn/ha

  # Regression: the dashboard patch has no dependency on telemetry-install (a plain
  # ConfigMap Grafana's sidecar loads regardless of the telemetry pipeline's state), so
  # disabling telemetry entirely must not affect composition.
  - name: longhorn dashboard patch composes with telemetry fully disabled
    values:
      dns:
        private_domain: example.test
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          volumes:
            - /var/mnt/local
        storage:
          driver: longhorn
      telemetry:
        metrics:
          enabled: false
        logs:
          enabled: false
      observability:
        enabled: true
    expect:
      flux:
        - name: observability
          resources:
            - components:
                - grafana/dashboards/longhorn

  # Explicit openebs driver is same as default
  - name: explicit openebs driver produces same result as default
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          volumes:
            - /var/mnt/local
        storage:
          driver: openebs
    expect:
      flux:
        - <<: *csi-base
          install:
            components:
              - openebs
              - openebs/dynamic-localpv
            substitutions:
              local_volume_path: /var/mnt/local
              local_volume_quota: "true"

  # Custom local_base_path is passed as substitution
  - name: custom local_base_path is passed to CSI substitution
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          volumes:
            - /mnt/data
        storage:
          local_base_path: /mnt/data
    expect:
      flux:
        - <<: *csi-base
          install:
            components:
              - openebs
              - openebs/dynamic-localpv
            substitutions:
              local_volume_path: /mnt/data
              local_volume_quota: "true"

  # cluster.storage.quota turns on XFS project quotas for the local classes
  - name: cluster.storage.quota is passed to CSI substitution
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          volumes:
            - /var/mnt/local
        storage:
          quota: true
    expect:
      flux:
        - <<: *csi-base
          install:
            components:
              - openebs
              - openebs/dynamic-localpv
            substitutions:
              local_volume_path: /var/mnt/local
              local_volume_quota: "true"

  # Quota is on by default except on the docker platform
  - name: quota defaults to off on the docker platform
    values:
      platform: docker
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
    expect:
      flux:
        - <<: *csi-base
          install:
            components:
              - openebs
              - openebs/dynamic-localpv
            substitutions:
              local_volume_path: /var/mnt/local
              local_volume_quota: "false"

  # An explicit cluster.storage.quota overrides the platform default
  - name: cluster.storage.quota false overrides the default
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        storage:
          quota: false
    expect:
      flux:
        - <<: *csi-base
          install:
            components:
              - openebs
              - openebs/dynamic-localpv
            substitutions:
              local_volume_path: /var/mnt/local
              local_volume_quota: "false"

  # cluster.storage.quota reaches the mayastor install, which ships the same local classes
  - name: cluster.storage.quota is passed to the mayastor substitution
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          volumes:
            - /var/mnt/local
        storage:
          driver: mayastor
          quota: true
    expect:
      flux:
        - <<: *csi-base
          install:
            components:
              - openebs
              - openebs/mayastor
            substitutions:
              local_volume_path: /var/mnt/local
              local_volume_quota: "true"

  - name: mayastor image tags default to the release pins
    values:
      platform: metal
      workstation:
        arch: amd64
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          volumes:
            - /var/mnt/local
        storage:
          driver: mayastor
    expect:
      flux:
        - <<: *csi-base
          install:
            substitutions:
              mayastor_agent_core_tag: v2.11.1@sha256:f4f4b85b67b399cfb6452e139680cb35b788574f626ca27094bd7fda7fb8e6f3
              mayastor_agent_ha_cluster_tag: v2.11.1@sha256:5007ae0a38bf52fa51744d845325038327fe03c626c3f95f954c98cd100aed9d
              mayastor_agent_ha_node_tag: v2.11.1@sha256:27ea3280d3e71213f31e4815b7935f828ecc1cf0e8802e74aa2934b989ee5a43
              mayastor_api_rest_tag: v2.11.1@sha256:2e60c6fc69970a4dccc2d9b0f0719e6d272858c63c3a1dc24c38abac5853d0ec
              mayastor_csi_controller_tag: v2.11.1@sha256:f4f442d8ce7ea8b3e410c4cfe8540b1e8a3250ed91c025d83f1b870f119acb97
              mayastor_csi_node_tag: v2.11.1@sha256:0946de2b2fd44275ec60bc146cdb7ca917ec5cabfde9b21b64c2bfe532f41dd4
              mayastor_io_engine_tag: v2.11.1@sha256:b88de71674405f4fa0f755f0eb246e0eafc0d0f1473263852fd039e45e1b3553
              mayastor_operator_diskpool_tag: v2.11.1@sha256:231020f43edb57a31d3fc9626f67251f8bd7e356d362aeddbcd675eee7adc417

  # Longhorn single-node: schedulable CP with no workers gets CP toleration component
  - name: longhorn single-node with schedulable CP adds single-node component
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          schedulable: true
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 0
          volumes:
            - /var/mnt/local
        storage:
          driver: longhorn
    expect:
      flux:
        - <<: *csi-longhorn
          install:
            components:
              - longhorn
              - longhorn/single-node

  # Longhorn multi-node without HA: workers present, default topology — no single-node or ha component
  - name: longhorn multi-node topology omits topology components
    values:
      platform: metal
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 2
          volumes:
            - /var/mnt/local
        storage:
          driver: longhorn
    expect:
      flux:
        - <<: *csi-longhorn
          install:
            components:
              - longhorn

  # Longhorn HA: topology=ha adds ha component (non-schedulable CP — no single-node)
  - name: longhorn ha topology adds longhorn/ha component
    values:
      platform: metal
      topology: ha
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 2
          volumes:
            - /var/mnt/local
        storage:
          driver: longhorn
    expect:
      flux:
        - <<: *csi-longhorn
          install:
            components:
              - longhorn
              - longhorn/ha

  # Longhorn single-node + HA: schedulable CP + topology=ha — both topology components active
  - name: longhorn schedulable CP with ha topology adds both single-node and ha components
    values:
      platform: metal
      topology: ha
      gateway:
        enabled: false
      network: *default-network
      cluster:
        driver: talos
        controlplanes:
          schedulable: true
          nodes:
            controlplane-1: *cp1-node
        workers:
          count: 3
          volumes:
            - /var/mnt/local
        storage:
          driver: longhorn
    expect:
      flux:
        - <<: *csi-longhorn
          install:
            components:
              - longhorn
              - longhorn/single-node
              - longhorn/ha
