---
# Redirects plain HTTP on this gateway to HTTPS with a 301.
# The flux-webhook route keeps its more specific /hook/ match, so webhook POSTs are not redirected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect-${gateway_name}
  namespace: system-gateway
spec:
  parentRefs:
    - kind: Gateway
      name: ${gateway_name}
      namespace: system-gateway
      sectionName: web-http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: ${gateway_redirect_port}
            statusCode: 301
