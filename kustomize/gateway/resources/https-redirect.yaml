---
# Redirects all plain-HTTP traffic on this gateway to HTTPS with a 301. App
# routes attach only to web-https, so their hostnames are TLS-only and this
# catch-all covers everything else on web-http uniformly. The flux-webhook
# route (internal gateway only) keeps its own /hook/ path match, more
# specific than this catch-all, so signed webhook POSTs are not redirected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect-${gateway_name}
  namespace: system-gateway
spec:
  parentRefs:
    - kind: Gateway
      name: ${gateway_name}
      namespace: system-gateway
      sectionName: web-http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: ${gateway_redirect_port}
            statusCode: 301
