---
# Admits ListenerSets from the namespaces in gateway_listener_namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${gateway_name}
  namespace: system-gateway
spec:
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ${gateway_listener_namespaces}
