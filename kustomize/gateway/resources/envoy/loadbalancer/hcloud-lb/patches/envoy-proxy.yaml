---
# Annotations for hcloud-ccm to provision a Hetzner Cloud Load Balancer.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ${gateway_name}
  namespace: system-gateway
spec:
  provider:
    kubernetes:
      envoyService:
        patch:
          type: StrategicMerge
          value:
            metadata:
              annotations:
                load-balancer.hetzner.cloud/location: ${hcloud_location:-fsn1}
                load-balancer.hetzner.cloud/use-private-ip: "true"
                load-balancer.hetzner.cloud/uses-proxyprotocol: "false"
