---
# Flips the GKE LoadBalancer to internal. Hardcoded value because YAML
# tokens don't survive substitution through Flux postBuild + kustomize.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ${gateway_name}
  namespace: system-gateway
spec:
  provider:
    kubernetes:
      envoyService:
        patch:
          type: StrategicMerge
          value:
            metadata:
              annotations:
                networking.gke.io/load-balancer-type: Internal
