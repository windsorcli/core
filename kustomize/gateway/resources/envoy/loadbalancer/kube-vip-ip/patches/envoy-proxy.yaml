---
# Pins the Service address with the kube-vip annotation.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ${gateway_name}
  namespace: system-gateway
spec:
  provider:
    kubernetes:
      envoyService:
        patch:
          type: StrategicMerge
          value:
            metadata:
              annotations:
                kube-vip.io/loadbalancerIPs: ${gateway_loadbalancer_ip}
