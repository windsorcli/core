---
# Points the Gateway at its own EnvoyProxy (gateway/install/envoy/envoy-proxy.yaml
# or envoy-proxy-internal.yaml) so the data-plane Service is configured per
# gateway rather than through the controller-global EnvoyGateway default.
# Envoy-only: Cilium gateways don't use the gateway.envoyproxy.io EnvoyProxy
# resource.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${gateway_name}
  namespace: system-gateway
spec:
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ${gateway_name}
