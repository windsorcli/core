---
# Points the Gateway at its own EnvoyProxy. Envoy only: Cilium gateways have no EnvoyProxy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${gateway_name}
  namespace: system-gateway
spec:
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ${gateway_name}
