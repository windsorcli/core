---
# external-dns hostname annotation for the catch-all 404 route, which has no spec.hostnames.
# It registers the apex and a wildcard against the gateway address.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-404-${gateway_name}
  namespace: system-gateway
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "${gateway_domain},*.${gateway_domain}"
