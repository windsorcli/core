# Appends this gateway's docker-desktop host-published ports to the
# envoyService patch's spec.ports list, ClusterIP-reachable alongside the
# NodePort entries. Docker maps the published host ports straight onto the node
# container (terraform/compute/docker), which has no in-cluster listener on
# them otherwise; every hostname under the workstation domain is built with
# this port suffix regardless of caller.
- op: add
  path: /spec/provider/kubernetes/envoyService/patch/value/spec/ports/-
  value:
    name: https-${gateway_host_https_port}
    protocol: TCP
    port: ${gateway_host_https_port}
    targetPort: 10443
- op: add
  path: /spec/provider/kubernetes/envoyService/patch/value/spec/ports/-
  value:
    name: http-${gateway_host_http_port}
    protocol: TCP
    port: ${gateway_host_http_port}
    targetPort: 10080
