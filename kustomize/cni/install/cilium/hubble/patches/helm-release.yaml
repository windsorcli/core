apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: system-cni
spec:
  values:
    hubble:
      enabled: true
      # Rotate TLS certs via an in-cluster CronJob instead of Helm-generated secrets.
      # The 'helm' method re-renders server-secret.yaml on every upgrade and trips on
      # newly-enabled Hubble components ("invalid value; expected string" on upgrade).
      tls:
        auto:
          method: cronJob
      metrics:
        enabled:
          - dns
          - drop
          - port-distribution
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: true
      relay:
        enabled: true
        image:
          repository: quay.io/cilium/hubble-relay
          # artifact: type=image name=quay.io/cilium/hubble-relay
          tag: v1.20.3@sha256:c6f819d9c5e0b35ccac63b9f2f1ae213fd9be50588e15d5a444d5d305ad317b5
          useDigest: false
      ui:
        enabled: true
        frontend:
          image:
            repository: quay.io/cilium/hubble-ui
            # artifact: type=image name=quay.io/cilium/hubble-ui
            tag: v0.13.6@sha256:049a80a03585c043d0c3121bdc518c72b0fd42bae07e4bcce0fdb8f1e88041d0
            useDigest: false
        backend:
          image:
            repository: quay.io/cilium/hubble-ui-backend
            # artifact: type=image name=quay.io/cilium/hubble-ui-backend
            tag: v0.13.6@sha256:83b3fc763f3d49948c306bf49b08277383e195904b9ca5c0c0022b2112628787
            useDigest: false
