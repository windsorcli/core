---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
  namespace: system-cni
spec:
  interval: 10m
  timeout: 5m
  url: ${chart_registry:=oci://quay.io/cilium/charts}/cilium
  ref:
    # renovate: datasource=docker depName=quay.io/cilium/charts/cilium package=quay.io/cilium/charts/cilium
    tag: 1.20.3
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
