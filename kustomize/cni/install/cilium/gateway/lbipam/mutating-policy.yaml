---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: cilium-gateway-lbipam-sharing
  annotations:
    policies.kyverno.io/title: Cilium Gateway LBIPAM Sharing
    policies.kyverno.io/category: Cilium
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Service
    policies.kyverno.io/description: >-
      Injects LBIPAM IP sharing annotations onto Cilium-managed gateway services
      at admission time. The Cilium gateway controller creates services in two
      steps (create, then patch annotations), which races with LBIPAM
      initialization. By injecting annotations before the object is persisted,
      LBIPAM always sees a complete sharing group from the start.
spec:
  # Fail closed so the sharing annotations are never missed. The match is scoped
  # to CREATE on labeled Services in system-gateway, so the blast radius is small.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE]
        resources: [services]
    objectSelector:
      matchLabels:
        io.cilium.gateway/owning-gateway: external
  matchConditions:
    - name: gateway-namespace
      expression: "object.metadata.namespace == 'system-gateway'"
  variables:
    - name: lbipamConfig
      expression: resource.Get("v1", "configmaps", "system-gateway", "cilium-lbipam-config")
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            metadata: Object.metadata{
              annotations: {
                "lbipam.cilium.io/ips": string(variables.lbipamConfig.data.gatewayIp),
                "lbipam.cilium.io/sharing-key": "external",
                "lbipam.cilium.io/sharing-cross-namespace": "*"
              }
            }
          }
