apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: system-cni
spec:
  values:
    # Gateway API CRDs come from the crds layer, ordered ahead of cni.
    gatewayAPI:
      enabled: true
      enableAlpn: true
      enableAppProtocol: true

    # Per-node Envoy that serves gateway traffic.
    envoy:
      enabled: true
