---
# EKS: pods take VPC addresses from ENIs the operator attaches to each node.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: system-cni
spec:
  values:
    ipam:
      mode: eni
    eni:
      enabled: true
      awsEnablePrefixDelegation: true
    routingMode: native
