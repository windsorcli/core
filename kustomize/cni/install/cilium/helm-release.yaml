---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: system-cni
spec:
  interval: 5m
  timeout: 15m
  # Cilium components (DaemonSet, Operator, etc.) run in kube-system per upstream convention.
  # The HelmRelease CR lives in system-cni; Flux helm-controller adopts the release that was
  # bootstrapped by terraform/cni/cilium before Flux started.
  releaseName: cilium
  targetNamespace: kube-system
  storageNamespace: kube-system
  install:
    createNamespace: false
    # No uninstall on failed install: cilium is the CNI, so an uninstall
    # mid-retry cuts pod networking cluster-wide until it reinstalls.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chartRef:
    kind: OCIRepository
    name: cilium
  values:
    # Cluster identity surfaces in Hubble flows, metrics, and (if enabled later) ClusterMesh
    # routing. Sourced from the Windsor context name — generic, not Cilium-specific.
    cluster:
      name: ${cluster_name}

    # IPAM: use Kubernetes node CIDR allocation.
    ipam:
      mode: kubernetes

    # Replace kube-proxy. k8sServiceHost/k8sServicePort let Cilium reach the API server before
    # eBPF service rules are active.
    kubeProxyReplacement: true
    k8sServiceHost: ${k8s_service_host}
    k8sServicePort: "${k8s_service_port:=6443}"

    # Single operator on single-node clusters (avoids pending pods + extra Lease churn on etcd);
    # two on multi-node/ha for controller redundancy. Set by the facet from the topology value.
    operator:
      replicas: ${operator_replicas:=1}
      image:
        # The chart appends -generic to the repository.
        repository: quay.io/cilium/operator
        # artifact: type=image name=quay.io/cilium/operator-generic
        tag: v1.20.3@sha256:efdd8d89d6d8f63d21a065fa2f9e17614a2b3ac9371b221af9355f63829e2dbc
        useDigest: false

    image:
      repository: quay.io/cilium/cilium
      # artifact: type=image name=quay.io/cilium/cilium
      tag: v1.20.3@sha256:95cfa5c2427cc6b452c00908778d0566311f572589284af949d06a013db1a849
      useDigest: false

    certgen:
      image:
        repository: quay.io/cilium/certgen
        # artifact: type=image name=quay.io/cilium/certgen
        tag: v0.4.11@sha256:14d29a176fc96d15b154559ce1a5baf01367c10baabfa7bb8028b72f087a56f0
        useDigest: false

    # Bounds the per-node Envoy that serves gateway traffic.
    envoy:
      image:
        repository: quay.io/cilium/cilium-envoy
        # artifact: type=image name=quay.io/cilium/cilium-envoy
        tag: v1.38.6-1791537840-00e749f11f69334c625e53fc1ce2fc6c7f34a51f@sha256:d6c8c0c91954d1885026d82a31b341f37dcd34a4b127fdaf1587e43ddd224cef
        useDigest: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
