apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Sets the dedicated CMK and the user-assigned identity Flexible Server reads
# it with — both required together (confirmed against azurerm_postgresql_
# flexible_server's own schema: identity.identity_ids and customer_managed_
# key.primary_user_assigned_identity_id take the same identity). Only
# included when the module created that identity, i.e. the managed-key path;
# BYOK's identity is null (the operator's own identity already has access to
# that key), which this demo component doesn't handle.

patches:
  - target:
      kind: FlexibleServer
      name: ${database_instance_name}
    patch: |-
      - op: add
        path: /spec/forProvider/identity
        value:
          type: UserAssigned
          identityIds:
            - ${azuredb_cmk_identity_id}
      - op: add
        path: /spec/forProvider/customerManagedKey
        value:
          keyVaultKeyId: ${azuredb_kms_key_id}
          primaryUserAssignedIdentityId: ${azuredb_cmk_identity_id}
