---
# The database itself, a separate CR from the server — Flexible Server has
# no dbName-equivalent field the way rds.aws.upbound.io Instance does.
# forProvider has no name field (additionalProperties: false rejects one);
# the actual Postgres database name comes from Crossplane's external-name,
# metadata.name by default.
apiVersion: dbforpostgresql.azure.upbound.io/v1beta1
kind: FlexibleServerDatabase
metadata:
  name: demo
spec:
  deletionPolicy: Delete
  forProvider:
    serverIdRef:
      name: demo-db
