---
# Provisions a least-privilege application credential for demo-db, scoped
# to the demo database only — never the RDS master credential, matching
# CNPG's own separation of its superuser and app-database secrets (see
# ADR-0009 §7, "app credentials, not the admin secret"). Runs on a
# schedule rather than once: reads the RDS-managed master password via
# rds-secret-reader, creates demo_app with narrow grants, and publishes
# its password as demo-db-app-credentials in this namespace. Idempotent
# and safe to skip — a tick that finds the Instance not yet Ready, or
# demo_app already provisioned, exits clean and the next tick retries.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-db-provision-app-role
  namespace: system-provisioning
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: rds-secret-reader
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: fetch-admin-credentials
              # renovate: datasource=docker depName=alpine/k8s
              image: alpine/k8s:1.34.9@sha256:72c921a10c53ab749674e828ad12b776d006481c852bba7dd89e149ceed666f3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  READY=$(kubectl get instance.rds.aws.upbound.io demo-db \
                    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                  if [ "$READY" != "True" ]; then
                    echo "demo-db Instance not Ready yet, skipping this tick."
                    touch /shared/skip
                    exit 0
                  fi

                  kubectl get instance.rds.aws.upbound.io demo-db \
                    -o jsonpath='{.status.atProvider.address}' > /shared/address

                  SECRET_ARN=$(kubectl get instance.rds.aws.upbound.io demo-db \
                    -o jsonpath='{.status.atProvider.masterUserSecret[0].secretArn}')

                  SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
                    --query SecretString --output text)
                  echo "$SECRET_JSON" | jq -r '.username' > /shared/admin-username
                  echo "$SECRET_JSON" | jq -r '.password' > /shared/admin-password

                  # The app credential this job creates, independent of the
                  # admin password's own AWS-managed rotation schedule.
                  head -c 24 /dev/urandom | base64 | tr -d '/+=\n' > /shared/app-password
                  echo -n "demo_app" > /shared/app-username
              volumeMounts:
                - name: shared
                  mountPath: /shared
            - name: provision-app-role
              # renovate: datasource=docker depName=postgres
              image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  if [ -f /shared/skip ]; then
                    echo "Skipping, nothing to provision this tick."
                    exit 0
                  fi

                  ADDRESS=$(cat /shared/address)
                  ADMIN_USER=$(cat /shared/admin-username)
                  APP_USER=$(cat /shared/app-username)
                  APP_PASSWORD=$(cat /shared/app-password)

                  PGPASSWORD=$(cat /shared/admin-password) psql -h "$ADDRESS" -U "$ADMIN_USER" \
                    -d ${demo_db_name} -v ON_ERROR_STOP=1 <<SQL
                  DO \$\$
                  BEGIN
                    IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$APP_USER') THEN
                      CREATE ROLE $APP_USER WITH LOGIN PASSWORD '$APP_PASSWORD';
                    ELSE
                      ALTER ROLE $APP_USER WITH PASSWORD '$APP_PASSWORD';
                    END IF;
                  END
                  \$\$;
                  GRANT CONNECT ON DATABASE ${demo_db_name} TO $APP_USER;
                  GRANT USAGE ON SCHEMA public TO $APP_USER;
                  GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO $APP_USER;
                  ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO $APP_USER;
                  SQL
              volumeMounts:
                - name: shared
                  mountPath: /shared
          containers:
            - name: publish-app-secret
              # renovate: datasource=docker depName=alpine/k8s
              image: alpine/k8s:1.34.9@sha256:72c921a10c53ab749674e828ad12b776d006481c852bba7dd89e149ceed666f3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  if [ -f /shared/skip ]; then
                    echo "Skipping, nothing to publish this tick."
                    exit 0
                  fi

                  kubectl create secret generic demo-db-app-credentials \
                    -n demo-database \
                    --from-literal=username="$(cat /shared/app-username)" \
                    --from-literal=password="$(cat /shared/app-password)" \
                    --dry-run=client -o yaml | kubectl apply -f -
              volumeMounts:
                - name: shared
                  mountPath: /shared
          volumes:
            # Memory-backed: the admin and app passwords transiting this
            # volume never touch node disk.
            - name: shared
              emptyDir:
                medium: Memory
