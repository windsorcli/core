---
# Worked example of the kustomize/provisioning contract: just the database
# definition, no provider wiring. The windsorcli.dev/cluster tag and
# providerConfigRef are both handled by the provisioning add-on.
apiVersion: rds.aws.upbound.io/v1beta3
kind: Instance
metadata:
  name: demo-db
  namespace: demo-database
spec:
  deletionPolicy: Delete
  forProvider:
    region: ${aws_region}
    engine: postgres
    engineVersion: "16"
    instanceClass: db.t4g.micro
    allocatedStorage: 20
    dbSubnetGroupName: ${db_subnet_group_name}
    vpcSecurityGroupIds:
      - ${rds_security_group_id}
    dbName: ${demo_db_name}
    username: demo
    manageMasterUserPassword: true
    storageEncrypted: true
    kmsKeyId: ${kms_key_arn}
    publiclyAccessible: false
    skipFinalSnapshot: true
