---
# Worked example of the kustomize/database contract: just the database
# definition, no provider wiring. windsorcli.dev/cluster, dbSubnetGroupName,
# vpcSecurityGroupIds, and kmsKeyId are all defaulted by the database
# add-on's own Kyverno policies, same as a third-party chart gets them.
apiVersion: rds.aws.upbound.io/v1beta3
kind: Instance
metadata:
  name: ${database_instance_name}
spec:
  deletionPolicy: Delete
  forProvider:
    region: ${aws_region}
    engine: postgres
    engineVersion: "16"
    instanceClass: db.t4g.micro
    allocatedStorage: 20
    dbName: ${demo_database_name}
    username: demo
    autoGeneratePassword: true
    passwordSecretRef:
      name: ${database_instance_name}-admin-credentials
      namespace: system-database
      key: password
    storageEncrypted: true
    publiclyAccessible: false
    skipFinalSnapshot: true
