---
# Instance is cluster-scoped (rds.aws.upbound.io has no namespaced kinds),
# so reading it needs a ClusterRole even though this job only ever touches
# demo-db. Named for that one Instance to keep the grant obviously scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-db-instance-reader
rules:
  - apiGroups:
      - rds.aws.upbound.io
    resources:
      - instances
    resourceNames:
      - demo-db
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-db-instance-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-db-instance-reader
subjects:
  - kind: ServiceAccount
    name: rds-secret-reader
    namespace: system-provisioning
---
# Grants the shared rds-secret-reader identity (provisioning add-on) access
# into this namespace specifically — this namespace opts in, not core
# reaching into it uninvited. Scoped to the two Secrets this bootstrap job
# publishes, not every Secret in the namespace. create can't be scoped by
# resourceNames (the object doesn't exist yet), so it stays kind-level for
# that verb only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rds-secret-reader
  namespace: demo-database
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - demo-db-app-credentials
      - demo-db-monitor-credentials
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rds-secret-reader
  namespace: demo-database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rds-secret-reader
subjects:
  - kind: ServiceAccount
    name: rds-secret-reader
    namespace: system-provisioning
