---
# Worked example of the app-credential contract: name the instance and the
# database, get a login user owning it. Driver-agnostic — every cloud's
# instance is reached the same way once it exists.
#
# provider-sql generates the password and writes endpoint/port/username/
# password to demo-app-credentials in this namespace.
apiVersion: database.windsorcli.dev/v1alpha1
kind: AppRole
metadata:
  name: demo-app
  namespace: demo-database
spec:
  instanceName: ${database_instance_name}
  databaseName: ${demo_database_name}
