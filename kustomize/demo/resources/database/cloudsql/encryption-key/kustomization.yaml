apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Sets the dedicated CMK; only included when one exists, since the
# field is absent rather than empty otherwise.

patches:
  - target:
      kind: DatabaseInstance
      name: demo-db
    patch: |-
      - op: add
        path: /spec/forProvider/encryptionKeyName
        value: ${cloudsql_kms_key_name}
