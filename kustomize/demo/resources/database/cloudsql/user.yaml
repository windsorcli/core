---
# The admin user, a separate CR from the instance — Cloud SQL's
# DatabaseInstance carries no administratorLogin-equivalent field the way
# dbforpostgresql.azure.upbound.io FlexibleServer does. passwordSecretRef
# reads the credential database/gcp-cloudsql's Terraform already wrote;
# unlike Flexible Server's autoGeneratePassword, Cloud SQL never generates
# and writes one itself.
apiVersion: sql.gcp.upbound.io/v1beta2
kind: User
metadata:
  name: demo
spec:
  deletionPolicy: Delete
  forProvider:
    instanceRef:
      name: demo-db
    passwordSecretRef:
      name: demo-db-admin-credentials
      namespace: system-provisioning
      key: password
