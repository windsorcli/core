---
# The database itself, a separate CR from the instance — Cloud SQL has no
# dbName-equivalent field the way rds.aws.upbound.io Instance does. The
# actual Postgres database name comes from Crossplane's external-name,
# metadata.name by default.
apiVersion: sql.gcp.upbound.io/v1beta1
kind: Database
metadata:
  name: demo
spec:
  deletionPolicy: Delete
  forProvider:
    instanceRef:
      name: demo-db
