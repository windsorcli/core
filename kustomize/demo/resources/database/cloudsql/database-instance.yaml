---
# Worked example of the kustomize/provisioning contract. The admin
# credential lives at demo-db-admin-credentials in system-provisioning,
# written by database/gcp-cloudsql's Terraform.
apiVersion: sql.gcp.upbound.io/v1beta2
kind: DatabaseInstance
metadata:
  name: demo-db
spec:
  deletionPolicy: Delete
  forProvider:
    region: ${cloudsql_region}
    databaseVersion: POSTGRES_16
    deletionProtection: false
    encryptionKeyName: ${cloudsql_kms_key_name}
    settings:
      # Enterprise unlocks db-f1-micro; Enterprise Plus (the default)
      # rejects it.
      edition: ENTERPRISE
      tier: db-f1-micro
      ipConfiguration:
        ipv4Enabled: false
        privateNetwork: ${cloudsql_network_id}
