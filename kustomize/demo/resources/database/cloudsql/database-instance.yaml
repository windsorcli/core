---
# Worked example of the kustomize/database contract. The admin
# credential lives at demo-db-admin-credentials in system-database,
# written by kustomize/provisioning's crossplane/gcp-cloudsql WatchOperation.
# privateNetwork and encryptionKeyName come from the database add-on's own
# Kyverno policies, same as a third-party chart gets them.
apiVersion: sql.gcp.upbound.io/v1beta2
kind: DatabaseInstance
metadata:
  name: ${database_instance_name}
spec:
  deletionPolicy: Delete
  forProvider:
    region: ${cloudsql_region}
    databaseVersion: POSTGRES_16
    deletionProtection: false
    settings:
      # Enterprise unlocks db-f1-micro; Enterprise Plus (the default)
      # rejects it.
      edition: ENTERPRISE
      tier: db-f1-micro
      ipConfiguration:
        ipv4Enabled: false
