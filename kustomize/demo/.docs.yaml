# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

substitutions:
  external_domain:
    required_when: "`demo.resources.bookinfo: true` AND `gateway.enabled: true`"
    description: "Hostname suffix for the bookinfo HTTPRoute (`bookinfo.${external_domain}`). Passed by the facet itself, from `gateway_effective.external_domain`."
  REGISTRY_URL:
    required_when: "`demo.resources.static: true`"
    description: "Image registry hosting the demo static-site container image (`${REGISTRY_URL}/demo:1.0.6`). No fallback; the static workload's pod will fail to pull if the variable is not set at the Flux Kustomization level."
  db_subnet_group_name:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver == 'rds'`"
    description: "From `terraform_output('network', 'db_subnet_group_name')`. Sets the `demo-db` Instance's `dbSubnetGroupName` directly — the demo reads the real output rather than reconstructing the naming convention a third-party chart (with no Flux substitution access) has to use instead. Passed by the facet itself."
  kms_key_arn:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver == 'rds'`"
    description: "From `terraform_output('database', 'kms_key_arn')`. Sets the `demo-db` Instance's `kmsKeyId`. Passed by the facet itself."
  rds_security_group_id:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver == 'rds'`"
    description: "From `terraform_output('database', 'security_group_id')`. Sets the `demo-db` Instance's `vpcSecurityGroupIds` — scoped to the EKS cluster's own security group, not the whole VPC CIDR. Passed by the facet itself."
  aws_region:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver == 'rds'`"
    description: "AWS region for the `demo-db` Instance, from `aws.region`. Passed by the facet itself."
  demo_database_name:
    required_when: "`demo.resources.database: true` AND driver is `rds`, `azuredb`, or `cloudsql`"
    description: "Fixed value `demo`, from the facet's own `demo_database_name` config. Sets RDS's `dbName` directly, and names the database each driver's `DatabaseCredentials` resources target. Passed by the facet itself."
  cloudsql_network_id:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver == 'cloudsql'`"
    description: "From `terraform_output('network', 'network_id')`. Sets the `demo-db` DatabaseInstance's `privateNetwork` — the demo reads the real output rather than reconstructing the naming convention a third-party chart (with no Flux substitution access) has to use instead. Passed by the facet itself."
  cloudsql_kms_key_name:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver == 'cloudsql'`"
    description: "From `terraform_output('database', 'kms_key_name')`. Sets the `demo-db` DatabaseInstance's `encryptionKeyName`. Passed by the facet itself."
  cloudsql_region:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver == 'cloudsql'`"
    description: "From `terraform_output('network', 'region')`. Sets the `demo-db` DatabaseInstance's `region`. Passed by the facet itself."

components:
  database:
    enable_when: "`demo.resources.database: true`"
    description: "Creates the `demo-database` namespace. Always paired with a driver variant below."
  database-credentials:
    enable_when: "`demo.resources.database: true` AND driver is `rds`, `azuredb`, or `cloudsql`"
    description: "A `demo-app` `DatabaseCredentials` resource in `demo-database`, naming `demo-db` and the `demo` database. Requires `kustomize/provisioning`'s `crossplane/database-credentials` Composition. The monitoring role is provisioned automatically instead, by `kustomize/provisioning`'s own driver-specific `*-monitor` `WatchOperation`."
  database/cloudnativepg:
    enable_when: "`demo.resources.database: true` AND `database.postgres.driver == 'cloudnativepg'`"
    description: "A `Cluster` CR `demo-cluster` (2 instances, 100 max_connections, 1Gi PVC, PodMonitor enabled). Requires the `database` add-on so the CloudNativePG operator can reconcile the CR."
  database/rds:
    enable_when: "`demo.resources.database: true` AND `database.postgres.driver == 'rds'`"
    description: "An `rds.aws.upbound.io/v1beta3` `Instance` CR `demo-db` (db.t4g.micro, 20Gi, Crossplane-generated admin password, network-scoped to the cluster's own security group) — just the database definition, no provider wiring. `kustomize/provisioning`'s `crossplane/aws-rds-monitor` `WatchOperation` reacts to this CR directly, provisioning the monitoring role without this facet's involvement."
  database/azuredb:
    enable_when: "`demo.resources.database: true` AND `database.postgres.driver == 'azuredb'`"
    description: "A `dbforpostgresql.azure.upbound.io/v1beta1` `FlexibleServer` CR `demo-db` (B_Standard_B1ms, 32Gi, Crossplane-generated admin password, VNet-integrated with no public access) plus a `FlexibleServerDatabase` CR `demo` — just the database definition, no provider wiring. `kustomize/provisioning`'s `crossplane/azure-postgres-monitor` `WatchOperation` reacts to this CR directly, provisioning the monitoring role without this facet's involvement."
  database/cloudsql:
    enable_when: "`demo.resources.database: true` AND `database.postgres.driver == 'cloudsql'`"
    description: "A `sql.gcp.upbound.io/v1beta2` `DatabaseInstance` CR `demo-db` (db-f1-micro, private IP only) plus a `Database` CR `demo` — just the database definition, no provider wiring. `kustomize/provisioning`'s `crossplane/gcp-admin-password` `WatchOperation` generates the admin password and applies it onto the instance's own admin `User`; its `crossplane/gcp-cloudsql-monitor` `WatchOperation` reacts to the same CR, provisioning the monitoring role without this facet's involvement."
  database/cloudsql/encryption-key:
    enable_when: "`demo.resources.database: true` AND `database.postgres.driver == 'cloudsql'` AND `database.postgres.encryption.managed: true`"
    description: "Patches `encryptionKeyName` onto the `DatabaseInstance` CR. Absent rather than empty when unmanaged, since the field's type is `string`."
  static:
    enable_when: "`demo.resources.static: true`"
    description: "Creates the `demo-static` namespace (PSA `restricted`) with a `website` Deployment pulling `${REGISTRY_URL}/demo:1.0.6`, a Service, a 100Mi ReadWriteOnce PVC named `content`, and an Ingress."
  bookinfo:
    enable_when: "`demo.resources.bookinfo: true`"
    description: "Pulls the upstream Istio bookinfo sample at tag `1.22.8` into `demo-bookinfo` (PSA `restricted`) and applies SecurityContext patches to the four Deployments (productpage, details, ratings, reviews) so the upstream manifests satisfy the namespace's PSA."
  bookinfo/gateway:
    enable_when: "`demo.resources.bookinfo: true` AND `gateway.enabled: true`"
    description: "HTTPRoute exposing productpage at `bookinfo.${external_domain}` through the cluster Gateway. Skipped on clusters without Gateway API."

dependencies:
  database:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver == 'cloudnativepg'`"
    reason: "The CloudNativePG operator must be reconciling before the `demo-cluster` Cluster CR can come up. Wired as a conditional `dependsOn` in the facet."
  provisioning:
    required_when: "`demo.resources.database: true` AND `database.postgres.driver` is `rds`, `azuredb`, or `cloudsql`"
    reason: "Crossplane's provider must finish installing before the `demo-db` CR's CRD is registered. Wired as a conditional `dependsOn` in the facet."
  gateway-resources:
    required_when: "`bookinfo/gateway` is enabled"
    reason: "The HTTPRoute needs the cluster Gateway to be Programmed first. Wired as a conditional `dependsOn` in the facet."
