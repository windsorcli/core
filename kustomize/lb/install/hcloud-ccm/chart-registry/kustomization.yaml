apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - oci-repository.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: hcloud-cloud-controller-manager
        namespace: system-lb
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: hcloud-cloud-controller-manager
        namespace: system-lb
      spec:
        chart: null
        chartRef:
          kind: OCIRepository
          name: hcloud-cloud-controller-manager
