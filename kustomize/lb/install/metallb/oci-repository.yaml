---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: metallb
  namespace: system-lb
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry:=oci://quay.io/metallb/chart}/metallb
  ref:
    # artifact: type=chart name=metallb repo=oci://quay.io/metallb/chart
    tag: 0.16.1
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
