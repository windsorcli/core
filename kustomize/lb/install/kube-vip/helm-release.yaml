apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
  namespace: system-lb
spec:
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: kube-vip
      # artifact: type=chart name=kube-vip repo=https://kube-vip.github.io/helm-charts
      version: 0.11.2
      sourceRef:
        kind: HelmRepository
        name: kube-vip
  values:
    priorityClassName: windsorcli-platform-critical
    # DaemonSet: only the taint toleration applies. The chart's own
    # control-plane toleration is carried over verbatim, since setting
    # tolerations here replaces its default rather than appending to it.
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    image:
      repository: ghcr.io/kube-vip/kube-vip
      # artifact: type=image name=ghcr.io/kube-vip/kube-vip
      tag: v1.3.2@sha256:50b25c001fe19628a932b42ec6f8ec31bb65a5e1811a723a57ceddbc5cd5aade
    env:
      svc_enable: "true"
      svc_election: "true"
