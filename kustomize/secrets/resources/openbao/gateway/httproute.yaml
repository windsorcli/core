---
# Routes openbao.${external_domain} through the shared Gateway to the operator's
# openbao Service. TLS terminates at the gateway on the client side; the
# BackendTLSPolicy (install tier, always rendered) covers the backend hop,
# which is TLS-only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: system-secrets-store
spec:
  parentRefs:
    # web-https only; plain HTTP is 301-redirected by the gateway's https-redirect.
    - kind: Gateway
      name: external
      namespace: system-gateway
      sectionName: web-https
  hostnames:
    - openbao.${external_domain}
  rules:
    - backendRefs:
        - kind: Service
          name: openbao
          port: 8200
