---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-bootstrap
  namespace: system-secrets-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-bootstrap
  namespace: system-secrets-store
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-init"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-bootstrap
  namespace: system-secrets-store
subjects:
  - kind: ServiceAccount
    name: openbao-bootstrap
    namespace: system-secrets-store
roleRef:
  kind: Role
  name: openbao-bootstrap
  apiGroup: rbac.authorization.k8s.io
