---
# Submits the stored Shamir share after every restart — the recurring half
# of unseal that cloud auto-unseal drivers handle themselves. No-ops
# immediately when already unsealed, when openbao-init doesn't exist yet, or
# when the seal type isn't shamir (an auto-unseal cluster has nothing for
# this job to do).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-unseal
  namespace: system-secrets-store
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: openbao-bootstrap
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumes:
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            - name: ca
              secret:
                secretName: openbao-ca-trust
          containers:
            - name: unseal
              # renovate: datasource=docker depName=kubectl package=alpine/k8s
              image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: ca
                  mountPath: /ca
                  readOnly: true
              # $${...} are shell variables, escaped so Flux's substitution
              # doesn't try to resolve them as Windsor variables.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  BAO="https://openbao.system-secrets-store.svc.cluster.local:8200"
                  # The substituted ca.crt lands as one line, BEGIN/END
                  # markers and body run together — reflow it into valid
                  # PEM before curl's TLS backend gets it.
                  sed -E 's/-----(BEGIN|END) CERTIFICATE-----/\n&\n/g' /ca/ca.crt | sed '/^$/d' > /work/ca.crt
                  CACERT="/work/ca.crt"
                  status=$(curl -sSf --cacert "$${CACERT}" "$${BAO}/v1/sys/seal-status") || { echo "seal-status check failed"; exit 0; }
                  sealed=$(echo "$${status}" | jq -r '.sealed')
                  seal_type=$(echo "$${status}" | jq -r '.type')
                  if [ "$${sealed}" != "true" ] || [ "$${seal_type}" != "shamir" ]; then
                    exit 0
                  fi
                  if ! kubectl get secret openbao-init -n system-secrets-store >/dev/null 2>&1; then
                    echo "openbao sealed but no openbao-init secret yet, waiting on init job"
                    exit 0
                  fi
                  key=$(kubectl get secret openbao-init -n system-secrets-store -o jsonpath='{.data.init\.json}' | base64 -d | jq -r '.keys[0]')
                  curl -sSf --cacert "$${CACERT}" -X PUT -d "{\"key\":\"$${key}\"}" "$${BAO}/v1/sys/unseal" >/dev/null
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
