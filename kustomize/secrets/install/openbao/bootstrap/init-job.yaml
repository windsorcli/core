---
# One-time bao operator init. Reads the live seal type off /v1/sys/seal-status
# rather than being told it, so the same job works unmodified whether OpenBao
# is running Shamir or a cloud auto-unseal driver: Shamir gets secret_shares,
# anything else gets recovery_shares. Skips entirely once openbao-init exists
# — init only ever succeeds once per instance.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: system-secrets-store
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: openbao-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: ca
          secret:
            secretName: openbao-ca-trust
      containers:
        - name: init
          # renovate: datasource=docker depName=kubectl package=alpine/k8s
          image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
          volumeMounts:
            - name: work
              mountPath: /work
            - name: ca
              mountPath: /ca
              readOnly: true
          env:
            - name: HOME
              value: /work
            - name: TMPDIR
              value: /work
          # $${...} are shell variables, escaped so Flux's substitution
          # doesn't try to resolve them as Windsor variables.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BAO="https://openbao.system-secrets-store.svc.cluster.local:8200"
              # The substituted ca.crt lands as one line, BEGIN/END markers
              # and body run together — reflow it into valid PEM before
              # curl's TLS backend gets it.
              sed -E 's/-----(BEGIN|END) CERTIFICATE-----/\n&\n/g' /ca/ca.crt | sed '/^$/d' > /work/ca.crt
              CACERT="/work/ca.crt"
              if kubectl get secret openbao-init -n system-secrets-store >/dev/null 2>&1; then
                echo "openbao-init secret already exists, skipping"
                exit 0
              fi
              status=$(curl -sSf --cacert "$${CACERT}" "$${BAO}/v1/sys/seal-status")
              initialized=$(echo "$${status}" | jq -r '.initialized')
              if [ "$${initialized}" = "true" ]; then
                echo "ERROR: openbao is initialized but the openbao-init secret is missing." >&2
                echo "ERROR: the unseal keys and root token were never persisted and cannot be recovered from this job." >&2
                echo "ERROR: manual recovery required, e.g. 'bao operator generate-root' or restoring init.json from an out-of-band backup." >&2
                exit 1
              fi
              seal_type=$(echo "$${status}" | jq -r '.type')
              if [ "$${seal_type}" = "shamir" ]; then
                payload='{"secret_shares":1,"secret_threshold":1}'
              else
                payload='{"recovery_shares":1,"recovery_threshold":1}'
              fi
              curl -sSf --cacert "$${CACERT}" -X PUT -d "$${payload}" "$${BAO}/v1/sys/init" > /work/init.json
              kubectl create secret generic openbao-init -n system-secrets-store \
                --from-file=init.json=/work/init.json \
                --dry-run=client -o yaml | kubectl apply -f -
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
