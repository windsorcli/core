---
# Enables OpenBao's userpass auth method and creates a local admin user, so
# dev doesn't require pasting the root token into the UI. Idempotent: skips
# enabling userpass if already present, upserts the policy and user every
# run.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-dev
  namespace: system-secrets-store
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: openbao-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: ca
          secret:
            secretName: openbao-ca-trust
      containers:
        - name: dev-admin
          # renovate: datasource=docker depName=kubectl package=alpine/k8s
          image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
          volumeMounts:
            - name: work
              mountPath: /work
            - name: ca
              mountPath: /ca
              readOnly: true
          env:
            - name: HOME
              value: /work
            - name: TMPDIR
              value: /work
            - name: DEV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openbao-dev-password
                  key: password
          # $${...} are shell variables, escaped so Flux's substitution
          # doesn't try to resolve them as Windsor variables.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BAO="https://openbao.system-secrets-store.svc.cluster.local:8200"
              sed -E 's/-----(BEGIN|END) CERTIFICATE-----/\n&\n/g' /ca/ca.crt | sed '/^$/d' > /work/ca.crt
              CACERT="/work/ca.crt"

              i=0
              while ! curl -sSf --cacert "$${CACERT}" "$${BAO}/v1/sys/health" >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$${i}" -ge 60 ]; then
                  echo "timed out waiting for openbao to be unsealed" >&2
                  exit 1
                fi
                sleep 5
              done

              TOKEN=$(kubectl get secret openbao-init -n system-secrets-store -o jsonpath='{.data.init\.json}' | base64 -d | jq -r '.root_token')

              auths=$(curl -sSf --cacert "$${CACERT}" -H "X-Vault-Token: $${TOKEN}" "$${BAO}/v1/sys/auth")
              if ! echo "$${auths}" | jq -e 'has("userpass/")' >/dev/null; then
                curl -sSf --cacert "$${CACERT}" -H "X-Vault-Token: $${TOKEN}" \
                  -X PUT -d '{"type":"userpass"}' "$${BAO}/v1/sys/auth/userpass" >/dev/null
              fi

              policy='path "*" {
                capabilities = ["create", "read", "update", "delete", "list", "sudo"]
              }'
              curl -sSf --cacert "$${CACERT}" -H "X-Vault-Token: $${TOKEN}" -X PUT \
                -d "$(jq -n --arg policy "$${policy}" '{policy:$policy}')" \
                "$${BAO}/v1/sys/policies/acl/admin" >/dev/null

              curl -sSf --cacert "$${CACERT}" -H "X-Vault-Token: $${TOKEN}" -X POST \
                -d "$(jq -n --arg pw "$${DEV_PASSWORD}" '{password:$pw, token_policies:"admin"}')" \
                "$${BAO}/v1/auth/userpass/users/admin" >/dev/null
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
