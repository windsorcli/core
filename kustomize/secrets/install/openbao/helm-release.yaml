---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: system-secrets-store
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: openbao
      # renovate: datasource=helm depName=openbao package=openbao helmRepo=https://openbao.github.io/openbao-helm
      version: 0.28.6
      sourceRef:
        kind: HelmRepository
        name: openbao
  values:
    injector:
      enabled: false
    # Consumed by the chart's scheme/BackendTLSPolicy helpers below, not by
    # standalone.config, which is a raw passthrough unaffected by this.
    global:
      tlsDisable: false
    # Creates the ClusterIP Service fronting the UI; standalone.config's own
    # `ui = true` is what makes the server serve it at all, this is what
    # makes it reachable.
    ui:
      enabled: true
    server:
      image:
        # renovate: datasource=docker depName=quay.io/openbao/openbao package=quay.io/openbao/openbao
        tag: 2.6.1@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
      # TLS cert is issued by the private ClusterIssuer (certificate.yaml),
      # same pattern as coredns/etcd's mTLS. unauthenticated_metrics_access
      # lets kube-prometheus-stack scrape without a bao token; harmless if no
      # ServiceMonitor is scraping.
      standalone:
        enabled: true
        config: |
          ui = true

          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/openbao/tls/tls.crt"
            tls_key_file = "/openbao/tls/tls.key"

            telemetry {
              unauthenticated_metrics_access = "true"
            }
          }
          storage "file" {
            path = "/openbao/data"
          }
          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname = true
          }
      volumes:
        - name: tls
          secret:
            secretName: openbao-server-tls
      volumeMounts:
        - name: tls
          mountPath: /openbao/tls
          readOnly: true
      # Lets the Gateway (BackendTLSPolicy, chart-generated) trust this TLS-only
      # backend when the private-gateway HTTPRoute (resources tier) is enabled.
      # Inert with no HTTPRoute attached — safe to always render.
      gateway:
        tlsPolicy:
          enabled: true
          validation:
            caCertificateRefs:
              - group: ""
                kind: Secret
                name: openbao-ca-trust
      statefulSet:
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
          container:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
