---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: system-secrets-store
spec:
  values:
    server:
      serviceAccount:
        annotations:
          azure.workload.identity/client-id: ${openbao_client_id}
          azure.workload.identity/tenant-id: ${openbao_tenant_id}
      extraLabels:
        azure.workload.identity/use: "true"
