---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: system-secrets-store
spec:
  values:
    server:
      standalone:
        config: |
          ui = true

          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/openbao/tls/tls.crt"
            tls_key_file = "/openbao/tls/tls.key"

            telemetry {
              unauthenticated_metrics_access = "true"
            }
          }
          storage "file" {
            path = "/openbao/data"
          }
          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname = true
          }
          seal "azurekeyvault" {
            tenant_id  = "${openbao_tenant_id}"
            client_id  = "${openbao_client_id}"
            vault_name = "${openbao_vault_name}"
            key_name   = "${openbao_key_name}"
          }
