# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

substitutions:
  external_domain:
    required_when: "`openbao/gateway` is enabled"
    description: "Hostname domain for the `openbao.<domain>` route. `dns.private_domain` when set, else `dns.public_domain`."
  aws_region:
    required_when: "platform is `aws` AND `secrets_store.driver == 'openbao'`"
    description: "AWS region for the `seal \"awskms\"` stanza. Sourced from `aws.region`."
  openbao_kms_key_id:
    required_when: "platform is `aws` AND `secrets_store.driver == 'openbao'`"
    description: "KMS key ID for the `seal \"awskms\"` stanza. Sourced from `terraform_output('cluster', 'openbao_kms_key_id')`."
  openbao_tenant_id:
    required_when: "platform is `azure` AND `secrets_store.driver == 'openbao'`"
    description: "Azure AD tenant ID for the `seal \"azurekeyvault\"` stanza and the Workload Identity annotation. Sourced from `terraform_output('cluster', 'tenant_id')`."
  openbao_client_id:
    required_when: "platform is `azure` AND `secrets_store.driver == 'openbao'`"
    description: "Client ID of OpenBao's User-Assigned Managed Identity, for the `seal \"azurekeyvault\"` stanza and the Workload Identity annotation. Sourced from `terraform_output('cluster', 'openbao_client_id')`."
  openbao_vault_name:
    required_when: "platform is `azure` AND `secrets_store.driver == 'openbao'`"
    description: "Name of the dedicated Key Vault holding OpenBao's unseal key, for the `seal \"azurekeyvault\"` stanza. Sourced from `terraform_output('cluster', 'openbao_key_vault_name')`."
  openbao_key_name:
    required_when: "platform is `azure` AND `secrets_store.driver == 'openbao'`"
    description: "Name of the key OpenBao's Azure Key Vault seal wraps/unwraps with. Sourced from `terraform_output('cluster', 'openbao_key_name')`."

components:
  external-secrets:
    enable_when: "`external_secrets.enabled: true`"
    description: "Helm release of External Secrets Operator in `system-secrets`. Install-only: manages `ExternalSecret` and `ClusterSecretStore` CRs, creates none of its own. CRDs are vendored under `kustomize/crds/external-secrets-<version>/`, not chart-managed (`installCRDs: false`)."
  openbao:
    enable_when: "`secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'` (default)"
    description: "Helm release of OpenBao in `system-secrets-store`, plus its server `Certificate` off the `private` ClusterIssuer and the `openbao-ca-trust` Secret the chart's own `BackendTLSPolicy` validates against (`server.gateway.tlsPolicy.enabled: true`, always rendered — inert without an attached HTTPRoute). `openbao-ca-trust` is placed via the facet's `secrets:` block (`terraform_output('pki', 'cert')`), not a Flux substitution — a ConfigMap built that way lost the CA's PEM line breaks. Self-hosted, single-cluster secrets store; standalone mode with file-backed storage on a PVC (depends on `csi`). Ships sealed and uninitialized until `openbao/bootstrap` runs."
  openbao/bootstrap:
    enable_when: "`secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'` (always, every platform)"
    description: "One-time init Job plus a recurring unseal CronJob. The Job calls `bao operator init` once (skipped once its output Secret exists) and asks OpenBao's own `/v1/sys/seal-status` for the seal type to init correctly whether it's Shamir or a cloud auto-unseal driver. The CronJob resubmits the stored Shamir share every 2 minutes, no-oping instantly when already unsealed or on a non-Shamir seal. The root token and any Shamir share land in a plain `openbao-init` Secret in `system-secrets-store` — whoever can read Secrets there has root on the store."
  openbao/dev:
    enable_when: "`dev: true` AND `secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'`"
    description: "Enables OpenBao's `userpass` auth method and creates a local `admin` user, so the UI is reachable without pasting the root token. Idempotent — skips enabling `userpass` if already present, upserts the policy and user every run. Password comes from `secrets_store.admin_password` (defaults to `openbao`), placed as the `openbao-dev-password` Secret via the facet's `secrets:` block since it's a sensitive schema property, not a plaintext substitution."
  openbao/prometheus:
    enable_when: "`secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'` AND `telemetry.metrics.enabled: true`"
    description: "Patches the OpenBao HelmRelease to enable `serverTelemetry.serviceMonitor` (`release: kube-prometheus-stack` discovery labels, `insecureSkipVerify: true` since the scrape target is the same self-signed-CA listener). `unauthenticated_metrics_access` is always on in the base config so the endpoint is scrapable whenever this component is added."
  openbao/gateway:
    enable_when: "`secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'` AND `gateway.access == 'private'`"
    description: "Routes `openbao.${external_domain}` through the shared Gateway to the `openbao` Service. Client-side TLS terminates at the gateway; the backend hop to OpenBao's TLS-only listener is covered by the always-rendered `BackendTLSPolicy` from the `openbao` component."
  openbao/aws-kms-unseal:
    enable_when: "platform is `aws` AND `secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'`"
    description: "Replaces `server.standalone.config` with the base config plus a `seal \"awskms\"` stanza, so OpenBao auto-unseals via AWS KMS instead of Shamir. Authenticated through Pod Identity (`create_openbao_kms_role` on the cluster module) — no static credential."
  openbao/azure-keyvault-unseal:
    enable_when: "platform is `azure` AND `secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'`"
    description: "Replaces `server.standalone.config` with the base config plus a `seal \"azurekeyvault\"` stanza, so OpenBao auto-unseals via Azure Key Vault instead of Shamir."
  openbao/azure-workload-identity:
    enable_when: "platform is `azure` AND `secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'`"
    description: "Annotates the OpenBao ServiceAccount and labels the pod for Azure Workload Identity, so the SA token exchanges for an Azure AD token scoped to the Key Vault `openbao/azure-keyvault-unseal` wraps/unwraps against (`create_openbao_identity` on the cluster module)."

dependencies:
  csi:
    required_when: "`secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'`"
    reason: "OpenBao's standalone mode needs a PVC for its file storage backend; the default StorageClass must exist first."
  pki-install:
    required_when: "`secrets_store.enabled: true` AND `secrets_store.driver == 'openbao'`"
    reason: "OpenBao's server Certificate is issued by the private ClusterIssuer; cert-manager must be reconciling first."
  gateway-resources:
    required_when: "`openbao/gateway` is enabled"
    reason: "The shared Gateway must exist before the HTTPRoute can attach to it."
