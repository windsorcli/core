apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# postgres_exporter dashboard - vendored
# Run: task dashboards
# See: source.yaml for provenance

configMapGenerator:
  - name: grafana-dashboards-databases
    namespace: system-observability
    files:
      - postgres-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Database"
