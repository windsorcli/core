apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Keycloak dashboards - vendored
# Run: task dashboards
# See: source.yaml for provenance

configMapGenerator:
  - name: grafana-dashboards-identity
    namespace: system-observability
    files:
      - keycloak-capacity-planning-dashboard.json
      - keycloak-troubleshooting-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Identity"
