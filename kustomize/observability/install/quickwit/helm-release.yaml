---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quickwit
  namespace: system-observability
spec:
  interval: 5m
  timeout: 10m
  install:
    # No uninstall on failed install: the pvc component gives this a PVC-backed search index.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: quickwit
      # renovate: datasource=helm depName=quickwit package=quickwit helmRepo=https://helm.quickwit.io
      version: 0.8.17
      sourceRef: 
        kind: HelmRepository
        name: ${helm_mirror_name:=quickwit}
        namespace: ${helm_mirror_namespace:=system-observability}
  values:
    image:
      # renovate: datasource=docker depName=quickwit/quickwit package=quickwit/quickwit
      tag: v0.9.2@sha256:1c249c579063830be4666523c4d95289683f98c5a584de8e67a8be3361fe1f72
    environment:
      # Disable ANSI color codes in log output
      NO_COLOR: "1"
      # Reduce log verbosity - warn for internal modules, info for main operations
      RUST_LOG: "info,quickwit_search::leaf=warn,quickwit_search::root=warn,quickwit_indexing::actors=warn,tantivy=warn,hyper=warn,h2=warn,tower=warn"
    searcher:
      replicaCount: 1
