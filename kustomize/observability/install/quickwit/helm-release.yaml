---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quickwit
  namespace: system-observability
spec:
  interval: 5m
  timeout: 10m
  install:
    # No uninstall on failed install: the pvc component gives this a PVC-backed search index.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: quickwit
      # artifact: type=chart name=quickwit repo=https://helm.quickwit.io
      version: 0.8.17
      sourceRef: 
        kind: HelmRepository
        name: quickwit
  values:
    image:
      repository: docker.io/quickwit/quickwit
      # artifact: type=image name=docker.io/quickwit/quickwit
      tag: v0.9.3@sha256:7c3f5061ea7c00921205c295833f152871d057ec1a9e4c9b1d36131dacc420bd
    environment:
      # Disable ANSI color codes in log output
      NO_COLOR: "1"
      # Reduce log verbosity - warn for internal modules, info for main operations
      RUST_LOG: "info,quickwit_search::leaf=warn,quickwit_search::root=warn,quickwit_indexing::actors=warn,tantivy=warn,hyper=warn,h2=warn,tower=warn"
    searcher:
      replicaCount: 1
