---
# Kyverno's background-controller only reads/mutates resource kinds it's been
# explicitly granted. This label aggregates into its own ClusterRole
# (kyverno:background-controller), the extension point its chart ships
# for exactly this — see rbac.kyverno.io/aggregate-to-background-controller
# in Kyverno's own RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd-config-restart
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - fluentd.fluent.io
    resources:
      - clusterfilters
      - clusterinputs
      - clusteroutputs
      - clusterfluentdconfigs
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
---
# The patch/update the mutate rule needs stays namespace-scoped instead of
# joining the cluster-wide aggregation above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fluentd-config-restart
  namespace: system-observability
rules:
  - apiGroups:
      - apps
    resources:
      - statefulsets
    resourceNames:
      - fluentd
    verbs:
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fluentd-config-restart
  namespace: system-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fluentd-config-restart
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: system-policy
---
# The admission-controller applies a mutate-existing rule inline during the
# trigger's own admission review, so it needs the same read access, aggregated
# the same way via its own extension point.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd-config-restart-read
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups:
      - fluentd.fluent.io
    resources:
      - clusterfilters
      - clusterinputs
      - clusteroutputs
      - clusterfluentdconfigs
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
