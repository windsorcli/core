  name: grafana
  namespace: system-observability
spec:
  interval: 10m
  timeout: 5m
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  ref:
    # renovate: datasource=docker depName=ghcr.io/grafana-community/helm-charts/grafana package=ghcr.io/grafana-community/helm-charts/grafana
    tag: 10.5.15
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
