apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns
  namespace: system-dns
spec:
  replicas: 2
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pdns
                topologyKey: kubernetes.io/hostname
