apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pdns-db
  namespace: system-dns
spec:
  instances: 1
  # artifact: type=image name=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6@sha256:30b304a2e300ed80b6d1b740e4369e9b0f25599fb518de78c01fd9f25531791b
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: pdns
      owner: pdns
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: pdns-schema
            key: schema.sql
