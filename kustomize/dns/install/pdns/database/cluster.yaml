apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pdns-db
  namespace: system-dns
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 17
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: pdns
      owner: pdns
