apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdns-metrics
  namespace: system-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pdns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: system-telemetry
      ports:
        - port: 8081
          protocol: TCP
