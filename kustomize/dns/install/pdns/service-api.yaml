apiVersion: v1
kind: Service
metadata:
  name: pdns-api
  namespace: system-dns
  labels:
    app.kubernetes.io/name: pdns
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pdns
  ports:
    - name: api
      port: 8081
      targetPort: api
      protocol: TCP
