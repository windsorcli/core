---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: coredns
  namespace: system-dns
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry:=oci://ghcr.io/coredns/charts}/coredns
  ref:
    # artifact: type=chart name=coredns repo=oci://ghcr.io/coredns/charts
    tag: 1.49.0
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
