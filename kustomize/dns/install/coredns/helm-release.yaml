---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: system-dns
spec:
  interval: 1m
  timeout: 15m
  dependsOn: []
  install:
    # No uninstall on failed install: in-cluster DNS, so an uninstall mid-retry
    # breaks name resolution cluster-wide.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chartRef:
    kind: OCIRepository
    name: coredns
  values:
    priorityClassName: windsorcli-platform-critical
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
    image:
      repository: docker.io/coredns/coredns
      # artifact: type=image name=docker.io/coredns/coredns
      tag: 1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    isClusterService: false
    extraVolumes: []
    extraVolumeMounts: []
    servers:
      - zones:
          - zone: ${private_domain}
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: cache
            parameters: 30
          - name: reload
          - name: loadbalance
