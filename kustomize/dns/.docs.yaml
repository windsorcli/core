# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

substitutions:
  external_domain:
    required_when: "`external-dns` (public instance) is enabled"
    description: "Domain filter for the public external-dns instance. Always `dns.public_domain` -- this instance only ever exists when a public domain is set."
  internal_domain:
    required_when: "`external-dns-internal` is enabled"
    description: "Domain filter for the internal external-dns instance. Always `dns.private_domain` -- this instance only ever exists when a private domain is set."
  zone_type:
    required_when: "platform is AWS, public instance"
    description: "Always `public` on the public external-dns instance. Combined with `zone_id_filter` to lock the controller onto the public Route53 zone."
  zone_type_internal:
    required_when: "platform is AWS, internal instance"
    description: "Always `private` on the internal external-dns instance (`external-dns-internal`)."
  zone_id_filter:
    required_when: "platform is AWS or Azure, public instance"
    description: "Public hosted-zone ID to constrain the public external-dns instance to. AWS: `terraform_output('dns-zone', 'zone_id')`. Azure has no zone-id-filter equivalent (the provider already scopes to azure.json's resourceGroup)."
  zone_id_filter_internal:
    required_when: "platform is AWS, internal instance"
    description: "Private hosted-zone ID (`terraform_output('network', 'private_zone_id')`) to constrain the internal external-dns instance (`external-dns-internal`) to."
  aws_region:
    required_when: "`external-dns/providers/route53` or `external-dns-internal/providers/route53` is enabled"
    description: "AWS region for external-dns's Route53 API calls. Sourced from top-level `aws.region`."
  txt_owner_id:
    required_when: "`external-dns` or `external-dns-internal` is enabled"
    description: "Unique TXT-record owner ID for external-dns's registry. Keeps multiple external-dns instances in the same zone from clobbering each other's records. Threaded via Flux postBuild from the `values-dns` ConfigMap the CLI generates."
  loadbalancer_start_ip:
    required_when: "`coredns/loadbalancer` is enabled (private-DNS LB Service)"
    description: "External IP for the coredns Service when private DNS is exposed via the gateway LB. Sourced from `network.loadbalancer_ips.start`."

components:
  external-dns:
    enable_when: "`dns.public_domain` set"
    description: "Helm release of `external-dns` in `system-dns`, serving the public zone only. Watches Service / Ingress / Gateway / HTTPRoute resources and publishes their hostnames as DNS records. Pod runs as a workload identity-bound ServiceAccount; provider auth is handled by the provider-specific component. `external-dns-internal` is the independent counterpart serving the private zone -- both can run at once."
  external-dns-internal:
    enable_when: "`dns.private_domain` set"
    description: "Independent `external-dns-internal` HelmRelease serving the private zone only, feeding the internal gateway's hostnames. Same shape as `external-dns`, distinct HelmRelease name and substitution keys (`internal_domain`, `zone_type_internal`, `zone_id_filter_internal`) so both instances can be configured independently in one blueprint."
  external-dns/ha:
    enable_when: "`topology == 'ha'`"
    description: "Patches the external-dns Deployment to multi-replica with leader election. Skipped on single-node — one replica has nothing to elect against."
  external-dns/providers/route53:
    enable_when: "platform is AWS AND `dns.public_domain` set"
    description: "Patches the `external-dns` HelmRelease for the Route53 provider: `provider.aws.usePodIdentity: true`, `region: ${aws_region}`, `zoneType: ${zone_type}`, `--zone-id-filter=${zone_id_filter}`. `external-dns-internal/providers/route53` is the private-zone counterpart."
  external-dns/providers/azure:
    enable_when: "platform is Azure AND `dns.public_domain` set"
    description: "Patches the `external-dns` HelmRelease for the Azure provider (always `azure`, the public zone provider): federated workload identity. `external-dns-internal/providers/azure` is the private-zone counterpart (always `azure-private-dns`)."
  external-dns/providers/coredns:
    enable_when: "`dns.private.enabled: true` (provides private DNS via in-cluster coredns)"
    description: "Patches the external-dns HelmRelease for the CoreDNS provider, writing records into the in-cluster coredns etcd backend instead of a cloud DNS zone."
  external-dns/sources/gateway-httproute:
    enable_when: "`gateway.enabled: true`"
    description: "Adds `gateway-httproute` to external-dns's `sources` list so the Gateway API's `HTTPRoute` hostnames are published. Requires the Gateway API CRDs to be present (hence the `gateway-install` dependency)."
  coredns:
    enable_when: "`dns.private.enabled: true`"
    description: "Helm release of `coredns` in `system-dns`. In-cluster private DNS server. The default plugin chain serves cluster.local and forwards everything else upstream."
  coredns/etcd:
    enable_when: "`dns.private.enabled: true`"
    description: "etcd StatefulSet for coredns to use as a persistent backend for the `etcd` plugin. mTLS between coredns and etcd peers, certs issued by the `private` ClusterIssuer."
  coredns/prometheus:
    enable_when: "`dns.private.enabled: true` AND `telemetry.metrics.enabled: true`"
    description: "Enables the chart's metrics Service and ServiceMonitor so this coredns instance is scraped by kube-prometheus-stack. The unfiltered `prometheus/alerts/coredns` rules then cover it automatically alongside the cluster's built-in CoreDNS."
  coredns/ha:
    enable_when: "`dns.private.enabled: true` AND `topology == 'ha'`"
    description: "Patches the coredns HelmRelease for HA (multi-replica + leader election)."
  coredns/loadbalancer:
    enable_when: "`dns.private.enabled: true` AND `gateway.driver == 'cilium'`"
    description: "Adds a `Service type=LoadBalancer` for coredns at `${loadbalancer_start_ip}` so the cluster's private DNS is reachable from outside the cluster (workstation pointing at the bench IP)."
  coredns/cilium:
    enable_when: "`dns.private.enabled: true` AND `gateway.driver == 'cilium'`"
    description: "Cilium-specific patches on coredns (typically LB-sharing annotations matching the Cilium gateway's IP pool)."
  coredns/gateway:
    enable_when: "`dns.private.enabled: true` AND `gateway.enabled: true`"
    description: "Wires a Gateway API listener / route so coredns is reachable through the cluster Gateway (UDP/TCP 53)."

dependencies:
  pki-install:
    required_when: "`dns.private.enabled: true`"
    reason: "coredns's etcd peer / server certs are issued by the `private` ClusterIssuer; cert-manager must be reconciling first."
  gateway-install:
    required_when: "`gateway.enabled: true`"
    reason: "external-dns with `sources: [gateway-httproute]` crash-loops on `no matches for kind HTTPRoute` if the Gateway API CRDs aren't installed yet."
  policy-resources:
    required_when: "`workstation.runtime == 'docker-desktop'`"
    reason: "docker-desktop runs Kyverno in restricted-PSA mode for system-dns; the baseline policies need to be reconciling before coredns pods are admitted."
  cni:
    required_when: "`dns.private.enabled: true` AND `gateway.driver == 'cilium'`"
    reason: "The `coredns/cilium` and `coredns/loadbalancer` components rely on Cilium's L2 IP-sharing infrastructure being live."
