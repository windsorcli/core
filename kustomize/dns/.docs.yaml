# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

substitutions:
  public_domain:
    required_when: "`coredns/public-zone` is enabled"
    description: "Public domain the in-cluster coredns also serves. Always `dns.public_domain`."
  private_domain:
    required_when: "`coredns` is enabled"
    description: "Private domain the in-cluster coredns serves. Always `dns.private_domain`."
  external_dns_name:
    required_when: "a `resources/external-dns` instance is enabled"
    description: "HelmRelease name of the instance: `external-dns-public` for the public zone, `external-dns-private` for the private zone."
  external_dns_domain:
    required_when: "a `resources/external-dns` instance is enabled"
    description: "Domain filter for the instance: `dns.public_domain` or `dns.private_domain`."
  external_dns_zone_type:
    required_when: "`resources/external-dns/providers/route53` is enabled"
    description: "Route53 zone type of the instance, `public` or `private`. Combined with `external_dns_zone_id_filter` to lock the controller onto one zone."
  external_dns_zone_id_filter:
    required_when: "`resources/external-dns/providers/route53` is enabled"
    description: "Hosted-zone ID to constrain the instance to. Public: `terraform_output('dns-zone', 'zone_id')`. Private: `terraform_output('network', 'private_zone_id')`."
  external_dns_azure_provider:
    required_when: "`resources/external-dns/providers/azure` is enabled"
    description: "Azure provider of the instance: `azure` for the public zone, `azure-private-dns` for the VNet-linked private zone."
  external_dns_subscription_id:
    required_when: "`resources/external-dns/providers/azure` is enabled"
    description: "Azure subscription holding the instance's DNS zone. Public: `terraform_output('dns-zone', 'subscription_id')`. Private: `terraform_output('network', 'subscription_id')`."
  external_dns_resource_group:
    required_when: "`resources/external-dns/providers/azure` is enabled"
    description: "Azure resource group holding the instance's DNS zone. Public: `terraform_output('dns-zone', 'resource_group_name')`. Private: `terraform_output('network', 'resource_group_name')`."
  external_dns_tenant_id:
    required_when: "`external-dns/providers/azure` or `resources/external-dns/providers/azure` is enabled"
    description: "Azure AD tenant for the external-dns workload identity. Sourced from `terraform_output('cluster', 'tenant_id')`."
  external_dns_client_id:
    required_when: "`external-dns/providers/azure` is enabled"
    description: "Client ID of the external-dns managed identity, set on the shared ServiceAccount. Sourced from `terraform_output('cluster', 'external_dns_client_id')`."
  aws_region:
    required_when: "`resources/external-dns/providers/route53` is enabled"
    description: "AWS region for external-dns's Route53 API calls. Sourced from top-level `aws.region`."
  google_project_id:
    required_when: "`resources/external-dns/providers/google` is enabled"
    description: "GCP project external-dns's Cloud DNS API calls run against. Sourced from `gcp.project_id`."
  external_dns_service_account_email:
    required_when: "`external-dns/providers/google` is enabled"
    description: "Email of the external-dns Google Service Account, set on the shared ServiceAccount. Sourced from `terraform_output('cluster', 'external_dns_service_account_email')`."
  txt_owner_id:
    required_when: "a `resources/external-dns` instance uses a registry-backed provider"
    description: "Unique TXT-record owner ID for external-dns's registry. Keeps multiple external-dns instances in the same zone from clobbering each other's records. Threaded via Flux postBuild from the `values-dns` ConfigMap the CLI generates."
  loadbalancer_start_ip:
    required_when: "`coredns/loadbalancer` is enabled (private-DNS LB Service)"
    description: "External IP for the coredns Service when private DNS is exposed via the gateway LB. Sourced from `network.loadbalancer_ips.start`."

components:
  external-dns:
    facet: dns-install
    enable_when: "`dns.public_domain` or `dns.private_domain` is set"
    description: "The `external-dns` HelmRepository and the shared `external-dns` ServiceAccount in `system-dns`. Every instance uses that one ServiceAccount, so the cloud identity bindings (AWS Pod Identity, the Azure federated credential, the GKE Workload Identity binding) cover the public and the private instance alike."
  external-dns/providers/azure:
    facet: dns-install
    enable_when: "platform is Azure"
    description: "Adds the workload identity label and the client and tenant ID annotations to the shared ServiceAccount."
  external-dns/providers/google:
    facet: dns-install
    enable_when: "platform is GCP"
    description: "Adds the `iam.gke.io/gcp-service-account` annotation to the shared ServiceAccount."
  resources/external-dns:
    facet: dns-resources
    enable_when: "one named variant per zone: `public` when `dns.public_domain` is set, `private` when `dns.private_domain` is set"
    description: "The `external-dns` HelmRelease for one zone, named by `${external_dns_name}` and filtered to `${external_dns_domain}`. Watches Service / Ingress / Gateway / HTTPRoute resources and publishes their hostnames as DNS records. Runs under the shared ServiceAccount, with provider auth handled by the provider component."
  resources/external-dns/providers/route53:
    facet: dns-resources
    enable_when: "platform is AWS"
    description: "Patches the HelmRelease for the Route53 provider: `provider.aws.usePodIdentity: true`, `region: ${aws_region}`, `zoneType: ${external_dns_zone_type}`, `--zone-id-filter=${external_dns_zone_id_filter}`."
  resources/external-dns/providers/azure:
    facet: dns-resources
    enable_when: "platform is Azure"
    description: "Patches the HelmRelease for the Azure provider, `${external_dns_azure_provider}` being `azure` for the public zone and `azure-private-dns` for the private one, with federated workload identity."
  resources/external-dns/providers/google:
    facet: dns-resources
    enable_when: "platform is GCP"
    description: "Patches the HelmRelease for the Google provider: `provider.name: google` and `--google-project=${google_project_id}`. Cloud DNS serves public and private zones through the same API."
  resources/external-dns/providers/hetzner:
    facet: dns-resources
    enable_when: "platform is Hetzner"
    description: "Patches the HelmRelease for Hetzner DNS through the external-dns webhook provider, reading the API token from the `hetzner-dns` Secret."
  resources/external-dns/providers/coredns:
    facet: dns-resources
    enable_when: "`dns.private.enabled: true` (provides DNS through the in-cluster coredns)"
    description: "Patches the HelmRelease for the CoreDNS provider, writing records into the in-cluster coredns etcd backend instead of a cloud DNS zone."
  resources/external-dns/sources/gateway-httproute:
    facet: dns-resources
    enable_when: "`gateway.enabled: true`"
    description: "Adds `gateway-httproute` to external-dns's `sources` list so the Gateway API's `HTTPRoute` hostnames are published. Requires the Gateway API CRDs to be present."
  coredns/public-zone:
    facet: dns-install
    enable_when: "`dns.private.enabled: true` AND `dns.public_domain` is set"
    description: "Adds a `${public_domain}` zone to the in-cluster coredns server block, so a local or metal cluster answers for the public domain as well as the private one."
  coredns:
    enable_when: "`dns.private.enabled: true`"
    description: "Helm release of `coredns` in `system-dns`. In-cluster private DNS server. Serves only `dns.private_domain` and refuses every other name."
    variants:
      etcd:
        enable_when: "`dns.private.enabled: true`"
        description: "etcd StatefulSet for coredns to use as a persistent backend for the `etcd` plugin. mTLS between coredns and etcd peers, certs issued by the `private` ClusterIssuer."
      prometheus:
        enable_when: "`dns.private.enabled: true` AND `telemetry.metrics.enabled: true`"
        description: "Enables the chart's metrics Service and ServiceMonitor so this coredns instance is scraped by kube-prometheus-stack. The unfiltered `prometheus/alerts/coredns` rules then cover it automatically alongside the cluster's built-in CoreDNS."
      ha:
        enable_when: "`dns.private.enabled: true` AND `topology == 'ha'`"
        description: "Patches the coredns HelmRelease for HA (multi-replica + leader election)."
      loadbalancer:
        enable_when: "`dns.private.enabled: true` AND `gateway.driver == 'cilium'`"
        description: "Adds a `Service type=LoadBalancer` for coredns at `${loadbalancer_start_ip}` so the cluster's private DNS is reachable from outside the cluster (workstation pointing at the bench IP)."
      cilium:
        enable_when: "`dns.private.enabled: true` AND `gateway.driver == 'cilium'`"
        description: "Cilium-specific patches on coredns (typically LB-sharing annotations matching the Cilium gateway's IP pool)."
      gateway:
        enable_when: "`dns.private.enabled: true` AND `gateway.enabled: true`"
        description: "Wires a Gateway API listener / route so coredns is reachable through the cluster Gateway (UDP/TCP 53)."

dependencies:
  pki-install:
    required_when: "`dns.private.enabled: true`"
    reason: "coredns's etcd peer / server certs are issued by the `private` ClusterIssuer; cert-manager must be reconciling first."
  gateway-install:
    required_when: "`gateway.enabled: true`"
    reason: "external-dns with `sources: [gateway-httproute]` crash-loops on `no matches for kind HTTPRoute` if the Gateway API CRDs aren't installed yet."
  policy-resources:
    required_when: "`workstation.runtime == 'docker-desktop'`"
    reason: "docker-desktop runs Kyverno in restricted-PSA mode for system-dns; the baseline policies need to be reconciling before coredns pods are admitted."
  cni:
    required_when: "`dns.private.enabled: true` AND `gateway.driver == 'cilium'`"
    reason: "The `coredns/cilium` and `coredns/loadbalancer` components rely on Cilium's L2 IP-sharing infrastructure being live."
