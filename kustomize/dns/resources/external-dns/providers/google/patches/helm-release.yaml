---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${external_dns_name}
  namespace: system-dns
spec:
  values:
    provider:
      name: google
    policy: sync
    registry: txt
    txtOwnerId: ${txt_owner_id}
    extraArgs:
      - --google-project=${google_project_id}
