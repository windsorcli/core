apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${external_dns_name}
  namespace: system-dns
spec:
  values:
    provider:
      name: pdns
    env:
      - name: EXTERNAL_DNS_PDNS_SERVER
        value: http://pdns-api.system-dns.svc.cluster.local:8081
      - name: EXTERNAL_DNS_PDNS_API_KEY
        valueFrom:
          secretKeyRef:
            name: pdns-api
            key: api-key
    policy: sync
    registry: txt
    txtOwnerId: ${txt_owner_id}
