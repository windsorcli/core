---
# Cloudflare DNS through the in-tree external-dns provider. The API token comes
# from the `cloudflare-dns` Secret (key `api-token`) in system-dns.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${external_dns_name}
  namespace: system-dns
spec:
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-dns
            key: api-token
    policy: sync
    registry: txt
    txtOwnerId: ${txt_owner_id}
    extraArgs:
      # A missing zone ID falls back to a filter that matches no zone.
      - --zone-id-filter=${external_dns_zone_id_filter:-unresolved}
