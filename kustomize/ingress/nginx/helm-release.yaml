---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-controller
  namespace: system-ingress
spec:
  interval: 5m
  timeout: 10m
  install:
    # No uninstall on failed install: ships its own validating webhook for Ingress objects.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: ingress-nginx
      # renovate: datasource=docker depName=registry.k8s.io/ingress-nginx/charts/ingress-nginx package=registry.k8s.io/ingress-nginx/charts/ingress-nginx
      version: v4.15.1
      sourceRef:
        kind: HelmRepository
        name: ${helm_mirror_name:=ingress-nginx}
        namespace: ${helm_mirror_namespace:=system-ingress}
  values:
    controller:
      image:
        # renovate: datasource=docker depName=registry.k8s.io/ingress-nginx/controller package=registry.k8s.io/ingress-nginx/controller
        tag: v1.15.1@sha256:594ceea76b01c592858f803f9ff4d2cb40542cae2060410b2c95f75907d659e1
        digest: ""
        digestChroot: ""
      service:
        enableHttp: false
        enableTls: false
      ingressClassResource:
        default: true
      priorityClassName: windsorcli-platform-critical
