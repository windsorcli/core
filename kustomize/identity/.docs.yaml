# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

components:
  keycloak-operator:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "Keycloak Operator (Deployment + RBAC) in `system-identity`, vendored verbatim from keycloak-k8s-resources. Reconciles `Keycloak` custom resources; installs no server by itself. CRDs are applied separately by the `crds:` layer."
  keycloak/database:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "The CloudNativePG `Cluster` backing Keycloak: a `keycloak` database owned by role `keycloak`, published as the `keycloak-db-app` secret and the `keycloak-db-rw` service. Applied by the `identity-resources-database` tier, which the server tier waits on. That tier carries a `healthCheckExprs` gate on the `Cluster`\s `Ready` condition, since kstatus reports a CNPG `Cluster` Current the moment it is applied."
  keycloak/database/ha:
    enable_when: "`topology: ha`"
    description: "Scales the CloudNativePG `Cluster` to 3 instances with required pod anti-affinity, so each Postgres instance lands on a distinct node."
  keycloak:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "The `Keycloak` server CR. Keycloak serves HTTP internally (TLS terminates at the gateway) and stores realms in the `keycloak` database."
  keycloak/realm:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "One-shot `KeycloakRealmImport` for the platform realm (name from `identity.keycloak.realm`, default `platform`): a security baseline (sslRequired, brute-force detection, password policy, token/session lifetimes), a `platform-admins` group mapped to `realm-admin`. Consumers target this realm by name."
  keycloak/realm/clients/grafana:
    enable_when: "identity + Grafana both enabled (`grafana.sso != false`)"
    description: "Registers the `grafana` OIDC client in the platform `KeycloakRealmImport` (v2beta1, no client-admin-api CRDs). The secret resolves from a `GRAFANA_CLIENT_SECRET` placeholder (`spec.placeholders`) backed by `identity.keycloak.grafana_client_secret`, and the same value is copied into Grafana's namespace as `grafana-oidc-client`. One folder per consumer under `realm/clients/`."
  keycloak/realm/clients/kubernetes:
    enable_when: "`cluster.oidc.enabled == true`"
    description: "Registers the `kubernetes` OIDC client (public, PKCE) in the platform `KeycloakRealmImport` for kube-apiserver token validation. `cluster.oidc.issuer_url`/`client_id` are auto-inferred from this realm when unset, so enabling identity plus `cluster.oidc.enabled: true` needs no manual issuer/client config."
  keycloak/realm/dev-user:
    enable_when: "`dev == true`"
    description: "Dev-only patch seeding standard platform-realm users so local SSO works out of the box: `admin` / `admin-password` (in `platform-admins` → admin everywhere) and `viewer` / `viewer-password` (no group → read-only). Passwords satisfy the realm's length(12) policy. Never applied outside dev."
  keycloak/realm/clients/kubernetes/dev-rbac:
    enable_when: "`dev == true` and `cluster.oidc.enabled == true`"
    description: "Dev-only `ClusterRoleBinding` mapping the `platform-admins` group to `cluster-admin`, so the seeded dev `admin` user can do something after logging in via kubectl OIDC. Never applied outside dev."
  keycloak/gateway:
    enable_when: "`gateway.enabled == true`"
    description: "HTTPRoute publishing `keycloak.${external_domain}` through the shared external Gateway to the operator-managed `keycloak-service`."
  keycloak/cilium:
    enable_when: "`gateway.driver == 'cilium'`"
    description: "CiliumNetworkPolicy restricting Keycloak ingress to the gateway proxy. Cilium-enforced, so gated on the Cilium gateway driver."
  keycloak/admin:
    enable_when: "`identity.keycloak.admin.password` set, or `dev == true`"
    description: "Points the `Keycloak` CR at the `keycloak-bootstrap-admin` secret via `spec.bootstrapAdmin`, instead of the operator's auto-generated temporary admin. The password is the supplied one, or in dev a known default shared with the SSO admin user. Honored only at initial cluster creation."
  keycloak/prometheus:
    enable_when: "`telemetry.metrics.enabled: true`"
    description: "JSON6902 patch enabling Keycloak's own server and user-event metrics (`metrics-enabled`, `event-metrics-user-enabled`) and the operator's native `spec.serviceMonitor`, so Prometheus scrapes the management-interface `/metrics` endpoint with no hand-rolled ServiceMonitor needed. Also ships a hand-rolled `PodMonitor` for the `keycloak-db` CloudNativePG cluster's own postgres-exporter metrics -- CNPG's `Cluster.spec.monitoring.enablePodMonitor` convenience field is deprecated upstream, so this cluster is scraped the same way fluent-bit's ServiceMonitor is hand-rolled elsewhere. Without it, the CloudNativePG dashboard's namespace/cluster template variables (which query `cnpg_collector_up`) never discover this cluster."

dependencies:
  database:
    required_when: "`identity.driver == 'keycloak'`"
    reason: "Keycloak stores realm data in PostgreSQL; the CloudNativePG operator (database addon) must exist before its `Cluster` CR applies."
  identity-resources-database:
    required_when: "`identity.driver == 'keycloak'`"
    reason: "The `Keycloak` server CR waits for the CloudNativePG `Cluster` to report Ready; a server started without a database exits 1 and repeats its whole Quarkus build on restart."
  gateway-resources:
    required_when: "`gateway.enabled == true`"
    reason: "The shared Gateway must exist before the Keycloak HTTPRoute attaches to it."
