# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

components:
  keycloak-operator:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "Keycloak Operator (Deployment + RBAC) in `system-identity`, vendored verbatim from keycloak-k8s-resources. Reconciles `Keycloak` custom resources; installs no server by itself. CRDs are applied separately by the `crds:` layer."
  keycloak:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "The `Keycloak` server CR and its CloudNativePG `Cluster`. Keycloak serves HTTP internally (TLS terminates at the gateway) and stores realms in the `keycloak` database."
  keycloak/realm:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "One-shot `KeycloakRealmImport` for the platform realm (name from `identity.keycloak.realm`, default `platform`): a security baseline (sslRequired, brute-force detection, password policy, token/session lifetimes), a `platform-admins` group mapped to `realm-admin`, and a groups client scope for role mapping. Consumers target this realm by name."
  keycloak/grafana:
    enable_when: "identity + Grafana both enabled (`grafana.sso != false`)"
    description: "`KeycloakOIDCClient` registering Grafana in the platform realm (client id `grafana`; v2alpha1 derives it from the resource name). Reads the `grafana-oidc-client` Secret in `system-identity`."
  keycloak/grafana-secret:
    enable_when: "SSO inferred on and `grafana.client_secret` unset"
    description: "One-shot Job that generates the `grafana-oidc-client` Secret in `system-identity` when the blueprint did not supply one. Idempotent; leaves an existing secret untouched."
  keycloak/grafana-sync:
    enable_when: "identity + Grafana both enabled (`grafana.sso != false`)"
    description: "Kyverno `ClusterPolicy` (plus a background-controller RBAC grant) that replicates the `grafana-oidc-client` Secret from `system-identity` into `system-observability` and keeps it in sync."
  keycloak/gateway:
    enable_when: "`gateway.enabled == true`"
    description: "HTTPRoute publishing `keycloak.${external_domain}` through the shared external Gateway to the operator-managed `keycloak-service`."
  keycloak/cilium:
    enable_when: "`gateway.driver == 'cilium'`"
    description: "CiliumNetworkPolicy restricting Keycloak ingress to the gateway proxy. Cilium-enforced, so gated on the Cilium gateway driver."
  keycloak/admin:
    enable_when: "`identity.keycloak.admin.password` set"
    description: "Points the `Keycloak` CR at the supplied `keycloak-bootstrap-admin` secret via `spec.bootstrapAdmin`, instead of the operator's auto-generated temporary admin. Honored only at initial cluster creation."

dependencies:
  database:
    required_when: "`identity.driver == 'keycloak'`"
    reason: "Keycloak stores realm data in PostgreSQL; the CloudNativePG operator (database addon) must exist before its `Cluster` CR applies."
  gateway-resources:
    required_when: "`gateway.enabled == true`"
    reason: "The shared Gateway must exist before the Keycloak HTTPRoute attaches to it."
