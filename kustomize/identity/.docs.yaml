# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

components:
  keycloak-operator:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "Keycloak Operator (Deployment + RBAC) in `system-identity`, vendored verbatim from keycloak-k8s-resources. Reconciles `Keycloak` custom resources; installs no server by itself. CRDs are applied separately by the `crds:` layer."
  keycloak:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "The `Keycloak` server CR and its CloudNativePG `Cluster`. Keycloak serves HTTP internally (TLS terminates at the gateway) and stores realms in the `keycloak` database."
  keycloak/realm:
    enable_when: "`identity.driver == 'keycloak'`"
    description: "One-shot `KeycloakRealmImport` for the platform realm (name from `identity.keycloak.realm`, default `platform`): a security baseline (sslRequired, brute-force detection, password policy, token/session lifetimes), a `platform-admins` group mapped to `realm-admin`. Consumers target this realm by name."
  keycloak/realm/clients/grafana:
    enable_when: "identity + Grafana both enabled (`grafana.sso != false`)"
    description: "Onboards Grafana as an SSO consumer: a patch registers the `grafana` OIDC client in the platform `KeycloakRealmImport` (v2beta1, no client-admin-api CRDs) with no secret, so Keycloak generates one; a Job then reads that generated secret over the admin API and writes it into Grafana's namespace as `grafana-oidc-client`. No operator-supplied secret; stable because the realm import runs with `--override=false`. One folder per consumer under `realm/clients/`."
  keycloak/realm/dev-user:
    enable_when: "`dev == true`"
    description: "Dev-only patch seeding standard platform-realm users so local SSO works out of the box: `admin` / `admin-password` (in `platform-admins` → admin everywhere) and `viewer` / `viewer-password` (no group → read-only). Passwords satisfy the realm's length(12) policy. Never applied outside dev."
  keycloak/gateway:
    enable_when: "`gateway.enabled == true`"
    description: "HTTPRoute publishing `keycloak.${external_domain}` through the shared external Gateway to the operator-managed `keycloak-service`."
  keycloak/cilium:
    enable_when: "`gateway.driver == 'cilium'`"
    description: "CiliumNetworkPolicy restricting Keycloak ingress to the gateway proxy. Cilium-enforced, so gated on the Cilium gateway driver."
  keycloak/admin:
    enable_when: "`identity.keycloak.admin.password` set, or `dev == true`"
    description: "Points the `Keycloak` CR at the `keycloak-bootstrap-admin` secret via `spec.bootstrapAdmin`, instead of the operator's auto-generated temporary admin. The password is the supplied one, or in dev a known default shared with the SSO admin user. Honored only at initial cluster creation."

dependencies:
  database:
    required_when: "`identity.driver == 'keycloak'`"
    reason: "Keycloak stores realm data in PostgreSQL; the CloudNativePG operator (database addon) must exist before its `Cluster` CR applies."
  gateway-resources:
    required_when: "`gateway.enabled == true`"
    reason: "The shared Gateway must exist before the Keycloak HTTPRoute attaches to it."
