---
# Grants Kyverno's background controller the secret access its generate/clone rules
# need. Kyverno 3.x ships least-privilege controllers; secret clone is opt-in via an
# aggregated ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:replicate-secrets
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
# Replicates the Grafana OIDC client secret from system-identity (the source of truth,
# where the client CR lives) into Grafana's namespace, and keeps it in sync. Triggered
# by the target namespace so it also fills in for already-existing namespaces.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: replicate-grafana-oidc-client
  annotations:
    policies.kyverno.io/title: Replicate Grafana OIDC client secret
    policies.kyverno.io/subject: Secret
spec:
  generateExisting: true
  rules:
    - name: clone-to-observability
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - system-observability
      generate:
        apiVersion: v1
        kind: Secret
        name: grafana-oidc-client
        namespace: system-observability
        synchronize: true
        clone:
          namespace: system-identity
          name: grafana-oidc-client
