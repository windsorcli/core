---
# Routes keycloak-admin.${private_domain} through the internal gateway to keycloak-service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin
  namespace: system-identity
spec:
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: system-gateway
      sectionName: web-https
  hostnames:
    - keycloak-admin.${private_domain}
  rules:
    - backendRefs:
        - kind: Service
          name: keycloak-service
          port: 8080
