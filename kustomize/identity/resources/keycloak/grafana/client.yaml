---
# Grafana OIDC client in the platform realm. v2alpha1 has no clientId field — the
# client_id is the resource name (grafana). This CR does not generate the secret; it
# reads the grafana-oidc-client Secret in this namespace (supplied, or generated by
# keycloak/grafana-secret) which keycloak/grafana-sync replicates to Grafana.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: grafana
  namespace: system-identity
spec:
  keycloakCRName: keycloak
  realm: ${keycloak_realm}
  client:
    displayName: Grafana
    enabled: true
    loginFlows:
      - STANDARD
    redirectUris:
      - ${grafana_redirect_uri}
    webOrigins:
      - ${grafana_url}
    auth:
      method: client-secret
      secretRef:
        name: grafana-oidc-client
        key: clientSecret
