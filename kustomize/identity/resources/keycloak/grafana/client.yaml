---
# Grafana OIDC client in the platform realm. v2alpha1 has no clientId field — the
# client_id is the resource name (grafana). The client secret is not generated by
# this CR; it reads the grafana-oidc-client Secret that secret-job.yaml populates,
# which Grafana reads from its own namespace (see observability grafana/oidc).
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: grafana
  namespace: system-identity
spec:
  keycloakCRName: keycloak
  realm: ${keycloak_realm}
  client:
    displayName: Grafana
    enabled: true
    loginFlows:
      - STANDARD
    redirectUris:
      - ${grafana_redirect_uri}
    webOrigins:
      - ${grafana_url}
    auth:
      method: client-secret
      secretRef:
        name: grafana-oidc-client
        key: clientSecret
