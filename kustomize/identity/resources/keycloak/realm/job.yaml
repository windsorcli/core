---
# Applies the platform realm with keycloak-config-cli. The init container merges
# the fragments in the keycloak-realm ConfigMap into one realm, and the import
# creates, updates and removes what that realm defines. The ConfigMap name hash
# and the env change when a fragment or a value changes, so Flux recreates the Job.
# Fragments read values as $(env:NAME), never as Flux variables: a Flux variable
# in the ConfigMap changes no hash and leaves the Job in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm
  namespace: system-identity
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: merge
          # artifact: type=image name=ghcr.io/windsorcli/utils
          image: ghcr.io/windsorcli/utils:1.37.2-r1@sha256:fe4838c4687df97b318d83138801592e07fcaab9df091a883bb121045958b38e
          command: ["/bin/sh", "-c"]
          # Deep-merges the fragments and appends their lists, in file name order.
          args:
            - yq eval-all '. as $f ireduce ({}; . *+ $f)' /fragments/*.yaml > /realm/realm.yaml
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: fragments
              mountPath: /fragments
            - name: realm
              mountPath: /realm
      containers:
        - name: import
          # artifact: type=image name=ghcr.io/windsorcli/keycloak-config-cli
          image: ghcr.io/windsorcli/keycloak-config-cli:6.5.1-r1@sha256:87a425c0c522e2dda595b1c7d5c9c51966cf20aa86b03e2062e7113284cf9e95
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak-service.system-identity:8080
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: ${keycloak_admin_secret}
                  key: username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${keycloak_admin_secret}
                  key: password
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 600s
            - name: IMPORT_FILES_LOCATIONS
              value: file:/realm/realm.yaml
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75 -Djava.io.tmpdir=/tmp
            - name: KEYCLOAK_REALM
              value: ${keycloak_realm}
            - name: KEYCLOAK_ADMIN_GROUP
              value: ${keycloak_admin_group}
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: realm
              mountPath: /realm
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: fragments
          configMap:
            name: keycloak-realm
        - name: realm
          emptyDir: {}
        - name: tmp
          emptyDir: {}
