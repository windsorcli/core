---
# Platform realm — the security baseline and RBAC anchor core owns. Apps never
# live in master; every consumer targets this realm. One-shot import: the
# operator applies the RealmRepresentation once, later edits happen in-console.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: ${keycloak_realm}
  namespace: system-identity
spec:
  keycloakCRName: keycloak
  realm:
    realm: ${keycloak_realm}
    enabled: true
    # Security baseline every deployment wants, independent of what runs on it.
    sslRequired: external
    bruteForceProtected: true
    passwordPolicy: "length(12) and notUsername and notEmail"
    # Short-lived access tokens; bounded idle and absolute SSO session lifetimes.
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    # RBAC anchor: one place to grant realm administration. Core creates the
    # group; members are deployment-specific and never live in git.
    groups:
      - name: platform-admins
        clientRoles:
          realm-management:
            - realm-admin
    # Group membership in every client's tokens, so consumers (Grafana first) can
    # map platform-admins to their own admin role. Added as a realm default scope.
    clientScopes:
      - name: groups
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              full.path: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
    defaultDefaultClientScopes:
      - groups
