---
# Dev-only SSO users. Passwords satisfy the realm's length(12) policy.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: ${keycloak_realm}
  namespace: system-identity
spec:
  realm:
    users:
      # Admin, in platform-admins. Not named "admin": consumers reserve that
      # username for their own local admin and refuse to onboard it via OIDC.
      - username: dev-admin
        enabled: true
        emailVerified: true
        email: dev-admin@local.test
        firstName: Dev
        lastName: Admin
        credentials:
          - type: password
            value: ${dev_admin_password}
            temporary: false
        groups:
          - /platform-admins
      # Read-only, no group.
      - username: dev-viewer
        enabled: true
        emailVerified: true
        email: dev-viewer@local.test
        firstName: Dev
        lastName: Viewer
        credentials:
          - type: password
            value: viewer-password
            temporary: false
