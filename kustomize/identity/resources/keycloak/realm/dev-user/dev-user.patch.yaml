---
# Dev-only convenience: standard local SSO users, so any consumer (Grafana, MinIO,
# gateway auth, …) can be signed in out of the box on a local cluster. Applied only in
# dev — real users are deployment-specific and never live in git. Passwords satisfy the
# realm's length(12) policy (validated at import), so the security baseline stays intact.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: ${keycloak_realm}
  namespace: system-identity
spec:
  realm:
    users:
      # Admin: in platform-admins, so it maps to each SSO consumer's admin role. Password is
      # shared with the Keycloak console admin (identity_effective.admin_password).
      - username: admin
        enabled: true
        emailVerified: true
        email: admin@local.test
        firstName: Admin
        lastName: User
        credentials:
          - type: password
            value: ${dev_admin_password}
            temporary: false
        groups:
          - /platform-admins
      # Read-only: no group, so it maps to the consumer's viewer/default role — handy
      # for seeing the platform-admins → admin role mapping actually take effect.
      - username: viewer
        enabled: true
        emailVerified: true
        email: viewer@local.test
        firstName: Viewer
        lastName: User
        credentials:
          - type: password
            value: viewer-password
            temporary: false
