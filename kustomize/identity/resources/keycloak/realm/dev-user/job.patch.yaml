# The dev admin user signs in with the same password as the admin the realm Job uses.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm
  namespace: system-identity
spec:
  template:
    spec:
      containers:
        - name: import
          env:
            - name: DEV_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${keycloak_admin_secret}
                  key: password
