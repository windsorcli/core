# Dev-only SSO users. Passwords satisfy the realm's length(12) policy.
users:
  # Admin, in the admin group. Not named "admin": consumers reserve that
  # username for their own local admin and refuse to onboard it via OIDC.
  - username: dev-admin
    enabled: true
    emailVerified: true
    email: dev-admin@local.test
    firstName: Dev
    lastName: Admin
    credentials:
      - type: password
        value: $(env:DEV_ADMIN_PASSWORD)
        temporary: false
    groups:
      - /$(env:KEYCLOAK_ADMIN_GROUP)
  # Read-only, no group.
  - username: dev-viewer
    enabled: true
    emailVerified: true
    email: dev-viewer@local.test
    firstName: Dev
    lastName: Viewer
    credentials:
      - type: password
        value: viewer-password
        temporary: false
