# Grafana public PKCE client.
clients:
  - clientId: grafana
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    attributes:
      pkce.code.challenge.method: S256
    redirectUris:
      - $(env:GRAFANA_REDIRECT_URI)
    webOrigins:
      - $(env:GRAFANA_URL)
    defaultClientScopes:
      - web-origins
      - acr
      - profile
      - roles
      - email
      - basic
    # groups claim for role mapping.
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          full.path: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          claim.name: groups
