# Grafana OIDC client, appended to the realm import's clients array. Secret
# resolved via placeholder.patch.yaml; $${...} escapes Flux's postBuild substitution.
- op: add
  path: /spec/realm/clients/-
  value:
    clientId: grafana
    secret: $${GRAFANA_CLIENT_SECRET}
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    redirectUris:
      - ${grafana_redirect_uri}
    webOrigins:
      - ${grafana_url}
    defaultClientScopes:
      - web-origins
      - acr
      - profile
      - roles
      - email
      - basic
    # groups claim for role mapping.
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          full.path: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          claim.name: groups
