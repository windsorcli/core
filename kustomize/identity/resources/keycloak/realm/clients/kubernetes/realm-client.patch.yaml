# Kubernetes API-server OIDC client, appended to the realm import's clients
# array. Public client (no secret); redirect URIs are kubectl OIDC login
# plugin loopback ports.
- op: add
  path: /spec/realm/clients/-
  value:
    clientId: kubernetes
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    attributes:
      pkce.code.challenge.method: S256
    redirectUris:
      - http://localhost:8000
      - http://localhost:18000
    defaultClientScopes:
      - profile
      - email
      - roles
    optionalClientScopes:
      - offline_access
    # groups claim for role mapping.
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          full.path: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          claim.name: groups
