apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-keycloak
  namespace: system-identity
spec:
  endpointSelector:
    matchLabels:
      app: keycloak
  ingress:
    - fromEntities:
        - ingress
    # The realm client sync Job calls the admin API over HTTP.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: keycloak-realm-clients
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
