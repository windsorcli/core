---
# Routes keycloak.${keycloak_domain} to keycloak-service on the external gateway when a public domain is set, else the internal one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: system-identity
spec:
  parentRefs:
    # web-https only; plain HTTP is 301-redirected by the gateway's https-redirect.
    - kind: Gateway
      name: ${keycloak_gateway_name}
      namespace: system-gateway
      sectionName: web-https
  hostnames:
    - keycloak.${keycloak_domain}
  rules:
    - backendRefs:
        - kind: Service
          name: keycloak-service
          port: 8080
