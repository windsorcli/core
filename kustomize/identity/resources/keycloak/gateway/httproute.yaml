---
# Routes keycloak.${external_domain} to the operator-managed `keycloak-service`
# (HTTP 8080; TLS terminates at the gateway). Login/account UI, not the admin
# console (see ../gateway-admin) — attaches to whichever gateway actually
# exists for it: external when a public domain is set, internal otherwise
# (keycloak_gateway_name mirrors external_domain's own public/private
# fallback). external-dns picks up the hostname from this route automatically.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: system-identity
spec:
  parentRefs:
    # web-https only; plain HTTP is 301-redirected by the gateway's https-redirect.
    - kind: Gateway
      name: ${keycloak_gateway_name}
      namespace: system-gateway
      sectionName: web-https
  hostnames:
    - keycloak.${external_domain}
  rules:
    - backendRefs:
        - kind: Service
          name: keycloak-service
          port: 8080
