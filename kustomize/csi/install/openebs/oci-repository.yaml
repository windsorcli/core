---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: openebs
  namespace: system-csi
spec:
  interval: 10m
  timeout: 5m
  url: ${chart_registry:=oci://ghcr.io/openebs/charts}/openebs
  ref:
    # artifact: type=chart name=openebs repo=oci://ghcr.io/openebs/charts
    tag: 4.6.2
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
