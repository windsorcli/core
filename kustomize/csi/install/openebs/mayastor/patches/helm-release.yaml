---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: system-csi
spec:
  values:
    # The chart's own default StorageClass (openebs-single-replica);
    # redundant with our own single/replicated/local classes.
    storageClass:
      enabled: false
    engines:
      replicated:
        mayastor:
          enabled: true
    mayastor:
      enabled: true
      priorityClassName: windsorcli-platform-critical
      io_engine:
        # va needs IOMMU/VFIO; pa skips it for nested virtualization.
        envcontext: iova-mode=${mayastor_iova_mode:-va}
        nodeSelector:
          openebs.io/engine: mayastor
        resources:
          # Reactor core count scales with worker node size.
          requests:
            cpu: "${mayastor_io_engine_cpu:-2}"
          limits:
            cpu: "${mayastor_io_engine_cpu:-2}"
      operators:
        pool:
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 64Mi
      obs:
        callhome:
          enabled: false
      base:
        # Crash-loops on the develop tag: PodIPError("Unable to get pod ip").
        metrics:
          enabled: false
        initContainers:
          image:
            # artifact: type=image name=docker.io/openebs/alpine-sh
            tag: 4.6.0@sha256:640c187dccdaa305ce96deba8b57387aeab15e3456deff2efc0470e38f355369
      csi:
        image:
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-provisioner
          provisionerTag: v5.3.0@sha256:bb057f866177d5f4139a1527e594499cbe0feeb67b63aaca8679dfdf0a6016f9
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-attacher
          attacherTag: v4.13.0@sha256:d1a26170efed45491074ca4545c81844eee2b9043fb885ac01fb4aed6f8b72d2
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-snapshotter
          snapshotterTag: v8.6.0@sha256:42af0929bcd60a43499825c078a60ff0534e08af8fbeb283aa391be40feb9f3e
          # artifact: type=image name=registry.k8s.io/sig-storage/snapshot-controller
          snapshotControllerTag: v8.6.0@sha256:81e79f205083f105e573ba2ebfe5964ede7f69a154e8627f53ebbbccd3ed9f70
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-node-driver-registrar
          registrarTag: v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-resizer
          resizerTag: v1.14.0@sha256:5e7cbb63fd497fa913caa21fee1a69f727c220c6fa83c5f8bb0995e2ad73a474
      etcd:
        image:
          # artifact: type=image name=docker.io/openebs/etcd
          tag: 3.6.4-debian-12-r0@sha256:c86c06f1ce6a08b6df21eb7a9655b1818778b64c85b5cbb8413ebf7534789730
        volumePermissions:
          image:
            # artifact: type=image name=docker.io/openebs/alpine-bash
            tag: 4.6.0@sha256:366d6c5f18c3ea9d54f5ddb4fd4e305ae40339137ba24818d86fbd0d0b590dbc
        # Reuse our own local class instead of the chart's own hostpath
        # StorageClass. Stays local (not the mayastor CSI classes): etcd is
        # what agent-core needs to come up, so it can't depend on the data
        # plane it's bootstrapping.
        localpvScConfig:
          enabled: false
        persistence:
          storageClass: local
      preUpgradeHook:
        image:
          # artifact: type=image name=docker.io/openebs/kubectl
          tag: 1.32.4@sha256:9524faf8e3cefb47fa28244a5d15f95ec21a73d963273798e593e61f80712333
      eventing:
        enabled: false
  # Nine mayastor images share three tag slots between them, so a values
  # override can't give each its own digest. Patch each container directly.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: openebs-agent-core
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-agent-core
              spec:
                template:
                  spec:
                    containers:
                      - name: agent-core
                        image: docker.io/openebs/mayastor-agent-core:${mayastor_agent_core_tag}
                      - name: agent-ha-cluster
                        image: docker.io/openebs/mayastor-agent-ha-cluster:${mayastor_agent_ha_cluster_tag}
          - target:
              kind: Deployment
              name: openebs-agent-core
            patch: |
              # agent-core has no TLS listener. The chart's https:// scheme
              # here triggers a client TLS handshake the server can't answer.
              - op: replace
                path: /spec/template/spec/containers/1/args/2
                value: --core-grpc=http://openebs-agent-core:50051
          - target:
              kind: DaemonSet
              name: openebs-agent-ha-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: openebs-agent-ha-node
              spec:
                template:
                  spec:
                    containers:
                      - name: agent-ha-node
                        image: docker.io/openebs/mayastor-agent-ha-node:${mayastor_agent_ha_node_tag}
          - target:
              kind: Deployment
              name: openebs-api-rest
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-api-rest
              spec:
                template:
                  spec:
                    containers:
                      - name: api-rest
                        image: docker.io/openebs/mayastor-api-rest:${mayastor_api_rest_tag}
          - target:
              kind: Deployment
              name: openebs-api-rest
            patch: |
              # agent-core has no TLS listener. The chart's https:// scheme
              # here triggers a client TLS handshake the server can't answer.
              - op: replace
                path: /spec/template/spec/containers/0/args/4
                value: --core-grpc=http://openebs-agent-core:50051
          - target:
              kind: Deployment
              name: openebs-csi-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-csi-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-controller
                        image: docker.io/openebs/mayastor-csi-controller:${mayastor_csi_controller_tag}
          - target:
              kind: DaemonSet
              name: openebs-csi-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: openebs-csi-node
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-node
                        image: docker.io/openebs/mayastor-csi-node:${mayastor_csi_node_tag}
          - target:
              kind: DaemonSet
              name: openebs-io-engine
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: openebs-io-engine
              spec:
                template:
                  spec:
                    containers:
                      - name: io-engine
                        image: docker.io/openebs/mayastor-io-engine:${mayastor_io_engine_tag}
          - target:
              kind: Deployment
              name: openebs-operator-diskpool
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: openebs-operator-diskpool
              spec:
                template:
                  spec:
                    containers:
                      - name: operator-diskpool
                        image: docker.io/openebs/mayastor-operator-diskpool:${mayastor_operator_diskpool_tag}
