---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: system-csi
spec:
  interval: 5m
  timeout: 30m
  targetNamespace: system-csi
  install:
    createNamespace: false
    # No uninstall on failed install: this is the CSI storage driver managing live volumes.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: longhorn
      # artifact: type=chart name=longhorn repo=https://charts.longhorn.io
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
  values:
    image:
      longhorn:
        engine:
          registry: docker.io
          repository: longhornio/longhorn-engine
          # artifact: type=image name=docker.io/longhornio/longhorn-engine
          tag: v1.13.0@sha256:b0cc5090889d57705acd69c5106492992e84560170ac3bec4a1cc8dd3fe83ca6
        manager:
          registry: docker.io
          repository: longhornio/longhorn-manager
          # artifact: type=image name=docker.io/longhornio/longhorn-manager
          tag: v1.13.0@sha256:7372f3c59239e9a67c0017b3af32fabdf08c4dcc0631140161da9a47e3b142f0
        ui:
          registry: docker.io
          repository: longhornio/longhorn-ui
          # artifact: type=image name=docker.io/longhornio/longhorn-ui
          tag: v1.13.0@sha256:f22fb0254ae50195c1635ce428dfae26375956b3d7bd39640fae8fe33a236023
        instanceManager:
          registry: docker.io
          repository: longhornio/longhorn-instance-manager
          # artifact: type=image name=docker.io/longhornio/longhorn-instance-manager
          tag: v1.13.0@sha256:fc9e1c15e81988b04c146866ce7010b6df3a70f88302809bf53e19b27d1658a3
        shareManager:
          registry: docker.io
          repository: longhornio/longhorn-share-manager
          # artifact: type=image name=docker.io/longhornio/longhorn-share-manager
          tag: v1.13.0@sha256:53950f78b7af38b8a943c298cd3020622191a4661a13036f69d83c154cc8690d
        backingImageManager:
          registry: docker.io
          repository: longhornio/backing-image-manager
          # artifact: type=image name=docker.io/longhornio/backing-image-manager
          tag: v1.13.0@sha256:49779b9a8ab535f1e86d224f8e2eb5c2c3713b8f1783403fe00612a75de2b3b8
        supportBundleKit:
          registry: docker.io
          repository: longhornio/support-bundle-kit
          # artifact: type=image name=docker.io/longhornio/support-bundle-kit
          tag: v0.0.99@sha256:daab3a78b1eab8ea6e4d46eff6c71a5dc5cde62f0c59593830e898417b07e1bb
      csi:
        attacher:
          registry: docker.io
          repository: longhornio/csi-attacher
          # artifact: type=image name=docker.io/longhornio/csi-attacher
          tag: v4.13.1@sha256:dc5ec19c6fe06ce01d3ac91bc5e8cf097a359973c75034687c94a59e08448838
        provisioner:
          registry: docker.io
          repository: longhornio/csi-provisioner
          # artifact: type=image name=docker.io/longhornio/csi-provisioner
          tag: v5.3.0-20260225@sha256:8486bfd58e93681e0a8fea6b7270958b45034646ce7cb94f91da5e74c72931d0
        nodeDriverRegistrar:
          registry: docker.io
          repository: longhornio/csi-node-driver-registrar
          # artifact: type=image name=docker.io/longhornio/csi-node-driver-registrar
          tag: v2.18.1@sha256:748076a7d3a3a024559a71a8833722d2f95be894e8b150a177809f563c039c29
        resizer:
          registry: docker.io
          repository: longhornio/csi-resizer
          # artifact: type=image name=docker.io/longhornio/csi-resizer
          tag: v2.3.1@sha256:8d857146305065268df0c2b32ed7cb0835978392d004d76cbc459d940631d3c7
        snapshotter:
          registry: docker.io
          repository: longhornio/csi-snapshotter
          # artifact: type=image name=docker.io/longhornio/csi-snapshotter
          tag: v8.7.1@sha256:0a4dda6fde3f18ffb65761fd561026ab4a501945be1c01406a7c298755bf3b1d
        livenessProbe:
          registry: docker.io
          repository: longhornio/livenessprobe
          # artifact: type=image name=docker.io/longhornio/livenessprobe
          tag: v2.20.1@sha256:8a582886ea522df0088c412fefe0a145a3d98d900dd4e256525a2f0870fe193d
    defaultSettings:
      # /var/mnt/longhorn is where Talos UserVolumeConfig auto-mounts the dedicated disk (name: longhorn).
      # Multi-disk configurations require manual Longhorn Node CRD configuration.
      defaultDataPath: /var/mnt/longhorn
      defaultReplicaCount: 1
      storageMinimalAvailablePercentage: 10
      storageReservedPercentageForDefaultDisk: 10
      replicaSoftAntiAffinity: true
      allowVolumeCreationWithDegradedAvailability: true
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      upgradeChecker: false
      allowCollectingLonghornUsageMetrics: false
    longhornUI:
      replicas: 1
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    persistence:
      defaultClass: false
