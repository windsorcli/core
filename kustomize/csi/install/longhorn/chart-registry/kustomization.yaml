apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - oci-repository.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: longhorn
        namespace: system-csi
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: longhorn
        namespace: system-csi
      spec:
        chart: null
        chartRef:
          kind: OCIRepository
          name: longhorn
