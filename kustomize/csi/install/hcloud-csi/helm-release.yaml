---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-csi
  namespace: system-csi
spec:
  interval: 5m
  timeout: 10m
  targetNamespace: system-csi
  install:
    createNamespace: false
    # No uninstall on failed install: this is the CSI storage driver itself.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: hcloud-csi
      # artifact: type=chart name=hcloud-csi repo=https://charts.hetzner.cloud
      version: 2.24.3
      sourceRef:
        kind: HelmRepository
        name: hcloud-csi
  values:
    # Reads the API token from the `hcloud` Secret (key `token`) the platform
    # facet materializes into system-csi. All images pinned tag@digest (renovate).
    controller:
      hcloudToken:
        existingSecret:
          name: hcloud
          key: token
      image:
        csiAttacher:
          name: registry.k8s.io/sig-storage/csi-attacher
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-attacher
          tag: v4.13.1@sha256:b398d0f5a30202b5261412023b24057bc5a493d8b2b5dad25ebf5c89966e1559
        csiResizer:
          name: registry.k8s.io/sig-storage/csi-resizer
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-resizer
          tag: v2.1.0@sha256:589e525cddef6d768e68da1f0bc9ffd0a24bf3add3dd010648eb7189976fde79
        csiProvisioner:
          name: registry.k8s.io/sig-storage/csi-provisioner
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-provisioner
          tag: v6.2.0@sha256:6be9f63ca4caa6c46aae55aa372500949d8a21473d72f819da1f746076b32d4e
        livenessProbe:
          name: registry.k8s.io/sig-storage/livenessprobe
          # artifact: type=image name=registry.k8s.io/sig-storage/livenessprobe
          tag: v2.18.0@sha256:c4cc074199c045dd73ab85f28897e2a32f4d6f38ffdba4f3b13b8007ccbd3570
        hcloudCSIDriver:
          name: docker.io/hetznercloud/hcloud-csi-driver
          # artifact: type=image name=docker.io/hetznercloud/hcloud-csi-driver
          tag: v2.24.3@sha256:3cb24d853d637893512c5a289956c19dd9f5ecefb3ceabb79a42f95fd7614b73
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: "instance.hetzner.cloud/provided-by"
                    operator: In
                    values:
                      - "cloud"
            - weight: 100
              preference:
                matchExpressions:
                  - key: windsorcli.dev/pool-class
                    operator: In
                    values:
                      - system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      priorityClassName: windsorcli-platform-critical
    node:
      image:
        csiNodeDriverRegistrar:
          name: registry.k8s.io/sig-storage/csi-node-driver-registrar
          # artifact: type=image name=registry.k8s.io/sig-storage/csi-node-driver-registrar
          tag: v2.18.1@sha256:f847fb218cdf1d0f0fa79772ca6f46e11d25635eb49c06efb5dccd00b5245ef5
        livenessProbe:
          name: registry.k8s.io/sig-storage/livenessprobe
          # artifact: type=image name=registry.k8s.io/sig-storage/livenessprobe
          tag: v2.18.0@sha256:c4cc074199c045dd73ab85f28897e2a32f4d6f38ffdba4f3b13b8007ccbd3570
        hcloudCSIDriver:
          name: docker.io/hetznercloud/hcloud-csi-driver
          # artifact: type=image name=docker.io/hetznercloud/hcloud-csi-driver
          tag: v2.24.3@sha256:3cb24d853d637893512c5a289956c19dd9f5ecefb3ceabb79a42f95fd7614b73
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      priorityClassName: windsorcli-platform-critical
    # The chart's built-in StorageClass is disabled; storageclass.yaml ships the
    # windsor-canonical `single` default class instead.
    storageClasses: []
