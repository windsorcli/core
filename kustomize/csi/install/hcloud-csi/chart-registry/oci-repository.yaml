---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: hcloud-csi
  namespace: system-csi
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry}/hcloud-csi
  ref:
    # artifact: type=chart name=hcloud-csi repo=https://charts.hetzner.cloud
    tag: 2.24.1
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
