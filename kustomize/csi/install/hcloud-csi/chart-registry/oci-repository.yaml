---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: hcloud-csi
  namespace: system-csi
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry}/hcloud-csi
  ref:
    # renovate: datasource=helm depName=hcloud-csi package=hcloud-csi helmRepo=https://charts.hetzner.cloud
    tag: 2.24.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
