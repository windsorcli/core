apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: system-policy
spec:
  interval: 5m
  timeout: 30m
  install:
    # No uninstall on failed install: kyverno is a globalDependency, so a wedged
    # uninstall blocks every other install behind it.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: kyverno
      # renovate: datasource=helm depName=kyverno package=kyverno helmRepo=https://kyverno.github.io/kyverno/
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
  values:
    global:
      priorityClassName: windsorcli-platform-critical
    # The kube-apiserver enforces the webhook namespaceSelector even when the
    # admission controller is unreachable. Excluding the GitOps and kube-system
    # namespaces keeps Flux able to reconcile a fix if Kyverno is ever down.
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - ${FLUX_SYSTEM_NAMESPACE:-system-gitops}
    crds:
      migration:
        image:
          # renovate: datasource=docker depName=reg.kyverno.io/kyverno/kyverno-cli package=reg.kyverno.io/kyverno/kyverno-cli
          tag: v1.19.1@sha256:ced7b2be0b04250cabfe695f15307f69eb715fe23234816388af4f3812915b2a
    # Disable ANSI color codes in logs
    admissionController:
      # 2 replicas: no leader election on inbound webhook requests, so each
      # adds real parallel serving capacity during startup and node drains.
      replicas: 2
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
      initContainer:
        image:
          # renovate: datasource=docker depName=reg.kyverno.io/kyverno/kyvernopre package=reg.kyverno.io/kyverno/kyvernopre
          tag: v1.19.1@sha256:c25c47461f06f2845a48c319ae86fbbc1730a7b9ed5b701889c9dc1f9ee94b09
      container:
        image:
          # renovate: datasource=docker depName=reg.kyverno.io/kyverno/kyverno package=reg.kyverno.io/kyverno/kyverno
          tag: v1.19.1@sha256:b31d8511ae5fd6010e2a01ea72ebae08eb82fa51d91af14a1d9fe989949b4edb
        extraEnvVars:
        - name: NO_COLOR
          value: "1"
    backgroundController:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
      image:
        # renovate: datasource=docker depName=reg.kyverno.io/kyverno/background-controller package=reg.kyverno.io/kyverno/background-controller
        tag: v1.19.1@sha256:8f1e9143373a27578cafc2d28d2c66ba0926c63b4c77e63de8d2fdd4a122859f
      extraEnvVars:
      - name: NO_COLOR
        value: "1"
    # cleanup-controller executes CleanupPolicy / ClusterCleanupPolicy CRDs
    # on a cron. Windsor defines zero CleanupPolicy resources out of the
    # box, so this controller sits idle — disabled by default; opt in with
    # policies.cleanup=enabled, which layers in the kyverno/cleanup
    # component.
    cleanupController:
      enabled: false
      image:
        # renovate: datasource=docker depName=reg.kyverno.io/kyverno/cleanup-controller package=reg.kyverno.io/kyverno/cleanup-controller
        tag: v1.19.1@sha256:67a48e62a8d8f8120c86914ff822b90017c54054c7b64ef8a1555645e9d9761e
      extraEnvVars:
      - name: NO_COLOR
        value: "1"
    # reports-controller runs background scans and emits PolicyReport /
    # ClusterPolicyReport resources for audit/observability. Admission-time
    # enforcement is unaffected when this is off. Disabled by default; opt
    # in with policies.reporting=enabled, which layers in the
    # kyverno/reports component.
    reportsController:
      enabled: false
      image:
        # renovate: datasource=docker depName=reg.kyverno.io/kyverno/reports-controller package=reg.kyverno.io/kyverno/reports-controller
        tag: v1.19.0@sha256:02013e2288600f514b71f814699441007fcce7aff188f1eb9e8c5da877c6e911
      extraEnvVars:
      - name: NO_COLOR
        value: "1"
