apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: system-policy
spec:
  interval: 5m
  timeout: 30m
  install:
    # Retry on failure. A kyverno uninstall blocks every install behind it.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: kyverno
      # renovate: datasource=helm depName=kyverno package=kyverno helmRepo=https://kyverno.github.io/kyverno/
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
  values:
    global:
      priorityClassName: windsorcli-platform-critical
    # Exclude kube-system and the GitOps namespace. Flux can then reconcile a
    # fix while kyverno is down.
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - ${FLUX_SYSTEM_NAMESPACE:-system-gitops}
    crds:
      migration:
        image:
          # renovate: datasource=docker depName=reg.kyverno.io/kyverno/kyverno-cli package=reg.kyverno.io/kyverno/kyverno-cli
          tag: v1.19.1@sha256:ced7b2be0b04250cabfe695f15307f69eb715fe23234816388af4f3812915b2a
    admissionController:
      # Watch CRDs to invalidate the discovery cache. A new CRD otherwise stays
      # invisible to policy matching until the 15m resync.
      crdWatcher: true
      replicas: 2
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
      initContainer:
        image:
          # renovate: datasource=docker depName=reg.kyverno.io/kyverno/kyvernopre package=reg.kyverno.io/kyverno/kyvernopre
          tag: v1.19.1@sha256:c25c47461f06f2845a48c319ae86fbbc1730a7b9ed5b701889c9dc1f9ee94b09
      container:
        image:
          # renovate: datasource=docker depName=reg.kyverno.io/kyverno/kyverno package=reg.kyverno.io/kyverno/kyverno
          tag: v1.19.1@sha256:b31d8511ae5fd6010e2a01ea72ebae08eb82fa51d91af14a1d9fe989949b4edb
        extraEnvVars:
        - name: NO_COLOR
          value: "1"
    backgroundController:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
      image:
        # renovate: datasource=docker depName=reg.kyverno.io/kyverno/background-controller package=reg.kyverno.io/kyverno/background-controller
        tag: v1.19.1@sha256:8f1e9143373a27578cafc2d28d2c66ba0926c63b4c77e63de8d2fdd4a122859f
      extraEnvVars:
      - name: NO_COLOR
        value: "1"
    # Off by default. Opt in with policies.cleanup=enabled.
    cleanupController:
      enabled: false
      image:
        # renovate: datasource=docker depName=reg.kyverno.io/kyverno/cleanup-controller package=reg.kyverno.io/kyverno/cleanup-controller
        tag: v1.19.1@sha256:67a48e62a8d8f8120c86914ff822b90017c54054c7b64ef8a1555645e9d9761e
      extraEnvVars:
      - name: NO_COLOR
        value: "1"
    # Off by default. Opt in with policies.reporting=enabled.
    reportsController:
      enabled: false
      image:
        # renovate: datasource=docker depName=reg.kyverno.io/kyverno/reports-controller package=reg.kyverno.io/kyverno/reports-controller
        tag: v1.19.1@sha256:c0eee97b9b44a0dd35805d56b358fa52548480f79d4944602b9609538eccd64c
      extraEnvVars:
      - name: NO_COLOR
        value: "1"
