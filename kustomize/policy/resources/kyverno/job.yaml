# Retries a dry-run admission request until Kyverno's webhook actually answers.
apiVersion: batch/v1
kind: Job
metadata:
  name: kyverno-webhook-probe
  namespace: system-policy
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: kyverno-webhook-probe
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: probe
        # artifact: type=image name=ghcr.io/windsorcli/utils
        image: ghcr.io/windsorcli/utils:1.37.2-r1@sha256:fe4838c4687df97b318d83138801592e07fcaab9df091a883bb121045958b38e
        command: ["/bin/sh", "-c"]
        args:
        - |
          i=1
          while [ "$i" -le 48 ]; do
            OUT=$(kubectl run kyverno-webhook-probe --image=does-not-matter --restart=Never -n system-policy --dry-run=server 2>&1)
            STATUS=$?
            if [ "$STATUS" -eq 0 ] || echo "$OUT" | grep -q "denied the request"; then
              echo "Kyverno's admission webhook evaluated the request (allowed or denied)."
              exit 0
            fi
            echo "Attempt $i/48: webhook not yet reachable: $OUT"
            sleep 5
            i=$((i + 1))
          done
          echo "Kyverno's admission webhook never became reachable within the timeout."
          exit 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
