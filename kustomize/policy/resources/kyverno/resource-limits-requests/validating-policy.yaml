apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: resource-limits-requests
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: managed-namespace
      expression: >-
        object.metadata.namespace.startsWith('system-') ||
        namespaceObject.metadata.?labels[?'policy.windsorcli.dev/managed'].orValue('') == 'true'
    - name: not-excluded
      expression: >-
        namespaceObject.metadata.?labels[?'policy.windsorcli.dev/managed'].orValue('') != 'false' &&
        object.metadata.namespace != 'kube-system'
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.?resources.?requests[?'memory'].hasValue() &&
          c.?resources.?requests[?'cpu'].hasValue() &&
          c.?resources.?limits[?'memory'].hasValue())
      message: "Resource limits and requests must be set on all containers."
