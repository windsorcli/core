---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Require Image Digest
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Ensures that all container images use SHA256 digests to promote immutability
      and security. Images must be in the format: repository:tag@sha256:digest or
      repository@sha256:digest.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: managed-namespace
      expression: >-
        object.metadata.namespace.startsWith('system-') ||
        namespaceObject.metadata.?labels[?'policy.windsorcli.dev/managed'].orValue('') == 'true'
    - name: not-excluded
      # Flux controllers are installed by the flux-operator, which resolves
      # images by distribution version rather than digest.
      expression: >-
        namespaceObject.metadata.?labels[?'policy.windsorcli.dev/managed'].orValue('') != 'false' &&
        namespaceObject.metadata.?labels[?'app.kubernetes.io/part-of'].orValue('') != 'flux'
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains('@sha256:')) &&
        object.spec.?initContainers.orValue([]).all(c, c.image.contains('@sha256:')) &&
        object.spec.?ephemeralContainers.orValue([]).all(c, c.image.contains('@sha256:'))
      message: "All container images must include a SHA256 digest (e.g., image:tag@sha256:digest or image@sha256:digest)."
