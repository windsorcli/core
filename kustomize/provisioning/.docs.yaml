# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

components:
  crossplane:
    enable_when: "`database.postgres.driver == 'rds'`"
    description: "Helm release of Crossplane in `system-provisioning`."
  crossplane/aws-rds:
    enable_when: "`database.postgres.driver == 'rds'`"
    description: "In `install:`: digest-pinned `Provider` CRs for `provider-aws-rds` (`skipDependencyResolution: true`) and its `provider-family-aws` dependency, plus a `DeploymentRuntimeConfig` that fixes the provider pod's ServiceAccount name to `provider-aws-rds` so the `provisioning/crossplane-iam` Terraform module's Pod Identity association can target it. In `resources:`, once the Provider reports Healthy/Installed: the `default` `ProviderConfig` (credentials source `PodIdentity`, so a consuming `Instance` CR needs no `providerConfigRef`), a Kyverno `ClusterPolicy` that force-sets the `windsorcli.dev/cluster` tag on every `Instance`, the `rds-secret-reader` ServiceAccount `app-role` (below) and the monitoring `ClusterPolicy`s use to provision scoped credentials from the RDS-managed master password, a static `Role`/`RoleBinding` granting it access to every monitor-credentials `Secret` in `system-provisioning`, and two `generate` `ClusterPolicy`s that automatically provision `pg_monitor` monitoring (the role, plus the per-Instance `ClusterRole`/`ClusterRoleBinding` letting `rds-secret-reader` read that Instance's status) for every `Instance` in the cluster — no chart opt-in, matching CNPG's own free monitoring. A `ClusterRole` pair aggregates into Kyverno's `background-controller`/`admission-controller`, the RBAC those `generate` rules need. The `postgres_exporter` Deployment/Service/PodMonitor itself is the separate `monitoring-exporter` component below."
  crossplane/aws-rds/app-role:
    enable_when: "a chart opts in — see `kustomize/demo/resources/database/rds` for the worked example"
    description: "Reusable application-credential provisioning for any `provider-aws-rds` `Instance` — a chart supplies its grants, not its own CronJob. A `ClusterRole`/`Role` opting `rds-secret-reader` into the named `Instance` and an app `Secret`, and a `CronJob` that idempotently creates `<pg_database_name>_app` and runs the chart's `pg_grant_sql` against it, publishing `<pg_instance_name>-app-credentials` — never the master credential itself. Requires `pg_instance_name`, `pg_database_name`, `pg_target_namespace`, and `pg_grant_sql` (one line — Flux substitution is literal text, so a multi-line value would corrupt the CronJob's YAML) substitutions from the consuming facet."
  crossplane/aws-rds/monitoring-exporter:
    enable_when: "`database.postgres.driver == 'rds'` AND `telemetry.metrics.enabled` (default true)"
    description: "A `generate` `ClusterPolicy` that automatically provisions a `postgres_exporter` Deployment/Service/PodMonitor in `system-provisioning` for every `Instance` in the cluster, scraping the `pg_monitor` role `crossplane/aws-rds`'s own generate policies provision. Split from `crossplane/aws-rds` because `PodMonitor` (`monitoring.coreos.com/v1`) only exists once the metrics pipeline vendors prometheus-operator's CRDs."
