# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

components:
  crossplane:
    enable_when: "`database.postgres.driver == 'rds'`"
    description: "Helm release of Crossplane in `system-provisioning`."
  crossplane/aws-rds:
    enable_when: "`database.postgres.driver == 'rds'`"
    description: "In `install:`: digest-pinned `Provider` CRs for `provider-aws-rds` (`skipDependencyResolution: true`) and its `provider-family-aws` dependency, plus a `DeploymentRuntimeConfig` that fixes the provider pod's ServiceAccount name to `provider-aws-rds` so the `provisioning/crossplane-iam` Terraform module's Pod Identity association can target it. In `resources:`, once the Provider reports Healthy/Installed: the `default` `ProviderConfig` (credentials source `PodIdentity`, so a consuming `Instance` CR needs no `providerConfigRef`), a Kyverno `ClusterPolicy` that force-sets the `windsorcli.dev/cluster` tag on every `Instance`, and the `rds-secret-reader` ServiceAccount a consumer's bootstrap job uses (via its own namespace's opt-in RoleBinding) to provision a scoped application credential from the RDS-managed master password."
