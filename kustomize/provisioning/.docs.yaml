# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

components:
  crossplane:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "Helm release of Crossplane in `system-provisioning`. Generic engine mechanics only — a driver's own database-specific consumption of it (ProviderConfig, monitoring, app-role) lives in `kustomize/database` instead, in `system-database`."
  crossplane/provider-sql:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "Digest-pinned `Provider` CR for `crossplane-contrib/provider-sql` plus a `DeploymentRuntimeConfig` setting its resource requests/limits. Installed once per context alongside whichever cloud provider is active — its `Role`/`Database`/`Grant` CRDs speak the Postgres wire protocol, not a cloud API, so the same install serves every driver."
  crossplane/function-python:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "Digest-pinned `Function` CR for `crossplane-contrib/function-python` plus a `DeploymentRuntimeConfig` setting its resource requests/limits. Runs every `WatchOperation` in this domain, which requires Crossplane's `--enable-operations` alpha flag, set on this component's own `helm-release.yaml`."
  crossplane/instance-connection:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "The cluster-scoped `InstanceConnection` XRD and its one shared Composition. Each driver's `WatchOperation` only ensures an instance named after its own; the Composition reads the driver-specific fields on the XR's own spec to build the `<instance-name>-connection` Secret, `ClusterProviderConfig`, and the `ClusterUsage` blocking the instance's deletion while they exist. Composing none of the three once the instance's `deletionTimestamp` is set prunes them — a `WatchOperation` cannot delete what it creates, so this step has to be a real Composition."
  crossplane/app-role:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "The `AppRole` XRD and its Composition — the CNPG app-user equivalent. A chart creates one namespaced `AppRole` naming an instance and a database, and gets a login `Role` owning that database plus a `<name>-credentials` Secret in its own namespace. Deliberately narrow: a role needing role membership, a privilege subset, or `CREATEDB` authors provider-sql's own `Role`/`Grant` against the instance's `ClusterProviderConfig` instead."
  crossplane/postgres-monitor:
    enable_when: "`telemetry.metrics.enabled` (default true)"
    description: "A `WatchOperation` watching every `ClusterProviderConfig` cluster-wide — driver-agnostic, since by the time one exists every cloud difference is already resolved. Creates an `<instance-name>-monitor` `Role` and its `pg_monitor` `Grant` in `system-database`, then once that `Role` is `Ready`, a `postgres_exporter` Deployment/Service/PodMonitor reading its connection Secret."
  crossplane/aws-rds:
    enable_when: "`database.postgres.cloud.enabled == true` AND `database.postgres.cloud.driver == 'rds'`"
    description: "Digest-pinned `Provider` CRs for `provider-aws-rds` (`skipDependencyResolution: true`) and its `provider-family-aws` dependency, plus a `DeploymentRuntimeConfig` that fixes the provider pod's ServiceAccount name to `provider-aws-rds` so the `provisioning/crossplane-identity/aws` Terraform module's Pod Identity association can target it. Also carries a `WatchOperation` watching every `rds.aws.upbound.io` `Instance` cluster-wide and ensuring its `crossplane/instance-connection` XR. A chart's own `Role`/`Grant` reference the resulting `ClusterProviderConfig` by the instance's name."
  crossplane/azure-postgres:
    enable_when: "`database.postgres.cloud.enabled == true` AND `database.postgres.cloud.driver == 'azuredb'`"
    description: "Azure twin of `crossplane/aws-rds`. Digest-pinned `Provider` CRs for `provider-azure-dbforpostgresql` (`skipDependencyResolution: true`) and its `provider-family-azure` dependency, plus a `DeploymentRuntimeConfig` that fixes the provider pod's ServiceAccount name to `provider-azure-dbforpostgresql` and wires AKS Workload Identity (client-id/tenant-id annotations, the `azure.workload.identity/use` label on both the ServiceAccount and the pod) so the `provisioning/crossplane-identity/azure` Terraform module's federated credential can target it. Also carries the `WatchOperation` ensuring `crossplane/instance-connection` for `FlexibleServer`, same as `crossplane/aws-rds`."
  crossplane/gcp-cloudsql:
    enable_when: "`database.postgres.cloud.enabled == true` AND `database.postgres.cloud.driver == 'cloudsql'`"
    description: "GCP twin of `crossplane/aws-rds`. Digest-pinned `Provider` CRs for `provider-gcp-sql` (`skipDependencyResolution: true`) and its `provider-family-gcp` dependency, plus a `DeploymentRuntimeConfig` that wires GKE Workload Identity (the `iam.gke.io/gcp-service-account` annotation on the provider ServiceAccount) so the `provisioning/crossplane-identity/gcp` Terraform module's Workload Identity binding can target it. Its `WatchOperation` does one thing more than `crossplane/aws-rds`'s: `provider-gcp-sql` has no auto-generate-password field, so it first ensures `<instance-name>-admin-credentials` and an admin `User` CR before ensuring its `crossplane/instance-connection` XR."
