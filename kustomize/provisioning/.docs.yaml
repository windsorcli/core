# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

components:
  crossplane:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "Helm release of Crossplane in `system-provisioning`. Generic engine mechanics only — a driver's own database-specific consumption of it (ProviderConfig, monitoring, app-role) lives in `kustomize/database` instead, in `system-database`."
  crossplane/provider-sql:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "Digest-pinned `Provider` CR for `crossplane-contrib/provider-sql` plus a `DeploymentRuntimeConfig` setting its resource requests/limits. Installed once per context alongside whichever cloud provider is active — its `Role`/`Database`/`Grant` CRDs speak the Postgres wire protocol, not a cloud API, so the same install serves every driver."
  crossplane/function-python:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "Digest-pinned `Function` CR for `crossplane-contrib/function-python` plus a `DeploymentRuntimeConfig` setting its resource requests/limits. Runs every `WatchOperation` in this domain, which requires Crossplane's `--enable-operations` alpha flag, set on this component's own `helm-release.yaml`."
  crossplane/app-role:
    enable_when: "`database.postgres.cloud.enabled == true`"
    description: "The `AppRole` XRD and its Composition — the CNPG app-user equivalent. A chart creates one namespaced `AppRole` naming an instance and a database, and gets a login `Role` owning that database plus a `<name>-credentials` Secret in its own namespace. Deliberately narrow: a role needing role membership, a privilege subset, or `CREATEDB` authors provider-sql's own `Role`/`Grant` against the instance's `ClusterProviderConfig` instead."
  crossplane/gcp-admin-password:
    enable_when: "`database.postgres.cloud.enabled == true` AND `database.postgres.cloud.driver == 'cloudsql'`"
    description: "A `WatchOperation` watching every `sql.gcp.upbound.io` `DatabaseInstance` cluster-wide, unfiltered by name. Ensures `<instance-name>-admin-credentials` exists in `system-database` and an admin `User` CR applies it, generating each independently the first time it's missing — `provider-gcp-sql` has no auto-generate-password field of its own, unlike RDS/Azure."
  crossplane/postgres-monitor:
    enable_when: "`telemetry.metrics.enabled` (default true)"
    description: "A `WatchOperation` watching every `ClusterProviderConfig` cluster-wide — driver-agnostic, since by the time one exists every cloud difference is already resolved. Creates an `<instance-name>-monitor` `Role` in `system-database` granted `pg_monitor`, for `crossplane/postgres-exporter` to pick up."
  crossplane/postgres-exporter:
    enable_when: "`telemetry.metrics.enabled` (default true)"
    description: "A `WatchOperation` watching every provider-sql `Role` cluster-wide. For any labelled as a monitor role, applies a `postgres_exporter` Deployment/Service/PodMonitor in the Role's own namespace, reading the connection Secret the Role writes."
  crossplane/aws-rds:
    enable_when: "`database.postgres.cloud.enabled == true` AND `database.postgres.cloud.driver == 'rds'`"
    description: "Digest-pinned `Provider` CRs for `provider-aws-rds` (`skipDependencyResolution: true`) and its `provider-family-aws` dependency, plus a `DeploymentRuntimeConfig` that fixes the provider pod's ServiceAccount name to `provider-aws-rds` so the `provisioning/crossplane-identity/aws` Terraform module's Pod Identity association can target it. Also carries a `WatchOperation` watching every `rds.aws.upbound.io` `Instance` cluster-wide: ensures one `ClusterProviderConfig` named after the instance, the `<instance-name>-connection` Secret in `system-database` it reads, and a `ClusterUsage` blocking the instance's deletion while that config still exists. A chart's own `Role`/`Grant` reference the `ClusterProviderConfig` by the instance's name."
  crossplane/azure-postgres:
    enable_when: "`database.postgres.cloud.enabled == true` AND `database.postgres.cloud.driver == 'azuredb'`"
    description: "Azure twin of `crossplane/aws-rds`. Digest-pinned `Provider` CRs for `provider-azure-dbforpostgresql` (`skipDependencyResolution: true`) and its `provider-family-azure` dependency, plus a `DeploymentRuntimeConfig` that fixes the provider pod's ServiceAccount name to `provider-azure-dbforpostgresql` and wires AKS Workload Identity (client-id/tenant-id annotations, the `azure.workload.identity/use` label on both the ServiceAccount and the pod) so the `provisioning/crossplane-identity/azure` Terraform module's federated credential can target it. Also carries the `WatchOperation` ensuring `FlexibleServer`'s `ClusterProviderConfig`, connection Secret, and `ClusterUsage`, same as `crossplane/aws-rds`."
  crossplane/gcp-cloudsql:
    enable_when: "`database.postgres.cloud.enabled == true` AND `database.postgres.cloud.driver == 'cloudsql'`"
    description: "GCP twin of `crossplane/aws-rds`. Digest-pinned `Provider` CRs for `provider-gcp-sql` (`skipDependencyResolution: true`) and its `provider-family-gcp` dependency, plus a `DeploymentRuntimeConfig` that wires GKE Workload Identity (the `iam.gke.io/gcp-service-account` annotation on the provider ServiceAccount) so the `provisioning/crossplane-identity/gcp` Terraform module's Workload Identity binding can target it. Also carries the `WatchOperation` ensuring `DatabaseInstance`'s `ClusterProviderConfig`, connection Secret, and `ClusterUsage`, same as `crossplane/aws-rds`."
