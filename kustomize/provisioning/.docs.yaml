# Descriptor consumed by scripts/kustomize-docs.sh to populate the
# BEGIN_KUSTOMIZE_DOCS / END_KUSTOMIZE_DOCS region of README.md.
# Edit this file (not the README tables) when substitutions, components,
# or dependencies change.

components:
  crossplane:
    enable_when: "`database.postgres.driver == 'rds'`"
    description: "Helm release of Crossplane in `system-provisioning`."
  crossplane/aws-rds:
    enable_when: "`database.postgres.driver == 'rds'`"
    description: "In `install:`: digest-pinned `Provider` CRs for `provider-aws-rds` (`skipDependencyResolution: true`) and its `provider-family-aws` dependency, plus a `DeploymentRuntimeConfig` that fixes the provider pod's ServiceAccount name to `provider-aws-rds` so the `provisioning/crossplane-iam` Terraform module's Pod Identity association can target it. In `resources:`, once the Provider reports Healthy/Installed: the `default` `ProviderConfig` (credentials source `PodIdentity`, so a consuming `Instance` CR needs no `providerConfigRef`), a Kyverno `ClusterPolicy` that force-sets the `windsorcli.dev/cluster` tag on every `Instance`, and the `rds-secret-reader` ServiceAccount the `app-role`/`postgres-exporter` components below use (via their own namespace's opt-in RoleBinding) to provision scoped credentials from the RDS-managed master password."
  crossplane/aws-rds/app-role:
    enable_when: "a chart opts in — see `kustomize/demo/resources/database/rds` for the worked example"
    description: "Reusable application-credential provisioning for any `provider-aws-rds` `Instance` — a chart supplies its grants, not its own CronJob. A `ClusterRole`/`Role` opting `rds-secret-reader` into the named `Instance` and an app `Secret`, and a `CronJob` that idempotently creates `<pg_database_name>_app` and runs the chart's `pg_grant_sql` against it, publishing `<pg_instance_name>-app-credentials` — never the master credential itself. Requires `pg_instance_name`, `pg_database_name`, `pg_target_namespace`, and `pg_grant_sql` (one line — Flux substitution is literal text, so a multi-line value would corrupt the CronJob's YAML) substitutions from the consuming facet. See ADR-0009 §7."
  crossplane/aws-rds/postgres-exporter:
    enable_when: "a chart opts in — see `kustomize/demo/resources/database/rds` for the worked example"
    description: "Reusable `postgres_exporter` monitoring for any `provider-aws-rds` `Instance` — not authored per-chart. A `ClusterRole`/`Role` opting `rds-secret-reader` into the named `Instance` and a monitor `Secret`, a `CronJob` that provisions `<pg_database_name>_monitor` (`pg_monitor`) and publishes its DSN, and a `Deployment`/`PodMonitor` scraping it. Requires `pg_instance_name`, `pg_database_name`, and `pg_target_namespace` substitutions from the consuming facet. See ADR-0009 §8."
