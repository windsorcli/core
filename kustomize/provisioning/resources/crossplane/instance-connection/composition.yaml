---
# Builds the connection Secret, ClusterProviderConfig, and the ClusterUsage
# blocking the instance's deletion while they exist. Composing none of the
# three once the instance's deletionTimestamp is set prunes them, which a
# WatchOperation cannot do.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: instance-connection
spec:
  compositeTypeRef:
    apiVersion: database.windsorcli.dev/v1alpha1
    kind: InstanceConnection
  mode: Pipeline
  pipeline:
    - step: compose-instance-connection
      functionRef:
        name: function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          import base64

          from crossplane.function import request, resource, response
          from crossplane.function.proto.v1 import run_function_pb2 as fnv1

          ADMIN_NAMESPACE = "system-database"
          PROVIDER_SQL_API = "postgresql.sql.m.crossplane.io/v1alpha1"


          def admin_secret_name(instance_name):
              return f"{instance_name}-admin-credentials"


          def admin_user_name(instance_name):
              return f"{instance_name}-admin"


          def connection_secret_name(instance_name):
              return f"{instance_name}-connection"


          def build_connection_secret(instance_name, endpoint, username, password):
              return {
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "metadata": {"name": connection_secret_name(instance_name), "namespace": ADMIN_NAMESPACE},
                  "type": "Opaque",
                  "stringData": {
                      "endpoint": endpoint,
                      "port": "5432",
                      "username": username,
                      "password": password,
                  },
              }


          def build_cluster_provider_config(instance_name):
              # Named after the instance: what a consumer's Role references.
              return {
                  "apiVersion": PROVIDER_SQL_API,
                  "kind": "ClusterProviderConfig",
                  "metadata": {"name": instance_name},
                  "spec": {
                      "sslMode": "require",
                      "credentials": {
                          "source": "PostgreSQLConnectionSecret",
                          "connectionSecretRef": {
                              "name": connection_secret_name(instance_name),
                              "namespace": ADMIN_NAMESPACE,
                          },
                      },
                  },
              }


          def build_cluster_usage(instance_name, instance_api_version, instance_kind):
              return {
                  "apiVersion": "protection.crossplane.io/v1beta1",
                  "kind": "ClusterUsage",
                  "metadata": {"name": f"{instance_name}-provider-config"},
                  "spec": {
                      "of": {
                          "apiVersion": instance_api_version,
                          "kind": instance_kind,
                          "resourceRef": {"name": instance_name},
                      },
                      "by": {
                          "apiVersion": PROVIDER_SQL_API,
                          "kind": "ClusterProviderConfig",
                          "resourceRef": {"name": instance_name},
                      },
                      "replayDeletion": True,
                  },
              }


          def resolve_admin_username(instance, secret, admin_username_field, instance_name):
              if admin_username_field:
                  return instance.get("spec", {}).get("forProvider", {}).get(admin_username_field, "")
              username_b64 = secret.get("data", {}).get("username")
              return base64.b64decode(username_b64).decode() if username_b64 else admin_user_name(instance_name)


          def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
              xr = resource.struct_to_dict(req.observed.composite.resource)
              spec = xr["spec"]
              instance_name = spec["instanceName"]
              instance_api_version = spec["instanceApiVersion"]
              instance_kind = spec["instanceKind"]

              response.require_resources(
                  rsp, name="instance", api_version=instance_api_version, kind=instance_kind,
                  match_name=instance_name,
              )
              instance = request.get_required_resource(req, "instance")
              if instance is None or instance.get("metadata", {}).get("deletionTimestamp"):
                  return

              secret_name = admin_secret_name(instance_name)
              response.require_resources(
                  rsp, name="admin-secret", api_version="v1", kind="Secret",
                  match_name=secret_name, namespace=ADMIN_NAMESPACE,
              )
              secret = request.get_required_resource(req, "admin-secret")
              if secret is None:
                  return

              password_b64 = secret.get("data", {}).get("password")
              if not password_b64:
                  return

              endpoint = instance.get("status", {}).get("atProvider", {}).get(spec["endpointField"], "")
              if not endpoint:
                  return

              rsp.desired.resources["connection-secret"].resource.update(
                  build_connection_secret(
                      instance_name, endpoint,
                      resolve_admin_username(instance, secret, spec.get("adminUsernameField", ""), instance_name),
                      base64.b64decode(password_b64).decode(),
                  )
              )
              rsp.desired.resources["cluster-provider-config"].resource.update(
                  build_cluster_provider_config(instance_name)
              )
              rsp.desired.resources["cluster-usage"].resource.update(
                  build_cluster_usage(instance_name, instance_api_version, instance_kind)
              )
