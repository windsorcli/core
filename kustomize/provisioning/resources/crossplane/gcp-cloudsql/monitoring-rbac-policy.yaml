---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cloudsql-monitor-rbac
  annotations:
    policies.kyverno.io/title: Cloud SQL monitor RBAC
    policies.kyverno.io/category: GCP
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: DatabaseInstance
    policies.kyverno.io/description: >-
      Generates the ClusterRole/ClusterRoleBinding cloudsql-bootstrap needs
      to read a new DatabaseInstance's status, scoped by resourceNames to
      that one instance. Runs in the background too, so a DatabaseInstance
      that already existed before this policy was installed still gets
      RBAC. Secret access is a static Role (bootstrap-secret-rbac.yaml),
      not generated here — every admin/monitor Secret lands in
      system-provisioning regardless of instance.
spec:
  background: true
  rules:
    - name: generate-monitor-clusterrole
      match:
        any:
          - resources:
              kinds:
                - sql.gcp.upbound.io/v1beta1/DatabaseInstance
      generate:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        name: "{{request.object.metadata.name}}-monitor-reader"
        synchronize: true
        data:
          rules:
            - apiGroups:
                - sql.gcp.upbound.io
              resources:
                - databaseinstances
              resourceNames:
                - "{{request.object.metadata.name}}"
              verbs:
                - get
    - name: generate-monitor-clusterrolebinding
      match:
        any:
          - resources:
              kinds:
                - sql.gcp.upbound.io/v1beta1/DatabaseInstance
      generate:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "{{request.object.metadata.name}}-monitor-reader"
        synchronize: true
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{request.object.metadata.name}}-monitor-reader"
          subjects:
            - kind: ServiceAccount
              name: cloudsql-bootstrap
              namespace: system-provisioning
