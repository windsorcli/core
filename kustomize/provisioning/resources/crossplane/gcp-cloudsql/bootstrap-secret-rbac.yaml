---
# Every admin-credentials and monitor-credentials Secret lands in this one
# namespace regardless of instance, so this stays static instead of
# Kyverno-generated per DatabaseInstance, unlike the per-instance status
# read in monitoring-rbac-policy.yaml. app-role's own Secret lands in the
# chart's target namespace instead — granted per-instance in
# app-role/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudsql-secret-reader
  namespace: system-provisioning
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudsql-secret-reader
  namespace: system-provisioning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudsql-secret-reader
subjects:
  - kind: ServiceAccount
    name: cloudsql-bootstrap
    namespace: system-provisioning
