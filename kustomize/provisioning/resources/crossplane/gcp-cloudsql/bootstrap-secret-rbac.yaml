---
# Grants access to every admin/monitor-credentials Secret in this
# namespace, static rather than per-instance.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudsql-secret-reader
  namespace: system-provisioning
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudsql-secret-reader
  namespace: system-provisioning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudsql-secret-reader
subjects:
  - kind: ServiceAccount
    name: cloudsql-bootstrap
    namespace: system-provisioning
