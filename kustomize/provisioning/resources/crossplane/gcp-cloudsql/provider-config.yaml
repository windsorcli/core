---
# Named "default" so a consuming DatabaseInstance CR needs no
# providerConfigRef at all — that's the field's own default. Credentials
# resolve via the pod's GKE Workload Identity binding; no static keys.
apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  projectID: ${crossplane_gcp_project_id}
  credentials:
    source: InjectedIdentity
