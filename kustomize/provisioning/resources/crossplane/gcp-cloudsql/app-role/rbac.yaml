---
# DatabaseInstance is cluster-scoped, so reading it needs a ClusterRole.
# Named for the one DatabaseInstance it grants access to.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${pg_instance_name}-app-reader
rules:
  - apiGroups:
      - sql.gcp.upbound.io
    resources:
      - databaseinstances
    resourceNames:
      - ${pg_instance_name}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${pg_instance_name}-app-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${pg_instance_name}-app-reader
subjects:
  - kind: ServiceAccount
    name: cloudsql-bootstrap
    namespace: system-provisioning
---
# Opts the target namespace into the shared cloudsql-bootstrap identity,
# scoped to the one Secret this provisions. create can't be scoped by
# resourceNames (the object doesn't exist yet), so it stays kind-level.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${pg_instance_name}-app-reader
  namespace: ${pg_target_namespace}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - ${pg_instance_name}-app-credentials
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${pg_instance_name}-app-reader
  namespace: ${pg_target_namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${pg_instance_name}-app-reader
subjects:
  - kind: ServiceAccount
    name: cloudsql-bootstrap
    namespace: system-provisioning
