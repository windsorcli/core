---
# Identity the app-role and monitoring bootstrap CronJobs run as. Reads the
# admin credential Crossplane already wrote to a Kubernetes Secret, and a
# FlexibleServer's own status — no Azure identity of its own, unlike AWS's
# rds-secret-reader, since nothing here calls an Azure API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flexibleserver-bootstrap
  namespace: system-provisioning
