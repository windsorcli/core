---
# FlexibleServer is cluster-scoped (dbforpostgresql.azure.upbound.io has no
# namespaced kinds), so reading it needs a ClusterRole even though this
# only ever touches the one named FlexibleServer. Named for it to keep the
# grant obviously scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${pg_instance_name}-app-reader
rules:
  - apiGroups:
      - dbforpostgresql.azure.upbound.io
    resources:
      - flexibleservers
    resourceNames:
      - ${pg_instance_name}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${pg_instance_name}-app-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${pg_instance_name}-app-reader
subjects:
  - kind: ServiceAccount
    name: flexibleserver-bootstrap
    namespace: system-provisioning
---
# Opts the target namespace into the shared flexibleserver-bootstrap
# identity, scoped to the one Secret this provisions. create can't be
# scoped by resourceNames (the object doesn't exist yet), so it stays
# kind-level.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${pg_instance_name}-app-reader
  namespace: ${pg_target_namespace}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - ${pg_instance_name}-app-credentials
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${pg_instance_name}-app-reader
  namespace: ${pg_target_namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${pg_instance_name}-app-reader
subjects:
  - kind: ServiceAccount
    name: flexibleserver-bootstrap
    namespace: system-provisioning
