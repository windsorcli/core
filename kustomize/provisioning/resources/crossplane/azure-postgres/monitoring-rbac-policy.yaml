---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: flexibleserver-monitor-rbac
  annotations:
    policies.kyverno.io/title: Flexible Server monitor RBAC
    policies.kyverno.io/category: Azure
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: FlexibleServer
    policies.kyverno.io/description: >-
      Generates the ClusterRole/ClusterRoleBinding flexibleserver-bootstrap
      needs to read a new FlexibleServer's status, scoped by resourceNames
      to that one server. Runs in the background too, so a FlexibleServer
      that already existed before this policy was installed still gets
      RBAC. Secret access is a static Role (bootstrap-secret-rbac.yaml),
      not generated here — every admin/monitor Secret lands in
      system-provisioning regardless of server.
spec:
  background: true
  rules:
    - name: generate-monitor-clusterrole
      match:
        any:
          - resources:
              kinds:
                - dbforpostgresql.azure.upbound.io/v1beta1/FlexibleServer
      generate:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        name: "{{request.object.metadata.name}}-monitor-reader"
        synchronize: true
        data:
          rules:
            - apiGroups:
                - dbforpostgresql.azure.upbound.io
              resources:
                - flexibleservers
              resourceNames:
                - "{{request.object.metadata.name}}"
              verbs:
                - get
    - name: generate-monitor-clusterrolebinding
      match:
        any:
          - resources:
              kinds:
                - dbforpostgresql.azure.upbound.io/v1beta1/FlexibleServer
      generate:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "{{request.object.metadata.name}}-monitor-reader"
        synchronize: true
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{request.object.metadata.name}}-monitor-reader"
          subjects:
            - kind: ServiceAccount
              name: flexibleserver-bootstrap
              namespace: system-provisioning
