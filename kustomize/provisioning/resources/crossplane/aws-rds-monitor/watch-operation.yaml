---
# Ensures every RDS Instance has a monitor DatabaseCredentials XR, granting
# pg_monitor for the postgres-exporter WatchOperation to pick up.
apiVersion: ops.crossplane.io/v1alpha1
kind: WatchOperation
metadata:
  name: rds-monitor
spec:
  watch:
    apiVersion: rds.aws.upbound.io/v1beta3
    kind: Instance
  concurrencyPolicy: Replace
  successfulHistoryLimit: 1
  failedHistoryLimit: 3
  operationTemplate:
    spec:
      mode: Pipeline
      pipeline:
        - step: ensure-monitor-credentials
          functionRef:
            name: function-python
          input:
            apiVersion: python.fn.crossplane.io/v1beta1
            kind: Script
            script: |
              from crossplane.function import request, response


              def build_monitor_credentials(instance, instance_name, owner_refs):
                  return {
                      "apiVersion": "database.windsorcli.dev/v1alpha1",
                      "kind": "DatabaseCredentials",
                      "metadata": {
                          "name": f"{instance_name}-monitor",
                          "namespace": "system-database",
                          "ownerReferences": owner_refs,
                      },
                      "spec": {
                          "target": {
                              "apiVersion": instance["apiVersion"],
                              "kind": instance["kind"],
                              "name": instance_name,
                          },
                          "roleName": "monitor",
                          "secretName": f"{instance_name}-monitor-credentials",
                          "grants": [{"memberOf": "pg_monitor"}],
                      },
                  }


              def operate(req, rsp):
                  instance = request.get_required_resource(req, "ops.crossplane.io/watched-resource")
                  instance_name = instance["metadata"]["name"]
                  owner_refs = [{
                      "apiVersion": instance["apiVersion"],
                      "kind": instance["kind"],
                      "name": instance_name,
                      "uid": instance["metadata"]["uid"],
                      "blockOwnerDeletion": False,
                  }]

                  rsp.desired.resources["monitor-credentials"].resource.update(
                      build_monitor_credentials(instance, instance_name, owner_refs)
                  )
                  response.set_output(rsp, {"monitor_credentials": f"{instance_name}-monitor"})
