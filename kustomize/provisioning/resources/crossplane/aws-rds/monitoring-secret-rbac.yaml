---
# Every monitor-credentials Secret lands in this one namespace regardless
# of instance, so this stays static instead of Kyverno-generated per
# Instance, unlike the per-instance Instance-status read in
# monitoring-rbac-policy.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rds-monitor-secret-writer
  namespace: system-provisioning
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rds-monitor-secret-writer
  namespace: system-provisioning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rds-monitor-secret-writer
subjects:
  - kind: ServiceAccount
    name: rds-secret-reader
    namespace: system-provisioning
