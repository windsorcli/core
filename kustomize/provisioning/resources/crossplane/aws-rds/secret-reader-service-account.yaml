---
# Identity a bootstrap job uses to read an RDS-managed master password and
# provision a scoped, least-privilege application credential from it —
# never the master credential itself. Shared across every consumer; a chart
# grants it access to its own namespace via its own RoleBinding rather than
# this identity being re-provisioned per consumer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rds-secret-reader
  namespace: system-provisioning
