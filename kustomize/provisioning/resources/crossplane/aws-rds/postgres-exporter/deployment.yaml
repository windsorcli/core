---
# Scrapes ${pg_instance_name} as its pg_monitor role (no admin access) so
# the vendored postgres_exporter Grafana dashboard has data — see
# ADR-0009 §8 and provision-monitor-role-cronjob.yaml, which provisions
# the role and publishes its DSN as ${pg_instance_name}-monitor-credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${pg_instance_name}-postgres-exporter
  namespace: ${pg_target_namespace}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${pg_instance_name}-postgres-exporter
  template:
    metadata:
      labels:
        app: ${pg_instance_name}-postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          # renovate: datasource=docker depName=quay.io/prometheuscommunity/postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: ${pg_instance_name}-monitor-credentials
                  key: uri
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            # No CPU limit: a bursty, low-usage exporter like this gets
            # CFS-throttled by a tight limit even when the node is
            # otherwise idle. The request alone protects scheduling
            # fairness without capping real bursts.
            limits:
              memory: 64Mi
            requests:
              memory: 32Mi
              cpu: 25m
---
apiVersion: v1
kind: Service
metadata:
  name: ${pg_instance_name}-postgres-exporter
  namespace: ${pg_target_namespace}
spec:
  selector:
    app: ${pg_instance_name}-postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ${pg_instance_name}-postgres-exporter
  namespace: ${pg_target_namespace}
spec:
  selector:
    matchLabels:
      app: ${pg_instance_name}-postgres-exporter
  podMetricsEndpoints:
    - port: metrics
      # Without this, instance defaults to the exporter pod's own IP —
      # meaningless, and it churns on every pod restart. Naming the
      # actual Instance instead keeps it stable and readable.
      relabelings:
        - targetLabel: instance
          replacement: ${pg_instance_name}
