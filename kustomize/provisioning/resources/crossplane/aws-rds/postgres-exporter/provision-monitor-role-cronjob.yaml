---
# Provisions a read-only pg_monitor Postgres role, ${pg_database_name}_monitor,
# for ${pg_instance_name} from its RDS-managed master password — never
# the master credential itself, the same posture as the app-role
# component uses for application credentials. Publishes its DSN as
# ${pg_instance_name}-monitor-credentials for deployment.yaml to read.
# A tick before the Instance is Ready, or after the role already
# exists, exits clean.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${pg_instance_name}-provision-monitor-role
  namespace: system-provisioning
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: rds-secret-reader
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: fetch-admin-credentials
              # renovate: datasource=docker depName=alpine/k8s
              image: alpine/k8s:1.34.9@sha256:72c921a10c53ab749674e828ad12b776d006481c852bba7dd89e149ceed666f3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  READY=$(kubectl get instance.rds.aws.upbound.io ${pg_instance_name} \
                    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                  if [ "$READY" != "True" ]; then
                    echo "${pg_instance_name} Instance not Ready yet, skipping this tick."
                    touch /shared/skip
                    exit 0
                  fi

                  kubectl get instance.rds.aws.upbound.io ${pg_instance_name} \
                    -o jsonpath='{.status.atProvider.address}' > /shared/address

                  SECRET_ARN=$(kubectl get instance.rds.aws.upbound.io ${pg_instance_name} \
                    -o jsonpath='{.status.atProvider.masterUserSecret[0].secretArn}')

                  SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
                    --query SecretString --output text)
                  echo "$SECRET_JSON" | jq -r '.username' > /shared/admin-username
                  echo "$SECRET_JSON" | jq -r '.password' > /shared/admin-password

                  # Reuse the password already published, so a role that
                  # already exists doesn't get a new one every tick — the
                  # exporter's DSN is read once at pod start and wouldn't
                  # see the change anyway. Only a fresh role gets a fresh
                  # one, independent of the admin password's own
                  # AWS-managed rotation schedule.
                  EXISTING=$(kubectl get secret ${pg_instance_name}-monitor-credentials \
                    -n ${pg_target_namespace} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
                  if [ -n "$EXISTING" ]; then
                    echo -n "$EXISTING" > /shared/monitor-password
                  else
                    head -c 24 /dev/urandom | base64 | tr -d '/+=\n' > /shared/monitor-password
                  fi
              volumeMounts:
                - name: shared
                  mountPath: /shared
            - name: provision-monitor-role
              # renovate: datasource=docker depName=postgres
              image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  if [ -f /shared/skip ]; then
                    echo "Skipping, nothing to provision this tick."
                    exit 0
                  fi

                  ADDRESS=$(cat /shared/address)
                  ADMIN_USER=$(cat /shared/admin-username)
                  MONITOR_PASSWORD=$(cat /shared/monitor-password)

                  PGPASSWORD=$(cat /shared/admin-password) psql -h "$ADDRESS" -U "$ADMIN_USER" \
                    -d ${pg_database_name} -v ON_ERROR_STOP=1 <<SQL
                  DO \$\$
                  BEGIN
                    IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${pg_database_name}_monitor') THEN
                      CREATE ROLE ${pg_database_name}_monitor WITH LOGIN PASSWORD '$MONITOR_PASSWORD';
                    ELSE
                      ALTER ROLE ${pg_database_name}_monitor WITH PASSWORD '$MONITOR_PASSWORD';
                    END IF;
                  END
                  \$\$;
                  GRANT pg_monitor TO ${pg_database_name}_monitor;
                  SQL
              volumeMounts:
                - name: shared
                  mountPath: /shared
          containers:
            - name: publish-monitor-secret
              # renovate: datasource=docker depName=alpine/k8s
              image: alpine/k8s:1.34.9@sha256:72c921a10c53ab749674e828ad12b776d006481c852bba7dd89e149ceed666f3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  if [ -f /shared/skip ]; then
                    echo "Skipping, nothing to publish this tick."
                    exit 0
                  fi

                  ADDRESS=$(cat /shared/address)
                  MONITOR_PASSWORD=$(cat /shared/monitor-password)
                  kubectl create secret generic ${pg_instance_name}-monitor-credentials \
                    -n ${pg_target_namespace} \
                    --from-literal=username="${pg_database_name}_monitor" \
                    --from-literal=password="$MONITOR_PASSWORD" \
                    --from-literal=uri="postgresql://${pg_database_name}_monitor:$MONITOR_PASSWORD@$ADDRESS:5432/${pg_database_name}?sslmode=require" \
                    --dry-run=client -o yaml | kubectl apply -f -
              volumeMounts:
                - name: shared
                  mountPath: /shared
          volumes:
            # Memory-backed: the admin and monitor passwords transiting
            # this volume never touch node disk.
            - name: shared
              emptyDir:
                medium: Memory
