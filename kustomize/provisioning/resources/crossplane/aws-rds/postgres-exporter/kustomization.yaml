apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Reusable postgres_exporter monitoring for any provider-aws-rds Instance.
# A chart opts in by adding this component and setting the substitutions
# below — no exporter/role/RBAC of its own to author. See ADR-0009 §8.
#
# Required substitutions:
#   pg_instance_name     Instance CR's name, e.g. demo-db
#   pg_database_name     Database inside it to connect to, e.g. demo
#   pg_role_name         Postgres role to create, e.g. demo_monitor
#   pg_target_namespace  Namespace for the Secret and exporter, e.g. demo-database

resources:
  - rbac.yaml
  - provision-monitor-role-cronjob.yaml
  - deployment.yaml
