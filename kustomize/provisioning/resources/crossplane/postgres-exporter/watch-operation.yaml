---
# Provisions a postgres_exporter Deployment/Service/PodMonitor for every
# DatabaseCredentials granted pg_monitor, named after that claim's own
# unique name.
apiVersion: ops.crossplane.io/v1alpha1
kind: WatchOperation
metadata:
  name: postgres-exporter
spec:
  watch:
    apiVersion: database.windsorcli.dev/v1alpha1
    kind: DatabaseCredentials
  concurrencyPolicy: Replace
  successfulHistoryLimit: 1
  failedHistoryLimit: 3
  operationTemplate:
    spec:
      mode: Pipeline
      pipeline:
        - step: ensure-exporter
          functionRef:
            name: function-python
          input:
            apiVersion: python.fn.crossplane.io/v1beta1
            kind: Script
            script: |
              from crossplane.function import request, response

              MONITOR_GRANT = "pg_monitor"

              EXPORTER_IMAGE = "quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e"


              def has_monitor_grant(grants):
                  return any(g.get("memberOf") == MONITOR_GRANT for g in grants)


              def build_exporter_deployment(name, namespace, secret_name):
                  return {
                      "apiVersion": "apps/v1",
                      "kind": "Deployment",
                      "metadata": {"name": f"{name}-exporter", "namespace": namespace},
                      "spec": {
                          "replicas": 1,
                          "selector": {"matchLabels": {"app": f"{name}-exporter"}},
                          "template": {
                              "metadata": {"labels": {"app": f"{name}-exporter"}},
                              "spec": {
                                  "containers": [{
                                      "name": "postgres-exporter",
                                      "image": EXPORTER_IMAGE,
                                      "ports": [{"name": "metrics", "containerPort": 9187}],
                                      "env": [
                                          {"name": "PGHOST", "valueFrom": {"secretKeyRef": {"name": secret_name, "key": "endpoint"}}},
                                          {"name": "PGPORT", "valueFrom": {"secretKeyRef": {"name": secret_name, "key": "port"}}},
                                          {"name": "DATA_SOURCE_USER", "valueFrom": {"secretKeyRef": {"name": secret_name, "key": "username"}}},
                                          {"name": "DATA_SOURCE_PASS", "valueFrom": {"secretKeyRef": {"name": secret_name, "key": "password"}}},
                                          {"name": "DATA_SOURCE_URI", "value": "$(PGHOST):$(PGPORT)/postgres?sslmode=require"},
                                      ],
                                      "securityContext": {
                                          "runAsNonRoot": True,
                                          "runAsUser": 1000,
                                          "runAsGroup": 1000,
                                          "allowPrivilegeEscalation": False,
                                          "readOnlyRootFilesystem": True,
                                          "capabilities": {"drop": ["ALL"]},
                                          "seccompProfile": {"type": "RuntimeDefault"},
                                      },
                                      "resources": {
                                          # No CPU limit, to avoid CFS throttling on bursty scrapes.
                                          "limits": {"memory": "64Mi"},
                                          "requests": {"memory": "32Mi", "cpu": "25m"},
                                      },
                                  }],
                              },
                          },
                      },
                  }


              def build_exporter_service(name, namespace):
                  return {
                      "apiVersion": "v1",
                      "kind": "Service",
                      "metadata": {"name": f"{name}-exporter", "namespace": namespace},
                      "spec": {
                          "selector": {"app": f"{name}-exporter"},
                          "ports": [{"name": "metrics", "port": 9187, "targetPort": "metrics"}],
                      },
                  }


              def build_exporter_podmonitor(name, namespace, instance_name):
                  return {
                      "apiVersion": "monitoring.coreos.com/v1",
                      "kind": "PodMonitor",
                      "metadata": {"name": f"{name}-exporter", "namespace": namespace},
                      "spec": {
                          "selector": {"matchLabels": {"app": f"{name}-exporter"}},
                          "podMetricsEndpoints": [{
                              "port": "metrics",
                              # Labels the instance instead of the exporter pod's own, unstable IP.
                              "relabelings": [{"targetLabel": "instance", "replacement": instance_name}],
                          }],
                      },
                  }


              def operate(req, rsp):
                  claim = request.get_required_resource(req, "ops.crossplane.io/watched-resource")
                  grants = claim.get("spec", {}).get("grants", [])
                  if not has_monitor_grant(grants):
                      response.set_output(rsp, {"skipped": "no pg_monitor grant"})
                      return

                  claim_name = claim["metadata"]["name"]
                  namespace = claim["metadata"]["namespace"]
                  instance_name = claim["spec"]["target"]["name"]
                  secret_name = claim.get("status", {}).get("connectionSecretRef", {}).get("name")
                  if not secret_name:
                      response.set_output(rsp, {"skipped": f"{claim_name} has no connectionSecretRef yet"})
                      return

                  rsp.desired.resources["exporter-deployment"].resource.update(
                      build_exporter_deployment(claim_name, namespace, secret_name)
                  )
                  rsp.desired.resources["exporter-service"].resource.update(
                      build_exporter_service(claim_name, namespace)
                  )
                  rsp.desired.resources["exporter-podmonitor"].resource.update(
                      build_exporter_podmonitor(claim_name, namespace, instance_name)
                  )
                  response.set_output(rsp, {"exporter": f"{claim_name}-exporter"})
