---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: system-provisioning
spec:
  interval: 5m
  timeout: 10m
  install:
    # No uninstall on failed install: it reconciles every cloud-managed resource in the cluster.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: crossplane
      # renovate: datasource=helm depName=crossplane package=crossplane helmRepo=https://charts.crossplane.io/stable
      version: "2.4.2"
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: system-provisioning
  values:
    priorityClassName: windsorcli-platform-critical
    # Alpha feature: enables WatchOperations. Scoped to crossplane database
    # contexts — this HelmRelease only installs when one is active.
    args:
      - --enable-operations
    image:
      # renovate: datasource=docker depName=xpkg.crossplane.io/crossplane/crossplane package=xpkg.crossplane.io/crossplane/crossplane
      tag: v2.4.1@sha256:d4a43dafa1114ad028db08e87f6d4a6850b1d5e501f59e9b921f43ed6a66a44a
    # Chart defaults already cover most of PSA restricted; these two close
    # the rest (capabilities drop-all, seccompProfile) for system-provisioning.
    securityContextCrossplane:
      capabilities:
        drop: ["ALL"]
    securityContextRBACManager:
      capabilities:
        drop: ["ALL"]
    podSecurityContextCrossplane:
      seccompProfile:
        type: RuntimeDefault
    podSecurityContextRBACManager:
      seccompProfile:
        type: RuntimeDefault
