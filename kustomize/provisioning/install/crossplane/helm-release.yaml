---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: system-provisioning
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: crossplane
      # renovate: datasource=helm depName=crossplane package=crossplane helmRepo=https://charts.crossplane.io/stable
      version: "2.4.0"
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: system-provisioning
  values:
    image:
      # renovate: datasource=docker depName=xpkg.crossplane.io/crossplane/crossplane package=xpkg.crossplane.io/crossplane/crossplane
      tag: v2.4.0@sha256:c5d773aa940041475e2cf6b9adf3512cb382b1a6b889f53ed791192ed8ada75b
    # Chart defaults already cover most of PSA restricted; these two close
    # the rest (capabilities drop-all, seccompProfile) for system-provisioning.
    securityContextCrossplane:
      capabilities:
        drop: ["ALL"]
    securityContextRBACManager:
      capabilities:
        drop: ["ALL"]
    podSecurityContextCrossplane:
      seccompProfile:
        type: RuntimeDefault
    podSecurityContextRBACManager:
      seccompProfile:
        type: RuntimeDefault
