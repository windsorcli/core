---
# Pins the provider-aws-rds pod's ServiceAccount name so Terraform's Pod
# Identity association (fixed to the same name) can target it.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-aws-rds
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-aws-rds
  deploymentTemplate:
    spec:
      # selector is a required field on apps/v1 DeploymentSpec, but empty
      # satisfies it: Crossplane computes and applies the real selector
      # itself when it merges this template onto the Deployment it creates.
      selector: {}
      template:
        spec:
          priorityClassName: windsorcli-platform-critical
