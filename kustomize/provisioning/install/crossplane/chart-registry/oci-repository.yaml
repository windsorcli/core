---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crossplane
  namespace: system-provisioning
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry}/crossplane
  ref:
    # renovate: datasource=helm depName=crossplane package=crossplane helmRepo=https://charts.crossplane.io/stable
    tag: 2.4.3
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
