---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: minio-operator
  namespace: system-object-store
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry}/operator
  ref:
    # artifact: type=chart name=minio-operator repo=https://operator.min.io
    tag: 7.1.1
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
