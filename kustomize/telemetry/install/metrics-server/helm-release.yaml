apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: system-telemetry
spec:
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: metrics-server
      # artifact: type=chart name=metrics-server repo=https://kubernetes-sigs.github.io/metrics-server/
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  values:
    image:
      repository: registry.k8s.io/metrics-server/metrics-server
      # artifact: type=image name=registry.k8s.io/metrics-server/metrics-server
      tag: v0.9.1@sha256:9b0ba1926e1d3089673f45461c3c1416109dea33b3ba3434048defd380df329b
    args: []
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
