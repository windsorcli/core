apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebeat
  namespace: system-telemetry
spec:
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: filebeat
      # artifact: type=chart name=filebeat repo=https://helm.elastic.co
      version: "8.5.1"
      sourceRef:
        kind: HelmRepository
        name: filebeat
  values:
    image: docker.elastic.co/beats/filebeat
    # artifact: type=image name=docker.elastic.co/beats/filebeat referrers=false
    imageTag: 9.5.6@sha256:13afd81be4fa1523865c987a22b7c4aebca739941270333c7ca0048a4c9efeb3
    daemonset:
      secretMounts:
        - name: filebeat-tls
          secretName: filebeat-tls
          path: /usr/share/filebeat/certs/
      extraEnvs:
        - name: ELASTICSEARCH_HOSTS
          value: "elasticsearch-master.system-observability.svc.cluster.local"
        - name: "ELASTICSEARCH_USERNAME"
          valueFrom:
            secretKeyRef:
              name: elasticsearch-master-credentials
              key: username
        - name: "ELASTICSEARCH_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: elasticsearch-master-credentials
              key: password
        - name: "ssl.certificate_authorities"
          value: "/usr/share/filebeat/certs/ca.crt"
    resources:
      requests:
        cpu: "100m"
        memory: "100M"
      limits:
        cpu: "500m"
        memory: "300M"
