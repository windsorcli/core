---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-manager
  namespace: system-telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: secret-manager
    namespace: system-telemetry
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-manager-init-job
  namespace: system-telemetry
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: copy-k8s-secret
        # artifact: type=image name=ghcr.io/windsorcli/utils
        image: ghcr.io/windsorcli/utils:0c99365cba0f@sha256:fe4838c4687df97b318d83138801592e07fcaab9df091a883bb121045958b38e
        command: ["/bin/sh", "-c", "--"]
        args:
          - |
            kubectl get secret elasticsearch-master-credentials -n system-observability -o yaml \
              | yq eval 'del(.metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.managedFields) | .metadata.namespace = "system-telemetry"' - \
              | kubectl apply -n system-telemetry -f -
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
              - ALL
      restartPolicy: Never
      volumes:
        - name: temp-volume
          emptyDir: {}
      serviceAccountName: secret-manager

