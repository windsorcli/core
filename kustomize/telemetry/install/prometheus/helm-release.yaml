apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: system-telemetry
spec:
  interval: 5m
  timeout: 30m
  install:
    # No uninstall on failed install: ships its own admission webhook for PrometheusRule objects.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  values:
    crds:
      enabled: false
    grafana:
      enabled: false
    kubeStateMetrics:
      enabled: true
    # Talos binds these to 127.0.0.1 only, unreachable from Prometheus --
    # would otherwise permanently false-positive TargetDown/InstanceUnreachable.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kube-state-metrics:
      image:
        # renovate: datasource=docker depName=registry.k8s.io/kube-state-metrics/kube-state-metrics package=registry.k8s.io/kube-state-metrics/kube-state-metrics
        tag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
    prometheusOperator:
      priorityClassName: windsorcli-platform-critical
      image:
        # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-operator package=quay.io/prometheus-operator/prometheus-operator
        tag: v0.94.1@sha256:7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
      prometheusConfigReloader:
        image:
          # renovate: datasource=docker depName=quay.io/prometheus-operator/prometheus-config-reloader package=quay.io/prometheus-operator/prometheus-config-reloader
          tag: v0.94.1@sha256:06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
      admissionWebhooks:
        patch:
          image:
            # renovate: datasource=docker depName=ghcr.io/jkroepke/kube-webhook-certgen package=ghcr.io/jkroepke/kube-webhook-certgen
            tag: 1.11.0@sha256:778d97dc3986355625e14392419b3364c487a7c807d4d86ddad1df369129b082
    prometheus:
      prometheusSpec:
        priorityClassName: windsorcli-platform-critical
        # renovate: datasource=github-releases depName=prometheus/prometheus package=prometheus/prometheus
        version: v3.15.0
        image:
          # renovate: datasource=docker depName=quay.io/prometheus/prometheus package=quay.io/prometheus/prometheus
          tag: v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: { }
        serviceMonitorSelector: { }
        podMonitorNamespaceSelector: { }
        podMonitorSelector: { }
    kubelet:
      serviceMonitor:
        # Chart default list, with container_cpu_cfs_throttled_seconds_total kept.
        cAdvisorMetricRelabelings:
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)'
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_memory_(mapped_file|swap)'
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_(file_descriptors|tasks_state|threads_max)'
          - sourceLabels: [__name__, scope]
            action: drop
            regex: 'container_memory_failures_total;hierarchy'
          - sourceLabels: [__name__, interface]
            action: drop
            regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_spec.*'
          - sourceLabels: [id, pod]
            action: drop
            regex: '.+;'
    alertmanager:
      alertmanagerSpec:
        priorityClassName: windsorcli-platform-critical
        # renovate: datasource=github-releases depName=prometheus/alertmanager package=prometheus/alertmanager
        version: v0.34.1
        image:
          # renovate: datasource=docker depName=quay.io/prometheus/alertmanager package=quay.io/prometheus/alertmanager
          tag: v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    nodeExporter:
      enabled: true
      replicas: 1
    prometheus-node-exporter:
      # renovate: datasource=github-releases depName=prometheus/node_exporter package=prometheus/node_exporter
      version: v1.12.1
      image:
        # renovate: datasource=docker depName=quay.io/prometheus/node-exporter package=quay.io/prometheus/node-exporter
        tag: v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
        digest: ""
        # chart defaults this to true and would append `-distroless` to tag, breaking the digest pinning
        distroless: false
