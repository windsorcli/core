---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
  namespace: system-telemetry
spec:
  interval: 10m
  timeout: 5m
  url: ${chart_registry:=oci://ghcr.io/prometheus-community/charts}/kube-prometheus-stack
  ref:
    # artifact: type=chart name=kube-prometheus-stack repo=oci://ghcr.io/prometheus-community/charts
    tag: 88.6.5
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
