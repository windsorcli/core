---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: x509-certificate-exporter
  namespace: system-telemetry
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry:=oci://quay.io/enix/charts}/x509-certificate-exporter
  ref:
    # renovate: datasource=docker depName=quay.io/enix/charts/x509-certificate-exporter package=quay.io/enix/charts/x509-certificate-exporter
    tag: 4.2.3
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
