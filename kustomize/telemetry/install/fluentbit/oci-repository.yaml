---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fluent-operator
  namespace: system-telemetry
spec:
  interval: 10m
  timeout: 3m
  url: oci://ghcr.io/fluent/helm-charts/fluent-operator
  ref:
    # renovate: datasource=docker depName=ghcr.io/fluent/helm-charts/fluent-operator package=ghcr.io/fluent/helm-charts/fluent-operator
    tag: 4.3.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
