---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fluent-operator
  namespace: system-telemetry
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry:=oci://ghcr.io/fluent/helm-charts}/fluent-operator
  ref:
    # artifact: type=chart name=fluent-operator repo=oci://ghcr.io/fluent/helm-charts
    tag: 4.3.0
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
