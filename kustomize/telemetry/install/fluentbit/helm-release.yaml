---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator
  namespace: system-telemetry
spec:
  interval: 5m
  timeout: 20m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: fluent-operator
      # renovate: datasource=helm depName=fluent-operator package=fluent-operator helmRepo=https://fluent.github.io/helm-charts
      version: 4.3.0
      sourceRef:
        kind: HelmRepository
        name: fluent
  values:
    operator:
      image:
        # renovate: datasource=docker depName=ghcr.io/fluent/fluent-operator/fluent-operator package=ghcr.io/fluent/fluent-operator/fluent-operator
        tag: 3.10.1@sha256:be978534f9fc1b998dc822c5eaa95b4e88e6a853a9739fd84fe10b44fcb9a97b
      initcontainer:
        image:
          # renovate: datasource=docker depName=docker.io/library/docker package=docker.io/library/docker
          tag: 20.10@sha256:2967f0819c84dd589ed0a023b9d25dcfe7a3c123d5bf784ffbb77edf55335f0c
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: windsorcli.dev/pool-class
                    operator: In
                    values:
                      - system
      priorityClassName: windsorcli-platform-critical
    containerRuntime: containerd
    Kubernetes: false
    fluentd:
      image:
        # renovate: datasource=docker depName=ghcr.io/fluent/fluent-operator/fluentd package=ghcr.io/fluent/fluent-operator/fluentd
        tag: v1.19.2@sha256:fef9f961b919a56c7f11b0d6edcd55693150cc72d9728aac4b7a95937336774f
      enable: false
      crdsEnable: false
    fluentbit:
      image:
        # renovate: datasource=docker depName=ghcr.io/fluent/fluent-operator/fluent-bit package=ghcr.io/fluent/fluent-operator/fluent-bit
        tag: v5.1.2@sha256:49cf60e7f7463e43a88ba818136432b851aac9aa0c320e107ad26fe7fe4e37d2
      enable: false
      crdsEnable: false
