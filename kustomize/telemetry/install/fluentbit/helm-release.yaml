---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator
  namespace: system-telemetry
spec:
  interval: 5m
  timeout: 20m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  chartRef:
    kind: OCIRepository
    name: fluent-operator
  values:
    operator:
      image:
        registry: ghcr.io
        repository: fluent/fluent-operator/fluent-operator
        # artifact: type=image name=ghcr.io/fluent/fluent-operator/fluent-operator
        tag: 3.11.0@sha256:13af2f68887c442fcca787ad86d066d7403d43744dcebcc9dfd65830fdb8b55a
      initcontainer:
        image:
          # artifact: type=image name=docker.io/library/docker
          tag: 20.10@sha256:2967f0819c84dd589ed0a023b9d25dcfe7a3c123d5bf784ffbb77edf55335f0c
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: windsorcli.dev/pool-class
                    operator: In
                    values:
                      - system
      priorityClassName: windsorcli-platform-critical
    containerRuntime: containerd
    Kubernetes: false
    fluentd:
      image:
        registry: ghcr.io
        repository: fluent/fluent-operator/fluentd
        # artifact: type=image name=ghcr.io/fluent/fluent-operator/fluentd
        tag: v1.19.4@sha256:81b4665c7792e09516beaa719fd07f2b8560c33a9d134d902cca2fb6605f7ebb
      enable: false
      crdsEnable: false
    fluentbit:
      image:
        registry: ghcr.io
        repository: fluent/fluent-operator/fluent-bit
        # artifact: type=image name=ghcr.io/fluent/fluent-operator/fluent-bit
        tag: v5.2.1@sha256:01049ca9c917b5807c75dda9f2a6e7f4c6beaf3ba118f18d566f3fdd4a22c112
      enable: false
      crdsEnable: false
