apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: database-alerts
  namespace: system-telemetry
spec:
  groups:
    - name: database-supplemental.rules
      rules:
        - alert: LongRunningTransaction
          expr: cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG query running longer than 5 minutes (pod {{ $labels.pod }})
            description: "Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: BackendsWaiting
          expr: cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG backend waiting on another query (pod {{ $labels.pod }})
            description: "Pod {{ $labels.pod }} has been waiting for longer than 5 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: PGDatabase
          expr: cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG transaction ID age high (pod {{ $labels.pod }})
            description: "Over 300,000,000 transactions from the frozen XID to the current one on pod {{ $labels.pod }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: PGReplication
          expr: cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG standby lagging behind primary (pod {{ $labels.pod }})
            description: "Standby {{ $labels.pod }} is lagging behind by over 300 seconds (5 minutes).\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: LastFailedArchiveTime
          expr: (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG WAL archiving failed (pod {{ $labels.pod }})
            description: "Archiving failed for pod {{ $labels.pod }}. Will be negative when archiving hasn't failed.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: DatabaseDeadlockConflicts
          expr: cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG deadlocks detected (pod {{ $labels.pod }})
            description: "There are over 10 deadlock conflicts on pod {{ $labels.pod }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: ReplicaFailingReplication
          expr: cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG replica failing to replicate (pod {{ $labels.pod }})
            description: "Replica {{ $labels.pod }} is failing to replicate.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
