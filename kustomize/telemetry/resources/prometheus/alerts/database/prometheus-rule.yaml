apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: database-alerts
  namespace: system-telemetry
spec:
  groups:
    - name: database-supplemental.rules
      rules:
        # cnpg_collector_last_collection_error always exists once the exporter
        # is scraped successfully, so absent() here is a safer "the whole
        # pod/exporter is gone" signal than guessing at up{job=...}'s exact
        # job-naming convention (the podMonitor's job label isn't something
        # this facet controls directly).
        - alert: CloudNativePGAbsent
          expr: absent(cnpg_collector_last_collection_error)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: CloudNativePG absent from Prometheus service discovery
            description: "No cnpg_collector_last_collection_error series found. Either every CloudNativePG instance is down, or metrics collection has stopped entirely.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: CloudNativePGCollectorError
          expr: max by (namespace, pod) (cnpg_collector_last_collection_error{}) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG metrics collector reporting an error (pod {{ $labels.pod }})
            description: "The exporter in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) has been failing to collect one or more PostgreSQL statistics for 10 minutes -- some panels/alerts may be silently stale until this clears.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        # Combined lag (replication_lag is the primary signal; the write/flush/replay
        # components add detail but rarely diverge much from it) mirrors the
        # dashboard's own "Replication Lag" panel. Only fires where a replica
        # actually exists -- a single-instance (non-HA) cluster has no series here.
        - alert: CloudNativePGReplicationLagHigh
          expr: max by (namespace, pod) (cnpg_pg_replication_lag{}) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG replication lag above 30s (pod {{ $labels.pod }})
            description: "Replica {{ $labels.pod }} in namespace {{ $labels.namespace }} has been more than 30 seconds behind its primary for 5 minutes. A failover now would lose recent writes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        # datname="" (the default in the dashboard's own query) scopes this to
        # cluster-wide deadlocks rather than per-database noise.
        - alert: CloudNativePGDeadlocksDetected
          expr: sum by (namespace, pod) (rate(cnpg_pg_stat_database_deadlocks{datname="",namespace=~".*",pod=~".*"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG deadlocks detected (pod {{ $labels.pod }})
            description: "PostgreSQL instance {{ $labels.pod }} in namespace {{ $labels.namespace }} has recorded deadlocks in the last 5 minutes -- consistent with lock contention between concurrent transactions.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        # rate(), not increase(): a single archiver retry loop can log several
        # failures in one scrape interval, so this catches a sustained failure
        # rate rather than one-off blips gated purely on count.
        - alert: CloudNativePGWalArchivingFailing
          expr: max by (namespace, pod) (rate(cnpg_pg_stat_archiver_failed_count{}[5m])) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: CloudNativePG WAL archiving failing (pod {{ $labels.pod }})
            description: "PostgreSQL instance {{ $labels.pod }} in namespace {{ $labels.namespace }} has been failing to archive WAL segments for 15 minutes. Point-in-time recovery is degrading the longer this continues.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
