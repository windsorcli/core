apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Adapted from prometheus-community/postgres_exporter's own
# postgres_mixin/alerts/postgres.libsonnet, rewritten against the
# metrics this exporter's default collectors actually expose (verified
# live) and this repo's job/instance grouping instead of the mixin's
# multi-cluster jsonnet templating. Two of the mixin's alerts
# (replication slot usage, unvacuumed tables) are dropped: their
# metrics aren't in this exporter's default build.

resources:
  - prometheus-rule.yaml
