---
# Mirrors the instance's endpoint and admin credential into the single
# Secret provider-sql's ProviderConfig reads — the connection-secret
# bridge provider-sql itself has no way to assemble on its own, since its
# ProviderConfig takes exactly one Secret with fixed key names. The
# PG_CRD_*/PG_ENDPOINT_FIELD/PG_USERNAME_* env vars come from the driver
# overlay's ConfigMap, not Flux substitution: they never vary by instance.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${pg_instance_name}-app-role-connection-secret
  namespace: system-database
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: bootstrap
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: mirror-connection-secret
              # renovate: datasource=docker depName=alpine/k8s
              image: alpine/k8s:1.34.9@sha256:72c921a10c53ab749674e828ad12b776d006481c852bba7dd89e149ceed666f3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              envFrom:
                - configMapRef:
                    name: ${pg_instance_name}-app-role-driver-config
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  READY=$(kubectl get $PG_CRD_KIND_LOWER.$PG_CRD_GROUP "${pg_instance_name}" \
                    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                  if [ "$READY" != "True" ]; then
                    echo "${pg_instance_name} $PG_CRD_KIND not Ready yet, skipping this tick."
                    exit 0
                  fi

                  PASSWORD=$(kubectl get secret "${pg_instance_name}"-admin-credentials \
                    -n system-database -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
                  if [ -z "$PASSWORD" ]; then
                    echo "${pg_instance_name}-admin-credentials not populated yet, skipping this tick."
                    exit 0
                  fi

                  ENDPOINT=$(kubectl get $PG_CRD_KIND_LOWER.$PG_CRD_GROUP "${pg_instance_name}" \
                    -o jsonpath="{.status.atProvider.$PG_ENDPOINT_FIELD}")

                  # The admin username lives on the instance CR itself for
                  # some drivers, and only in the admin credential Secret
                  # for others (no instance-level field to read it from).
                  if [ "$PG_USERNAME_FROM_SECRET" = "true" ]; then
                    USERNAME=$(kubectl get secret "${pg_instance_name}"-admin-credentials \
                      -n system-database -o jsonpath="{.data.$PG_USERNAME_FIELD}" | base64 -d)
                  else
                    USERNAME=$(kubectl get $PG_CRD_KIND_LOWER.$PG_CRD_GROUP "${pg_instance_name}" \
                      -o jsonpath="{.spec.forProvider.$PG_USERNAME_FIELD}")
                  fi

                  kubectl create secret generic "${pg_instance_name}"-connection \
                    -n system-database \
                    --from-literal=endpoint="$ENDPOINT" \
                    --from-literal=port="5432" \
                    --from-literal=username="$USERNAME" \
                    --from-literal=password="$PASSWORD" \
                    --dry-run=client -o yaml | kubectl apply -f -
