---
# The instance CRD is cluster-scoped, so reading it needs a ClusterRole
# even though this only ever touches the one named instance. Named for it
# to keep the grant obviously scoped. apiGroups/resources are set by the
# driver overlay, not here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${pg_instance_name}-app-reader
rules:
  - apiGroups:
      - REPLACED_BY_DRIVER_OVERLAY
    resources:
      - REPLACED_BY_DRIVER_OVERLAY
    resourceNames:
      - ${pg_instance_name}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${pg_instance_name}-app-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${pg_instance_name}-app-reader
subjects:
  - kind: ServiceAccount
    name: bootstrap
    namespace: system-database
