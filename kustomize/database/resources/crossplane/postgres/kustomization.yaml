apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Driver-agnostic Postgres mechanics: the bootstrap ServiceAccount and its
# Secret access, and generate policies provisioning monitor RBAC and a
# pg_monitor role.
#
# A driver's own kustomization.yaml references this and patches in the
# CRD identity and annotations.
#
# app-role and monitoring-exporter are optional sub-components, not part
# of this always-on base.

resources:
  - service-account.yaml
  - secret-rbac.yaml
  - monitor-generate-rbac.yaml
  - monitoring-rbac-policy.yaml
  - monitoring-cronjob-policy.yaml
