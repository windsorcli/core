apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Driver-agnostic Postgres mechanics: the bootstrap ServiceAccount and its
# Secret access, and the generate policies that provision per-instance
# monitor RBAC and a pg_monitor role. Reference this from a driver's own
# kustomization.yaml, which patches in the CRD identity and annotations.
# app-role and monitoring-exporter are optional per-chart/per-feature
# sub-components, not part of this always-on base.

resources:
  - service-account.yaml
  - secret-rbac.yaml
  - monitor-generate-rbac.yaml
  - monitoring-rbac-policy.yaml
  - monitoring-cronjob-policy.yaml
