- op: replace
  path: /metadata/annotations/policies.kyverno.io~1title
  value: RDS instance monitor RBAC
- op: replace
  path: /metadata/annotations/policies.kyverno.io~1category
  value: AWS
- op: replace
  path: /metadata/annotations/policies.kyverno.io~1subject
  value: Instance
- op: replace
  path: /spec/rules/0/match/any/0/resources/kinds
  value: &instanceKinds
    - rds.aws.upbound.io/v1beta1/Instance
    - rds.aws.upbound.io/v1beta2/Instance
    - rds.aws.upbound.io/v1beta3/Instance
- op: replace
  path: /spec/rules/0/generate/data/rules/0/apiGroups/0
  value: rds.aws.upbound.io
- op: replace
  path: /spec/rules/0/generate/data/rules/0/resources/0
  value: instances
- op: replace
  path: /spec/rules/1/match/any/0/resources/kinds
  value: *instanceKinds
