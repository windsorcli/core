---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: crossplane-instance-tag
  annotations:
    policies.kyverno.io/title: Crossplane RDS cluster tag
    policies.kyverno.io/category: AWS
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Instance
    policies.kyverno.io/description: >-
      Force-sets the windsorcli.dev/cluster and WindsorContextID tags on
      every Crossplane rds.aws.upbound.io Instance, overwriting whatever
      value (if any) the resource was submitted with. The crossplane_rds
      IAM role's policy conditions on windsorcli.dev/cluster, so an
      Instance can only be created or modified within this cluster's own
      scope regardless of what a chart submits. WindsorContextID makes
      the Instance visible to context-scoped sweeps the same way
      Terraform-managed resources already are.
spec:
  # Fail-open: if the mutation webhook is unreachable, the create still goes
  # through and IAM's own tag condition is the backstop that rejects it.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [rds.aws.upbound.io]
        apiVersions: [v1beta1, v1beta2, v1beta3]
        operations: [CREATE, UPDATE]
        resources: [instances]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              forProvider: Object.spec.forProvider{
                tags: {
                  "windsorcli.dev/cluster": "${cluster_name}",
                  "WindsorContextID": "${context_id}"
                }
              }
            }
          }
