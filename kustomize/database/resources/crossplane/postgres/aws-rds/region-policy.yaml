---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: crossplane-instance-region
  annotations:
    policies.kyverno.io/title: Crossplane RDS region
    policies.kyverno.io/category: AWS
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Instance
    policies.kyverno.io/description: >-
      Rejects any Crossplane rds.aws.upbound.io Instance whose region differs
      from the cluster's. The subnet group, security group, and KMS key the
      network defaults policy injects exist only in the cluster's region.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rds.aws.upbound.io]
        apiVersions: [v1beta1, v1beta2, v1beta3]
        operations: [CREATE, UPDATE]
        resources: [instances]
  validations:
    - expression: >-
        object.spec.forProvider.?region.orValue("${aws_region}") == "${aws_region}"
      messageExpression: >-
        "spec.forProvider.region must be ${aws_region}, the cluster's region; got " + object.spec.forProvider.?region.orValue("unset")
