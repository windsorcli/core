---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: crossplane-instance-network
  annotations:
    policies.kyverno.io/title: Crossplane RDS network defaults
    policies.kyverno.io/category: AWS
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Instance
    policies.kyverno.io/description: >-
      Defaults dbSubnetGroupName, kmsKeyId, and vpcSecurityGroupIds on every
      Crossplane rds.aws.upbound.io Instance that doesn't already set them,
      so a third-party chart with no Terraform or Flux substitution access
      can create a working Instance without knowing this cluster's
      networking. A chart that sets its own value keeps it.
spec:
  # Fail closed: no IAM condition or other backstop catches an Instance
  # left with no subnet group, security group, or encryption key.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rds.aws.upbound.io]
        apiVersions: [v1beta1, v1beta2, v1beta3]
        operations: [CREATE, UPDATE]
        resources: [instances]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              forProvider: Object.spec.forProvider{
                dbSubnetGroupName: object.spec.forProvider.?dbSubnetGroupName.hasValue() ? object.spec.forProvider.dbSubnetGroupName : "${db_subnet_group_name}",
                kmsKeyId: object.spec.forProvider.?kmsKeyId.hasValue() ? object.spec.forProvider.kmsKeyId : "${kms_key_arn}",
                vpcSecurityGroupIds: object.spec.forProvider.?vpcSecurityGroupIds.hasValue() ? object.spec.forProvider.vpcSecurityGroupIds : ["${rds_security_group_id}"]
              }
            }
          }
