---
# Mirrors the instance's endpoint and admin credential into the Secret
# provider-sql's ProviderConfig reads, reacting to either changing.
apiVersion: ops.crossplane.io/v1alpha1
kind: WatchOperation
metadata:
  name: ${pg_instance_name}-connection-secret
spec:
  watch:
    apiVersion: ${pg_crd_apiversion}
    kind: ${pg_crd_kind}
  concurrencyPolicy: Replace
  successfulHistoryLimit: 1
  failedHistoryLimit: 3
  operationTemplate:
    spec:
      mode: Pipeline
      pipeline:
        - step: mirror
          functionRef:
            name: function-python
          requirements:
            requiredResources:
              - requirementName: admin-credentials
                apiVersion: v1
                kind: Secret
                name: ${pg_instance_name}-admin-credentials
                namespace: system-database
          input:
            apiVersion: python.fn.crossplane.io/v1beta1
            kind: Script
            script: |
              import base64

              from crossplane.function import request, resource, response


              def operate(req, rsp):
                  instance = request.get_required_resource(req, "ops.crossplane.io/watched-resource")
                  instance_name = instance["metadata"]["name"]

                  # The watch has no per-name filter: fires for every
                  # instance of this kind, skipped here if not this one.
                  if instance_name != "${pg_instance_name}":
                      response.set_output(rsp, {"skipped": f"watched {instance_name}, not ${pg_instance_name}"})
                      return

                  if resource.get_condition(instance, "Ready").status != "True":
                      response.set_output(rsp, {"skipped": "instance not Ready yet"})
                      return

                  admin_secret = request.get_required_resource(req, "admin-credentials")
                  password_b64 = admin_secret.get("data", {}).get("password")
                  if not password_b64:
                      response.set_output(rsp, {"skipped": "admin credentials not populated yet"})
                      return
                  password = base64.b64decode(password_b64).decode()

                  endpoint = instance.get("status", {}).get("atProvider", {}).get("${pg_endpoint_field}", "")

                  if "${pg_username_from_secret}" == "true":
                      username_b64 = admin_secret.get("data", {}).get("${pg_username_field}")
                      username = base64.b64decode(username_b64).decode() if username_b64 else ""
                  else:
                      username = instance.get("spec", {}).get("forProvider", {}).get("${pg_username_field}", "")

                  rsp.desired.resources["connection-secret"].resource.update({
                      "apiVersion": "v1",
                      "kind": "Secret",
                      "metadata": {
                          "name": "${pg_instance_name}-connection",
                          "namespace": "system-database",
                      },
                      "type": "Opaque",
                      "stringData": {
                          "endpoint": endpoint,
                          "port": "5432",
                          "username": username,
                          "password": password,
                      },
                  })

                  response.set_output(rsp, {"instance": instance_name, "endpoint": endpoint})
