apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Read-only monitoring credential for any provider-sql-fronted instance
# CR: a Role granted the pg_monitor role.
#
# Reference ../instance-connection as a peer component: it provides the
# ProviderConfig this component's Role/Grant use.
#
# Required substitutions:
#   pg_instance_name       Instance CR's name, e.g. demo-db

resources:
  - role.yaml
  - grant.yaml
