---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: crossplane-azuredb-rg
  annotations:
    policies.kyverno.io/title: Crossplane Flexible Server resource group
    policies.kyverno.io/category: Azure
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: FlexibleServer
    policies.kyverno.io/description: >-
      Force-sets resourceGroupName on every Crossplane
      dbforpostgresql.azure.upbound.io FlexibleServer to this context's
      dedicated postgres resource group, overwriting whatever value (if
      any) the resource was submitted with. crossplane-identity's
      role assignment is scoped to that resource group, so a
      FlexibleServer can only be created or modified within it regardless
      of what a chart submits.
spec:
  # Fail-open: the role assignment's own scope backstops a create that
  # slips through an unreachable webhook.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [dbforpostgresql.azure.upbound.io]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [flexibleservers]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              forProvider: Object.spec.forProvider{
                resourceGroupName: "${azuredb_resource_group_name}"
              }
            }
          }
