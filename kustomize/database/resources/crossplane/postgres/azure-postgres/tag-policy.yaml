---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: crossplane-instance-tag
  annotations:
    policies.kyverno.io/title: Crossplane Flexible Server context tag
    policies.kyverno.io/category: Azure
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: FlexibleServer
    policies.kyverno.io/description: >-
      Force-sets the WindsorContextID tag on every Crossplane
      dbforpostgresql.azure.upbound.io FlexibleServer, overwriting
      whatever value (if any) the resource was submitted with. Makes the
      FlexibleServer visible to context-scoped sweeps the same way
      Terraform-managed resources already are.
spec:
  # Fail-open: if the mutation webhook is unreachable, the create still goes
  # through.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [dbforpostgresql.azure.upbound.io]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [flexibleservers]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              forProvider: Object.spec.forProvider{
                tags: {
                  "WindsorContextID": "${context_id}"
                }
              }
            }
          }
