---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: crossplane-azuredb-encryption-key
  annotations:
    policies.kyverno.io/title: Crossplane Flexible Server encryption key default
    policies.kyverno.io/category: Azure
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: FlexibleServer
    policies.kyverno.io/description: >-
      Defaults identity and customerManagedKey on every Crossplane
      dbforpostgresql.azure.upbound.io FlexibleServer that doesn't already
      set them, so a third-party chart with no Terraform or Flux
      substitution access can create a FlexibleServer encrypted with this
      context's own managed key. A chart that sets its own value keeps it.
      Only installed when this context actually has a managed key — see
      this component's own enable_when in addon-database.yaml — since an
      unconditional default would set an explicit empty key/identity
      rather than leaving them absent when no key exists.
spec:
  # CREATE only: azurerm_postgresql_flexible_server forces a new server on
  # either field changing, matching this driver's other network-policy.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [dbforpostgresql.azure.upbound.io]
        apiVersions: [v1beta1, v1beta2]
        operations: [CREATE]
        resources: [flexibleservers]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              forProvider: Object.spec.forProvider{
                identity: object.spec.forProvider.?identity.hasValue() ? object.spec.forProvider.identity : Object.spec.forProvider.identity{
                  type: "UserAssigned",
                  identityIds: ["${azuredb_cmk_identity_id}"]
                },
                customerManagedKey: object.spec.forProvider.?customerManagedKey.hasValue() ? object.spec.forProvider.customerManagedKey : Object.spec.forProvider.customerManagedKey{
                  keyVaultKeyId: "${azuredb_kms_key_id}",
                  primaryUserAssignedIdentityId: "${azuredb_cmk_identity_id}"
                }
              }
            }
          }
