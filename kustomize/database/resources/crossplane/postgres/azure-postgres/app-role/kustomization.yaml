apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Flexible Server's CRD identity and status field names for the shared
# ../../_shared/app-role component.

components:
  - ../../_shared/app-role

configMapGenerator:
  - name: ${pg_instance_name}-app-role-driver-config
    namespace: system-database
    literals:
      - PG_CRD_GROUP=dbforpostgresql.azure.upbound.io
      - PG_CRD_RESOURCE=flexibleservers
      - PG_CRD_KIND_LOWER=flexibleserver
      - PG_CRD_KIND=FlexibleServer
      - PG_ENDPOINT_FIELD=fqdn
      - PG_USERNAME_FROM_SECRET=false
      - PG_USERNAME_FIELD=administratorLogin
    options:
      disableNameSuffixHash: true

patches:
  - path: patches/rbac.yaml
    target:
      kind: ClusterRole
