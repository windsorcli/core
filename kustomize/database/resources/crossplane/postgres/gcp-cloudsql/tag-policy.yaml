---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: crossplane-instance-tag
  annotations:
    policies.kyverno.io/title: Crossplane Cloud SQL context label
    policies.kyverno.io/category: GCP
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: DatabaseInstance
    policies.kyverno.io/description: >-
      Force-sets the windsor_context_id label on every Crossplane
      sql.gcp.upbound.io DatabaseInstance, overwriting whatever value (if
      any) the resource was submitted with. Makes the DatabaseInstance
      visible to context-scoped sweeps the same way Terraform-managed
      resources already are.
spec:
  # Fail-open: if the mutation webhook is unreachable, the create still goes
  # through.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [sql.gcp.upbound.io]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [databaseinstances]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              forProvider: Object.spec.forProvider{
                settings: Object.spec.forProvider.settings{
                  userLabels: {
                    "windsor_context_id": "${context_id}"
                  }
                }
              }
            }
          }
