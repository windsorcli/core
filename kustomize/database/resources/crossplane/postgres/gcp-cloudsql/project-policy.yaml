---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: crossplane-cloudsql-project
  annotations:
    policies.kyverno.io/title: Crossplane Cloud SQL project
    policies.kyverno.io/category: GCP
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: DatabaseInstance
    policies.kyverno.io/description: >-
      Force-sets project on every Crossplane sql.gcp.upbound.io
      DatabaseInstance to this context's project, overwriting whatever
      value (if any) the resource was submitted with. Unlike Azure's
      resource-group scoping, crossplane-identity's IAM role grants
      project-wide access, so this only guards against a chart pointing at
      the wrong project — it isn't a security boundary the way the Azure
      equivalent is.
spec:
  # Fail-open: if the mutation webhook is unreachable, the create still goes
  # through.
  failurePolicy: Ignore
  background: false
  rules:
    - name: set-project
      match:
        any:
          - resources:
              kinds:
                - sql.gcp.upbound.io/v1beta1/DatabaseInstance
      mutate:
        patchStrategicMerge:
          spec:
            forProvider:
              project: ${crossplane_gcp_project_id}
