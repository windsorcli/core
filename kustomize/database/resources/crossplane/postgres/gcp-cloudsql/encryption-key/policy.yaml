---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: crossplane-cloudsql-encryption-key
  annotations:
    policies.kyverno.io/title: Crossplane Cloud SQL encryption key default
    policies.kyverno.io/category: GCP
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: DatabaseInstance
    policies.kyverno.io/description: >-
      Defaults encryptionKeyName on every Crossplane sql.gcp.upbound.io
      DatabaseInstance that doesn't already set it, so a third-party chart
      with no Terraform or Flux substitution access can create a
      DatabaseInstance encrypted with this context's own managed key. A
      chart that sets its own value keeps it. Only installed when this
      context actually has a managed key — see this component's own
      enable_when in addon-database.yaml — since an unconditional default
      would set an explicit empty encryptionKeyName rather than leaving it
      absent when no key exists.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [sql.gcp.upbound.io]
        apiVersions: [v1beta2]
        operations: [CREATE, UPDATE]
        resources: [databaseinstances]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              forProvider: Object.spec.forProvider{
                encryptionKeyName: object.spec.forProvider.?encryptionKeyName.hasValue() ? object.spec.forProvider.encryptionKeyName : "${cloudsql_kms_key_name}"
              }
            }
          }
