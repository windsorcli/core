apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Cloud SQL's CRD identity and status field names for the shared
# ../../_shared/app-role component.

components:
  - ../../_shared/app-role

configMapGenerator:
  - name: ${pg_instance_name}-app-role-driver-config
    namespace: system-database
    literals:
      - PG_CRD_GROUP=sql.gcp.upbound.io
      - PG_CRD_RESOURCE=databaseinstances
      - PG_CRD_KIND_LOWER=databaseinstance
      - PG_CRD_KIND=DatabaseInstance
      - PG_ENDPOINT_FIELD=privateIpAddress
      - PG_USERNAME_FROM_SECRET=true
      - PG_USERNAME_FIELD=username
    options:
      disableNameSuffixHash: true

patches:
  - path: patches/rbac.yaml
    target:
      kind: ClusterRole
