---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: instance-monitor-rbac
  annotations:
    policies.kyverno.io/title: REPLACED_BY_DRIVER_OVERLAY
    policies.kyverno.io/category: REPLACED_BY_DRIVER_OVERLAY
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: REPLACED_BY_DRIVER_OVERLAY
    policies.kyverno.io/description: >-
      Generates the ClusterRole/ClusterRoleBinding bootstrap needs to read
      a new instance's status, scoped by resourceNames to that one
      instance. Runs in the background too, so an instance that already
      existed before this policy was installed still gets RBAC. Secret
      access is a static Role (secret-rbac.yaml), not generated here —
      every admin/monitor Secret lands in system-database regardless of
      instance.
spec:
  background: true
  rules:
    - name: generate-monitor-clusterrole
      match:
        any:
          - resources:
              kinds:
                - REPLACED_BY_DRIVER_OVERLAY
      generate:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        name: "{{request.object.metadata.name}}-monitor-reader"
        synchronize: true
        data:
          rules:
            - apiGroups:
                - REPLACED_BY_DRIVER_OVERLAY
              resources:
                - REPLACED_BY_DRIVER_OVERLAY
              resourceNames:
                - "{{request.object.metadata.name}}"
              verbs:
                - get
    - name: generate-monitor-clusterrolebinding
      match:
        any:
          - resources:
              kinds:
                - REPLACED_BY_DRIVER_OVERLAY
      generate:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "{{request.object.metadata.name}}-monitor-reader"
        synchronize: true
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{request.object.metadata.name}}-monitor-reader"
          subjects:
            - kind: ServiceAccount
              name: bootstrap
              namespace: system-database
