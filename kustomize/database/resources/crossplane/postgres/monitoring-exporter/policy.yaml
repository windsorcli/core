---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: instance-monitor-exporter
  annotations:
    policies.kyverno.io/title: REPLACED_BY_DRIVER_OVERLAY
    policies.kyverno.io/category: REPLACED_BY_DRIVER_OVERLAY
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: REPLACED_BY_DRIVER_OVERLAY
    policies.kyverno.io/description: >-
      Generates a postgres_exporter Deployment/Service/PodMonitor in
      system-database for a new instance, scraping it as the pg_monitor
      role instance-monitor-role provisions. Runs in the background too,
      so an instance that already existed before this policy was
      installed still gets an exporter.
spec:
  background: true
  rules:
    - name: generate-monitor-deployment
      match:
        any:
          - resources:
              kinds:
                - REPLACED_BY_DRIVER_OVERLAY
      generate:
        apiVersion: apps/v1
        kind: Deployment
        name: "{{request.object.metadata.name}}-postgres-exporter"
        namespace: system-database
        synchronize: true
        data:
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "{{request.object.metadata.name}}-postgres-exporter"
            template:
              metadata:
                labels:
                  app: "{{request.object.metadata.name}}-postgres-exporter"
              spec:
                containers:
                  - name: postgres-exporter
                    # renovate: datasource=docker depName=quay.io/prometheuscommunity/postgres-exporter
                    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
                    ports:
                      - name: metrics
                        containerPort: 9187
                    env:
                      - name: DATA_SOURCE_NAME
                        valueFrom:
                          secretKeyRef:
                            name: "{{request.object.metadata.name}}-monitor-credentials"
                            key: uri
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                      seccompProfile:
                        type: RuntimeDefault
                    resources:
                      # No CPU limit, to avoid CFS throttling on bursty scrapes.
                      limits:
                        memory: 64Mi
                      requests:
                        memory: 32Mi
                        cpu: 25m
    - name: generate-monitor-service
      match:
        any:
          - resources:
              kinds:
                - REPLACED_BY_DRIVER_OVERLAY
      generate:
        apiVersion: v1
        kind: Service
        name: "{{request.object.metadata.name}}-postgres-exporter"
        namespace: system-database
        synchronize: true
        data:
          spec:
            selector:
              app: "{{request.object.metadata.name}}-postgres-exporter"
            ports:
              - name: metrics
                port: 9187
                targetPort: metrics
    - name: generate-monitor-podmonitor
      match:
        any:
          - resources:
              kinds:
                - REPLACED_BY_DRIVER_OVERLAY
      generate:
        apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        name: "{{request.object.metadata.name}}-postgres-exporter"
        namespace: system-database
        synchronize: true
        data:
          spec:
            selector:
              matchLabels:
                app: "{{request.object.metadata.name}}-postgres-exporter"
            podMetricsEndpoints:
              - port: metrics
                # Labels the instance instead of the exporter pod's own,
                # unstable IP.
                relabelings:
                  - targetLabel: instance
                    replacement: "{{request.object.metadata.name}}"
