---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnativepg
  namespace: system-database
spec:
  interval: 5m
  timeout: 10m
  install:
    # No uninstall on failed install: the operator manages live Postgres Clusters.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chartRef:
    kind: OCIRepository
    name: cloudnativepg
  values:
    priorityClassName: windsorcli-platform-critical
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
    config:
      clusterWide: true
    image:
      repository: ghcr.io/cloudnative-pg/cloudnative-pg
      # artifact: type=image name=ghcr.io/cloudnative-pg/cloudnative-pg
      tag: 1.30.2@sha256:f96f6be3d81ec93819b443c665c575c609342fca840df90d4d87dae314a5b913
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 256Mi
    containerSecurityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    webhook:
      mutating:
        failurePolicy: Fail
      validating:
        failurePolicy: Fail
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
