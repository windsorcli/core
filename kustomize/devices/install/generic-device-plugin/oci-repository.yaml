---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: generic-device-plugin
  namespace: system-devices
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry:=oci://ghcr.io/squat/charts}/generic-device-plugin
  ref:
    # artifact: type=chart name=generic-device-plugin repo=oci://ghcr.io/squat/charts
    tag: 0.2.0
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
