apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# daemonset.yaml is vendored by task crds; re-derive the digest when its version bumps:
#   crane digest docker.io/intel/intel-gpu-plugin:<version>
resources:
  - daemonset.yaml
patches:
  - target:
      kind: DaemonSet
      name: intel-gpu-plugin
    patch: |
      - op: add
        path: /metadata/namespace
        value: system-devices
      - op: replace
        path: /spec/template/spec/containers/0/image
        # artifact: type=image name=docker.io/intel/intel-gpu-plugin
        value: docker.io/intel/intel-gpu-plugin:0.37.2@sha256:d8c5d202e53a5ca4ea4105f0b2729b3108ac4304aba948e956f80f5f38ae119b
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - -shared-dev-num=10
      - op: add
        path: /spec/template/spec/nodeSelector/feature.node.kubernetes.io~1gpu-intel
        value: "true"
