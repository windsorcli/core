---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: node-feature-discovery
  namespace: system-devices
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry:=oci://registry.k8s.io/nfd/charts}/node-feature-discovery
  ref:
    # artifact: type=chart name=node-feature-discovery repo=oci://registry.k8s.io/nfd/charts
    tag: 0.20.1
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
