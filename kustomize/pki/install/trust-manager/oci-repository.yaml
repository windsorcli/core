---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trust-manager
  namespace: system-pki-trust
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry:=oci://quay.io/jetstack/charts}/trust-manager
  ref:
    # artifact: type=chart name=trust-manager repo=oci://quay.io/jetstack/charts
    tag: v0.25.0
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
