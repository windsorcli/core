---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trust-manager
  namespace: system-pki-trust
spec:
  interval: 10m
  timeout: 3m
  url: oci://quay.io/jetstack/charts/trust-manager
  ref:
    # renovate: datasource=docker depName=quay.io/jetstack/charts/trust-manager package=quay.io/jetstack/charts/trust-manager
    tag: v0.25.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
