---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: system-pki-trust
spec:
  interval: 5m
  timeout: 10m
  dependsOn:
    - name: cert-manager
      namespace: system-pki
  chart:
    spec:
      chart: trust-manager
      # renovate: datasource=helm depName=trust-manager package=trust-manager helmRepo=https://charts.jetstack.io
      version: 0.24.0
      sourceRef: 
        kind: HelmRepository
        name: jetstack
  values:
    image:
      # renovate: datasource=docker depName=quay.io/jetstack/trust-manager package=quay.io/jetstack/trust-manager
      tag: v0.24.0@sha256:a7c1d71cad37b404738192213e3801dbf89fe797e72664b0ff0d498db35cea74
    defaultPackageImage:
      name: trust-pkg-debian-trixie
      # renovate: datasource=docker depName=quay.io/jetstack/trust-pkg-debian-trixie package=quay.io/jetstack/trust-pkg-debian-trixie
      tag: 20250419.1@sha256:17084a794d1e75065c9047438e2a6167907771fe78d7e4b5d4373a4b1d4e0494
    app:
      trust:
        namespace: system-pki-trust
