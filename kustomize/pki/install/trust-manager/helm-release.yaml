---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: system-pki-trust
spec:
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  dependsOn:
    - name: cert-manager
      namespace: system-pki
  chartRef:
    kind: OCIRepository
    name: trust-manager
  values:
    image:
      repository: quay.io/jetstack/trust-manager
      # artifact: type=image name=quay.io/jetstack/trust-manager
      tag: v0.25.0@sha256:0521921c2a46d14d0417336b20bcde69215ef3164f2977cc939d53c6e5224a17
    defaultPackageImage:
      name: trust-pkg-debian-trixie
      repository: quay.io/jetstack/trust-pkg-debian-trixie
      # artifact: type=image name=quay.io/jetstack/trust-pkg-debian-trixie
      tag: 20250419.2@sha256:3093d4f6634fbd9eaf6a70a06d809132850d7cae30da82396d3b1f884c1135e7
    app:
      trust:
        namespace: system-pki-trust
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
    priorityClassName: windsorcli-platform-critical
