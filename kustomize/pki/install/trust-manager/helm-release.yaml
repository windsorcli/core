---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: system-pki-trust
spec:
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  dependsOn:
    - name: cert-manager
      namespace: system-pki
  chartRef:
    kind: OCIRepository
    name: trust-manager
  values:
    image:
      repository: quay.io/jetstack/trust-manager
      # artifact: type=image name=quay.io/jetstack/trust-manager
      tag: v0.26.0@sha256:783afe31d39f122a811b96ac3aedab9f358488088df21622ae5b057b4a38b5c2
    defaultPackageImage:
      name: trust-pkg-debian-trixie
      repository: quay.io/jetstack/trust-pkg-debian-trixie
      # artifact: type=image name=quay.io/jetstack/trust-pkg-debian-trixie
      tag: 20250419.1@sha256:17084a794d1e75065c9047438e2a6167907771fe78d7e4b5d4373a4b1d4e0494
    app:
      trust:
        namespace: system-pki-trust
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
    priorityClassName: windsorcli-platform-critical
