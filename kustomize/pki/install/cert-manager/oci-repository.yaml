---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: system-pki
spec:
  interval: 10m
  timeout: 3m
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager package=quay.io/jetstack/charts/cert-manager
    tag: v1.21.2
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
