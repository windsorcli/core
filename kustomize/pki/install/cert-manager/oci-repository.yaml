---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: system-pki
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry:=oci://quay.io/jetstack/charts}/cert-manager
  ref:
    # artifact: type=chart name=cert-manager repo=oci://quay.io/jetstack/charts
    tag: v1.21.2
  insecure: ${chart_registry_insecure:=false}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
