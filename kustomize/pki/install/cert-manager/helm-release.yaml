---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: system-pki
spec:
  interval: 5m
  timeout: 20m
  install:
    # No uninstall on failed install: ships its own webhook gating every Certificate/Issuer platform-wide.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 5
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    global:
      priorityClassName: windsorcli-platform-critical
    image:
      repository: quay.io/jetstack/cert-manager-controller
      # artifact: type=image name=quay.io/jetstack/cert-manager-controller
      tag: v1.21.2@sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
    tolerations: &systemToleration
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    affinity: &systemAffinity
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: windsorcli.dev/pool-class
                  operator: In
                  values:
                    - system
    webhook:
      tolerations: *systemToleration
      affinity: *systemAffinity
      image:
        repository: quay.io/jetstack/cert-manager-webhook
        # artifact: type=image name=quay.io/jetstack/cert-manager-webhook
        tag: v1.21.2@sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
    cainjector:
      tolerations: *systemToleration
      affinity: *systemAffinity
      image:
        repository: quay.io/jetstack/cert-manager-cainjector
        # artifact: type=image name=quay.io/jetstack/cert-manager-cainjector
        tag: v1.21.3@sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
    startupapicheck:
      image:
        repository: quay.io/jetstack/cert-manager-startupapicheck
        # artifact: type=image name=quay.io/jetstack/cert-manager-startupapicheck
        tag: v1.21.2@sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5
    acmesolver:
      image:
        repository: quay.io/jetstack/cert-manager-acmesolver
        # artifact: type=image name=quay.io/jetstack/cert-manager-acmesolver
        tag: v1.21.3@sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
    crds:
      enabled: false
