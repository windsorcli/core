apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: public-acme
spec:
  acme:
    server: ${acme_server}
    email: ${acme_email}
    privateKeySecretRef:
      name: acme-account-key
    solvers:
      - selector:
          dnsZones:
            - ${acme_dns_zone}
        dns01:
          cloudDNS:
            project: ${acme_dns_zone_project}
