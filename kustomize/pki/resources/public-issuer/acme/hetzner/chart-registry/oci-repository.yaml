---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager-webhook-hetzner
  namespace: system-pki
spec:
  interval: 10m
  timeout: 3m
  url: ${chart_registry}/cert-manager-webhook-hetzner
  ref:
    # renovate: datasource=helm depName=cert-manager-webhook-hetzner package=cert-manager-webhook-hetzner helmRepo=https://charts.hetzner.cloud
    tag: 0.9.1
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
