name: Claude Code Review
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
permissions:
  contents: read

# The review step only READS the diff and WRITES two files:
#   /tmp/summary-block.md      — sticky summary body (required)
#   /tmp/review-comments.json  — inline findings, JSON array (optional)
# Model jobs hold a read-only token. The publish and resolve-threads-apply
# jobs run no model and do every GitHub write from main's scripts.
jobs:
  review:
    name: Full Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'synchronize' &&
      github.event.pull_request.user.type != 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      !github.event.pull_request.draft
    outputs:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch base ref
        run: git fetch --depth=1 origin ${{ github.base_ref }}
      - uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          GH_REPO: ${{ github.repository }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request and produce two output files. Do NOT post
            anything to GitHub yourself — a later CI step publishes what you
            write. Your only job is to write the files.

            Scope strictly to the diff. Read the changed set with
            `git diff "origin/$BASE_REF"...HEAD` (full history is checked out).
            Do NOT read files outside the changed set unless flagging a
            specific, concrete concern. Skip style nits; focus on correctness,
            security, and blast radius.

            ## Output 1 — /tmp/summary-block.md (REQUIRED, always write it)

            A sticky summary of the whole PR as it stands now. Write ONLY the
            callout body — no HTML comment markers, the publish step adds them.
            Exact shape:

              > [!NOTE]
              >
              > **{Low|Medium|High} Risk**
              >
              > {One sentence: what the change affects and why this risk level
              > is appropriate.}
              >
              > **Overview**
              >
              > {2-3 sentences on what the PR does at the highest level — the
              > shape of the change, not a file list.}
              >
              > {Optional second paragraph: the most notable behavioral or
              > structural detail — a rename, a new default, a migration.}

            Tone: calm, specific, prose-first. No emojis, no bullet lists, no
            "Test plan", under ~150 words. Risk level: Low for isolated,
            reversible changes; Medium for shared infra/CLI/workflows or
            changes to defaults; High for security, data-loss, or cross-cutting
            changes. Write this file even when the PR is clean (say it's clean).

            ## Output 2 — /tmp/review-comments.json (optional)

            Inline, line-anchored findings as a JSON array. Omit the file, or
            write `[]`, if there are no line-anchored findings. Each element:

              {
                "path": "relative/path.ext",
                "line": 42,
                "side": "RIGHT",
                "body": "**{title}**\n\n_{Low|Medium|High} Severity_ · `path:line`\n\n{1-3 sentences on what's wrong and the concrete consequence}"
              }

            `line` must be a line present in the PR's current diff or GitHub
            rejects the comment. For a multi-line span add `"start_line"` and
            `"start_side": "RIGHT"`. Title: 4-10 words, imperative or
            declarative, no trailing punctuation. Prefer a few high-signal
            findings over many nits; if a finding can't be line-anchored, fold
            it into the summary instead.

            Write the two files and stop. Do not run `gh`, do not post, do not
            edit the PR.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write"
            --disallowedTools WebSearch,WebFetch
      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-output
          path: |
            /tmp/summary-block.md
            /tmp/review-comments.json
          if-no-files-found: ignore
          retention-days: 1

  review-on-comment:
    name: Full Review (on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    needs: resolve-threads-apply
    if: >-
      !cancelled() &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    outputs:
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      # Reviews only a head commit pushed before the /review comment.
      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTED_AT: ${{ github.event.comment.created_at }}
        run: |
          PR_JSON=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          HEAD_SHA=$(echo "$PR_JSON" | jq -r .head.sha)
          PUSHED_AT=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request" \
            --jq '[.workflow_runs[].created_at] | min // empty')
          if [ -z "$PUSHED_AT" ] || [[ "$PUSHED_AT" > "$COMMENTED_AT" ]]; then
            echo "::error::Head $HEAD_SHA has no push recorded before the /review comment. Comment /review again to review it."
            exit 1
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$PR_JSON" | jq -r .base.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # refs/pull/N/head exists in the base repo for fork PRs too; the
          # head branch name only exists in the fork.
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out head
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::PR head moved after the /review comment. Comment /review again to review it."
            exit 1
          fi
      - name: Fetch base ref
        run: git fetch --depth=1 origin ${{ steps.pr.outputs.base_ref }}
      - uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          GH_REPO: ${{ github.repository }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request and produce two output files. Do NOT post
            anything to GitHub yourself — a later CI step publishes what you
            write. Your only job is to write the files.

            Scope strictly to the diff. Read the changed set with
            `git diff "origin/$BASE_REF"...HEAD` (full history is checked out).
            Do NOT read files outside the changed set unless flagging a
            specific, concrete concern. Skip style nits; focus on correctness,
            security, and blast radius.

            ## Output 1 — /tmp/summary-block.md (REQUIRED, always write it)

            A sticky summary of the whole PR as it stands now. Write ONLY the
            callout body — no HTML comment markers, the publish step adds them.
            Exact shape:

              > [!NOTE]
              >
              > **{Low|Medium|High} Risk**
              >
              > {One sentence: what the change affects and why this risk level
              > is appropriate.}
              >
              > **Overview**
              >
              > {2-3 sentences on what the PR does at the highest level — the
              > shape of the change, not a file list.}
              >
              > {Optional second paragraph: the most notable behavioral or
              > structural detail — a rename, a new default, a migration.}

            Tone: calm, specific, prose-first. No emojis, no bullet lists, no
            "Test plan", under ~150 words. Risk level: Low for isolated,
            reversible changes; Medium for shared infra/CLI/workflows or
            changes to defaults; High for security, data-loss, or cross-cutting
            changes. Write this file even when the PR is clean (say it's clean).

            ## Output 2 — /tmp/review-comments.json (optional)

            Inline, line-anchored findings as a JSON array. Omit the file, or
            write `[]`, if there are no line-anchored findings. Each element:

              {
                "path": "relative/path.ext",
                "line": 42,
                "side": "RIGHT",
                "body": "**{title}**\n\n_{Low|Medium|High} Severity_ · `path:line`\n\n{1-3 sentences on what's wrong and the concrete consequence}"
              }

            `line` must be a line present in the PR's current diff or GitHub
            rejects the comment. For a multi-line span add `"start_line"` and
            `"start_side": "RIGHT"`. Title: 4-10 words, imperative or
            declarative, no trailing punctuation. Prefer a few high-signal
            findings over many nits; if a finding can't be line-anchored, fold
            it into the summary instead.

            Write the two files and stop. Do not run `gh`, do not post, do not
            edit the PR.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write"
            --disallowedTools WebSearch,WebFetch
      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-output
          path: |
            /tmp/summary-block.md
            /tmp/review-comments.json
          if-no-files-found: ignore
          retention-days: 1

  resolve-threads:
    name: Resolve Threads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.user.type != 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      count: ${{ steps.check.outputs.count }}
    steps:
      # Resolves only against a head commit pushed before the /review comment.
      - name: Pin PR head
        id: pr
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTED_AT: ${{ github.event.comment.created_at }}
        run: |
          HEAD_SHA=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)
          PUSHED_AT=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request" \
            --jq '[.workflow_runs[].created_at] | min // empty')
          if [ -z "$PUSHED_AT" ] || [[ "$PUSHED_AT" > "$COMMENTED_AT" ]]; then
            echo "::error::Head $HEAD_SHA has no push recorded before the /review comment. Comment /review again to review it."
            exit 1
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Check for unresolved bot threads
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          OWNER="${GH_REPO%/*}"
          REPO="${GH_REPO#*/}"
          COUNT=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){
                pullRequest(number:$num){
                  reviewThreads(first:100){
                    nodes{
                      isResolved
                      comments(first:1){ nodes{ author{ login } } }
                    }
                  }
                }
              }
            }' -F owner="$OWNER" -F repo="$REPO" -F num="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                   | select(.isResolved == false)
                   | select(.comments.nodes[0].author.login
                       | test("\\[bot\\]$|^github-actions|^claude$"))]
                   | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Unresolved bot threads: $COUNT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.count != '0'
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked-out head
        if: steps.check.outputs.count != '0' && github.event_name == 'issue_comment'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::PR head moved after the /review comment. Comment /review again to review it."
            exit 1
          fi
      - uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        if: steps.check.outputs.count != '0'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Your only job is to identify which existing review threads on
            this PR have been addressed. A later CI step resolves them. Do
            NOT call any GitHub write API yourself. Do NOT post new findings
            or update the PR summary.

            1. List unresolved review threads:

              gh api graphql -f query='
                query($owner:String!,$repo:String!,$num:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$num){
                      reviewThreads(first:100){
                        nodes{
                          id isResolved isOutdated
                          comments(first:1){ nodes{ author{login} path line body } }
                        }
                      }
                    }
                  }
                }' -F owner="${{ github.repository_owner }}" -F repo="${{ github.event.repository.name }}" -F num="${{ github.event.pull_request.number || github.event.issue.number }}"

            2. For each unresolved thread authored by the bot (login ending
               in `[bot]`, `github-actions`, or `claude`):
               - If `isOutdated: true`, it qualifies.
               - Otherwise, read the file at the commented path/line and
                 check whether the specific concern is still present. If
                 fixed, it qualifies.
               - If a human has replied to the thread, leave it alone — it
                 does not qualify.

            3. Write the id of every qualifying thread, one per line, to
               /tmp/resolve-thread-ids.txt. Write an empty file if none
               qualify.

            That is all. Do not run any `gh api graphql` mutation yourself.
            Do not post comments. Do not modify the PR description. Be fast.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh api graphql:*),Bash(jq:*),Write"
            --disallowedTools WebSearch,WebFetch
      - name: Upload thread ids
        if: always() && steps.check.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolve-thread-ids
          path: /tmp/resolve-thread-ids.txt
          if-no-files-found: ignore
          retention-days: 1

  resolve-threads-apply:
    name: Resolve Threads (apply)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: resolve-threads
    if: >-
      !cancelled() &&
      needs.resolve-threads.result == 'success' &&
      needs.resolve-threads.outputs.count != '0'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: resolve-thread-ids
          path: /tmp
      - name: Resolve threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bash .github/scripts/resolve-threads.sh

  publish:
    name: Publish Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [review, review-on-comment]
    if: >-
      !cancelled() &&
      (needs.review.outputs.head_sha || needs.review-on-comment.outputs.head_sha) != ''
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: review-output
          path: /tmp
      - name: Reject output containing credentials
        run: bash .github/scripts/scrub-review.sh
      - name: Publish review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number || needs.review-on-comment.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.review.outputs.head_sha || needs.review-on-comment.outputs.head_sha }}
        run: bash .github/scripts/publish-review.sh
