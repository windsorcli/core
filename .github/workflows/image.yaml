# =============================================================================
# Image workflow
# =============================================================================
# Builds an image from images/<name>, and pushes, signs and attests the tag in images/<name>/VERSION when ghcr.io does not have it.
name: Image

on:
  workflow_call:
    inputs:
      name:
        description: Image name under ghcr.io/windsorcli and directory name under images/.
        required: true
        type: string
      builder:
        description: apko builds images/<name>/apko.yaml with its lock file. docker builds images/<name>/Dockerfile.
        required: true
        type: string
      script:
        description: Script that verifies the image references with --check and prints the VERSION tag with --tag.
        required: true
        type: string
      pin-digest:
        description: Fail unless the built image has the digest that the script prints with --digest.
        required: false
        type: boolean
        default: false
      test:
        description: Shell commands that run in the amd64 image before the push. apko only.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    name: Build
    runs-on: ubuntu-latest
    env:
      DIR: images/${{ inputs.name }}
      REPO: ghcr.io/windsorcli/${{ inputs.name }}
      # A pull request from a fork has no write access to ghcr.io, so it only builds.
      PUSH: ${{ github.event.pull_request.head.repo.fork != true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        if: inputs.builder == 'apko'
        uses: ./.github/actions/setup-tools
        with:
          tools: apko

      - name: Resolve image reference
        id: image
        env:
          SCRIPT: ${{ inputs.script }}
          PIN_DIGEST: ${{ inputs.pin-digest }}
        run: |
          "$SCRIPT" --check
          echo "ref=${REPO}:$("$SCRIPT" --tag)" >> "$GITHUB_OUTPUT"
          if [ "$PIN_DIGEST" = true ]; then
            echo "digest=$("$SCRIPT" --digest)" >> "$GITHUB_OUTPUT"
          fi
          content=$(cd "$DIR" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "content=${content}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Tags are immutable: a tag that ghcr.io has is never pushed again.
      - name: Check for the image
        id: exists
        env:
          REF: ${{ steps.image.outputs.ref }}
          PINNED: ${{ steps.image.outputs.digest }}
          CONTENT: ${{ steps.image.outputs.content }}
          BUILDER: ${{ inputs.builder }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/image\.yaml@
        run: |
          if ! skopeo inspect --raw "docker://${REF}" > remote-index.json 2>/dev/null; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          have="sha256:$(sha256sum remote-index.json | cut -d' ' -f1)"
          if [ -n "$PINNED" ] && [ "$have" != "$PINNED" ]; then
            echo "::error::${REF} has digest ${have}, but the references pin ${PINNED}. Run ${{ inputs.script }} to set the next version."
            exit 1
          fi
          if [ "$BUILDER" = docker ]; then
            built_from=$(skopeo inspect "docker://${REF}" | jq -r '.Labels["dev.windsorcli.image.content"] // ""')
            if [ "$built_from" != "$CONTENT" ]; then
              echo "::error::${REF} was built from other content than ${DIR}. Bump ${DIR}/VERSION."
              exit 1
            fi
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "digest=${have}" >> "$GITHUB_OUTPUT"
          if cosign verify --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${REPO}@${have}" >/dev/null 2>&1; then
            echo "${REF}@${have} exists and is signed. Skipping the build."
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "${REF}@${have} exists without a signature."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # An unsigned apko image is built again for its SBOMs.
      - name: Build the image with apko
        id: apko
        if: inputs.builder == 'apko' && (steps.exists.outputs.exists != 'true' || steps.exists.outputs.signed != 'true')
        env:
          REF: ${{ steps.image.outputs.ref }}
          PINNED: ${{ steps.image.outputs.digest || steps.exists.outputs.digest }}
        run: |
          mkdir sbom
          apko build --vcs=false --lockfile "${DIR}/apko.lock.json" --sbom-path sbom "${DIR}/apko.yaml" "$REF" image.tar
          built="sha256:$(tar -xOf image.tar index.json | sha256sum | cut -d' ' -f1)"
          if [ -n "$PINNED" ] && [ "$built" != "$PINNED" ]; then
            echo "::error::apko built ${built}, but the references pin ${PINNED}. Run ${{ inputs.script }} and commit the change."
            tar -xOf image.tar index.json
            tar -xOf image.tar manifest.json | jq -r '.[].Config' | xargs -I{} tar -xOf image.tar {}
            exit 1
          fi
          echo "digest=${built}" >> "$GITHUB_OUTPUT"

      - name: Test the image
        if: steps.apko.outcome == 'success' && inputs.test != ''
        env:
          REF: ${{ steps.image.outputs.ref }}
          TEST: ${{ inputs.test }}
        run: |
          docker load < image.tar
          docker run --rm "${REF}-amd64" -c "$TEST"

      - name: Push the apko image
        id: apko-push
        if: steps.apko.outcome == 'success' && steps.exists.outputs.exists != 'true' && env.PUSH == 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
          BUILT: ${{ steps.apko.outputs.digest }}
        run: |
          apko publish --vcs=false --lockfile "${DIR}/apko.lock.json" --sbom=false "${DIR}/apko.yaml" "$REF"
          skopeo inspect --raw "docker://${REF}" > remote-index.json
          pushed="sha256:$(sha256sum remote-index.json | cut -d' ' -f1)"
          if [ "$pushed" != "$BUILT" ]; then
            echo "::error::${REF} has digest ${pushed}, but apko built ${BUILT}"
            exit 1
          fi
          echo "digest=${pushed}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true' && inputs.builder == 'docker'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # BuildKit attaches the SBOM to the index as an attestation manifest.
      - name: Build and push the image with docker
        id: docker
        if: steps.exists.outputs.exists != 'true' && inputs.builder == 'docker'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.DIR }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          sbom: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            dev.windsorcli.image.content=${{ steps.image.outputs.content }}

      # Signs with the workflow's GitHub OIDC identity.
      - name: Sign the image
        id: sign
        if: env.PUSH == 'true' && (steps.apko-push.outcome == 'success' || steps.docker.outcome == 'success' || steps.exists.outputs.signed == 'false')
        env:
          DIGEST: ${{ steps.apko-push.outputs.digest || steps.docker.outputs.digest || steps.exists.outputs.digest }}
        run: |
          cosign sign --yes "${REPO}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Attests the index SBOM on the index and each arch SBOM on its manifest.
      - name: Attest the apko SBOMs
        if: steps.sign.outcome == 'success' && steps.apko.outcome == 'success'
        env:
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom/sbom-index.spdx.json "${REPO}@${DIGEST}"
          for pair in amd64:x86_64 arm64:aarch64; do
            manifest=$(tar -xOf image.tar index.json | jq -r --arg a "${pair%%:*}" '.manifests[] | select(.platform.architecture == $a) | .digest')
            cosign attest --yes --type spdxjson --predicate "sbom/sbom-${pair#*:}.spdx.json" "${REPO}@${manifest}"
          done
