version: '3'

tasks:
  dashboards:
    desc: Download, patch, and validate vendored dashboards from source.yaml files
    cmds:
      - scripts/vendor-dashboards.sh

  crds:
    desc: Regenerate vendored CRDs from kustomize/crds/sources.yaml
    cmds:
      - scripts/vendor-crds.sh

  crds:check:
    desc: Verify vendored CRDs match their sources (CI drift guard)
    cmds:
      - scripts/vendor-crds.sh --check

  scan:
    desc: Scan for security vulnerabilities
    silent: true
    cmds:
      - cmd: source .venv/bin/activate && checkov -d {{.CLI_ARGS | default "terraform/"}} 2>/dev/null

  test:
    desc: Run all tests (Terraform, Blueprint, Prometheus rules, and Composition functions)
    silent: true
    cmds:
      - task: test:terraform
      - task: test:blueprint
      - task: test:prometheus-rules
      - task: test:composition-functions

  test:prometheus-rules:
    desc: Unit-test PrometheusRule alerting rules via promtool
    silent: true
    cmds:
      - scripts/test-prometheus-rules.sh

  test:composition-functions:
    desc: Unit-test embedded Crossplane Composition Python functions
    silent: true
    cmds:
      - scripts/test-composition-functions.sh

  test:terraform:
    desc: Run Terraform tests (all or specific module)
    silent: true
    cmds:
      - cmd: |
          MODULE={{.CLI_ARGS | default "terraform"}}
          if [ -d "$MODULE" ]; then
            # Create a temporary directory for test results
            TEMP_DIR=$(mktemp -d)
            export TEMP_DIR
            # Run each module's tests as its own process via xargs, not a
            # shell background job in a loop. A `(...) &` loop shares the
            # loop variable across jobs under task's shell, so most
            # directories race and silently test against the wrong path.
            # -n1 passes one file per invocation as $1, avoiding -I{}'s
            # small substituted-command-length limit on BSD xargs.
            find "$MODULE" -type f -name '*.tftest.hcl' -print0 | \
              xargs -0 -n1 -P0 sh -c '
                testfile="$1"
                testdir=$(dirname "$testfile")
                cd "$testdir" && \
                echo "Running tests in $testdir..." && \
                terraform init -input=false -reconfigure && \
                OUTPUT=$(terraform test -no-color 2>&1)
                TEST_EXIT=$?
                echo "$OUTPUT"
                if [ $TEST_EXIT -ne 0 ]; then
                  echo "FAILED: $testfile" >> "$TEMP_DIR/failures"
                fi
                # Check for warnings (case-insensitive)
                if echo "$OUTPUT" | grep -qi "Warning:"; then
                  echo "WARNINGS: $testfile" >> "$TEMP_DIR/warnings"
                fi
              ' _
            # Check if any tests failed
            if [ -f "$TEMP_DIR/failures" ]; then
              echo "Test failures:"
              cat "$TEMP_DIR/failures"
              rm -rf "$TEMP_DIR"
              exit 1
            fi
            # Check if any warnings were found
            if [ -f "$TEMP_DIR/warnings" ]; then
              echo "Tests completed with warnings:"
              cat "$TEMP_DIR/warnings"
              rm -rf "$TEMP_DIR"
              exit 1
            fi
            rm -rf "$TEMP_DIR"
          else
            echo "Module path '$MODULE' does not exist."
            exit 1
          fi

  test:blueprint:
    desc: Run Windsor blueprint tests
    silent: true
    cmds:
      - windsor test

  fmt:
    desc: Check Terraform formatting
    silent: true
    cmds:
      - cmd: terraform fmt -recursive

  docs:terraform:
    desc: Generate the Inputs/Outputs/Resources tables inside every terraform/<module>/README.md via terraform-docs, the terraform/README.md umbrella index, and each category's Modules list
    silent: true
    cmds:
      - cmd: |
          find terraform -type d -exec test -e '{}/main.tf' -a -e '{}/variables.tf' \; -print | while read -r dir; do
            if [[ "$dir" == *"/modules/"* ]]; then
              continue
            fi
            echo "Generating docs for $dir"
            docker run --rm -v "$(pwd):/src" -w "/src/$dir" quay.io/terraform-docs/terraform-docs:0.20.0 markdown table --output-file README.md --output-mode inject .
          done
      - scripts/umbrella-index.sh terraform
      - scripts/terraform-module-index.sh

  docs:terraform:check:
    desc: Fail if docs:terraform would produce drift (CI use)
    silent: true
    cmds:
      - task: docs:terraform
      - cmd: |
          status="$(git status --porcelain -- 'terraform/' | grep -E 'README\.md$' || true)"
          if [ -n "$status" ]; then
            echo "error: terraform-docs produced drift. Run 'task docs:terraform' and commit the result." >&2
            echo "$status" >&2
            exit 1
          fi

  docs:kustomize:
    desc: Generate the Substitutions/Components/Dependencies tables inside every kustomize/<add-on>/README.md from its .docs.yaml descriptor, plus the kustomize/README.md umbrella index
    cmds:
      - scripts/kustomize-docs.sh --all
      - scripts/umbrella-index.sh kustomize

  docs:kustomize:check:
    desc: Fail if docs:kustomize would produce drift (CI use)
    cmds:
      - scripts/kustomize-docs.sh --check
      - scripts/umbrella-index.sh --check kustomize

  docs:stack:
    desc: Regenerate docs/index.md's Stack section from the terraform/ and kustomize/ trees
    cmds:
      - scripts/stack-index.sh

  docs:stack:check:
    desc: Fail if docs:stack would produce drift (CI use)
    cmds:
      - scripts/stack-index.sh --check

  docs:guides:
    desc: Regenerate the "The knobs" and "Reference" blocks in every docs/guides/*.md from schema.yaml and the facets that implement it
    cmds:
      - scripts/guide-scaffold.sh --all

  docs:guides:check:
    desc: Fail if docs:guides would produce drift (CI use)
    cmds:
      - scripts/guide-scaffold.sh --check

  docs:no-future-work:
    desc: Fail if any doc uses future-work framing (a "not covered yet" heading, roadmap/TODO phrasing) outside ADRs and roadmap files
    cmds:
      - scripts/no-future-work.sh
